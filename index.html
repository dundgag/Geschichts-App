  "In Wien einigten sich die Mächte 1814/15 auf eine Ordnung, die Frieden sichern sollte. Fürst Metternich, der österreichische Staatskanzler, setzte auf Legitimität (die alten Dynastien kehren zurück), Gleichgewicht der Mächte und Bekämpfung von Revolutionen. Frankreich wurde nicht hart bestraft, sondern wieder in das Konzert der Mächte aufgenommen, was Stabilität förderte. Der Deutsche Bund ersetzte das Heilige Römische Reich (1806 aufgelöst). Die Ordnung verhinderte große Kriege für Jahrzehnte, aber sie unterdrückte Wünsche nach Freiheit und nationaler Einheit, die sich 1830 und 1848 entluden (Einheit 31). Der Vergleich mit 1648 und 1919 (Einheiten 20 und 35) zeigt: Dauerhaft ist eine Ordnung, wenn alle wichtigen Mächte sie mittragen und die Verlierer eingebunden werden."
]});

addEnd(UNITS.u28, { h: "Die Menschen der Fabrik: Arbeit, Familie, Kinder", p: [
  "Man darf sich die Fabrikarbeit nicht als sanfte Modernisierung vorstellen. In den Baumwollspinnereien Lancashires arbeiteten Frauen und Kinder, weil Maschinen bedient werden konnten, ohne große Kraft zu verlangen, und weil sie billiger waren. Zehn- bis Zwölfjährige arbeiteten 12 bis 14 Stunden am Tag, in staubiger, lauter Umgebung, mit Unfällen an ungesicherten Maschinen und Lungenkrankheiten durch Baumwollstaub. Der Takt wurde nicht mehr von Sonne und Jahreszeit bestimmt, sondern von Uhr und Fabrikglocke. Der Historiker E. P. Thompson hat gezeigt, wie sehr diese neue Zeitdisziplin für Menschen eine Umstellung war, die bisher nach Aufgabe und Wetter gearbeitet hatten.",
  "Familien veränderten sich. Auf dem Land hatte die Familie gemeinsam gearbeitet, nun trennten sich Wohnort und Arbeitsort. Männer, Frauen und Kinder arbeiteten oft in verschiedenen Schichten, und die Kinderbetreuung wurde zum Problem. Sparen war kaum möglich, Krankheit oder Arbeitslosigkeit konnten in Armut stürzen, denn es gab keine Absicherung. Reformen kamen langsam: Die Fabrikgesetze von 1833 verboten Kinderarbeit unter neun Jahren in Textilfabriken und begrenzten die Arbeitszeit, 1842 wurde Frauen- und Kinderarbeit im Bergbau unter Tage verboten, 1847 der Zehnstundentag für Frauen und Jugendliche eingeführt. Fabrikinspektoren sollten das überwachen.",
  "Die Frage ist: Verbesserte sich das Leben durch die Industrialisierung? Die Antwort hängt vom Zeitraum ab. Historiker streiten über den „Lebensstandardstreit“. Man nimmt an, dass die Reallöhne in den ersten Jahrzehnten kaum stiegen und die Lebensbedingungen in den Städten sich teilweise verschlechterten, während später, ab Mitte des 19. Jahrhunderts, Einkommen, Ernährung und Lebenserwartung deutlich stiegen. Gewinner und Verlierer unterschieden sich: Handweber, die mit Maschinen nicht konkurrieren konnten, verarmten (die Ludditen zerstörten 1811–16 Maschinen aus Protest). Lehrreich ist, dass wirtschaftliches Wachstum und Wohlergehen nicht dasselbe sind. Die Politik musste Regeln schaffen, damit Wachstum den Menschen zugutekam (Einheit 29)."
]});
addEnd(UNITS.u28, { h: "Energie und Natur: Der Preis der Kohle", p: [
  "Mit der Kohle begann ein Wandel im Verhältnis zur Natur. Bis dahin hing Energie von Holz, Wasser, Wind und Muskelkraft ab, also von Flächen, die jedes Jahr nachwachsen. Kohle erschloss gespeicherte Sonnenenergie aus Jahrmillionen. Damit war Wachstum nicht mehr durch das Land begrenzt. Der Historiker Kenneth Pomeranz argumentiert, dass Großbritannien neben Kohle auch Zugang zu Rohstoffen und Flächen in Übersee (Baumwolle, Zucker, Holz aus Amerika) hatte, die „Geisterflächen“, die Europa entlasteten (Einheit 18). China besaß ebenfalls Kohle, aber in anderen Regionen als die Zentren seiner Wirtschaft.",
  "Die Folgen für Umwelt und Gesundheit waren sofort sichtbar. Städte wie Manchester lagen unter Rauch, die Flüsse wurden zu Abwasserkanälen, Atemwegserkrankungen stiegen. Der „Große Smog“ von London 1952 kostete noch Tausende das Leben. Der Anstieg von Kohlendioxid in der Atmosphäre wurde schon im 19. Jahrhundert theoretisch erkannt (Fourier, Tyndall, Arrhenius), spielte aber lange keine praktische Rolle. Heute ist die Frage der Klimaerwärmung eine direkte Folge dieser Entwicklung. Die Industrielle Revolution ist daher nicht nur ein Kapitel der Vergangenheit, sondern erklärt, warum die Welt heute vor der Aufgabe steht, Energie anders zu erzeugen.",
  "Man erkennt eine Spannung, die sich in der Geschichte wiederholt: Neue Techniken lösen Probleme der Gegenwart und schaffen Probleme der Zukunft. Die Landwirtschaft (Einheit 2) erlaubte Städte, brachte aber Seuchen. Die Kohle erlaubte Wohlstand, brachte aber Verschmutzung. Antibiotika retten Leben, aber Resistenzen entstehen. Wer die Industrialisierung versteht, versteht daher auch heutige Debatten über Technikfolgen. Hier liegen die Fragen: Wer trägt die Kosten? Wer entscheidet? Und wie lange sind wir bereit zu warten, bis wir reagieren? Ein Beispiel für Reaktion war das Cholera-Jahr 1854 und die Reform der Wasserversorgung (siehe Abschnitt zur Cholera und Einheit 30)."
]});

addEnd(UNITS.u29, { h: "Warum Deutschland aufholte: Staat, Bildung und Banken", p: [
  "Deutschland war um 1815 agrarisch und politisch zersplittert. Nach 1850 holte es auf und war um 1900 die größte Industriemacht Europas. Wie? Ein Faktor war der Staat. Preußische Reformer hatten nach 1806 Leibeigenschaft und Zunftzwang beseitigt (Stein-Hardenberg-Reformen), Gewerbefreiheit eingeführt und das Bildungswesen ausgebaut. Der Zollverein von 1834 schuf einen großen Binnenmarkt ohne Zollgrenzen. Der Staat förderte den Eisenbahnbau, der Eisen, Kohle und Maschinenbau stimulierte: Aufträge für Schienen, Lokomotiven und Brücken trieben Firmen wie Krupp und Borsig voran.",
  "Ein zweiter Faktor war Bildung. Das deutsche Schulwesen war früh stark, es gab technische Hochschulen und eine enge Verbindung von Universität und Industrie. Justus von Liebig gründete in Gießen ein Labor, das die organische Chemie voranbrachte, und die chemische Industrie (BASF, Bayer, Hoechst) wurde führend. Dritter Faktor: Banken. Universalbanken wie die Deutsche Bank (1870) finanzierten langfristig Industrie, nicht nur Handel, und saßen in Aufsichtsräten. Vierter Faktor: Rohstoffe, Kohle und Erz an Ruhr, Saar und in Oberschlesien, später Lothringen nach 1871 (Einheit 31).",
  "Diese Mischung unterschied den deutschen vom britischen Weg: In Großbritannien entstand Industrie aus privatem Gewerbe, in Deutschland mit Hilfe von Staat und Banken. Das Land wurde zum Vorbild der „zweiten Industrialisierung“ mit Chemie, Elektro und Stahl (Siemens, AEG). Der wirtschaftliche Aufstieg hatte politische Folgen: Er erzeugte Selbstbewusstsein und Rivalität mit Großbritannien, die sich in Flottenbau und Kolonialpolitik zeigte (Einheiten 32 und 33). Man erkennt, wie wirtschaftliche Entwicklung Außenpolitik prägt, und warum der Gedanke vom „Wandel durch Handel“ Grenzen hat."
]});
addEnd(UNITS.u29, { h: "Die soziale Frage und die Antworten: Reform, Revolution, Fürsorge", p: [
  "Die Arbeiterschaft wuchs rasch, ihre Lage war oft elend. Die Antworten fielen sehr verschieden aus. Eine Antwort war Selbsthilfe: Arbeiter gründeten Genossenschaften, Gewerkschaften und Vereine. In Großbritannien entstanden Trade Unions, in Deutschland die Freien Gewerkschaften. Eine zweite war die Theorie. Karl Marx und Friedrich Engels, der als Sohn eines Fabrikanten Manchester kannte, analysierten im „Kommunistischen Manifest“ (1848) und im „Kapital“ (1867) das Verhältnis von Kapital und Arbeit und prognostizierten einen Klassenkampf, der zur klassenlosen Gesellschaft führen werde. Die SPD (1875) verband diese Ideen mit parlamentarischer Politik.",
  "Eine dritte Antwort kam von Kirche und Reformern. Wichern gründete in Hamburg das „Rauhe Haus“ für verwahrloste Kinder, Adolph Kolping Gesellenvereine, Bischof Ketteler forderte soziale Gerechtigkeit; die päpstliche Enzyklika „Rerum novarum“ (1891) behandelte die Arbeiterfrage. Eine vierte war staatlich: Bismarck verfolgte die Sozialdemokratie mit den Sozialistengesetzen (1878–1890) und führte zugleich Kranken- (1883), Unfall- (1884) und Invaliditäts- und Altersversicherung (1889) ein, um die Arbeiter an den Staat zu binden. Die Sozialversicherung war weltweit neuartig und wurde zum Modell des Sozialstaats.",
  "Welche Antwort wirkte? Eine Mischung. Die Verbindung von Gewerkschaften, Gesetzen und wirtschaftlichem Wachstum verbesserte nach 1870 die Lage: Der Reallohn stieg, Arbeitszeiten sanken, und Lebenserwartung nahm zu, auch dank hygienischer Reformen (Einheit 30). Radikale Revolution kam in Westeuropa zunächst nicht; sie kam in Russland 1917, wo Reformen fehlten (Einheit 35). Daraus lässt sich lernen: Staaten, die Spannungen durch Reformen abbauen, bleiben stabiler. Dass sich Arbeiterschaft und Nation im Weltkrieg 1914 zunächst hinter der Regierung sammelten, überraschte viele, und zeigt, wie stark der Nationalismus (Einheit 31) war."
]});

addEnd(UNITS.u30, { h: "Wie Wissen entsteht: Zufall, Methode und Widerstand", p: [
  "Die Geschichte der Medizin im 19. Jahrhundert zeigt, wie Erkenntnis entsteht. Ignaz Semmelweis erkannte 1847 in Wien, dass Ärzte das Kindbettfieber übertrugen, wenn sie von Leichenöffnungen zu Gebärenden gingen: In der Abteilung der Ärzte starben deutlich mehr Frauen als in der Hebammenabteilung. Er ließ Händewaschen mit Chlorkalk einführen, und die Sterblichkeit sank stark. Seine Kollegen lehnten die Idee ab, auch weil sie bedeutete, dass sie selbst Schuld trugen, und weil Semmelweis keine Theorie hatte, die erklärte, was übertragen wurde. Er wurde persönlich schwierig, verlor seine Stelle und starb 1865 in einer Anstalt, vermutlich an einer Wundinfektion. Erst Pasteur und Lister lieferten später die Erklärung.",
  "Louis Pasteur zeigte in den 1860er-Jahren, dass Gärung und Fäulnis durch Mikroorganismen entstehen, widerlegte die Lehre von der Urzeugung und entwickelte Impfungen (Tollwut 1885). Joseph Lister nutzte Karbolsäure, um Wunden und Instrumente zu desinfizieren, und senkte die Infektionsrate bei Operationen stark. Robert Koch wies mit strengen Kriterien nach, dass bestimmte Bakterien bestimmte Krankheiten auslösen: Milzbrand (1876), Tuberkulose (1882), Cholera (1883). Seine Methoden, Reinkulturen auf festem Nährboden, wurden Standard. Die „Kochschen Postulate“ stehen für methodisches Denken: Erreger muss man isolieren, kultivieren und die Krankheit damit erneut erzeugen können.",
  "Man sieht, dass Fortschritt von Methoden abhängt, nicht allein von Genie. Das Mikroskop wurde besser (Zeiss und Abbe in Jena), Färbetechniken machten Bakterien sichtbar, Nährböden erlaubten Reinkulturen. Zugleich spielt Widerstand eine Rolle: Neue Erkenntnisse treffen auf Gewohnheit, Hierarchie und Stolz. Das gilt für Semmelweis ebenso wie für Galilei (Einheit 23). Wer als Ärztin oder Arzt arbeitet, sieht darin eine bleibende Lehre: Prüfen, dokumentieren, Fehler zugeben, Hygienevorschriften nicht als Last, sondern als Ergebnis bitterer Erfahrung verstehen."
]});
addEnd(UNITS.u30, { h: "Narkose, Chirurgie und das moderne Krankenhaus", p: [
  "Vor 1846 war Chirurgie ein Wettlauf gegen den Schmerz. Operateure wie Robert Liston in London amputierten ein Bein in unter dreißig Sekunden, weil der Patient bei Bewusstsein war und festgehalten wurde. Die Einführung der Äthernarkose durch William Morton in Boston (16. Oktober 1846) und von Chloroform durch James Simpson (1847) veränderte dies. Operationen konnten länger und sorgfältiger dauern, und neue Eingriffe im Bauchraum wurden denkbar. Allerdings stieg zunächst die Zahl der Infektionen, denn längere Operationen in unhygienischen Verhältnissen führten zu Wundbrand und Sepsis („Hospitalismus“). Erst mit der Antisepsis (Lister, 1867) und der Asepsis (steriles Arbeiten, Dampfsterilisation, Gummihandschuhe, Ende des 19. Jahrhunderts) wurden Operationen sicher.",
  "Die Anästhesie entwickelte sich weiter: John Snow führte den Chloroform-Gebrauch mit kontrollierter Dosierung durch Inhalator ein, 1884 setzte Carl Koller Kokain am Auge als Lokalanästhetikum ein, 1898 führte August Bier die Spinalanästhesie ein. Die Entdeckung, dass Narkose Dosierung, Überwachung und Wissen verlangte, ließ aus dem Hilfsdienst ein eigenes Fachgebiet werden. Dass die Betäubung zu den zentralen Errungenschaften der Medizin zählt, wird oft übersehen, weil sie unauffällig wirkt: Ihr Erfolg ist, dass der Patient nichts spürt.",
  "Das Krankenhaus selbst wandelte sich. Florence Nightingale reformierte im Krimkrieg (1854–56) die Pflege, zeigte mit Statistik, dass mehr Soldaten an Seuchen als an Verwundungen starben, und gründete die moderne Krankenpflegeausbildung. Krankenhäuser wurden von Orten der Armenfürsorge zu Orten der Heilung, mit Operationssälen, Labors und Spezialisierung. Der Staat baute öffentliche Gesundheit aus: Wasserleitungen, Kanalisation (Hamburg nach der Cholera 1892), Impfpflicht, Lebensmittelkontrolle. Die Lebenserwartung stieg in Europa zwischen 1850 und 1914 von etwa 40 auf über 50 Jahre. Man sieht, wie Wissenschaft, Technik, Staat und Organisation zusammenwirken müssen, damit Erkenntnis in besseres Leben übersetzt wird (Einheit 29)."
]});

addEnd(UNITS.u31, { h: "1848: die Revolution, die scheiterte und doch wirkte", p: [
  "Im Frühjahr 1848 erhob sich Europa. Auslöser war Frankreich, wo im Februar der „Bürgerkönig“ Louis-Philippe gestürzt wurde. Die Nachricht sprang über, nach Wien, wo Metternich floh, nach Berlin, wo der König nach Barrikadenkämpfen nachgab, und nach Italien und Ungarn. Die Gründe waren ein Gemenge: schlechte Ernten und Hunger 1846/47, Arbeitslosigkeit, der Wunsch nach Pressefreiheit, Verfassungen und nationaler Einheit, die Unzufriedenheit mit den Regierungen, die nach 1815 Reformen verweigert hatten (Einheit 27). Liberale Bürger, Handwerker, Arbeiter und Studenten waren beteiligt, mit verschiedenen Zielen.",
  "In Frankfurt trat im Mai 1848 die Nationalversammlung in der Paulskirche zusammen, gewählt in allgemeinen Wahlen der Männer. Sie beriet über Grundrechte und eine Verfassung für ein Deutschland als Nationalstaat. Zwei Fragen spalteten sie: Wie groß sollte der Staat sein, „großdeutsch“ mit Österreich oder „kleindeutsch“ ohne? Und wer sollte Staatsoberhaupt sein? Die Versammlung bot im April 1849 dem preußischen König Friedrich Wilhelm IV. die Kaiserkrone an. Er lehnte ab: Eine Krone „aus der Gosse“, von einem Parlament, wollte er nicht. Daraufhin zerfiel die Versammlung; die alten Mächte, die sich erholt hatten, schlugen die Aufstände nieder, in Baden mit preußischen Truppen, in Wien und Ungarn mit Hilfe Russlands.",
  "Scheiterte die Revolution also? Politisch ja, doch die Wirkungen blieben. Die Verfassungen, Grundrechte und der Gedanke der Volkssouveränität waren nicht mehr aus der Welt zu schaffen, in Preußen gab es nun eine Verfassung und ein Parlament, die Bauernbefreiung wurde abgeschlossen. Viele Demokraten wanderten aus, vor allem in die USA („Forty-Eighters“). Der Schluss, den Bismarck später zog, lautete: Die Einheit werde nicht „durch Reden und Majoritätsbeschlüsse“, sondern durch „Eisen und Blut“ entschieden. Dieser Satz von 1862 zeigt, wie die Enttäuschung von 1848 in Machtpolitik umschlug."
]});
addEnd(UNITS.u31, { h: "Nation als Chance und Gefahr: Minderheiten, Ausgrenzung, Nationalismus", p: [
  "Die Idee der Nation (Einheit 26) versprach Zugehörigkeit und Mitsprache, hatte aber eine Kehrseite. Sie legt nahe, dass Staat und Volk deckungsgleich sein sollen. Doch Europas Völker lebten durcheinander. In Österreich-Ungarn, einem Staat mit zehn offiziellen Sprachgruppen, wollten Tschechen, Ungarn, Polen, Südslawen, Italiener und andere eigene Rechte. Der Ausgleich von 1867 machte aus dem Kaisertum die Doppelmonarchie, in der die Ungarn eine Sonderstellung hatten, aber andere Gruppen fühlten sich zurückgesetzt. Das Reich blieb bis 1918 zusammen, doch der Streit zwischen den Nationalitäten schwächte es und trug zur Spannung auf dem Balkan bei (Einheit 33).",
  "Auch im Deutschen Reich und in Frankreich entstand eine Politik der Vereinheitlichung. Der Kulturkampf (1871–1878) richtete sich gegen die katholische Kirche, die Polen in Preußen wurden germanisiert, in Elsass-Lothringen herrschte nach 1871 Spannung. Nationalismus verband sich zunehmend mit der Abgrenzung nach außen: Gegen „Erbfeinde“, gegen Minderheiten. Aus dem religiös begründeten Antijudaismus wurde ein rassistischer Antisemitismus, der in den 1870er- und 1880er-Jahren politisch organisiert auftrat (Berliner Antisemitismusstreit 1879). Die Dreyfus-Affäre in Frankreich (1894–1906) zeigte, wie ein Jude als Sündenbock für nationale Ängste herhalten musste.",
  "Zugleich war Nation ein Motor von Freiheitsbewegungen: Griechen, Serben, Belgier, Polen, Italiener, Iren erkämpften oder forderten Eigenstaatlichkeit, und der Gedanke trug später die Dekolonisierung (Einheit 45). Man sollte die Ambivalenz festhalten: Nationalismus kann befreien und einen, aber auch ausgrenzen und in Krieg führen. Welche Seite überwiegt, hängt davon ab, ob die Nation als Gemeinschaft freier Bürger oder als Abstammungsgemeinschaft verstanden wird. Diese Frage bleibt bis heute aktuell, etwa in Debatten über Staatsbürgerschaft und Zugehörigkeit."
]});

addEnd(UNITS.u32, { h: "Zwei Blicke auf dasselbe Ereignis: der Kongo und die Berliner Konferenz", p: [
  "Um Imperialismus zu verstehen, hilft es, ein Ereignis aus mehreren Perspektiven zu betrachten. Aus Sicht der Europäer war die Berliner Konferenz 1884/85 ein diplomatisches Arrangement, um Streit zu vermeiden: Wer ein Gebiet besetzt, behält es, Handelsfreiheit am Kongo und Niger wird garantiert. Bismarck wollte Deutschland als Vermittler zeigen. König Leopold II. von Belgien erhielt das Kongobecken als Privatbesitz, den „Kongo-Freistaat“, getarnt als humanitäres und wissenschaftliches Unternehmen. Er versprach, die Sklaverei der arabischen Händler zu bekämpfen, und schuf ein System der Ausbeutung.",
  "Aus Sicht der Menschen im Kongo bedeutete das etwas anderes. Die Konzessionsgesellschaften und die Force Publique zwangen die Bevölkerung, Kautschuk zu sammeln, einen Rohstoff, der durch Fahrrad- und Autoreifen (Dunlop 1888, Michelin) gefragt wurde. Wer die Quote nicht erfüllte, wurde geschlagen, Geiseln wurden genommen, Dörfer niedergebrannt, und als Beweis für verbrauchte Munition wurden abgeschlagene Hände abgeliefert. Die Bevölkerung ging dramatisch zurück, durch Gewalt, Hunger und Krankheiten wie die Schlafkrankheit. Der Autor Edmund Morel, der Konsul Roger Casement und Schriftsteller wie Joseph Conrad („Herz der Finsternis“, 1899) machten die Verbrechen öffentlich, und 1908 übernahm Belgien die Kolonie.",
  "Das Beispiel zeigt mehrere Dinge. Erstens: Öffentlichkeit kann Gewalt begrenzen, denn der Druck von Presse, Kirchen und Parlamenten führte zur Änderung. Zweitens: Die Nachfrage der Industrie (Einheit 28) bewirkte Gewalt in fernen Ländern. Drittens: Auch nach der Übernahme durch Belgien blieb das Land Rohstofflieferant, und bei der Unabhängigkeit 1960 fehlten Verwaltung und ausgebildete Eliten (Einheit 46). Die Wurzeln heutiger Probleme der Region reichen in diese Zeit zurück, ebenso wie die Debatten über Entschädigung. 2020 äußerte der belgische König sein „tiefstes Bedauern“ über Gewalt in der Kolonialzeit."
]});
addEnd(UNITS.u32, { h: "Die Ideen hinter dem Imperialismus: Rasse, Fortschritt und Wissenschaft", p: [
  "Der Imperialismus brauchte Ideen, die ihn rechtfertigten. Eine zentrale war die Vorstellung eines Fortschritts, bei dem Europa an der Spitze stehe. Die Wissenschaft des 19. Jahrhunderts ordnete Menschen in „Rassen“ ein, mit Messungen von Schädeln und Körpern. Charles Darwins Evolutionstheorie (1859) wurde von anderen, vor allem Herbert Spencer, zum Sozialdarwinismus umgedeutet: Im „Kampf ums Dasein“ setze sich das Stärkere durch, auch unter Völkern. Darwin selbst hatte dies so nicht gemeint. Die Verbindung von scheinbarer Wissenschaft und Vorurteil gab Rassismus eine Autorität, die er zuvor nicht hatte.",
  "Auch Missionare, Ärzte und Forscher waren Teil des Systems, mit gemischten Motiven. Missionsschulen und -krankenhäuser verbesserten die Gesundheit und Bildung für manche, während sie europäische Werte verbreiteten und Kulturen abwerteten. Die Tropenmedizin entstand, weil Europäer in den Kolonien erkrankten: Patrick Manson und Ronald Ross klärten die Malariaübertragung durch Mücken auf, Robert Koch erforschte Schlafkrankheit, Rinderpest und Malaria in Afrika. Die Forschungen retteten viele Leben, nutzten aber auch Menschen als Versuchsobjekte, etwa bei Schlafkrankheitsprogrammen, in denen Kranke in Lager gebracht und mit giftigen Mitteln wie Atoxyl behandelt wurden, mit Erblindungen als Folge (Einheit 30).",
  "Aus heutiger Sicht ist zentral, wie sich Ideen und Interessen verstärkten. Kaufleute wollten Märkte, Militärs Stützpunkte, Missionare Seelen, Politiker Prestige, Forscher Wissen und Ruhm. Jede Gruppe konnte ihre Sicht mit der Ideologie der Überlegenheit verbinden. Als Folge wirkten Kategorien weiter, die Menschen nach Herkunft einteilten, und fanden ihre äußerste Zuspitzung im Nationalsozialismus (Einheit 37). Es wäre aber falsch zu sagen, der Imperialismus führe direkt zum Holocaust. Die Forschung diskutiert, wie weit Verbindungslinien reichen (Debatte um den Herero-Krieg und den Holocaust). Entscheidend ist, die Mechanismen zu verstehen: Entmenschlichung, Bürokratie und technische Überlegenheit machen Gewalt leichter."
]});

addEnd(UNITS.u33, { h: "Wie Entscheidungen im Juli 1914 fielen: Menschen unter Druck", p: [
  "Die Julikrise war ein Prozess, in dem Entscheidungen von Menschen fielen, die Informationen unvollständig kannten und einander misstrauten. In Wien wollte der Außenminister Berchtold und der Generalstabschef Conrad von Hötzendorf Serbien „ein für alle Mal“ ausschalten. Kaiser Franz Joseph war alt und zögerlich. Man wollte Rückendeckung aus Berlin, und Kaiser Wilhelm II. gab sie, ohne Bedingungen. Reichskanzler Bethmann Hollweg hoffte, der Krieg bleibe begrenzt („lokalisiert“), und nahm das Risiko eines großen Krieges in Kauf, weil er glaubte, Russland sei zu schwach oder werde nicht eingreifen und Deutschland könne sonst in einigen Jahren zu schwach sein, wenn Russland aufrüstet.",
  "In Russland befürchtete Zar Nikolaus II., als Schutzmacht der Slawen das Gesicht zu verlieren, und ordnete die Teilmobilmachung an, bald darauf die allgemeine. Für die Generäle war die Mobilmachung technisch eine Folge von Entscheidungen, die schwer zurückzunehmen war. In Frankreich sicherte Präsident Poincaré Russland Unterstützung zu. In Großbritannien zögerte die Regierung, bis der Einmarsch in Belgien die öffentliche Meinung kippen ließ. Zwischen dem Ultimatum und den Kriegserklärungen vergingen nur gut fünf Wochen. Der Zeitdruck ließ kaum Raum für Vermittlungsversuche. Telegramme zwischen Wilhelm und Nikolaus („Willy-Nicky-Telegramme“) zeigen den späten Versuch, die Lage zu halten.",
  "Was lernt man daraus? Erstens: Strukturen schaffen Spielräume, Menschen entscheiden. Zweitens: Annahmen über Gegner (Russland sei schwach, England bleibe draußen, der Krieg sei kurz) können fatal sein. Drittens: Systeme mit engen Zeitplänen und starren Bündnissen verringern die Chance, Fehler zu korrigieren. Die Krise von 1914 wird daher bis heute in der Politikwissenschaft studiert, etwa bei der Kubakrise 1962, als Kennedy und Chruschtschow versuchten, solche Eskalationen zu vermeiden (Einheit 43). Dass die Beteiligten die Folgen unterschätzten, zeigt sich im Sprichwort, der Krieg werde „bis Weihnachten“ vorbei sein."
]});
addEnd(UNITS.u33, { h: "Stimmung, Rüstung und Wirtschaft: Das Europa vor dem Krieg", p: [
  "Das Europa von 1900 bis 1914 war zugleich blühend und angespannt. Wirtschaft und Verkehr waren vernetzt wie nie, Telegrafen und Eisenbahnen verbanden Länder, Wissenschaftler reisten, Nobelpreise (seit 1901) wurden international vergeben, und Pazifisten wie Bertha von Suttner (Friedensnobelpreis 1905) warnten vor einem Krieg. Gleichzeitig stiegen die Rüstungsausgaben: Das Deutsche Reich, Frankreich und Russland erhöhten ihre Heere, und das Wettrüsten zur See zwischen Deutschland und Großbritannien kostete Milliarden. Die Bevölkerung wuchs, die Städte wurden voll, und soziale Spannungen nahmen zu.",
  "In der Öffentlichkeit prägten Massenpresse, Vereine und Schulen ein nationales Denken. Das Militär genoss Ansehen, Uniformen und Paraden waren alltäglich. Kriege galten vielen als Mittel der Politik und als Prüfung von Männlichkeit und Nation. Gleichzeitig gab es starke Gegenkräfte: Die Sozialdemokratie, die größte Partei im Reichstag seit 1912, lehnte Krieg ab, und die Zweite Internationale beschloss, bei Kriegsgefahr gemeinsam dagegen zu wirken. Im Sommer 1914 versagte dieser Plan, denn die Parteien stimmten fast überall für Kriegskredite (in Deutschland am 4. August 1914), weil sie ihr Land verteidigen wollten.",
  "Für das Verständnis ist wichtig, dass der Krieg weder unvermeidlich war noch zufällig. Er kam aus einem Gemisch aus Strukturen (Bündnisse, Rüstung, Nationalismus, Imperialismus), Haltungen (Erwartung, dass ein Krieg lösbar und kurz sei) und kurzfristigen Entscheidungen. Der Historiker Christopher Clark beschreibt die Akteure als „Schlafwandler“, andere wie Fritz Fischer betonen die deutschen Kriegsziele. Beide Sichten ergänzen sich, wenn man sie als Aussagen auf verschiedenen Ebenen versteht (Abschnitt zur Schuldfrage). Eine Lehre bleibt aktuell: Wirtschaftliche Verflechtung allein verhindert keinen Krieg, und der Wunsch, dem Gegner zuvorzukommen, kann Krisen beschleunigen."
]});

addEnd(UNITS.u34, { h: "Der Krieg der Soldaten: Alltag im Graben, Angst und Gewalt", p: [
  "Das Leben an der Front war geprägt von Nässe, Schlamm, Ratten, Läusen und ständiger Bedrohung. Soldaten verbrachten oft Wochen in Gräben, unter Artilleriefeuer, das die Nerven zerstörte. Die meisten Verluste verursachte nicht der Nahkampf, sondern Granatsplitter. Krankheiten wie „Schützengrabenfuß“, Ruhr, Typhus und Fleckfieber (Läuse) waren verbreitet. Briefe der Soldaten zeigen eine Mischung aus Pflichtgefühl, Angst, Humor und Heimweh. An Weihnachten 1914 gab es an manchen Frontabschnitten spontane Waffenruhen, bei denen Deutsche und Briten miteinander sprachen und tauschten, ein Zeichen, dass die Gegner einander nicht nur als Feinde sahen.",
  "Das massenhafte Sterben veränderte Gesellschaften. Etwa zehn Millionen Soldaten fielen, viele mehr wurden verwundet oder blieben für immer beeinträchtigt: Amputierte, Gasgeschädigte, Menschen mit zerstörten Gesichtern (daraus entstand die plastische Chirurgie, etwa durch Harold Gillies). Die psychischen Folgen, „Kriegszitterer“ oder „Shell Shock“, zeigten, dass die moderne Kriegführung Menschen überforderte. Ärzte behandelten sie mit Elektroschocks oder Drill, oder sie verdächtigten sie der Simulation. Erst später entstand das Verständnis für Traumafolgestörungen.",
  "Wer von „den Soldaten“ spricht, sollte die Vielfalt sehen. Unter ihnen waren Kolonialsoldaten: Senegalesische Schützen kämpften für Frankreich, Inder für Großbritannien, Australier und Neuseeländer (ANZAC) bei Gallipoli 1915, wo ein Landungsversuch gegen das Osmanische Reich scheiterte und die nationale Identität beider Länder prägte. Viele kehrten nach 1918 mit der Erfahrung zurück, dass man sie für Freiheit kämpfen ließ, die ihnen selbst verweigert wurde (Einheiten 35 und 38). So trug der Krieg zur Entstehung antikolonialer Bewegungen bei."
]});
addEnd(UNITS.u34, { h: "Die Heimatfront und die Kriegsgesellschaft", p: [
  "An der Heimatfront wurde die Wirtschaft staatlich gelenkt, in Deutschland etwa durch das Hilfsdienstgesetz 1916 und die Kriegsrohstoffabteilung unter Walther Rathenau. Lebensmittel wurden rationiert, Lebensmittelkarten eingeführt, und der Schwarzmarkt blühte. Die britische Blockade verhinderte Einfuhr, und Missernten 1916 führten zum Steckrübenwinter. Frauen arbeiteten in Fabriken, in der Landwirtschaft und im Nahverkehr, viele verloren Männer und Söhne. Die Erfahrung, Verantwortung zu tragen, stärkte die Forderung nach Wahlrecht (Großbritannien 1918 teilweise, Deutschland 1918, USA 1920).",
  "Die Propaganda stellte den Krieg als Verteidigung dar. Plakate, Zeitungen und Filme verbreiteten Feindbilder und Siegeszuversicht. Zensur unterdrückte kritische Nachrichten. Zugleich wuchs der Widerstand: 1916/17 streikten Arbeiter in Deutschland, die SPD spaltete sich 1917 in Mehrheits-SPD und USPD, in Frankreich meuterten 1917 Truppen nach der gescheiterten Nivelle-Offensive. In Russland trugen Hunger und Kriegsmüdigkeit zur Revolution bei (Einheit 35). In Deutschland entstand 1917 Streit zwischen denen, die einen „Siegfrieden“ wollten, und denen, die einen „Verständigungsfrieden“ suchten.",
  "Der Krieg veränderte Staat und Wirtschaft dauerhaft. Staaten griffen tiefer in das Leben ein, kontrollierten Preise und Produktion, und das Vertrauen in Autorität und Fortschritt war erschüttert. Wissenschaftler wurden in den Dienst des Krieges gestellt, was später Vorbild für staatlich geförderte Forschung wurde. Die Kriegsfinanzierung durch Anleihen und Gelddrucken führte zu Schulden und zur Inflation, die in Deutschland 1923 ihren Höhepunkt erreichte (Einheit 36). Zugleich entstand die Idee der „Generation“ des Krieges, in der Literatur (Erich Maria Remarque, „Im Westen nichts Neues“, 1929) ebenso wie in der Politik. Damit hing der Krieg unmittelbar mit der Zwischenkriegszeit zusammen."
]});

addEnd(UNITS.u35, { h: "Warum die Bolschewiki gewannen: Organisation, Versprechen, Zufall", p: [
  "Nach dem Sturz des Zaren im Februar 1917 hatte Russland keine feste Macht. Die Provisorische Regierung unter Kerenski setzte den Krieg fort, versprach Wahlen, lieferte aber weder Land noch Brot noch Frieden. Neben ihr standen die Sowjets, die in Betrieben und Truppenteilen Macht ausübten. Dieses Doppelregime lähmte den Staat. Die Bolschewiki waren zunächst eine kleine Gruppe. Lenin kehrte im April 1917 mit deutscher Hilfe (im plombierten Zug aus der Schweiz) zurück und forderte radikal: „Alle Macht den Sowjets“, Frieden, Land für die Bauern, Kontrolle der Fabriken. Diese einfachen Versprechen trafen die Wünsche der Soldaten, Bauern und Arbeiter.",
  "Im Oktober 1917 (nach dem russischen Kalender; im Westen: November) übernahmen die Bolschewiki unter Führung von Trotzki, der den bewaffneten Aufstand in Petrograd organisierte, die Macht. Der Sturm auf das Winterpalais war weniger dramatisch als später im Film dargestellt, die Regierung hatte wenig Rückhalt. Eine freie Wahl zur Verfassunggebenden Versammlung im November 1917 gewannen die Sozialrevolutionäre; die Bolschewiki lösten die Versammlung im Januar 1918 auf. Damit zeigte sich die Richtung: nicht Parlament, sondern Parteidiktatur. Der Bürgerkrieg (1918–1922) entschied sich zugunsten der Roten, weil sie das Kerngebiet mit Industrie und Eisenbahn hielten, die Armee diszipliniert organisierten und die Gegner uneinig waren.",
  "Welche Bedeutung hatte das für die Welt? Die Oktoberrevolution gab Hoffnung auf eine Welt ohne Ausbeutung und rief Angst bei Besitzenden hervor. Die Kommunistische Internationale (Komintern, 1919) strebte Weltrevolution an. In Deutschland führte die Furcht vor einer Räterepublik dazu, dass die SPD-Führung mit der Armee zusammenarbeitete (Abschnitt zu Deutschland). Und in der Sowjetunion selbst entstand ein System, das Millionen Opfer forderte (Einheit 37). Zugleich lieferte die Revolution einen Gegenpol zum liberalen Westen, der im Kalten Krieg zentral wurde (Einheit 42)."
]});
addEnd(UNITS.u35, { h: "Naher Osten und die Frage nach Selbstbestimmung: Versprechen, die kollidierten", p: [
  "Während des Krieges machten die Briten gegensätzliche Zusagen. Hochkommissar Henry McMahon sagte dem Scherifen Hussein von Mekka 1915/16 arabische Unabhängigkeit zu, wenn die Araber gegen das Osmanische Reich kämpften (der Arabische Aufstand, in dem T. E. Lawrence eine Rolle spielte). Im Sykes-Picot-Abkommen 1916 teilten Großbritannien und Frankreich die Region heimlich unter sich auf. 1917 erklärte der britische Außenminister Balfour, die Regierung betrachte die Errichtung einer „nationalen Heimstätte“ für das jüdische Volk in Palästina mit Wohlwollen, ohne die Rechte der bestehenden Gemeinschaften zu beeinträchtigen. Die Zionistische Bewegung, die Theodor Herzl 1897 begründet hatte, war eine Reaktion auf Antisemitismus in Europa (Einheit 31).",
  "Nach 1918 setzten sich die Mandate durch: Großbritannien erhielt Irak, Transjordanien und Palästina, Frankreich Syrien und Libanon. Die Grenzen wurden zum Teil mit dem Lineal gezogen und fassten verschiedene Gruppen zusammen (Sunniten, Schiiten, Kurden im Irak). Die Kurden, denen der Vertrag von Sèvres (1920) einen Staat in Aussicht gestellt hatte, gingen nach dem Vertrag von Lausanne (1923) leer aus. Araber empfanden die Mandate als Verrat, und in Palästina wuchsen Spannungen zwischen jüdischer Einwanderung und arabischer Bevölkerung, was zu Unruhen 1920, 1929 und zum arabischen Aufstand 1936–39 führte (Einheit 38).",
  "Für das Verständnis sind drei Punkte wichtig. Erstens: Viele Konflikte der Region haben Wurzeln in Entscheidungen, die in Hauptstädten Europas getroffen wurden. Zweitens: Nationen und Staaten fallen nicht zusammen, wenn Grenzen von außen gezogen werden (Einheit 32). Drittens: Das Prinzip der Selbstbestimmung galt in der Praxis nur für manche. Wilsons Versprechen weckte weltweit Hoffnungen, die enttäuscht wurden, und trug zu Protesten in Ägypten (1919), Indien, Korea (Märzbewegung 1919) und China bei. Dies bereitet die Dekolonisierung nach 1945 vor (Einheit 45)."
]});

addEnd(UNITS.u36, { h: "Das Geld und die Gesellschaft: Was Inflation und Arbeitslosigkeit mit Menschen machten", p: [
  "Um die politische Wirkung der Krisen zu verstehen, muss man ihre Folgen im Alltag sehen. Während der Hyperinflation 1923 wurden Löhne täglich, zuletzt mehrmals täglich ausgezahlt, und die Menschen eilten zum Einkaufen, bevor das Geld weiter entwertet wurde. Wer Schulden hatte, etwa Landwirte und Unternehmer mit Sachwerten, kam gut davon; wer Ersparnisse oder Rente in Geld hielt, verlor alles. Betroffen war besonders der Mittelstand: Beamte, Lehrer, Rentner, Kleinunternehmer. Diese Gruppe fühlte sich um die Früchte lebenslanger Arbeit betrogen. Der Historiker Gerald Feldman hat gezeigt, dass viele die Schuld nicht in der Politik des Staates sahen, sondern bei „Spekulanten“, der Republik oder dem Ausland, was antisemitische und antirepublikanische Stimmungen stärkte.",
  "Die Weltwirtschaftskrise traf eine andere Gruppe. Millionen Arbeiter verloren ihre Stelle, und die Arbeitslosenversicherung von 1927, die für Zeiten normaler Arbeitslosigkeit gedacht war, wurde überfordert. Ab 1931 wurden Leistungen gekürzt, viele lebten von Wohlfahrt. Junge Menschen fanden keine Lehrstellen, und Männer, die ihre Familie nicht ernähren konnten, erlebten Scham und Perspektivlosigkeit. In dieser Lage boten radikale Parteien Gemeinschaft, Uniformen, Mahlzeiten und Hoffnung: die SA und die KPD organisierten Arbeitslose. Eine Gesellschaft, in der der Staat nicht mehr als schützend erlebt wird, ist anfälliger für Rufe nach einem „starken Mann“.",
  "Auch die Medizin und Gesundheit spiegeln die Lage. In der Inflationszeit stieg die Tuberkulose-Sterblichkeit, viele Kinder litten an Unterernährung (Rachitis), und Ärzte klagten über Armut in Praxen. Gleichzeitig entstanden Fortschritte in der Sozialmedizin: Wohlfahrtseinrichtungen, Mütterberatung, Schulärzte und die Anfänge moderner Sexualberatung. Die Rassenhygiene, die vor 1933 auch in demokratischen Staaten diskutiert wurde, gewann in Krisenzeiten Anhänger, weil sie scheinbar Kosten sparte (Einheit 40). Aus all dem lässt sich folgern: Wirtschaftliche Not erzeugt nicht automatisch Radikalismus, aber sie schwächt das Vertrauen in die Ordnung, und das macht Gesellschaften verwundbar."
]});
addEnd(UNITS.u36, { h: "Die Welt in der Krise: Unterschiedliche Antworten auf dieselbe Not", p: [
  "Die Weltwirtschaftskrise erfasste alle Industrieländer, doch die Antworten unterschieden sich und prägten die politische Zukunft. In den USA führte Roosevelts New Deal ab 1933 zu Bankenreform, öffentlichen Arbeiten (Tennessee Valley Authority), Sozialversicherung (1935) und Stärkung der Gewerkschaften. Die Arbeitslosigkeit sank, doch erst die Rüstung im Zweiten Weltkrieg beseitigte sie. In Großbritannien verließ man 1931 den Goldstandard, wertete das Pfund ab und stützte die Wirtschaft, was die Erholung erleichterte. Frankreich hielt länger am Gold fest, die Krise dauerte dort länger, und die Volksfront-Regierung unter Léon Blum (1936) führte Sozialreformen wie die 40-Stunden-Woche und bezahlten Urlaub ein.",
  "In Deutschland wählte Brüning die Deflationspolitik, später begann die Regierung Hitler mit staatlichen Aufträgen, Autobahnbau und vor allem Aufrüstung. Die Arbeitslosenzahl sank rasch, teils durch statistische Tricks (Ausschluss von Juden, Frauen, Arbeitsdienst) und durch Wehrpflicht. Die Finanzierung beruhte auf geheimen Wechseln (MEFO-Wechsel), die nur durch Eroberung und Raub bezahlt werden konnten, was in den Krieg führte (Einheit 39). In der Sowjetunion war die Planwirtschaft von der Krise kaum betroffen, aber auf Kosten von Millionen Toten durch Zwangskollektivierung (Einheit 37). Japan zog Konsequenzen in Form von Expansion (Einheit 38).",
  "Man erkennt, wie wirtschaftliche Entscheidungen politische Ordnungen prägen. Demokratien, die schnell und glaubwürdig handelten, blieben stabil; Staaten, in denen Eliten die Demokratie ohnehin ablehnten, kippten. Auch das internationale System litt: Zölle und Währungsblöcke schnitten Handel ab und verschärften Konflikte. Nach 1945 wollten die Siegermächte genau das verhindern, mit Bretton Woods, dem Allgemeinen Zoll- und Handelsabkommen (GATT) und später der EU (Einheit 41). Die Lehre aus den 1930er-Jahren, dass offene Märkte, Zusammenarbeit und Sozialstaat zusammen Stabilität schaffen, prägte die Nachkriegsordnung."
]});

addEnd(UNITS.u37, { h: "Wie funktioniert eine Diktatur im Alltag? Zustimmung, Angst, Gewöhnung", p: [
  "Es wäre bequem, sich Diktaturen als Herrschaft einer kleinen Gruppe über eine widerstrebende Mehrheit vorzustellen. Die Realität war komplexer. Das NS-Regime hatte echte Zustimmung, die auf Erfolgen beruhte: sinkende Arbeitslosigkeit, außenpolitische Revisionen (Rheinland 1936, Anschluss 1938), Feste und Gemeinschaftserlebnisse, ein Gefühl nationaler Würde nach 1918. Zugleich herrschte Angst. Die Gestapo war weniger allgegenwärtig, als man dachte, sie arbeitete stark mit Denunziationen aus der Bevölkerung. Wer Witze über den Führer erzählte, konnte angezeigt werden. Das Wissen, dass jeder Nachbar Spitzel sein konnte, führte zu Rückzug und Schweigen.",
  "Wichtig ist der Mechanismus der Gewöhnung. Einzelne Schritte, wie Boykott, Entlassung, Ausschluss aus Vereinen, wirkten für sich begrenzt, erst in der Summe entstand die Entrechtung. Der Publizist Sebastian Haffner beschrieb in „Geschichte eines Deutschen“, wie normales Leben und Unrecht nebeneinander her liefen. Die Gleichschaltung erfasste Vereine, Berufsverbände, Universitäten und Kirchen. Viele sahen in der Anpassung eine Möglichkeit, weiter zu arbeiten; andere trugen aktiv mit. Widerstand gab es: Georg Elser (Attentat 1939), die Weiße Rose (1943), Pfarrer wie Dietrich Bonhoeffer, Gewerkschafter und Kommunisten, doch er blieb eine Minderheit und war lebensgefährlich.",
  "Auch Stalin stützte sich auf Zustimmung und Furcht, mit Aufstiegsmöglichkeiten für Arbeiter und Bauern, Bildungsprogrammen und Kampagnen gegen „Volksfeinde“. Der Terror traf auch die Parteimitglieder, was dazu führte, dass sich niemand sicher fühlte. In Italien blieb das Regime vergleichsweise weniger totalitär: König, Kirche und Armee bestanden fort. Der Vergleich zeigt, dass Diktaturen unterschiedliche Mittel nutzen, aber ähnliche Wirkungen erzeugen: Sie machen Menschen abhängig vom Wohlwollen der Macht, zerstören unabhängige Institutionen und kontrollieren Information. Für das Verständnis heute heißt das, auf Warnzeichen zu achten: Angriffe auf unabhängige Gerichte und Presse, Entmenschlichung von Gruppen, Dauer-Ausnahmezustände."
]});
addEnd(UNITS.u37, { h: "Frauen, Jugend, Wissenschaft: Wie Regime das Leben formen wollten", p: [
  "Totalitäre Regime wollten nicht nur Gehorsam, sondern den „neuen Menschen“ formen. Die Jugend wurde früh erfasst: Hitlerjugend und Bund Deutscher Mädel (ab 1936 Pflicht für alle), in der Sowjetunion die Pioniere und der Komsomol, in Italien die Balilla. Schulen wurden ideologisch ausgerichtet, Lehrpläne und Lehrer kontrolliert. Das Frauenbild des NS betonte die Rolle als Mutter („Gebärpflicht“ für „rassisch Erwünschte“); Frauen wurden aus Führungspositionen gedrängt, gleichzeitig mobilisierte der Krieg sie für Arbeit. In der Sowjetunion arbeiteten Frauen in großer Zahl in Industrie und Medizin (Frauenanteil unter Ärzten sehr hoch), die Familienpolitik schwankte zwischen Befreiung und Pronatalismus.",
  "Wissenschaft und Kultur erlitten Schäden. In Deutschland führte das „Gesetz zur Wiederherstellung des Berufsbeamtentums“ (April 1933) zur Entlassung jüdischer und politisch missliebiger Professoren; Albert Einstein, Lise Meitner (später), Max Born, Erwin Schrödinger, Sigmund Freud und viele andere emigrierten oder wurden vertrieben. Die Bücherverbrennung am 10. Mai 1933 war ein Symbol. Die deutsche Spitzenstellung in Naturwissenschaft und Medizin brach ein, und viele Forscher fanden in den USA und Großbritannien neue Wirkungsstätten, was später dort Atomforschung und Medizin stärkte (Einheit 41). In der Sowjetunion förderte Stalin den Pseudowissenschaftler Trofim Lyssenko, dessen Lehren die Genetik zerstörten und der Landwirtschaft schadeten, ein Beispiel dafür, wie Ideologie Wissenschaft verdirbt.",
  "Ärzte und Juristen wurden von den Regimen besonders gebraucht und besonders anfällig. Mehr als die Hälfte der deutschen Ärzte trat der NSDAP oder einer Gliederung bei, ein Beispiel dafür, wie Fachautorität und Ideologie sich verbinden (Einheit 40). Es gab auch Widerstand und Mut, etwa Ärzte, die verfolgte Patienten behandelten und versteckten. Das Verständnis dieser Zeit zeigt eine Wahrheit: Institutionen und Berufsethos schützen nur, wenn Einzelne bereit sind, sie zu verteidigen. Das macht die Geschichte gerade für Berufe mit Verantwortung für Menschen lehrreich."
]});

addEnd(UNITS.u38, { h: "Gandhi, Nehru, Jinnah: Wege zu einem unabhängigen Indien", p: [
  "Indien war die „Perle“ des britischen Empires. Die Briten regierten mit wenigen Beamten über Hunderte Millionen Menschen, auf der Grundlage lokaler Verbündeter, der Fürstenstaaten und der Armee. Die Unabhängigkeitsbewegung wuchs aus Bildungsschichten, die westliche Ideen von Freiheit und Recht auf die Kolonialherrschaft anwandten. Gandhi verband diese Forderung mit einer Politik, die Massen ansprach: Er trug einfache Kleidung, spann selbst Garn (das Spinnrad als Symbol des Boykotts britischer Textilien) und wählte Ziele, die jeder verstand, wie das Salz. Das war strategisch klug, denn Gewaltlosigkeit machte es dem Staat schwer, mit Gewalt zu antworten, ohne sich moralisch zu schaden.",
  "Neben ihm standen Jawaharlal Nehru, ein weltläufiger, sozialistisch denkender Jurist und späterer erster Premierminister, und Muhammad Ali Jinnah, der die Muslimliga führte. Die Frage war, wie ein Land mit Hindus (rund 70 Prozent), Muslimen (rund 25 Prozent), Sikhs, Christen und vielen Sprachen als Ganzes regiert werden könnte. Jinnah fürchtete, Muslime würden in einem hinduistisch dominierten Staat zur Minderheit. Die Briten förderten teils die Spaltung („divide et impera“), doch die Gegensätze hatten auch eigene Gründe. 1940 forderte die Muslimliga erstmals einen eigenen Staat (Pakistan). Die Spannungen führten 1946/47 zu Gewalt und zur Teilung (Einheit 45).",
  "Der Zweite Weltkrieg verschob die Lage. Indien wurde ohne Befragung in den Krieg gezogen, Millionen Inder kämpften für Großbritannien, und die Bengalische Hungersnot 1943 mit über zwei Millionen Toten, verschärft durch Kriegspolitik, zerstörte das Vertrauen. 1942 forderte der Kongress mit der „Quit India“-Bewegung den sofortigen Abzug der Briten; Gandhi und die Führer wurden eingesperrt. Nach 1945 war Großbritannien erschöpft und der Gedanke an die Herrschaft über Indien nicht mehr zu halten. So führen die Wege der Zwischenkriegszeit direkt in die Dekolonisierung."
]});
addEnd(UNITS.u38, { h: "China zwischen Republik, Bürgerkrieg und Krieg: Warum die Kommunisten gewannen", p: [
  "Nach dem Sturz des Kaisers 1911 gelang es China nicht, einen stabilen Staat zu bilden. Sun Yat-sen, der „Vater der Republik“, formulierte die „Drei Volksprinzipien“ (Nationalismus, Volksrechte, Volkswohlfahrt). Nach seinem Tod 1925 übernahm Chiang Kai-shek die Guomindang und einte 1926–28 im „Nordfeldzug“ große Teile des Landes. Die Regierung in Nanjing modernisierte Verwaltung, Banken und Militär, blieb aber auf Städte und Küste beschränkt, abhängig von Bankiers und Großgrundbesitzern. Die Landbevölkerung, vier Fünftel der Menschen, litt unter Pacht, Steuern und Hunger. Hier setzte Mao Zedong an: Er organisierte Bauern in Kommunen, verteilte Land und baute eine Guerillaarmee auf.",
  "Der japanische Angriff 1937 veränderte alles. Die Guomindang verlor die Küstenstädte und Industrie, zog sich ins Landesinnere zurück (Chongqing) und trug die Hauptlast der Kämpfe, geschwächt durch Korruption und Inflation. Die Kommunisten bauten im Norden Stützpunkte auf, mobilisierten die Bevölkerung und gewannen Ansehen als Verteidiger gegen die Japaner. Schätzungsweise 14 bis 20 Millionen Chinesen starben im Krieg. Nach 1945 brach der Bürgerkrieg erneut aus, und 1949 siegten die Kommunisten; Chiang floh nach Taiwan (Einheit 43).",
  "Warum gewannen die Kommunisten? Mehrere Faktoren spielen zusammen: die Unterstützung der Bauern durch Landreform, die Disziplin der Armee, die Schwäche und Korruption der Guomindang, Inflation und der nationale Widerstand gegen Japan. Ein Gedanke zum Vergleich mit Russland (Einheit 35): Auch dort trug die Verbindung aus Krieg, Not und Versprechen von Land zur Machtübernahme bei. Revolutionen gelingen oft, wenn der Staat durch Krieg erschöpft ist und eine organisierte Gruppe überzeugende Antworten auf konkrete Nöte bietet."
]});

addEnd(UNITS.u39, { h: "Wie ein Krieg geführt wurde: Wirtschaft, Besatzung, Zwangsarbeit", p: [
  "Der Zweite Weltkrieg war ein Krieg der Wirtschaftskraft. Deutschland rüstete früh auf, litt aber unter Rohstoffknappheit (Öl, Eisenerz, Kautschuk) und baute daher auf Eroberung und Ausbeutung. Besetzte Länder mussten Besatzungskosten zahlen, Lebensmittel und Rohstoffe liefern, und Millionen Menschen wurden zur Zwangsarbeit ins Reich gebracht: 1944 arbeiteten rund acht Millionen ausländische Zivilarbeiter und Kriegsgefangene in Deutschland, jeder vierte Beschäftigte. Die Behandlung unterschied sich nach „Rasse“: Westeuropäer wurden besser behandelt als „Ostarbeiter“, und KZ-Häftlinge wurden in Rüstungsbetrieben „durch Arbeit vernichtet“. Konzerne wie IG Farben, Siemens und Volkswagen profitierten.",
  "Die Alliierten hatten dagegen Ressourcen in großem Maßstab. Die USA stellten ab 1942 jährlich Zehntausende Flugzeuge und Tausende Schiffe her, die „Liberty“-Frachter wurden in wenigen Tagen gebaut. Lend-Lease lieferte der Sowjetunion Lastwagen, Nahrung und Treibstoff, ohne die ihre Offensiven schwieriger gewesen wären. Die Sowjetunion verlegte ab 1941 Fabriken hinter den Ural und erreichte hohe Produktion. Das Gewicht der Wirtschaft erklärt, warum Deutschland ab 1941/42 kaum noch gewinnen konnte: Es konnte kurze Kriege führen, aber einen langen gegen die größten Industriemächte nicht.",
  "Das Leben unter Besatzung war unterschiedlich. In Westeuropa gab es Kollaboration und Widerstand (Résistance), Razzien und Deportationen der Juden. In Polen und der Sowjetunion zielte die deutsche Politik auf Entvölkerung und Versklavung; Städte wie Leningrad wurden fast 900 Tage belagert, wobei über eine Million Zivilisten verhungerten. Auch die Sowjetunion verübte Verbrechen, so den Massenmord an polnischen Offizieren in Katyn (1940) und Deportationen ganzer Völker (Krimtataren, Tschetschenen). Das Bild des Krieges lässt sich nicht auf „Gut“ und „Böse“ verkürzen, ohne die Besonderheit der NS-Verbrechen aus dem Blick zu verlieren."
]});
addEnd(UNITS.u39, { h: "Technik, Wissen und Medizin im Krieg", p: [
  "Der Krieg beschleunigte Technik und Wissenschaft. Radar warnte Großbritannien vor Luftangriffen, Entschlüsselung (Enigma, „Ultra“) gab den Alliierten Einblicke in deutsche Pläne, und Rechenmaschinen wie die „Bombe“ und „Colossus“ waren Vorläufer des Computers. Düsenflugzeuge, Raketen (V2) und Atomforschung entstanden. Die Luftkriegführung entwickelte sich vom Bombardement von Städten zu strategischer Zerstörung, mit Folgen für Zivilisten. Der Krieg war daher auch ein Krieg der Ingenieure und Mathematiker.",
  "In der Medizin brachte der Krieg Fortschritte, die später Alltag wurden. Penicillin, 1928 von Alexander Fleming entdeckt, wurde von Howard Florey und Ernst Chain in den USA und Großbritannien in Massenproduktion gebracht und rettete Hunderttausenden Verwundeten das Leben, weil Wundinfektionen behandelbar wurden. Blutbanken und Plasmatransfusionen (Charles Drew) retteten Verletzte. Die Notfallchirurgie, Anästhesie und Intensivmedizin entwickelten sich weiter. Auch Impfstoffe gegen Fleckfieber und Insektizide wie DDT schützten Soldaten vor Seuchen. Beim Ende des Krieges kam es in Deutschland und Osteuropa dennoch zu Seuchenausbrüchen unter Flüchtlingen und Häftlingen, etwa Fleckfieber in Bergen-Belsen.",
  "Gleichzeitig missbrauchten Regime die Medizin: Menschenversuche in Lagern (Einheit 40), aber auch in Japan, wo die Einheit 731 in der Mandschurei an Gefangenen biologische Waffen erprobte, und ethisch fragwürdige Versuche, zum Beispiel in den USA (Tuskegee-Syphilis-Studie, 1932–1972). Dass Ergebnisse von Forschung unabhängig von ihrer Herkunft nicht automatisch ethisch sind, führte nach 1945 zu Regeln. Man kann die Gleichzeitigkeit von Heilung und Verbrechen als Hinweis lesen, dass Wissen nicht moralisch von selbst ist. Es braucht Normen, Kontrolle und Verantwortung, ein Gedanke, den der Nürnberger Kodex und die Deklaration von Helsinki aufnehmen."
]});

addEnd(UNITS.u40, { h: "Wie wurde der Holocaust erforscht? Quellen, Zeugen, Streitfragen", p: [
  "Die Erforschung des Holocaust beruht auf einer enormen Quellenbasis. Es gibt die Dokumente der Täter: Akten von Behörden, Fahrpläne der Reichsbahn, Berichte der Einsatzgruppen, Protokolle wie das der Wannsee-Konferenz. Hinzu kommen die Zeugnisse der Überlebenden, Tagebücher (Anne Frank, Victor Klemperer, Etty Hillesum), Interviews (die „Shoah Foundation“ sammelte über 50.000), Fotografien und Filme der Befreiung, und Funde aus den Lagern. Durch den Vergleich der Quellen lassen sich Abläufe, Zahlen und Verantwortlichkeiten gut belegen. Leugner, die den Holocaust bestreiten, widersprechen daher nicht Hypothesen, sondern einer erdrückenden Beweislage; in Deutschland ist die Leugnung strafbar (§ 130 StGB).",
  "Historiker diskutierten und diskutieren zentrale Fragen. „Intentionalisten“ betonten den Willen Hitlers und der Führung von Beginn an, „Funktionalisten“ das Zusammenwirken von Bürokratie und Radikalisierung unter Kriegsbedingungen. Heute dominieren Sichtweisen, die beides verbinden. Offen bleiben Fragen nach den Entscheidungswegen 1941: Wann fiel die Entscheidung zur systematischen Ermordung aller Juden Europas? Die Forschung sieht einen Prozess zwischen Sommer und Herbst 1941. Auch die Frage nach der Rolle der „einfachen“ Täter, wie in Brownings „Ganz normale Männer“ oder in Daniel Goldhagens umstrittener These vom „eliminatorischen Antisemitismus“, wurde heftig debattiert.",
  "Wichtig ist die Perspektive der Opfer. Jüdisches Leben in Europa war vielfältig: orthodox und liberal, Handwerker, Kaufleute, Ärzte, Arbeiter, Zionisten und Bundisten. Die Vernichtung zerstörte Gemeinden mit tausendjähriger Geschichte, vor allem in Polen, Litauen, Ungarn. Wer nur Zahlen nennt, verliert das aus dem Blick. Gedenkstätten wie Yad Vashem, Stolpersteine und lokale Erinnerungsarbeit versuchen, Namen und Lebensgeschichten zu bewahren. Der Medizinhistoriker Ernst Klee und andere dokumentierten die Rolle von Ärzten; der Ärztekammer-Vertreter Alexander Mitscherlich berichtete über den Nürnberger Ärzteprozess. Die ärztliche Selbstvergewisserung, die erst in den 1980er-Jahren stärker einsetzte, zeigt, wie lange Verdrängung wirken kann."
]});
addEnd(UNITS.u40, { h: "Konsequenzen: Recht, Ethik und die Frage nach Verantwortung", p: [
  "Aus den Verbrechen erwuchs Recht. Die Nürnberger Prozesse stützten sich auf drei Anklagepunkte: Verbrechen gegen den Frieden, Kriegsverbrechen und Verbrechen gegen die Menschlichkeit, ein neuer Begriff. Sie legten fest, dass Befehlsnotstand nicht vor Strafe schützt und dass auch Staatsorgane individuell verantwortlich sind. Die UNO beschloss 1948 die Völkermordkonvention, den Begriff „Genozid“ hatte der polnisch-jüdische Jurist Raphael Lemkin 1944 geprägt. Die Allgemeine Erklärung der Menschenrechte (1948) beginnt mit dem Satz, die Würde des Menschen sei unantastbar, und das deutsche Grundgesetz (1949) stellt in Artikel 1 die Menschenwürde an die Spitze. Aus der Erfahrung des Unrechts entstand damit der Gedanke, dass Recht nicht nur Gesetz, sondern auch Gerechtigkeit sein muss.",
  "In der Medizin führte das zu einer Neuordnung der Ethik: informierte Einwilligung, Ethikkommissionen, Schweigepflicht, Patientenautonomie. Heute ist es selbstverständlich, dass man vor Eingriffen aufklärt und zustimmen lässt; die Wurzel liegt in der Antwort auf die Verbrechen. Auch die Frage der Verantwortung bleibt: Wie weit trägt der Einzelne Verantwortung in Systemen mit Arbeitsteilung? Hannah Arendt, Karl Jaspers („Die Schuldfrage“, 1946) und andere stellten Unterscheidungen auf: kriminelle, politische, moralische und metaphysische Schuld. Sie helfen zu verstehen, dass es verschiedene Formen von Verantwortung gibt, und dass Nachgeborene keine Schuld, aber Verantwortung für Erinnerung tragen.",
  "Für heutige Gesellschaften bleibt die Aufgabe, Warnzeichen zu erkennen, ohne jede Krise mit der NS-Zeit gleichzusetzen. Dazu gehört, Antisemitismus und Menschenfeindlichkeit früh zu benennen, Minderheiten zu schützen und Institutionen zu stärken, die unabhängig von Mehrheitsstimmungen Rechte sichern. Die Geschichte des Holocaust lehrt auch, dass Menschen in Systemen handeln, und dass mutiges Handeln einzelner, auch kleiner Gesten, einen Unterschied machen kann. Diese Erinnerung ist anspruchsvoll, weil sie keine einfachen Rezepte bietet, sondern Nachdenken über Verantwortung verlangt."
]});

addEnd(UNITS.u41, { h: "Das Ende des Krieges in der Welt: Flucht, Vertreibung, Besatzung", p: [
  "1945 war Europa ein Kontinent in Bewegung. Rund 40 Millionen Menschen waren auf der Flucht, vertrieben, deportiert oder ausgebombt. Etwa zwölf bis vierzehn Millionen Deutsche flohen oder wurden aus Ostpreußen, Schlesien, Pommern, dem Sudetenland und anderen Gebieten vertrieben; ungefähr 500.000 bis zwei Millionen starben. Die Westverschiebung Polens, beschlossen in Jalta und Potsdam, verschob Grenzen: Polen verlor Gebiete im Osten an die Sowjetunion und erhielt Land im Westen. Dahinter standen die Erfahrungen von Besatzung und Verbrechen, und die Absicht der Siegermächte, ethnisch einheitliche Staaten zu schaffen, um künftige Konflikte zu vermeiden. Das Mittel war massenhafte Zwangsumsiedlung, aus heutiger Sicht ein Verstoß gegen Menschenrechte.",
  "Überlebende der Lager, „Displaced Persons“, lebten oft jahrelang in Lagern, bis sie in die USA, nach Israel oder in andere Länder auswandern konnten. Die Staatsgründung Israels 1948 (Einheit 46) stand auch unter diesem Eindruck. Deutschland und Österreich wurden in Besatzungszonen aufgeteilt, ebenso Berlin. Die Alliierten betrieben Entnazifizierung, Entmilitarisierung und Dezentralisierung, teils mit begrenztem Erfolg. Viele Täter kehrten rasch in Ämter zurück, auch Ärzte und Juristen, weil Fachkräfte gebraucht wurden. Die Nürnberger Nachfolgeprozesse betrafen nur eine kleine Zahl.",
  "In Asien wurde Japan von den USA unter General MacArthur besetzt. Es erhielt eine neue Verfassung (1947), die den Krieg ächtete (Artikel 9) und die Rolle des Kaisers zum Symbol reduzierte, Landreform, Frauenwahlrecht und Bildungsreformen. Der Tokioter Prozess verurteilte Kriegsverbrecher, doch Kaiser Hirohito blieb unbehelligt, auch aus politischer Rücksicht. Die Aufarbeitung der Kriegsverbrechen, etwa in Nanjing oder gegen „Trostfrauen“, blieb in Ostasien bis heute umstritten. Korea wurde 1945 geteilt, China blieb im Bürgerkrieg (Einheit 43). Der Kalte Krieg begann sich abzuzeichnen."
]});
addEnd(UNITS.u41, { h: "Das Atomzeitalter und die Verantwortung der Wissenschaft", p: [
  "Die Entwicklung der Atombombe zeigt, wie Wissenschaft, Politik und Moral zusammenhängen. Die Entdeckung der Kernspaltung durch Otto Hahn und Fritz Straßmann (1938), erklärt von Lise Meitner und Otto Frisch, zeigte, dass enorme Energie freigesetzt werden kann. Emigrierte Physiker wie Szilard, Fermi, Teller und Bethe, viele aus Europa vor Verfolgung geflohen, warnten vor einer deutschen Bombe und drängten die USA, selbst zu forschen. Das Manhattan-Projekt beschäftigte schließlich rund 130.000 Menschen und kostete etwa zwei Milliarden Dollar. Als sich zeigte, dass Deutschland keine Bombe bauen würde, fragten einige Wissenschaftler, ob sie dennoch eingesetzt werden sollte. Szilard und andere appellierten, sie zunächst zu demonstrieren; der Vorschlag setzte sich nicht durch.",
  "Nach Hiroshima äußerten sich viele Beteiligte beunruhigt. Oppenheimer zitierte aus der Bhagavad Gita: „Nun bin ich der Tod geworden, der Zerstörer der Welten.“ Einstein bedauerte seinen Brief an Roosevelt. 1957 forderten 18 deutsche Atomforscher im „Göttinger Manifest“, auf Atomwaffen für die Bundeswehr zu verzichten, und 1955 mahnten Russell und Einstein mit ihrem Manifest zur Abschaffung des Krieges. Die Frage, wer Verantwortung für die Folgen von Forschung trägt, ist seither Teil der Wissenschaftsethik, bis hin zu heutigen Debatten über Gentechnik und Künstliche Intelligenz.",
  "Für die Politik begann ein neues Zeitalter. Die Sowjetunion zündete 1949 ihre erste Bombe, und ein Wettrüsten begann (Einheit 42). Das Gleichgewicht des Schreckens, die Gewissheit, dass ein Angriff gegenseitige Vernichtung auslöst, verhinderte nach vielen Deutungen einen direkten Krieg der Supermächte, brachte aber die Welt mehrmals an den Rand eines Atomkrieges (Einheit 43). Zugleich nutzte die Medizin die Kernphysik: Strahlentherapie, Szintigrafie, Nuklearmedizin. Die Geschichte zeigt wieder die Doppelnatur von Wissen: Es kann heilen und zerstören, und es braucht Menschen, die über die Folgen nachdenken."
]});

addEnd(UNITS.u36, { h: "Die Politik der Republik: Parteien, Koalitionen und Wahlen", p: [
  "Um zu verstehen, warum die Republik scheiterte, lohnt ein Blick auf ihr politisches System. Die Weimarer Verfassung kannte ein reines Verhältniswahlrecht ohne Sperrklausel. Das spiegelte den Wählerwillen genau, brachte aber viele kleine Parteien in den Reichstag. Keine Partei erreichte je eine Mehrheit, Regierungen mussten Koalitionen bilden und fielen oft nach Monaten. Zwischen 1919 und 1933 gab es zwanzig Regierungen. Die Mitte, bestehend aus SPD, Zentrum und Liberalen (DDP, DVP), die die Republik trug, verlor ab Mitte der 1920er-Jahre Stimmen an die Ränder.",
  "Der Reichspräsident hatte eine starke Stellung: Er ernannte den Kanzler, konnte den Reichstag auflösen und nach Artikel 48 Notverordnungen erlassen. Das war als Notbremse gedacht, wurde aber in der Krise zum Regelfall. Brüning regierte ab 1930 ohne parlamentarische Mehrheit mit Hilfe des Präsidenten Hindenburg, danach folgten Papen und Schleicher. Das Parlament verlor Gewicht, und die Bevölkerung gewöhnte sich an Regieren ohne Parlament. Als im Januar 1933 Hitler Kanzler wurde, war der Weg dafür vorbereitet. Historiker sprechen vom „Verfassungswandel“ vor 1933: Die Demokratie wurde ausgehöhlt, bevor sie abgeschafft wurde.",
  "Ein zweiter Faktor war die politische Kultur. Viele Bürger sahen in der Republik das System der Niederlage und des „Diktats“. Wichtige Berufsgruppen wie Richter, Offiziere und Professoren standen ihr kühl gegenüber, und die Parteien kämpften mit paramilitärischen Verbänden: Reichsbanner (SPD-nah), Rotfrontkämpferbund (KPD), SA (NSDAP), Stahlhelm. Straßengewalt und Wahlkämpfe verschmolzen. Zugleich gab es starke demokratische Kräfte, etwa Gewerkschaften, Frauenbewegung und Teile der Presse. Das Scheitern war nicht vorherbestimmt, aber es gab zu wenige, die bereit waren, die Republik zu verteidigen, als es darauf ankam."
]});
addEnd(UNITS.u36, { h: "Kultur, Wissenschaft und neue Lebensformen der Zwanzigerjahre", p: [
  "Die Weimarer Jahre waren auch eine Zeit großer Kreativität. Das Bauhaus in Weimar und Dessau verband Kunst, Handwerk und Industrie und prägte Architektur und Design. Im Film schufen Fritz Lang („Metropolis“, 1927) und F. W. Murnau Klassiker, Bertolt Brecht und Kurt Weill revolutionierten das Theater, Thomas Mann erhielt 1929 den Nobelpreis. In Berlin, mit vier Millionen Einwohnern, mischten sich Kabarett, Jazz, Mode und politische Debatten. Frauen erhielten 1919 das Wahlrecht, arbeiteten als Angestellte und Sekretärinnen und prägten das Bild der „neuen Frau“, auch wenn Gleichstellung im Alltag begrenzt blieb.",
  "In Wissenschaft und Medizin gehörte Deutschland zur Weltspitze. Physiker wie Einstein, Heisenberg, Born und Schrödinger prägten die Quantenmechanik. In der Medizin entdeckten Forscher Insulin (Banting und Best in Toronto, 1921, mit deutscher Vorarbeit), und die Sozialmedizin baute Gesundheitsfürsorge aus: Mütterberatung, Tuberkulosefürsorge, Schulärzte, Krankenkassen. Magnus Hirschfeld gründete 1919 in Berlin das Institut für Sexualwissenschaft. Zugleich wuchsen eugenische Ideen, die später missbraucht wurden (Einheit 40). Das Beispiel zeigt, dass Fortschritt und dunkle Linien nebeneinander bestehen können.",
  "Die Kultur der Republik war umstritten. Konservative und Nationalisten sahen in Jazz, Nacktkultur und modernen Kunstformen „Verfall“. Antisemitische Hetze richtete sich gegen jüdische Künstler, Intellektuelle und Politiker, darunter Rathenau. Als die Wirtschaftskrise kam, verband sich kultureller Widerstand mit sozialer Not. Nach 1933 wurden viele Künstler und Wissenschaftler vertrieben (Einheit 37). Das ist ein Grund, warum die Zwanzigerjahre bis heute fasziniert: Sie zeigen, wie viel möglich war, und wie schnell es verloren gehen konnte."
]});

addEnd(UNITS.u37, { h: "Die Machtübernahme genauer betrachtet: Zufälle, Intrigen, Entscheidungen", p: [
  "Hitlers Ernennung am 30. Januar 1933 war kein zwangsläufiges Ergebnis, sondern Folge von Entscheidungen. Bei der Reichstagswahl im November 1932 hatte die NSDAP erstmals Stimmen verloren (33,1 Prozent), die Partei steckte in finanziellen Schwierigkeiten, und die Weltwirtschaftskrise ließ nach. Kanzler Schleicher versuchte vergeblich, Mehrheiten zu finden. Franz von Papen, der gestürzte Kanzler, verhandelte mit Hitler und überzeugte Hindenburg, der ihn zunächst verachtete, ihn zum Kanzler zu machen, mit konservativen Ministern, die ihn „einrahmen“ sollten. Die Konservativen glaubten, sie könnten die Massenbewegung der Nazis für sich nutzen. Das war ein fataler Irrtum.",
  "Nach dem Reichstagsbrand (27. Februar 1933), dessen Urheberschaft bis heute diskutiert wird (verurteilt wurde der Niederländer Marinus van der Lubbe), nutzten die Nationalsozialisten den Schock. Die Verordnung „zum Schutz von Volk und Staat“ hob Grundrechte auf. Bei den Wahlen im März erreichte die NSDAP 43,9 Prozent, nicht die absolute Mehrheit, aber zusammen mit Verbündeten genügte es. Dann folgte in schneller Folge: Ermächtigungsgesetz, Verbot der Gewerkschaften (2. Mai), Auflösung der Parteien (Juli), Gesetz gegen die Neubildung von Parteien, womit die NSDAP die einzige Partei blieb. Im Juni 1934 ließ Hitler im „Röhm-Putsch“ SA-Führer und politische Gegner ermorden, ohne rechtliche Folgen; die Reichswehr und viele Bürger nahmen es hin.",
  "Wichtig für das Verständnis: Der Prozess verband Legalität und Gewalt. Äußerlich blieb der Staat bestehen, Beamte, Richter und Offiziere dienten weiter, nur die Ziele änderten sich. Damit erklärt sich, warum so viele mitmachten. Es erklärt auch, warum der Verweis auf Gesetz und Ordnung allein nicht schützt, wenn Gesetze selbst zum Instrument werden. Das Grundgesetz von 1949 (Einheit 42) reagierte darauf mit einer „wehrhaften Demokratie“, die ihre Gegner begrenzen kann, und mit der „Ewigkeitsklausel“, die die Grundsätze von Artikel 1 und 20 unveränderbar macht."
]});
addEnd(UNITS.u37, { h: "Wirtschaft, Aufrüstung und der Weg in den Krieg", p: [
  "Das NS-Regime stützte sich auf eine Wirtschaftspolitik, die kurzfristig erfolgreich schien. Mit staatlichen Aufträgen, dem Autobahnbau, dem Reichsarbeitsdienst und vor allem der Aufrüstung sank die Arbeitslosigkeit von sechs Millionen (1932) auf nahezu Vollbeschäftigung (1938). Die Finanzierung erfolgte durch Kredite, die über geheime Wechsel (MEFO-Wechsel) liefen, durch Druck auf Löhne und durch den Raub jüdischen Eigentums. Das System war auf Dauer nicht tragfähig: Bis 1938/39 drohte der Staatsbankrott, wenn nicht durch Eroberung neue Ressourcen erschlossen würden. Wirtschaftliche Zwänge und ideologische Ziele verstärkten sich gegenseitig.",
  "Außenpolitisch verfolgte Hitler schrittweise Revisionen: 1935 Wehrpflicht und Flottenabkommen mit Großbritannien, 1936 Besetzung des Rheinlands, 1936–39 Unterstützung Francos im spanischen Bürgerkrieg (Bombardierung von Guernica 1937), 1938 Anschluss Österreichs und Sudetenland (Einheit 39). Die Westmächte reagierten zögerlich, aus Angst vor einem neuen Krieg und wegen eigener Krisen. Der Vierjahresplan (1936) verpflichtete die Wirtschaft zur Kriegsfähigkeit innerhalb von vier Jahren. Die Planung des Krieges war also lange vor 1939 im Gange.",
  "Die Erfahrungen der Menschen in dieser Zeit waren gespalten. Für viele schienen die ersten Jahre Aufschwung, Sicherheit und Stolz zu bringen, für Verfolgte bedeuteten sie Entrechtung, Flucht und Angst. Etwa 500.000 Juden lebten 1933 in Deutschland, bis 1939 flohen rund 280.000. Viele fanden keine Aufnahmeländer (Einheit 40). Das Bild, das sich ergibt, ist kein einfaches Schwarz-Weiß, sondern zeigt, wie wirtschaftlicher Erfolg und Verbrechen nebeneinanderstanden und wie Teile der Gesellschaft das Unrecht hinnahmen oder ignorierten."
]});

addEnd(UNITS.u38, { h: "Japan 1868 bis 1945: Wie eine Modernisierung zur Aggression wurde", p: [
  "Japans Weg in den Krieg lässt sich nur aus seiner Modernisierungsgeschichte verstehen (Einheit 29). Nach der Meiji-Restauration 1868 baute das Land in wenigen Jahrzehnten eine Industrie, ein Heer und eine Verwaltung nach westlichem Vorbild auf. Es verstand sich als Gegengewicht zu den Kolonialmächten, wurde aber selbst Kolonialmacht: 1894/95 gegen China (Taiwan), 1904/05 gegen Russland (Einheit 32), 1910 Annexion Koreas. Die Ideologie verband Staatsshinto, Kaiserkult und Nationalismus. Die Armee und Marine bekamen in der Verfassung eine Sonderstellung, sie waren dem Kaiser direkt unterstellt, und Kriegsminister mussten aktive Offiziere sein. Dadurch konnte das Militär Regierungen stürzen, indem es seinen Minister zurückzog.",
  "In den 1920er-Jahren gab es Fortschritte der Parteienpolitik („Taishō-Demokratie“), 1925 das allgemeine Männerwahlrecht. Die Weltwirtschaftskrise veränderte das Klima: Der Export von Seide brach ein, Bauern verarmten, und junge Offiziere forderten eine „Showa-Restauration“ mit Expansion als Ausweg. Attentate auf Politiker (1932 Ministerpräsident Inukai) und Putschversuche (1936) schüchterten die Zivilregierung ein. Die Besetzung der Mandschurei 1931 geschah ohne Billigung der Regierung, die sich dem Fait accompli fügte. So zeigt sich ein Muster: Einzelne Militärs schufen Tatsachen, die Politik folgte.",
  "Die Besatzungspolitik war brutal. In China führte der Krieg zu Massakern (Nanjing), Zwangsarbeit und Zwangsprostitution („Trostfrauen“), in Südostasien nach 1941 zu Zwangsarbeit, etwa am Bau der Burma-Eisenbahn, bei dem Zehntausende alliierte Gefangene und Hunderttausende asiatische Arbeiter starben. Die Einheit 731 führte Menschenversuche durch (Einheit 39). Zugleich warb Japan mit der Parole „Asien den Asiaten“ um Unterstützung gegen die Kolonialmächte. Wie diese Zeit erinnert wird, bleibt in Ostasien bis heute umstritten und belastet das Verhältnis zu China und Korea. Man sieht an diesem Beispiel, wie Aufarbeitung Zeit braucht und wie Erinnerung Politik prägt."
]});
addEnd(UNITS.u38, { h: "Arabische Welt, Iran und Afrika: Zwischen Mandat, Reform und Öl", p: [
  "In der Zwischenkriegszeit entstanden in der arabischen Welt unterschiedliche Staaten. Ägypten wurde 1922 formal unabhängig, blieb aber unter britischem Einfluss (Suezkanal). Der Irak wurde 1932 aufgenommen in den Völkerbund, behielt jedoch britische Stützpunkte. Syrien und Libanon blieben französisches Mandat, mit Aufständen (1925–27). Saudi-Arabien wurde 1932 von Ibn Saud auf Basis einer Allianz mit der wahhabitischen Lehre vereint. In Persien (seit 1935 Iran) modernisierte Reza Schah das Land mit Hilfe von Bildung, Eisenbahn und Armee nach dem Vorbild Atatürks, geriet aber in Abhängigkeit von britischen Ölinteressen (Anglo-Persian Oil Company).",
  "Das Öl veränderte die Region. Funde in Persien (1908), im Irak (1927) und in Saudi-Arabien (1938) machten sie zum Schwerpunkt der Weltwirtschaft, weil Schiffe, Flugzeuge und Armeen auf Öl umstellten. Westliche Konzerne schlossen Konzessionsverträge, die den Staaten nur kleine Erlöse sicherten. Das legte die Wurzeln für spätere Konflikte um Souveränität über Ressourcen (Mossadegh 1951–53, Einheit 43; OPEC 1960). Man sieht, wie Rohstoffe politische Macht und Abhängigkeit schaffen.",
  "In Afrika verfestigte sich das Kolonialsystem, mit Steuern, Zwangsarbeit und Landenteignung. Dennoch entstanden Gruppen, die Rechte forderten: Gewerkschaften, Kirchen, Studentenvereine. Panafrikanische Kongresse (seit 1919, von W. E. B. Du Bois angeregt) verbanden Afrikaner und Afroamerikaner. In Südafrika wurde der ANC 1912 gegründet (Einheit 46). Der Äthiopienkrieg 1935 erzeugte weltweit Empörung, auch bei Schwarzen in Amerika und der Karibik. So bereiteten Netzwerke und Erfahrungen die Zeit nach 1945 vor, in der die Kolonialreiche endeten."
]});

addEnd(UNITS.u39, { h: "Vom Pazifik bis Stalingrad: Warum die Alliierten gewannen", p: [
  "Der Ausgang des Krieges lässt sich auf mehreren Ebenen erklären. Die erste ist die Ökonomie: Die Alliierten (USA, Sowjetunion, Großbritannien) hatten zusammen ein Vielfaches an Rohstoffen, Industriekraft und Bevölkerung. Die USA produzierten 1944 mehr als alle Achsenmächte zusammen. Die zweite Ebene ist die Strategie: Hitlers Entscheidung, die Sowjetunion anzugreifen und den USA den Krieg zu erklären, verband die größten Gegner gegen Deutschland. Ein Zweifrontenkrieg, den man 1914 gefürchtet hatte, wurde 1941 bewusst eingegangen, in der Hoffnung auf einen schnellen Sieg im Osten.",
  "Die dritte Ebene ist der Krieg im Osten. Die Wehrmacht konnte Moskau 1941 nicht einnehmen, scheiterte 1942/43 in Stalingrad und verlor 1943 bei Kursk die Initiative. Über 80 Prozent der deutschen Verluste entstanden an der Ostfront. Die Rote Armee erlitt riesige Verluste, lernte aber, verlagerte Industrie und nutzte Lend-Lease-Lieferungen. Die vierte Ebene ist der Luft- und Seekrieg: Die Schlacht im Atlantik gegen die U-Boote wurde 1943 durch Geleitzüge, Radar und Entschlüsselung entschieden, der Luftkrieg zerstörte Industrie und Verkehr und band Kräfte. Die fünfte Ebene sind Landungen im Mittelmeer und in der Normandie, die eine zweite Front im Westen schufen.",
  "Man sollte Gründe nicht zu mechanisch sehen. Auch die Haltung der Menschen zählte: Der Widerstand der Sowjetbevölkerung, der Durchhaltewillen Großbritanniens 1940 und die Mobilisierung der US-Gesellschaft wirkten. Auf deutscher Seite führten Ideologie, Terror und der Glaube an ein „Wunder“ zum Weiterkämpfen, obwohl der Krieg verloren war; allein von Januar bis Mai 1945 starben mehr Deutsche als in den Jahren zuvor. Die Weigerung, früher zu kapitulieren, kostete Millionen Menschen das Leben, auch in den Lagern und bei den Todesmärschen."
]});
addEnd(UNITS.u39, { h: "Zivilisten, Widerstand und Kollaboration: Der Krieg aus der Nähe", p: [
  "Der Krieg bedeutete für Zivilisten Bombennächte, Flucht, Besatzung und Hunger. In Deutschland starben bei Luftangriffen etwa 400.000 bis 600.000 Menschen; in Großbritannien trafen die Bombardierungen („Blitz“) vor allem London, Coventry und Liverpool. Millionen Kinder wurden aufs Land verschickt (Kinderlandverschickung, Evakuierungen). Frauen übernahmen Arbeit in Fabriken, als Flakhelferinnen, Ärztinnen und Krankenschwestern. In der Sowjetunion kämpften Frauen als Scharfschützinnen und Pilotinnen. Das Leben unter Rationierung und Bomben prägte eine Generation.",
  "In den besetzten Ländern waren die Reaktionen vielfältig. Es gab bewaffneten Widerstand (Résistance in Frankreich, Partisanen in Jugoslawien und der Sowjetunion, Warschauer Aufstand 1944), stillen Widerstand wie Fluchthilfe, und es gab Kollaboration, aus Überzeugung, Opportunismus oder Zwang. Das Vichy-Regime in Frankreich unter Pétain arbeitete mit Deutschland zusammen und lieferte Juden aus. Die Erinnerung daran wurde nach 1945 lange vereinfacht zugunsten eines Mythos des Widerstands. Erst später setzte eine kritischere Auseinandersetzung ein. Dänemark rettete im Oktober 1943 den größten Teil seiner Juden über das Meer nach Schweden, ein Beispiel dafür, wie gemeinsame Haltung etwas bewirken konnte.",
  "In Deutschland blieb Widerstand selten und riskant. Der 20. Juli 1944 war der Versuch, den Krieg zu beenden und das Regime zu stürzen, getragen von Offizieren und Zivilisten (Stauffenberg, Goerdeler, Beck); über 100 Beteiligte wurden hingerichtet. Die Weiße Rose (Geschwister Scholl, 1943) rief zum Widerstand auf. Georg Elser versuchte 1939 allein, Hitler zu töten. Diese Taten wurden nach 1945 unterschiedlich gewürdigt. Sie zeigen, dass moralische Entscheidungen möglich waren und was sie kosteten, und sie sind ein Gegenbild zur Behauptung, man habe nichts tun können."
]});

addEnd(UNITS.u40, { h: "Das Ghetto, das Lager, die Flucht: Wie Opfer das Unfassbare erlebten", p: [
  "Um die Geschichte nicht auf Zahlen zu verkürzen, hilft der Blick auf einzelne Erfahrungen. Im Warschauer Ghetto lebten 1941 rund 450.000 Menschen auf wenigen Quadratkilometern, mit Rationen von etwa 180 Kilokalorien am Tag. Hunger, Kälte und Fleckfieber töteten Zehntausende. Gleichzeitig entstanden Schulen, Suppenküchen, Theater, geheime Archive (das Ringelblum-Archiv) und ein Untergrund. Im Sommer 1942 wurden etwa 300.000 Menschen nach Treblinka deportiert. Im April 1943 erhob sich die Jüdische Kampforganisation (ŻOB) gegen die Auflösung des Ghettos, wohl wissend, dass sie nicht siegen konnte.",
  "Auschwitz war ein Ort, an dem nach der Ankunft der Züge Selektionen stattfanden: Wer arbeitsfähig erschien, kam ins Lager, Kinder, Alte und viele andere wurden direkt in die Gaskammern geschickt. Häftlinge erlebten Hunger, Appelle, Zwangsarbeit, Krankheit und Willkür. Das Lagerpersonal umfasste auch Ärzte, die bei der Selektion mitwirkten. Zugleich bildeten Häftlinge Netzwerke von Solidarität. Primo Levi, Elie Wiesel, Viktor Frankl und viele andere schrieben nach ihrer Befreiung, um zu bezeugen. Frankl, ein Arzt und Psychiater, entwickelte aus seiner Erfahrung die Logotherapie, die den Sinn im Leben betont.",
  "Am Ende des Krieges ließ die SS die Lager räumen und trieb Häftlinge auf Todesmärsche, bei denen Zehntausende starben. Die Befreiung durch Rote Armee (Auschwitz, 27. Januar 1945) und westalliierte Truppen (Bergen-Belsen, Buchenwald, Dachau) zeigte der Welt die Verbrechen, und Alliierte zwangen Anwohner, die Lager anzusehen. Viele Überlebende waren schwer krank, und Seuchen wie Typhus forderten auch nach der Befreiung Opfer. Das Leben danach war schwierig: Viele hatten ihre Familie verloren und keine Heimat. Ihre Erzählungen, oft erst Jahrzehnte später möglich, sind zentrale Quellen und mahnen zu Respekt."
]});
addEnd(UNITS.u40, { h: "Ärztliche Verantwortung heute: Was die Medizin aus dieser Geschichte lernt", p: [
  "Die Verstrickung der Medizin in die Verbrechen hat die ärztliche Ethik nachhaltig geprägt. Der Nürnberger Ärzteprozess formulierte die Grundsätze der Forschung am Menschen. Die Genfer Deklaration des Weltärztebundes (1948) erneuerte den hippokratischen Eid mit dem Versprechen, die Menschlichkeit auch unter Bedrohung zu achten. Die Deklaration von Helsinki (1964, mehrfach überarbeitet) verlangt unabhängige Prüfung von Studien und Schutz verletzlicher Gruppen. Heute stehen Ethikkommissionen, Aufklärungspflichten und Datenschutz auf diesem Fundament.",
  "Darüber hinaus bleibt die Frage nach Verantwortung im Beruf. Warum machten Ärzte mit? Die Forschung nennt mehrere Gründe: Das Selbstbild als „Gesundheitsführer“ des Volkes, die Faszination für „wissenschaftliche“ Lösungen, Karrierechancen nach der Entlassung jüdischer Kollegen 1933, Gruppendruck und die Gewöhnung an immer weitere Schritte. Der Psychologe Robert Jay Lifton sprach vom „Doppeln“ (doubling), dem Aufbau einer zweiten Persönlichkeit, die Verbrechen ermöglicht. Für heutige Mediziner bedeutet das, Strukturen zu schaffen, in denen man Bedenken äußern kann, und Hierarchien so zu gestalten, dass Fehlverhalten gemeldet werden darf.",
  "Gedenkstätten wie die Gedenkstätte Hadamar (eine der Tötungsanstalten der Aktion T4), das Denkmal für die Ermordeten der „Euthanasie“ in Berlin (Tiergartenstraße 4) und Ausstellungen von Ärztekammern machen die Geschichte sichtbar. Auch Themen wie Triage in Pandemien, Entscheidungen über Behandlungsgrenzen und Menschen mit Behinderungen werden vor diesem Hintergrund diskutiert. Man kann daraus keine einfachen Regeln ableiten, aber eine Haltung: Jeder Mensch hat unabhängig von Leistungsfähigkeit gleichen Wert; Entscheidungen über Leben dürfen nie nach Nützlichkeit für andere getroffen werden. Diese Haltung steht im Zentrum ärztlicher Berufsordnungen."
]});

addEnd(UNITS.u41, { h: "Die Schlacht um den Pazifik: Inselkrieg, Luftmacht, Logistik", p: [
  "Der Krieg im Pazifik war ein Krieg der Entfernungen. Er wurde über Tausende Kilometer geführt und hing von Flugzeugträgern, Versorgungsschiffen und Stützpunkten ab. Nach Pearl Harbor eroberte Japan in wenigen Monaten Südostasien. Die Briten verloren Singapur im Februar 1942, wo über 80.000 Soldaten kapitulierten, die größte Kapitulation in der britischen Geschichte. Die USA verloren die Philippinen. Doch Japans Fähigkeit, die Eroberungen zu halten, war begrenzt: Seine Industrie produzierte nur einen Bruchteil der amerikanischen. Nach Midway im Juni 1942 verlor Japan die Initiative und kämpfte in Guadalcanal (1942/43) um Stützpunkte.",
  "Die amerikanische Strategie des „Inselhüpfens“ umging stark befestigte Inseln und rückte näher zu Japan. Die Kämpfe auf Iwojima und Okinawa 1945 kosteten enorme Opfer: auf Okinawa starben über 100.000 Zivilisten, als Japaner und Amerikaner kämpften. Die Kamikaze-Angriffe verursachten Schäden, konnten aber den Verlauf nicht ändern. U-Boote versenkten den größten Teil der japanischen Handelsflotte, wodurch Rohstoffe und Nahrung knapp wurden. Hunger breitete sich aus. Die Luftangriffe auf Städte, die Brandbomben auf Tokio im März 1945, zerstörten große Teile der Städte.",
