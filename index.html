UNITS.u19 = {
  id: "u19",
  title: "Reformation: Luther und die Spaltung der Kirche",
  lead: "Warum ein Streit über den Ablass 1517 eine ganze Ordnung sprengte, und wie Buchdruck, Fürsten und Bauern das Ergebnis mitbestimmten.",
  body: [
    { h: "Die Ausgangslage: eine Kirche unter Druck", p: [
      "Die Reformation begann nicht aus dem Nichts. Seit dem Spätmittelalter war die Kirche in der Kritik (Einheit 13): Das Papsttum hatte im Schisma an Ansehen verloren, Johannes Hus war 1415 verbrannt worden, und viele Menschen störten sich an Ämterkauf, Reichtum und Lebenswandel mancher Geistlicher. Gleichzeitig wuchs das Bedürfnis nach persönlicher Frömmigkeit. Die Pest hatte die Angst vor Tod und Fegefeuer verschärft, und viele suchten Sicherheit, ob sie vor Gott bestehen könnten.",
      "Auf diese Angst antwortete die Kirche mit dem Ablass: Gläubige konnten durch Gebete, gute Werke oder Geldzahlungen Strafen im Fegefeuer verkürzen. Papst Leo X. brauchte Geld für den Neubau der Peterskirche, und Erzbischof Albrecht von Mainz hatte sich bei den Fuggern verschuldet, um mehrere Ämter zu erwerben. Der Ablasshandel, den der Dominikaner Johann Tetzel in Sachsen betrieb, sollte beiden helfen. Hier kam alles zusammen: religiöse Sorge, Geldbedarf und Kritik.",
      "Hinzu kam der Humanismus, der in Europa zu den antiken Quellen zurückkehrte (Einheit 13). Erasmus von Rotterdam gab 1516 das Neue Testament im griechischen Urtext heraus und kritisierte kirchliche Missstände mit Witz. Die Idee „zurück zu den Quellen“ passte zu Luthers Vorhaben, die Bibel selbst sprechen zu lassen."
    ]},
    { h: "Martin Luther: vom Mönch zum Gegner Roms", p: [
      "Martin Luther (1483–1546) war Augustinermönch und Professor für Bibelauslegung in Wittenberg. Ihn quälte die Frage, wie ein sündiger Mensch vor einem gerechten Gott bestehen kann. Seine Antwort, die er beim Studium des Römerbriefs fand, lautete: nicht durch Leistungen, sondern allein durch den Glauben („sola fide“) und die Gnade Gottes („sola gratia“). Wenn aber die Gnade geschenkt wird, kann man sie nicht kaufen, und dann verliert der Ablass seine Grundlage.",
      "1517 verfasste Luther 95 Thesen gegen den Ablass und schickte sie an Erzbischof Albrecht. Ob er sie am 31. Oktober tatsächlich an die Schlosskirche schlug, ist unter Fachleuten umstritten. Sicher ist, dass sie gedruckt wurden und sich in wenigen Wochen im Reich verbreiteten. In den folgenden Jahren wurde aus einer akademischen Debatte ein Grundsatzstreit über Autorität: Bei der Leipziger Disputation 1519 bestritt Luther, dass Päpste und Konzilien unfehlbar seien. 1520 schrieb er mehrere Schriften, darunter „An den christlichen Adel deutscher Nation“, und der Papst drohte ihm den Bann an. Luther verbrannte die Bulle öffentlich.",
      "Auf dem Reichstag zu Worms 1521 sollte er widerrufen. Er verweigerte es, berief sich auf sein Gewissen und die Heilige Schrift. Kaiser Karl V. verhängte die Reichsacht, aber Kurfürst Friedrich der Weise ließ Luther zum Schein entführen und auf der Wartburg verstecken. Dort übersetzte Luther 1521/22 das Neue Testament ins Deutsche, 1534 folgte die ganze Bibel. Seine Übersetzung prägte die deutsche Schriftsprache, denn sie verband Wortschatz verschiedener Regionen zu einer Form, die alle lesen konnten."
    ]},
    { h: "Warum setzte sich die Reformation durch?", p: [
      "Vor Luther hatte es Kritiker gegeben, die verbrannt wurden. Warum überlebte er? Man kann vier Gründe unterscheiden. Der erste ist das Medium. Der Buchdruck (Einheit 13) machte es möglich, dass Luthers Gedanken in kurzer Zeit zehntausendfach gedruckt wurden, als Flugschriften mit Holzschnitten, in deutscher Sprache. Luther war der meistgedruckte Autor seiner Zeit. Zum ersten Mal formte sich eine große öffentliche Debatte über Glaubensfragen. Für Hus hundert Jahre zuvor hatte es das nicht gegeben.",
      "Der zweite Grund ist die Politik. Fürsten sahen in der Reformation die Chance, ihre Unabhängigkeit gegenüber Kaiser und Papst zu stärken und Kirchengut einzuziehen. Dazu passt, dass Karl V. zugleich Herrscher über Spanien und Amerika (Einheit 17) war und gegen Frankreich und die Osmanen kämpfte, die 1529 vor Wien standen. Er konnte nicht alle Kräfte gegen die Reformation einsetzen. Der dritte Grund liegt bei den Städten, in denen Bürger, Handwerker und Kaufleute die neue Lehre aufnahmen, weil sie selbstbestimmte Gemeinden und Bildung betonte. Der vierte ist die Unzufriedenheit: über Abgaben nach Rom, Missstände und die Macht der Kirche, die schon im Investiturstreit (Einheit 12) als Frage nach der Grenze geistlicher Macht erschienen war.",
      "Wichtig ist, was Luther auch änderte: Er betonte das „Priestertum aller Gläubigen“, also dass jeder Christ unmittelbar zu Gott steht, und er verlangte, dass die Menschen die Bibel lesen können. Das förderte Schulen und Lesefähigkeit. Zugleich stärkte die Reformation die Landesherren, weil sie in protestantischen Gebieten zugleich Kirchenoberhaupt wurden."
    ]},
    { h: "Bauernkrieg und andere Wege der Reform", p: [
      "Die Botschaft von der „Freiheit eines Christenmenschen“ wurde von anderen anders verstanden. Im Südwesten des Reiches erhoben sich 1524/25 Bauern gegen Abgaben, Leibeigenschaft und die Willkür der Grundherren (Einheit 11). In den „Zwölf Artikeln“ forderten sie unter Berufung auf die Bibel Rechte wie die freie Pfarrerwahl, die Abschaffung der Leibeigenschaft und mehr Gerechtigkeit. Luther lehnte den Aufstand ab und rief die Fürsten auf, ihn niederzuschlagen. In der Schlacht bei Frankenhausen 1525 wurden die Bauern unter Thomas Müntzer vernichtend geschlagen, Zehntausende starben. Die Folge war, dass die Reformation fortan stark von den Fürsten getragen wurde.",
      "Daneben entstanden weitere Richtungen. Huldrych Zwingli führte ab 1519 in Zürich eine radikalere Reform ein, Johannes Calvin baute ab 1541 in Genf eine streng geordnete Gemeinde auf. Calvin lehrte die Vorherbestimmung (Prädestination) und betonte Arbeit und Bewährung im Alltag. Der Calvinismus breitete sich nach Frankreich, in die Niederlande, nach Schottland und England aus. Die Täufer lehnten die Kindertaufe ab und wurden von Katholiken wie Protestanten verfolgt. In England trennte sich Heinrich VIII. 1534 mit dem Act of Supremacy von Rom, vor allem aus politischen und dynastischen Gründen, und machte sich zum Oberhaupt der Kirche."
    ]},
    { h: "Katholische Antwort und der Augsburger Religionsfrieden", p: [
      "Die katholische Kirche reagierte mit einer eigenen Erneuerung. Das Konzil von Trient (1545–1563) bekräftigte zentrale Lehren, verbesserte die Ausbildung der Priester und schaffte einige Missstände ab. 1540 wurde der Jesuitenorden gegründet, der durch Bildung, Predigt und Mission wirkte. Jesuiten gründeten Schulen und Universitäten in Europa und gingen als Missionare nach Amerika, Indien, Japan (Franz Xaver ab 1549) und China (Matteo Ricci). So verbreitete sich der Streit der europäischen Konfessionen in die Welt, und die Weltmission folgte den Handelswegen (Einheit 16).",
      "Im Reich war nach langen Auseinandersetzungen ein Kompromiss nötig. Der Augsburger Religionsfriede von 1555 erlaubte den Reichsständen, zwischen katholischem und lutherischem Bekenntnis zu wählen („cuius regio, eius religio“, wessen Gebiet, dessen Religion). Wer nicht mit dem Glauben seines Landesherrn leben wollte, durfte auswandern. Für Calvinisten und Täufer galt der Frieden nicht. Es war ein Friede zwischen Fürsten, nicht für den Einzelnen, und er ließ den Konfliktstoff bestehen, der ein halbes Jahrhundert später ausbrach (Einheit 20)."
    ]},
    { h: "Folgen: Bildung, Staat und Schattenseiten", p: [
      "Die Reformation hatte weitreichende Folgen. Sie förderte Bildung: Protestantische Gebiete bauten Schulen, damit alle die Bibel lesen könnten, und die Alphabetisierung stieg. Sie stärkte den Staat: Landesherren übernahmen Aufgaben, die vorher die Kirche hatte, etwa Armenfürsorge und Schule. Sie zerbrach die religiöse Einheit des lateinischen Europas, was Raum für Wahlmöglichkeiten, aber auch für Konflikte schuf. Und sie veränderte das Denken über Autorität: Wenn man die Kirche kritisieren kann, kann man bald auch den Staat kritisieren.",
      "Es gab auch Schattenseiten. Luther schrieb in späteren Jahren heftige judenfeindliche Schriften, die später von Antisemiten benutzt wurden. In der Reformationszeit begannen zudem Hexenverfolgungen zuzunehmen (Einheit 20). Beide Konfessionen verfolgten Abweichler. Man sollte die Reformation deshalb weder als reinen Befreiungsakt noch als reinen Zerfall sehen, sondern als einen Umbruch, in dem religiöse, politische und wirtschaftliche Kräfte zusammenwirkten."
    ]}
  ],

  deep: [
    ["Luther und der Buchdruck: Was war neu?", "Gedruckte Flugschriften waren kurz, billig und leicht zu verbreiten, viele hatten Bilder, damit auch Menschen, die kaum lesen konnten, sie verstanden oder vorgelesen bekamen. Rund 90 Prozent der Bevölkerung konnten nicht lesen, aber Texte wurden in Gaststuben und auf Märkten vorgelesen. Der Druck schuf also eine Öffentlichkeit, die über Schrift und Mündlichkeit zugleich wirkte."],
    ["Warum Calvinismus und Wirtschaft?", "Der Soziologe Max Weber vermutete 1905 einen Zusammenhang zwischen calvinistischer Arbeitsethik und kapitalistischem Geist. Die These ist bis heute umstritten, denn Handelszentren gab es auch in katholischen Gebieten. Sie zeigt aber, dass man religiöse und wirtschaftliche Entwicklungen zusammen denken kann."]

UNITS.u20 = {
  id: "u20",
  title: "Konfessionskriege und der Westfälische Frieden",
  lead: "Wie aus dem Streit um den richtigen Glauben Kriege wurden, die Europa verwüsteten, und wie 1648 eine Ordnung entstand, in der Staaten als gleichberechtigt gelten.",
  body: [
    { h: "Konfessionalisierung: Glaube als Staatsaufgabe", p: [
      "Nach 1555 festigten sich die Konfessionen. Katholische, lutherische und calvinistische Herrscher legten verbindliche Bekenntnisse fest, schufen Kirchenordnungen, kontrollierten Schulen, Predigten und Moral und grenzten sich ab. Man nennt das Konfessionalisierung. Der Glaube wurde zu einer Staatsaufgabe: Wer zum Land gehörte, sollte den Glauben des Landesherrn teilen, und Abweichung galt als Gefahr für Ordnung und Seelenheil. So wuchs einerseits die Fähigkeit von Staaten, in das Leben der Menschen einzugreifen, andererseits wuchs die Spannung zwischen den Lagern.",
      "Dass daraus Krieg wurde, hat mehrere Ursachen, die man auseinanderhalten sollte. Es ging um Glaubenswahrheit, denn beide Seiten hielten ihren Weg für den einzig richtigen zum Heil. Es ging um Macht, denn Fürsten nutzten Religion, um Besitz und Einfluss zu sichern. Und es ging um Sicherheit, denn jede Seite fürchtete, von der anderen angegriffen zu werden. Wichtig ist, dass diese Motive sich verstärkten. Wer glaubt, für das ewige Heil zu kämpfen, ist schwerer zu Kompromissen zu bewegen."
    ]},
    { h: "Frankreich und die Niederlande: zwei Wege", p: [
      "In Frankreich kämpften zwischen 1562 und 1598 Katholiken und Hugenotten (französische Calvinisten) in den Hugenottenkriegen. In der Nacht zum 24. August 1572, der Bartholomäusnacht, wurden in Paris und anderen Städten Tausende Hugenotten ermordet. Der Konflikt endete, als der Hugenotte Heinrich von Navarra katholisch wurde und als Heinrich IV. König wurde („Paris ist eine Messe wert“). 1598 sicherte das Edikt von Nantes den Hugenotten Rechte und Sicherheit zu. Das war ein Kompromiss im Interesse des Staates. Ludwig XIV. widerrief es 1685, worauf Hunderttausende Hugenotten das Land verließen, viele nach Brandenburg-Preußen und in die Niederlande.",
      "In den Niederlanden verband sich Religion mit einem Streit um Steuern und Selbstbestimmung. Die reichen Städte gehörten zum Herrschaftsbereich Philipps II. von Spanien (Einheit 17: sein Silber), der ihnen den Katholizismus und hohe Abgaben aufzwingen wollte. Ab 1566/68 erhoben sich vor allem die calvinistischen Provinzen unter Wilhelm von Oranien. 1579 schlossen sich die nördlichen Provinzen in der Union von Utrecht zusammen, 1581 sagten sie sich von Philipp los. Die Unabhängigkeit der Republik der Vereinigten Niederlande wurde erst 1648 offiziell anerkannt.",
      "Die Republik wurde zu einer neuen Art von Macht. Sie hatte keinen König, sondern regierte als Bund von Städten und Provinzen, und sie lebte vom Handel. 1602 gründeten Kaufleute die Vereinigte Ostindien-Kompanie (VOC), die als eines der ersten Aktienunternehmen der Welt den Gewürzhandel in Asien übernahm und dabei auf portugiesischen Stützpunkten aufbaute (Einheit 16). In Amsterdam entstand eine Börse, Banken und eine relativ tolerante Gesellschaft, in der auch Flüchtlinge Platz fanden. Das 17. Jahrhundert gilt deshalb als das „Goldene Zeitalter“ der Niederlande. Es zeigt, dass eine Gemeinschaft, die auf Handel und Ausgleich setzt, eine Großmacht herausfordern kann. England, unter Elisabeth I. protestantisch, besiegte 1588 die spanische Armada und stieg langsam zur Seemacht auf."
    ]},
    { h: "Der Dreißigjährige Krieg (1618–1648)", p: [
      "Im Reich glimmte der Konflikt weiter. Der Augsburger Frieden schloss die Calvinisten aus, und katholische und protestantische Fürsten bildeten Bündnisse, die Union (1608) und die Liga (1609). Der Auslöser war in Böhmen: Als der katholische Habsburger Ferdinand II. protestantische Rechte beschneiden wollte, warfen protestantische Adlige 1618 bei dem „Prager Fenstersturz“ zwei kaiserliche Beamte aus dem Fenster der Burg. Aus dem böhmischen Aufstand wurde ein europäischer Krieg, weil Nachbarn eingriffen, nicht allein aus Glaubensgründen: Dänemark und Schweden wollten Einfluss an der Ostsee, Spanien wollte seine Stellung halten, und das katholische Frankreich unter Kardinal Richelieu unterstützte ab 1635 die Protestanten, weil es die Macht der Habsburger schwächen wollte. Der Krieg zeigt also, wie Religion und Staatsinteresse sich verflechten.",
      "Man unterscheidet Phasen: den böhmisch-pfälzischen Krieg (bis 1623), den dänisch-niedersächsischen (bis 1629), den schwedischen (1630–1635) und den schwedisch-französischen (bis 1648). Der kaiserliche Feldherr Wallenstein stellte ein riesiges Söldnerheer auf, das sich aus dem Land versorgte, und wurde 1634 ermordet. 1631 wurde das protestantische Magdeburg erobert und niedergebrannt, wobei Tausende starben. Der Schwedenkönig Gustav II. Adolf fiel 1632 bei Lützen. 1635 versuchte der Prager Frieden, den Konflikt zu beenden, doch durch den Kriegseintritt Frankreichs ging er weiter.",
      "Das Leiden der Bevölkerung war immens. Söldnerheere lebten von Plünderung und Kontribution, und die Truppen zogen kreuz und quer durchs Land. Hunger und Seuchen, vor allem Pest, Typhus und Ruhr, rafften weit mehr Menschen dahin als die Schlachten. In manchen Regionen, etwa in Teilen Thüringens, Württembergs und Mecklenburgs, ging die Bevölkerung um die Hälfte oder mehr zurück, im Reich insgesamt vermutlich um ein Fünftel bis ein Drittel. Die Wirtschaft, Städte und Dörfer brauchten Jahrzehnte, um sich zu erholen. Der Krieg hinterließ ein kollektives Trauma, das in Literatur und Erinnerung weiterwirkte, etwa in Grimmelshausens Roman „Simplicissimus“."
    ]},
    { h: "Der Westfälische Frieden (1648)", p: [
      "Fünf Jahre lang verhandelten Gesandte in Münster und Osnabrück, es war der erste große europäische Friedenskongress. 1648 wurde der Krieg beendet. Im Reich wurde die Gleichberechtigung der drei Konfessionen (katholisch, lutherisch, reformiert) festgeschrieben. Man legte das Jahr 1624 als „Normaljahr“ fest, das bestimmte, welche Konfession in einem Gebiet galt. Die Reichsstände, also die Fürsten und Städte, erhielten das Recht, eigene Bündnisse zu schließen, und der Kaiser musste bei wichtigen Entscheidungen den Reichstag beteiligen. Das Reich blieb bestehen, wurde aber weniger zu einem einheitlichen Staat und mehr zu einem Rechtsverband vieler fast selbständiger Staaten.",
      "Außerhalb des Reichs wurden die Niederlande und die Schweiz als unabhängig anerkannt, Schweden erhielt Gebiete an der Ostsee, Frankreich bekam Teile des Elsass. Die Habsburger verloren an Einfluss im Reich, richteten sich aber stärker auf ihre Länder im Südosten aus. Der Friede steht für das Prinzip, dass Staaten, ob groß oder klein, grundsätzlich als gleichberechtigt gelten, dass ihre inneren Angelegenheiten Sache der Herrscher sind und dass man ein Gleichgewicht der Mächte anstrebt. Man spricht vom „Westfälischen System“. Neuere Forschung warnt vor einem Mythos: Souveränität und Gleichgewicht entwickelten sich schon vorher und blieben nach 1648 lange umstritten. Aber als Symbol eines neuen Verständnisses von Staatenordnung hat der Friede Bedeutung."
    ]},
    { h: "Staat, Armee und Krise: das lange 17. Jahrhundert", p: [
      "Die Kriege dieser Zeit veränderten den Staat. Heere wurden größer und teurer, und wer sie bezahlen wollte, brauchte Steuern, Beamte und Kredit. Aus Söldnerheeren wurden nach und nach stehende Heere, die der Fürst dauerhaft unterhielt. Verwaltung, Finanzwesen und Rechtsprechung wurden professioneller. Man spricht von der Entstehung des „modernen Staates“, in dem Fürsten die Macht der Adelsstände und Städte zurückdrängten und ihre Herrschaft ausbauten (Absolutismus, siehe nächstes Kapitel). Das ist ein Gegenentwurf zu den Gedanken, die man später aus der Magna Carta (Einheit 12) ableitete: In England endete der Streit zwischen König und Parlament 1649 mit der Hinrichtung Karls I. und der Republik unter Cromwell.",
      "Die Zeit war auch von Krisen geprägt. In der „Kleinen Eiszeit“ sorgten kühle Sommer für Missernten und Hunger, die Pest kehrte immer wieder (Einheit 13), und Angst und Not erzeugten Sündenböcke. Zwischen 1560 und 1630 erreichten die Hexenverfolgungen ihren Höhepunkt. Man schätzt, dass in Europa insgesamt rund 40.000 bis 60.000 Menschen hingerichtet wurden, viele davon Frauen, in manchen Regionen des Reichs besonders viele. Das Muster aus Krise und Schuldzuweisung kennen wir bereits aus den Pogromen der Pestzeit.",
      "Zugleich entstand in diesen Jahrzehnten, gerade als Reaktion auf die Gewalt, der Wunsch nach Toleranz und nach Regeln, die für alle gelten. Denker wie Hugo Grotius entwarfen ein Recht der Staaten untereinander, und später forderten Philosophen die Trennung von Staat und Glaubensbekenntnis. Auf diese Ideen baut die Aufklärung auf, mit der das nächste Kapitel beginnt."
    ]}
  ],

UNITS.u21 = {
  id: "u21",
  title: "Osmanen, Safawiden und Moguln: drei islamische Großreiche",
  lead: "Zwischen 1450 und 1700 beherrschen drei Reiche den Raum vom Balkan bis Bengalen. Wie hielten sie Vielvölkerstaaten zusammen, und warum wuchs ihre Macht nicht weiter?",
  body: [
    { h: "Ein gemeinsamer Hintergrund", p: [
      "Nach dem Zerfall des Kalifats und dem Mongolensturm (Einheit 10 und 14) bildeten sich im Raum zwischen Mittelmeer und Ganges neue Machtzentren. Drei Reiche stiegen im 15. und 16. Jahrhundert auf: das Osmanische Reich in Anatolien und auf dem Balkan, das Safawidenreich in Persien und das Mogulreich in Nordindien. Alle drei gingen aus der Welt der Turk- und Mongolenreiter hervor, die in der Steppe Kriegführung gelernt hatten und in den alten Zentren der Zivilisation Verwaltung vorfanden. Alle drei setzten Feuerwaffen ein, Kanonen und Gewehre, weshalb man sie oft „Schießpulverreiche“ nennt. Diese Bezeichnung ist umstritten, weil sie suggeriert, die Waffen allein hätten den Aufstieg erklärt. Wichtiger waren Organisation, Steuern und die Fähigkeit, sehr verschiedene Gruppen einzubinden.",
      "Die Frage dieser Einheit lautet deshalb: Wie hält man ein Reich mit vielen Sprachen und Religionen zusammen, und was geschieht, wenn die Bedingungen sich ändern? Die drei Reiche gaben dazu sehr unterschiedliche Antworten."
    ]},
    { h: "Das Osmanische Reich: vom Grenzfürstentum zur Weltmacht", p: [
      "Um 1300 war Osman nur ein Grenzherr im Nordwesten Anatoliens. Seine Nachfolger eroberten den Balkan, und 1453 nahm Mehmed II. Konstantinopel ein (Einheit 13), das als Istanbul Hauptstadt wurde. Selim I. eroberte 1516/17 Syrien und Ägypten und kontrollierte damit Mekka, Medina und Kairo, die heiligen Stätten und die wichtigen Handelswege des Roten Meeres. Unter Süleyman dem Prächtigen (1520–1566) erreichte das Reich seinen Höhepunkt. Er nahm 1521 Belgrad, siegte 1526 bei Mohács über Ungarn und stand 1529 zum ersten Mal vor Wien. Zugleich galt er als großer Gesetzgeber („Kanuni“).",
      "Die Osmanen hielten ihr Reich durch ein besonderes System zusammen. Ein Teil der Elite bestand aus Männern, die als Kinder aus christlichen Familien des Balkans ausgehoben (devşirme), zum Islam erzogen und ausgebildet wurden. Sie dienten als Janitscharen, das waren Elitesoldaten mit Feuerwaffen, oder als Beamte und Großwesire. Sie hatten keine Familienmacht im Land und waren dem Sultan persönlich verpflichtet. Zugleich organisierte man die Bevölkerung in religiösen Gemeinschaften (Millets) mit eigener Rechtsprechung für Familienrecht, Schule und Gemeindeleben: Juden, griechische Orthodoxe, Armenier. Das war keine Gleichheit, denn Nichtmuslime zahlten eine Sondersteuer, aber es war eine Ordnung, die Vielfalt zuließ. Als die Juden 1492 aus Spanien vertrieben wurden, nahm das Reich viele von ihnen auf.",
      "Die Osmanen waren auch eine europäische Macht. Frankreich verbündete sich 1536 mit Süleyman gegen die Habsburger, und die Reformation (Einheit 19) profitierte davon, dass der Kaiser Kräfte gegen die Türken binden musste. Zur See erlitt die osmanische Flotte 1571 bei Lepanto eine schwere Niederlage gegen eine christliche Allianz, sie baute aber rasch neue Schiffe. Der Architekt Sinan schuf Moscheen wie die Süleymaniye. In Istanbul entstanden die ersten Kaffeehäuser, die sich nach Europa verbreiteten."
    ]},
    { h: "Die Safawiden: eine Religion als Staatsidentität", p: [
      "Im Iran war nach Timur und den Mongolen ein Machtvakuum entstanden. 1501 ließ sich der junge Ismail I. in Täbris zum Schah krönen. Die Safawiden stammten aus einem Sufi-Orden und stützten sich auf turkmenische Krieger, und Ismail erklärte die Zwölferschia zur Staatsreligion (Einheit 10: Sunniten und Schiiten). Das war folgenreich: Die Bevölkerung Irans war damals mehrheitlich sunnitisch. Der Schah ließ schiitische Gelehrte aus Arabien kommen und setzte die neue Konfession durch. Damit entstand eine Grenze zum sunnitischen Osmanenreich und zu den sunnitischen Usbeken, und der schiitische Charakter Irans ist bis heute ein Merkmal geblieben. 1514 besiegte der osmanische Sultan Selim I. Ismail bei Tschaldiran, und die Grenze zwischen beiden Reichen blieb jahrhundertelang umkämpft.",
      "Unter Schah Abbas I. (1588–1629) erreichte das Reich seine Blüte. Er reformierte das Heer, indem er neben den turkmenischen Stammeskriegern eine Truppe aus Kaukasiern und Feuerwaffen aufstellte, die ihm direkt unterstand. 1598 verlegte er die Hauptstadt nach Isfahan und baute sie zu einer prachtvollen Stadt aus. Er förderte den Seidenhandel, siedelte Armenier an und suchte Verbündete in Europa gegen die Osmanen. Nach seinem Tod schwächten Thronstreitigkeiten das Reich."
    ]},
    { h: "Das Mogulreich: Indien unter einer neuen Dynastie", p: [
      "1526 siegte Babur, ein Nachfahre Timurs und Dschingis Khans aus Zentralasien, bei Panipat über den Sultan von Delhi und gründete das Mogulreich. Unter seinem Enkel Akbar (1556–1605) wurde es zu einem Großstaat. Akbar schuf eine Verwaltung, in der Adlige (Mansabdare) nach einem Rang bezahlt wurden, der ihre Truppenstärke festlegte, und er regelte die Steuern nach der Ernte und der Bodenqualität. Er band Hindus in den Staat ein, heiratete Rajputenprinzessinnen und schaffte 1564 die Sondersteuer für Nichtmuslime (Jizya) ab. In seiner Residenz Fatehpur Sikri ließ er Gelehrte verschiedener Religionen diskutieren. Das Reich war mehrheitlich hinduistisch, und ohne die Zustimmung der lokalen Eliten hätte es nicht funktioniert.",
      "Sein Urenkel Shah Jahan baute 1632 bis 1653 für seine verstorbene Frau Mumtaz Mahal das Taj Mahal. Unter Aurangzeb (1658–1707) erreichte das Reich seine größte Ausdehnung, aber er führte jahrzehntelange Kriege im Dekkan und kehrte teilweise zur strengeren Politik gegenüber Nichtmuslimen zurück. Das überdehnte Reich zerfiel nach seinem Tod rasch in regionale Staaten.",
      "Indien war damals eine der wichtigsten Wirtschaftsmächte der Welt, vor allem für Baumwolltextilien, die bis nach Europa, Afrika und Südostasien gehandelt wurden. Genau deshalb lockte es europäische Händler, und die 1600 gegründete englische East India Company begann an der Küste Fuß zu fassen, zunächst als Handelspartner, später als Machtfaktor. In der Medizin lebte die Tradition der arabischen Heilkunde weiter, Ibn Sinas Kanon (Einheit 10) wurde in der unani-Medizin genutzt."
    ]},
    { h: "Vergleich: Wie Vielvölkerreiche zusammenhalten, und warum sie ins Stocken geraten", p: [
      "Die drei Reiche lösten das Zusammenhaltsproblem unterschiedlich. Die Osmanen setzten auf eine dem Sultan loyale Elite aus ausgehobenen Jungen und auf Autonomie der religiösen Gemeinschaften. Die Safawiden machten die Schia zum Kern einer gemeinsamen Identität und grenzten sich damit ab. Die Moguln banden die lokalen Eliten durch Teilhabe, Ränge und Toleranz ein. Alle drei brauchten Einnahmen für Heere, und alle gerieten im 17. Jahrhundert in Schwierigkeiten.",
      "Mehrere Ursachen kamen zusammen. Der Zufluss von amerikanischem Silber (Einheit 17) erreichte auch den Osmanischen Raum und löste Inflation aus, die Besoldung der Truppen und Beamten verteuerte sich. Der Handel verlagerte sich teilweise auf die Meere, wo Europäer mit Stützpunkten und bewaffneten Schiffen Vorteile suchten (Einheit 16). Thronfolgestreitigkeiten schwächten die Dynastien, und die Heere gerieten bei Technik und Organisation gegenüber den europäischen Staaten, die gerade ihre stehenden Heere aufbauten (Einheit 20), allmählich ins Hintertreffen. Das ist aber keine gerade Linie. Die Osmanen belagerten 1683 noch einmal Wien und blieben bis ins 19. Jahrhundert eine Großmacht. Sinnvoller ist es, von einem langsamen Verschieben der Gewichte zu sprechen."
    ]}

UNITS.u22 = {
  id: "u22",
  title: "China, Japan und Korea: Ming, Qing und Tokugawa",
  lead: "Wie Silber, Hunger und Eroberung Chinas Dynastie stürzten, warum Japan sich nach außen abschloss und was die Krise des 17. Jahrhunderts mit einem weltweiten Klimaproblem zu tun hat.",
  body: [
    { h: "Die späte Ming-Zeit: Reichtum und Risse", p: [
      "Die Ming-Dynastie (1368–1644, Einheit 14) hatte China nach den Mongolen wieder geeint. Im 16. Jahrhundert wandelte sich seine Wirtschaft stark. Der Staat ließ Steuern zunehmend in Silber zahlen, und weil China wenig eigenes Silber hatte, floss es von außen herein: aus japanischen Minen und, über Manila und Macau, aus Amerika (Einheit 16 und 17). Die Portugiesen erhielten 1557 den Hafen Macau, Spanier tauschten in Manila Silber gegen Seide und Porzellan. Eine blühende Marktwirtschaft entstand, mit Städten, Handwerk, Druckereien und einer gebildeten Schicht.",
      "Zugleich wuchsen die Probleme. Die Kaiser, etwa Wanli (1572–1620), zogen sich aus der Regierung zurück, am Hof stritten Beamtenfraktionen und Eunuchen. Die Steuerlast fiel auf die Bauern, und Silber verteuerte die Abgaben. Die „Kleine Eiszeit“ (Einheit 20) brachte kühle Sommer, Missernten und Hungersnöte. Dazu kamen Piraten, die Bedrohung durch die Mandschu im Nordosten und große Ausgaben für Heere, auch in den Kriegen gegen Japan in Korea."
    ]},
    { h: "1644: Der Wechsel zu den Qing", p: [
      "Die Mandschu, ein Volk aus der Mandschurei, hatten ein straff organisiertes Heer geschaffen, die „Banner“, und stiegen unter Nurhaci und seinem Sohn zur Macht auf. In China selbst brach ein Aufstand aus: 1644 nahm der Rebellenführer Li Zicheng Peking ein, und der letzte Ming-Kaiser nahm sich das Leben. Der Ming-General Wu Sangui öffnete den Mandschu den Pass im Norden, um die Rebellen zu schlagen. Die Mandschu zogen in Peking ein und gründeten die Qing-Dynastie, die bis 1912 herrschte.",
      "Die Eroberung des Südens dauerte Jahrzehnte und war blutig. 1645 verlangten die Mandschu von allen Männern den Zopf, als Zeichen der Unterwerfung. Sie übernahmen aber das chinesische Beamtensystem, die Prüfungen und den Konfuzianismus (Einheit 14), und sicherten damit die Zustimmung der Gebildeten. Unter Kaiser Kangxi (1661–1722) wurde das Reich stabilisiert, Taiwan 1683 erobert, die Grenze im Norden mit Russland vertraglich geregelt. Jesuiten am Hof, die seit Matteo Ricci (Einheit 19) in Peking wirkten, halfen bei Kalender, Astronomie und Kartografie. Unter Qianlong (1735–1796) erreichte das Reich seine größte Ausdehnung.",
      "Mais und Süßkartoffel aus Amerika (Einheit 17) ermöglichten Anbau auf Böden, die für Reis nicht taugten, und die Bevölkerung wuchs im 18. Jahrhundert etwa von 150 auf über 300 Millionen. Der Handel mit den Europäern blieb dagegen begrenzt: Seit 1757 durften sie nur über den Hafen Kanton handeln, unter strenger Aufsicht. Aus Sicht des Kaisers war China selbstgenügsam. Aus Sicht der Briten, die Tee und Seide kaufen wollten und bezahlen mussten, war das ein Problem, das sie später mit Opium lösen wollten."
    ]},
    { h: "Japan: Bürgerkrieg, Einigung und Abschließung", p: [
      "Japan erlebte im 15. und 16. Jahrhundert eine Epoche der Bürgerkriege (Sengoku), in der Regionalherren (Daimyō) kämpften. 1543 kamen Portugiesen mit Feuerwaffen, die Japaner schnell nachbauten und in der Kriegführung einsetzten. Oda Nobunaga begann die Einigung, Toyotomi Hideyoshi vollendete sie 1590. Hideyoshi wollte darüber hinaus Korea und China erobern und fiel 1592 und 1597 in Korea ein. Der koreanische Admiral Yi Sun-sin besiegte die japanische Flotte mehrfach, auch mit gepanzerten Schiffen, und mit Hilfe der Ming scheiterte die Invasion. Der Krieg verwüstete Korea.",
      "Nach Hideyoshis Tod setzte sich Tokugawa Ieyasu 1600 in der Schlacht von Sekigahara durch und wurde 1603 Shōgun. Sein Haus herrschte bis 1868 von Edo (Tokio) aus. Der Kaiser in Kyoto blieb als religiöse Spitze bestehen, die Macht lag beim Shōgun. Die Daimyō mussten abwechselnd in Edo und in ihren Gebieten leben, ihre Familien blieben als Geiseln in Edo. Die Gesellschaft wurde in Stände geordnet: Samurai, Bauern, Handwerker, Händler. Aus Kriegern wurden Beamte.",
      "Die Tokugawa fürchteten, dass Europäer und das Christentum die Ordnung stören. Nach einem Aufstand christlicher Bauern in Shimabara 1637/38 verboten sie das Christentum endgültig und schlossen das Land weitgehend ab (Sakoku). Nur die Niederländer durften auf der Insel Dejima bei Nagasaki handeln, ebenso gab es Kontakte zu Chinesen und Koreanern. Japan erlebte so rund 250 Jahre Frieden, eine wachsende Stadtkultur mit Kabuki und Holzschnitten und eine hohe Lesefähigkeit. Über die Niederländer gelangten Bücher ins Land, und die „Holland-Gelehrten“ (Rangaku) beschäftigten sich mit Medizin und Naturwissenschaft. 1774 erschien eine japanische Übersetzung eines europäischen Anatomiebuchs, nachdem Ärzte bei einer Sektion gesehen hatten, dass die westliche Abbildung der Wirklichkeit entsprach, nicht die traditionelle Lehre."
    ]},
    { h: "Korea: Eine Schrift für alle", p: [
      "Korea wurde im 15. Jahrhundert von der Joseon-Dynastie regiert und war noch stärker vom Konfuzianismus geprägt als China. Eine Besonderheit ist die Schrift: Die Gelehrten schrieben Chinesisch, das für die meisten Koreaner schwer zu lernen war. König Sejong ließ in den 1440er-Jahren eine eigene Buchstabenschrift entwickeln, Hangul, die 1446 verkündet wurde und mit wenigen Zeichen die Laute der Sprache abbildet. Das ist ein bemerkenswertes Beispiel dafür, dass Schrift auch Politik ist: Eine leicht lernbare Schrift verbreitert den Kreis derer, die lesen können (Einheit 2 und 3). Die gebildete Elite sah sie lange als minderwertig, und erst später wurde sie zur Nationalschrift.",
      "Im 17. Jahrhundert wurde Korea von den Mandschu unterworfen (1627, 1636) und musste sich den Qing unterordnen, blieb aber im Inneren weitgehend selbständig und schottete sich ebenfalls stark ab."
    ]},
    { h: "Die Krise des 17. Jahrhunderts: ein weltweites Muster?", p: [
      "Wer die Einheiten 20 bis 22 nebeneinanderlegt, bemerkt etwas Auffälliges. Um die Mitte des 17. Jahrhunderts erschütterten gleichzeitig mehrere Krisen die Welt: der Dreißigjährige Krieg im Reich, der Bürgerkrieg in England (1642–1649), die Aufstände in Frankreich (Fronde), das Ende der Ming 1644, Krisen im Osmanischen Reich und im Mogulreich. Manche Historiker sprechen von einer „allgemeinen Krise“ des 17. Jahrhunderts. Als gemeinsame Ursache gilt die Kleine Eiszeit: Kühle Jahre mit Missernten, Hunger, steigenden Preisen und Seuchen belasteten Staaten, die ohnehin unter Kriegskosten, Silberinflation und Legitimationsproblemen litten.",
      "Das ist eine Deutung, kein bewiesenes Gesetz. Viele Krisen hatten auch eigene Ursachen, und einige Regionen blieben stabil. Aber die Beobachtung ist nützlich, weil sie zeigt, dass Klima, Wirtschaft und Politik ineinandergreifen, und dass die Welt schon damals verbunden genug war, dass Silberströme und Preise Kontinente beeinflussten. Danach traten Staaten stärker, oft autoritärer, aus der Krise heraus, in Europa als absolute Monarchien (nächstes Kapitel), in China als Qing, in Japan als Tokugawa."
    ]}
  ],

UNITS.u23 = {
  id: "u23",
  title: "Absolutismus, Parlament und die Wissenschaftliche Revolution",
  lead: "Nach den Krisen des 17. Jahrhunderts entstehen zwei Antworten auf die Frage, wer herrschen soll, und zugleich eine neue Art, die Natur zu erforschen.",
  body: [
    { h: "Die Frage nach der Macht", p: [
      "Die Kriege und Aufstände des 17. Jahrhunderts (Einheiten 20 und 22) hatten gezeigt, wie gefährlich unklare Machtverhältnisse sind. Drei Erfahrungen prägten die Zeit: Religionskriege, die den inneren Frieden zerstört hatten, steigende Kosten für Heere und Verwaltung und der Wunsch nach einem Staat, der Ordnung garantiert. Die Antworten fielen sehr verschieden aus. In Frankreich setzte man auf einen König, der nahezu alle Macht in sich vereinte. In England dagegen setzte sich das Parlament gegen den König durch. Beide Wege stehen am Anfang der modernen Politik, und man kann sie wie ein Experiment lesen: gleiche Probleme, zwei Lösungen."
    ]},
    { h: "Frankreich: der Absolutismus Ludwigs XIV.", p: [
      "Ludwig XIV. (König seit 1643, selbst regierend ab 1661, gestorben 1715) gilt als Inbegriff des Absolutismus. Absolut heißt hier: losgelöst von Schranken wie Ständeversammlungen. Er soll gesagt haben „L’État, c’est moi“, was wohl später erfunden wurde, aber die Haltung trifft. Wie baute er diese Macht auf? Er entzog dem Adel die Rolle als Gegenspieler, indem er ihn in Versailles um sich versammelte, wo Zeremoniell, Ämter und Gunst wichtiger wurden als die eigene Hausmacht. Er setzte Intendanten ein, Beamte, die in den Provinzen für ihn handelten. Der Minister Colbert ordnete die Finanzen und förderte Manufakturen und Handel, was man Merkantilismus nennt: Der Staat soll mehr ausführen als einführen, um Gold und Silber im Land zu halten, und fördert dafür Kolonien (Einheit 18).",
      "Dazu kam ein stehendes Heer, das größte Europas, das der König ständig unterhielt. Es brauchte Steuern, die eine Verwaltung eintreiben musste, und so verstärkten sich Heer, Verwaltung und Finanzen gegenseitig. Das war der Kern des modernen Staates. Ludwig führte mehrere Kriege, um Frankreichs Grenzen und Einfluss zu erweitern, und stieß dabei auf Bündnisse anderer Mächte, die ein Gleichgewicht anstrebten (Einheit 20). Gleichzeitig verlangte er Einheit im Glauben. 1685 widerrief er das Edikt von Nantes, und Hunderttausende Hugenotten verließen das Land, viele davon Handwerker und Kaufleute, die in Preußen, England und den Niederlanden die Wirtschaft stärkten. Das war ein hoher Preis.",
      "Der Absolutismus war nie so allmächtig, wie die Kulisse suggerierte. Der König war auf Eliten angewiesen, die Ämter kauften, und auf Geldgeber. Das Muster, dass ein Staat sich durch Kriege und Prunk verschuldet, wurde später zu einer Ursache der Französischen Revolution (Einheit 26)."
    ]},
    { h: "England: das Parlament setzt sich durch", p: [
      "In England nahm die Geschichte einen anderen Verlauf. Das Parlament, das auf Magna Carta und mittelalterliche Versammlungen zurückging (Einheit 12), hatte das Recht, Steuern zu bewilligen. Als Karl I. ohne Parlament regierte und Abgaben erhob, kam es zum Konflikt, der religiöse Gegensätze (Anglikaner, Puritaner, Katholiken) mit Machtfragen verband. 1642 begann der Bürgerkrieg. Das Parlamentsheer unter Oliver Cromwell siegte, 1649 wurde Karl I. hingerichtet, der erste Fall, in dem ein Volk seinen König nach einem Prozess köpfen ließ. England wurde kurze Zeit Republik, danach Cromwells Militärherrschaft. 1660 kehrte die Monarchie zurück.",
      "Der Streit hörte nicht auf. Als Jakob II., ein Katholik, absolutistisch regieren wollte, holten Parlamentarier 1688 den Statthalter der Niederlande, Wilhelm von Oranien, ins Land. Jakob floh, und diese „Glorreiche Revolution“ verlief fast ohne Blutvergießen. 1689 musste Wilhelm in der Bill of Rights anerkennen, dass der König ohne Zustimmung des Parlaments weder Steuern erheben noch Gesetze aufheben noch ein stehendes Heer halten dürfe. Damit war die Herrschaft an das Gesetz gebunden. Der Philosoph John Locke begründete das theoretisch: Menschen haben natürliche Rechte auf Leben, Freiheit und Eigentum, und eine Regierung ist legitim, solange sie diese schützt. Was hier entsteht, ist keine Demokratie, denn das Wahlrecht war auf wenige Besitzende beschränkt, aber es ist ein Modell der begrenzten Macht.",
      "Warum verlief die Geschichte in England anders? Eine Erklärung liegt in der Lage: Als Inselstaat brauchte England kein riesiges Landheer und hatte weniger Gründe, die Steuererhebung zu zentralisieren. Eine andere liegt in der Geschichte: Das Parlament hatte jahrhundertelang Rechte, auf die man sich berufen konnte. Und eine dritte liegt in der Wirtschaft: Kaufleute und Landadel, die im Parlament saßen, hatten ein Interesse an Eigentumsschutz und Handel (Einheit 20: Niederlande)."
    ]},
    { h: "Die Wissenschaftliche Revolution", p: [
      "Im selben Jahrhundert veränderte sich auch die Art, die Natur zu erforschen. Die Voraussetzungen hatten sich lange aufgebaut. Die Übersetzungen aus dem Arabischen (Einheit 10) hatten antikes Wissen zurückgebracht, auch Optik und Mathematik arabischer Gelehrter wie Ibn al-Haytham. Der Buchdruck verbreitete Daten und Methoden (Einheit 13), die Reformation lehrte, Autoritäten zu hinterfragen (Einheit 19), und die Entdeckungsfahrten brachten neue Tiere, Pflanzen und Sterne, die in keinem antiken Buch standen (Einheit 16).",
      "1543 erschienen zwei Bücher, die oft als Beginn gelten. Nikolaus Kopernikus stellte die Sonne in den Mittelpunkt der Planetenbahnen. Andreas Vesalius veröffentlichte mit „De humani corporis fabrica“ ein Werk der Anatomie, das auf eigener Sektion beruhte und dabei Fehler Galens (Einheit 6) berichtigte. Johannes Kepler beschrieb die Planetenbahnen als Ellipsen. Galileo Galilei beobachtete 1609/10 mit dem Fernrohr die Jupitermonde und stützte damit das neue Weltbild. 1633 musste er vor der Inquisition abschwören, das Verfahren zeigt den Konflikt zwischen kirchlicher Lehre und neuer Beobachtung. William Harvey wies 1628 nach, dass das Blut in einem Kreislauf durch den Körper fließt und vom Herzen gepumpt wird, was Galens Vorstellung widersprach. Antonie van Leeuwenhoek entdeckte mit dem Mikroskop Bakterien und Blutkörperchen. Isaac Newton fasste 1687 in den „Principia“ die Bewegung von Äpfeln und Planeten in einem Gesetz der Schwerkraft zusammen.",
      "Neu war weniger das einzelne Ergebnis als die Methode. Francis Bacon forderte, Wissen durch Beobachtung und Experiment zu gewinnen, René Descartes setzte auf mathematische Klarheit und methodischen Zweifel. Man tauschte sich in Gesellschaften aus, etwa in der Royal Society (1660), veröffentlichte Ergebnisse in Zeitschriften und prüfte sie gegenseitig. Wissen war nun etwas, das man überprüfen und verbessern konnte, und das nicht mehr allein bei Kirche oder antiken Autoritäten lag. Das ist die Grundlage der modernen Wissenschaft, und in der Medizin die Wurzel einer Heilkunde, die sich auf Anatomie und Physiologie stützt statt auf alte Lehren."
    ]},
    { h: "Zusammenhänge: Macht, Wissen und Staat", p: [
      "Beide Entwicklungen hängen enger zusammen, als es scheint. Staaten brauchten Wissen: Navigation für Flotten, Mathematik für Festungen und Artillerie, Statistik für Steuern, Medizin für Soldaten. Zugleich boten Staaten Schutz und Geld, wo Gelehrte Förderer suchten. Ludwig XIV. gründete 1666 eine Akademie der Wissenschaften, und in England bildete das Netzwerk von Kaufleuten, Adligen und Gelehrten die Basis der Royal Society. Dass Wissen sich in Ländern mit Druckfreiheit und relativ tolerantem Klima schneller verbreitete, zeigt, wie sehr Politik und Wissenschaft zusammenspielen.",
      "Auch die Hexenverfolgungen (Einheit 20) klangen in dieser Zeit allmählich ab, weil Gelehrte und Juristen die Beweise anzweifelten. Die Wissenschaftliche Revolution bereitete das Denken vor, auf dem die Aufklärung aufbaut, mit der die nächste Einheit beginnt."
    ]}
  ],

UNITS.u24 = {
  id: "u24",
  title: "Die Aufklärung: Vernunft, Kritik und Öffentlichkeit",
  lead: "Warum im 18. Jahrhundert die Idee entsteht, dass Menschen mit eigenem Verstand Herrschaft, Glaube und Gesellschaft prüfen dürfen, und wo diese Idee ihre Grenzen hatte.",
  body: [
    { h: "Was ist Aufklärung?", p: [
      "Der Philosoph Immanuel Kant beantwortete die Frage 1784 so: Aufklärung ist der Ausgang des Menschen aus seiner selbstverschuldeten Unmündigkeit. Unmündigkeit ist das Unvermögen, sich seines Verstandes ohne Leitung eines anderen zu bedienen. Sein Wahlspruch: „Sapere aude“, wage zu wissen. Das ist eine Haltung und kein Lehrsatz: Man soll nicht glauben, was Tradition, Kirche oder Obrigkeit sagen, nur weil sie es sagen, sondern prüfen.",
      "Diese Haltung hat Vorläufer in der Wissenschaftlichen Revolution (Einheit 23), die gezeigt hatte, dass Beobachtung und Rechnung alte Autoritäten widerlegen können, in der Reformation (Einheit 19), die das Gewissen und die Schrift über die kirchliche Hierarchie stellte, und in den Erfahrungen der Religionskriege (Einheit 20), die den Wunsch nach Toleranz gestärkt hatten. Die Aufklärung übertrug die Methode der Naturforschung auf Gesellschaft und Politik. Wenn man die Gesetze der Planeten erkennen kann, kann man auch die Gesetze guten Zusammenlebens erkennen und verbessern."
    ]},
    { h: "Die großen Gedanken", p: [
      "John Locke (Einheit 23) hatte natürliche Rechte und die Regierung auf Zustimmung begründet. Der französische Adlige Montesquieu schrieb 1748 „Vom Geist der Gesetze“ und forderte, die Macht zu teilen: Gesetzgebung, Regierung und Rechtsprechung sollten in verschiedenen Händen liegen, damit Macht Macht begrenzt. Das war eine Antwort auf den Absolutismus, und die Idee der Gewaltenteilung wurde zur Grundlage moderner Verfassungen. Voltaire kämpfte mit Spott und Schriften für Toleranz und gegen religiöse Verfolgung, etwa im Fall des Hugenotten Jean Calas. Jean-Jacques Rousseau formulierte 1762 im „Gesellschaftsvertrag“, dass Herrschaft nur durch den Willen des Volkes legitim ist, was die Idee der Volkssouveränität begründete. Er war zugleich ein Kritiker der Zivilisation und beeinflusste Pädagogik und Romantik.",
      "In der Wirtschaft entwickelte Adam Smith 1776 in „Wohlstand der Nationen“ die Idee, dass freie Märkte und Arbeitsteilung Reichtum schaffen. Das richtete sich gegen den Merkantilismus. Der Kern der Aufklärung wirkte aber auch in kleineren Reformen: Folter und Todesstrafe wurden kritisiert (Cesare Beccaria 1764), Schulen und Armenfürsorge sollten verbessert werden. Die „Encyclopédie“ von Diderot und d’Alembert (1751–1772) wollte alles Wissen der Zeit sammeln und für alle zugänglich machen. Sie wurde mehrfach verboten und trotzdem gedruckt."
    ]},
    { h: "Wie sich Ideen verbreiteten: die Öffentlichkeit", p: [
      "Warum entfaltete die Aufklärung ihre Wirkung gerade jetzt? Man muss auf das Medium schauen. Im 18. Jahrhundert entstand eine bürgerliche Öffentlichkeit: Zeitungen, Zeitschriften, Bücher, Leihbibliotheken, Lesegesellschaften, Kaffeehäuser in London und Paris, Salons, in denen oft Frauen den Ton angaben, und Freimaurerlogen. Die Zahl der Lesenden stieg, vor allem in Städten. Hier konnte man über Politik, Religion und Moral diskutieren, ohne dass Kirche oder Fürst dabei waren. Meinung entstand zwischen Gleichen und wirkte als Druck auf die Herrschenden. Das ist der Gegenpol zum absolutistischen Hof, und er knüpft an den Buchdruck an, der schon die Reformation getragen hatte (Einheit 19).",
      "Manche Herrscher nahmen aufklärerische Gedanken auf, um ihren Staat zu modernisieren: Friedrich II. von Preußen („erster Diener des Staates“), Joseph II. von Österreich, Katharina II. von Russland. Man spricht von aufgeklärtem Absolutismus. Sie führten Schulpflicht, Rechtsreformen und religiöse Toleranz ein, verzichteten aber nicht auf ihre Macht. Reformen kamen von oben, und wenn sie Interessen verletzten, scheiterten sie."
    ]},
    { h: "Aufklärung und Medizin: Das Beispiel der Pockenimpfung", p: [
      "Wie wirkte der Geist der Aufklärung praktisch? Ein Beispiel liefert der Kampf gegen die Pocken, die in Europa jedes Jahr Hunderttausende töteten und in Amerika Gesellschaften zerstört hatten (Einheit 17). In China, Indien und im Osmanischen Reich kannte man die Variolation: Man übertrug Material aus Pockenpusteln auf Gesunde, die dann meist milde erkrankten und danach immun waren. Lady Mary Wortley Montagu, die Frau des britischen Botschafters in Istanbul, ließ ihre Kinder so behandeln und warb 1721 in England dafür. Das Verfahren war nicht ungefährlich, aber die Zahlen sprachen für sich, und man begann, Sterblichkeit statistisch zu vergleichen. 1796 entwickelte der englische Arzt Edward Jenner die Impfung mit Kuhpockenmaterial, die sicherer war. Hier zeigt sich die Aufklärung in Reinform: Beobachtung, Vergleich, Statistik und die Bereitschaft, Altes zu prüfen. Es zeigt auch, dass Wissen zwischen Kulturen wanderte.",
      "Ein anderes Ereignis erschütterte den Glauben an eine geordnete Welt: das Erdbeben von Lissabon 1755, das die Stadt zerstörte und Zehntausende tötete. Voltaire und Rousseau stritten darüber, ob ein gütiger Gott so etwas zulassen könne, und die Frage nach natürlichen Ursachen bekam neue Dringlichkeit."
    ]},
    { h: "Grenzen und Widersprüche", p: [
      "Aufklärung ist nicht nur Fortschrittsgeschichte. Die Denker sprachen von Freiheit und Gleichheit, aber der Alltag vieler Länder beruhte auf Sklaverei (Einheit 18). Manche Aufklärer, wie Montesquieu, kritisierten die Sklaverei scharf, andere, darunter bedeutende Denker, rechtfertigten sie oder entwickelten Theorien über „Rassen“, die später zur Begründung von Rassismus dienten. Auch Frauen blieben meist ausgeschlossen. Olympe de Gouges forderte 1791 eine Erklärung der Rechte der Frau, Mary Wollstonecraft 1792 eine bessere Bildung von Frauen. Beide stießen auf heftigen Widerstand, de Gouges wurde 1793 guillotiniert.",
      "Man kann daraus zwei Lehren ziehen. Erstens können Ideen weiter reichen als ihre Urheber: Der Anspruch auf Gleichheit wurde später gegen die Aufklärer selbst gewendet, etwa in der Haitianischen Revolution (Einheit 26). Zweitens zeigt sich, dass Vernunft kein Garant für Gerechtigkeit ist. Sie kann Herrschaft kritisieren, aber auch rechtfertigen, wenn man sie für eigene Interessen nutzt."
    ]}
  ],

  deep: [
    ["Warum Aufklärung und Revolution zusammenhängen, aber nicht dasselbe sind", "Aufklärer wie Voltaire wollten Reformen und waren oft keine Demokraten. Die Revolutionäre, die sich auf Rousseau beriefen, gingen weiter, als die Aufklärer es gewollt hätten. Daher ist die Geschichte von Ideen und die Geschichte von Ereignissen nicht gleichzusetzen: Ideen werden aufgegriffen, verändert und für Zwecke benutzt, die ihre Urheber nicht im Sinn hatten."],
    ["Variolation: Wissen wandert", "Das Wissen um die Variolation kam aus Asien und dem Osmanischen Reich, Lady Montagu brachte es nach England, Afrikaner in Amerika kannten das Verfahren ebenfalls. Der Name Jenners steht für die Weiterentwicklung. Wenn man Geschichte der Medizin erzählt, sollte man diese Kette sehen, statt nur einen Erfinder zu nennen."]
  ],
  quiz: [
    { q: "Was bedeutet Kants „Sapere aude“?", o: ["Gehorche der Obrigkeit", "Wage, dich deines eigenen Verstandes zu bedienen", "Schweige und glaube", "Sammle Reichtum"], a: 1,
      e: "Aufklärung ist der Ausgang aus selbstverschuldeter Unmündigkeit, also Denken auf eigene Verantwortung." },

UNITS.u25 = {
  id: "u25",
  title: "Die Amerikanische Revolution und die Verfassung der USA",
  lead: "Wie ein Streit um Steuern in den Kolonien zur Unabhängigkeit führte, wie aus Aufklärungsideen eine Verfassung wurde, und wer in dieser Freiheit nicht vorkam.",
  body: [
    { h: "Die Ausgangslage: dreizehn Kolonien im britischen Reich", p: [
      "Im 18. Jahrhundert lebten an der Ostküste Nordamerikas rund zwei Millionen Menschen in dreizehn britischen Kolonien. Sie waren sehr verschieden: Im Norden Handel, Werften und kleine Farmen, in der Mitte Getreide und Städte wie Philadelphia, im Süden große Plantagen mit Tabak, Reis und Indigo, bewirtschaftet von versklavten Afrikanern (Einheit 18). Jede Kolonie hatte eine eigene Versammlung, die Steuern bewilligte, und viele Siedler sahen sich als Engländer mit englischen Rechten. Man war aufgewachsen mit den Ideen der Bill of Rights und John Lockes (Einheit 23) und las aufklärerische Schriften (Einheit 24).",
      "Die Kolonien waren Teil des merkantilistischen Systems: Sie sollten Rohstoffe liefern und Fertigwaren aus England abnehmen, und der Handel unterlag Regeln und Monopolen. Das war lange erträglich, solange London sich wenig einmischte."
    ]},
    { h: "Vom Siebenjährigen Krieg zum Streit um Steuern", p: [
      "Der Auslöser kam aus der Weltpolitik. Der Siebenjährige Krieg (1756–1763) wurde in Europa, Amerika, Indien und auf den Meeren zwischen Großbritannien und Frankreich ausgetragen, und gilt manchen als erster Weltkrieg. Großbritannien siegte und erhielt von Frankreich Kanada und die Gebiete östlich des Mississippi. Aber der Krieg hatte die Staatsschulden verdoppelt. London beschloss, die Kolonien an den Kosten zu beteiligen, die man für ihren Schutz aufgewendet habe, und verbot außerdem die Besiedlung westlich der Appalachen (1763), um Konflikte mit Indigenen zu vermeiden. Beides traf die Siedler, die nach Westen wollten.",
      "1765 führte das Parlament die Stempelsteuer (Stamp Act) ein. Die Kolonisten reagierten mit Protest und Boykott: Sie hätten keine Abgeordneten im Londoner Parlament, also könne es sie nicht besteuern („no taxation without representation“). Das ist dasselbe Prinzip wie in der Magna Carta und der Bill of Rights: Steuern brauchen Zustimmung (Einheit 12 und 23). London hob die Steuer auf, erhob aber später andere. 1773 warfen Kolonisten aus Protest gegen das Teemonopol der East India Company Teekisten in den Hafen von Boston („Boston Tea Party“). Das Parlament antwortete mit harten Zwangsgesetzen, und beide Seiten verhärteten sich."
    ]},
    { h: "Krieg und Unabhängigkeit", p: [
      "Im April 1775 fielen bei Lexington und Concord die ersten Schüsse. Die Delegierten der Kolonien traten zum Kontinentalkongress zusammen und ernannten George Washington zum Oberbefehlshaber. Am 4. Juli 1776 beschloss der Kongress die Unabhängigkeitserklärung, hauptsächlich von Thomas Jefferson verfasst. Sie beginnt mit Sätzen, die bis heute berühmt sind: Alle Menschen seien gleich geschaffen, mit unveräußerlichen Rechten auf Leben, Freiheit und das Streben nach Glück, und Regierungen leiteten ihre Macht von der Zustimmung der Regierten ab. Hier wird Lockes Gedanke zu einer politischen Erklärung.",
      "Militärisch waren die Kolonien zunächst unterlegen. Entscheidend wurde Hilfe von außen. Nach dem amerikanischen Sieg bei Saratoga 1777 verbündete sich Frankreich 1778 mit den Aufständischen, später folgten Spanien und die Niederlande. Frankreich wollte die Niederlage des Siebenjährigen Krieges rächen, und die Teilnahme kostete es sehr viel Geld, ein Faktor der Staatskrise vor der eigenen Revolution (Einheit 26). 1781 kapitulierte die britische Armee bei Yorktown, im Frieden von Paris 1783 erkannte Großbritannien die Unabhängigkeit an."
    ]},
    { h: "Die Verfassung: Gewaltenteilung in der Praxis", p: [
      "Nach der Unabhängigkeit mussten die Staaten ein Gemeinwesen bauen. Die ersten Artikel der Konföderation (1781) schufen einen schwachen Bund ohne eigene Steuerhoheit, der kaum handlungsfähig war. 1787 trat in Philadelphia ein Konvent zusammen und schrieb eine neue Verfassung. Sie setzt die Gedanken Montesquieus um: Der Kongress (Senat und Repräsentantenhaus) macht Gesetze, der Präsident führt die Regierung, und der Oberste Gerichtshof wacht über das Recht. Jede Gewalt kontrolliert die anderen („checks and balances“). Zusätzlich teilt der Föderalismus die Macht zwischen Bundesstaat und Einzelstaaten.",
      "Der Weg war ein Kompromiss. Kleine Staaten fürchteten, von großen dominiert zu werden, und so erhielt der Senat zwei Sitze je Staat, während das Repräsentantenhaus nach Bevölkerung gewählt wird. Der Süden wollte seine versklavten Menschen für die Sitzverteilung mitzählen, der Norden nicht, und man einigte sich, jeden versklavten Menschen als drei Fünftel zu zählen. Der Sklavenhandel durfte bis 1808 weitergehen. Dass eine Verfassung der Freiheit solche Kompromisse enthielt, war ein Preis der Einigung und ein Problem, das später zum Bürgerkrieg führte. 1791 kam die Bill of Rights hinzu, zehn Zusatzartikel mit Rechten wie Meinungs- und Religionsfreiheit.",
      "Wer war Bürger mit Rechten? Ursprünglich vor allem weiße, besitzende Männer. Versklavte, Frauen und die Indigenen, deren Land die neue Republik begehrte, waren ausgeschlossen. Das Wahlrecht wurde im 19. und 20. Jahrhundert schrittweise erweitert, zuletzt durch den Kampf der Bürgerrechtsbewegung. So gesehen ist die Verfassung ein Anfang, kein Endpunkt."
    ]},
    { h: "Folgen und Zusammenhänge", p: [
      "Die Amerikanische Revolution zeigte, dass eine Republik auch in einem großen Land möglich ist und dass man Verfassungen schreiben kann, die Macht zähmen. Sie wurde ein Vorbild für Frankreich (Einheit 26) und später für lateinamerikanische Unabhängigkeitsbewegungen (Einheit 27). Großbritannien verlor seine wichtigste Siedlungskolonie, richtete seinen Blick aber stärker auf Indien und später auf Kanada, Australien und Afrika (Imperialismus).",
      "Für die Indigenen war die Unabhängigkeit eine Katastrophe: Die Krone hatte die Siedlung im Westen begrenzt, die Republik tat es nicht. Für Versklavte brachte die Revolution einige Verbesserungen im Norden, wo die Sklaverei allmählich abgeschafft wurde, aber im Süden wuchs sie mit dem Baumwollanbau weiter (siehe später die Einheiten zur Industrialisierung). Die Idee der Gleichheit und die Wirklichkeit lagen auseinander, und aus dieser Spannung speiste sich die spätere Geschichte der USA."
    ]}
  ],

  deep: [
    ["Wie ‚revolutionär‘ war die Revolution?", "Manche Historiker sehen vor allem Kontinuität: Eliten, die Selbstverwaltung gewohnt waren, lösten sich vom Mutterland. Andere sehen einen tiefen Wandel, weil die Idee der Volkssouveränität und die Verfassung den Boden für eine neue Politik legten. Ein Maßstab ist, wer vor und nach 1776 Rechte hatte: für viele Weiße weitete sich ihr Spielraum, für Versklavte und Indigene kaum."],
    ["Der Siebenjährige Krieg als Ursache", "Die Revolution lässt sich nicht verstehen, wenn man nur auf Amerika blickt. Der Sieg über Frankreich nahm den Siedlern die Bedrohung im Rücken und machte London schuldenbewusst, beides erhöhte die Spannung. Das ist ein Beispiel für eine weltweite Verbindung von Ereignissen, wie wir sie schon bei den Entdeckungen und dem Silber (Einheit 16 und 17) gesehen haben."]

UNITS.u26 = {
  id: "u26",
  title: "Die Französische Revolution (1789–1799)",
  lead: "Warum ein reiches Land im Jahr 1789 seine Ordnung stürzte, wie aus Freiheit Terror wurde und welche Muster sich später in anderen Revolutionen wiederholen.",
  body: [
    { h: "Warum Frankreich? Ursachen", p: [
      "Frankreich war um 1789 das bevölkerungsreichste Land Europas, kulturell führend und wirtschaftlich stark. Dass dort die Revolution ausbrach, hat mehrere zusammenwirkende Ursachen. Die erste ist das Geld. Die Kriege Ludwigs XIV. und seiner Nachfolger und die Teilnahme am Amerikanischen Krieg (Einheit 25) hatten den Staat tief verschuldet. Die Einnahmen reichten nicht, weil Adel und Klerus weitgehend von Steuern befreit waren. Reformversuche der Minister scheiterten am Widerstand der Privilegierten.",
      "Die zweite Ursache ist die Gesellschaft. Die Ständeordnung teilte die Menschen in den Klerus (erster Stand), den Adel (zweiter Stand) und alle übrigen (dritter Stand), vom reichen Kaufmann bis zum Tagelöhner. Der dritte Stand machte rund 97 Prozent der Bevölkerung aus, trug fast alle Lasten und hatte kaum Einfluss. Dazu kam ein wachsendes, gebildetes Bürgertum, das wirtschaftlich stark war und politisch ausgeschlossen blieb. Die dritte Ursache ist das Denken: Die Ideen der Aufklärung über Gleichheit, Volkssouveränität und Gewaltenteilung (Einheit 24) waren in Salons, Zeitschriften und Flugschriften verbreitet, und das Beispiel Amerikas zeigte, dass man sie verwirklichen konnte. Die vierte Ursache ist die Not. Schlechte Ernten 1788 trieben den Brotpreis nach oben, und viele Familien gaben den größten Teil ihres Einkommens für Brot aus. Hunger in den Städten und Wut auf Privilegien verbanden sich."
    ]},
    { h: "1789: Von den Generalständen zur Bastille", p: [
      "Um die Finanzen zu retten, berief König Ludwig XVI. 1789 erstmals seit 1614 die Generalstände ein, eine Versammlung der drei Stände. Sofort stritt man darüber, wie abgestimmt wird: nach Ständen, wobei die zwei Privilegierten den dritten überstimmen könnten, oder nach Köpfen. Der dritte Stand erklärte sich am 17. Juni zur Nationalversammlung, also zur Vertretung der Nation, und schwor am 20. Juni im Ballhaus, nicht auseinanderzugehen, bis Frankreich eine Verfassung habe. Das war der Bruch: Die Souveränität lag nicht mehr beim König, sondern bei der Nation.",
      "Als der König Truppen zusammenzog, stürmte das Volk von Paris am 14. Juli 1789 die Bastille, ein Gefängnis, das als Symbol der Willkür galt. Auf dem Land brach die „Große Furcht“ aus, Bauern griffen Schlösser an und verbrannten Urkunden über ihre Abgaben. In der Nacht zum 5. August schaffte die Nationalversammlung die Feudalrechte ab, und am 26. August verabschiedete sie die Erklärung der Menschen- und Bürgerrechte: Menschen werden frei und gleich an Rechten geboren, Souveränität liegt bei der Nation, Gesetze gelten für alle, Eigentum und Sicherheit werden geschützt. Im Oktober zogen Pariser Frauen nach Versailles und brachten den König in die Hauptstadt."
    ]},
    { h: "Konstitutionelle Monarchie und Krieg", p: [
      "1791 gab sich Frankreich eine Verfassung, die die Monarchie begrenzte. Aber der König akzeptierte das nicht wirklich. Im Juni 1791 versuchte er zu fliehen, wurde in Varennes erkannt und zurückgebracht. Damit verlor er das Vertrauen vieler. 1792 erklärte Frankreich Österreich und Preußen den Krieg, weil die Revolutionäre die Ideen verbreiten wollten und weil Monarchen in Europa die Revolution bekämpfen wollten. Die ersten Niederlagen steigerten die Angst vor Verrat. Im September 1792 wurde die Republik ausgerufen, und im Januar 1793 wurde Ludwig XVI. hingerichtet, nach einem Prozess, der Europa schockierte."
    ]},
    { h: "Die Radikalisierung: der Terror", p: [
      "Von Februar 1793 an stand Frankreich im Krieg gegen fast ganz Europa, im Inneren brach ein Aufstand in der Vendée aus. Die Revolutionsregierung, der „Wohlfahrtsausschuss“ unter Maximilien Robespierre, reagierte mit radikalen Mitteln: Sie führte die allgemeine Wehrpflicht ein („levée en masse“), regelte Höchstpreise für Brot, und schuf Revolutionsgerichte, die Verdächtige in kurzen Verfahren verurteilten. Zwischen 1793 und 1794 (der „Terreur“) wurden rund 17.000 Menschen offiziell zum Tode verurteilt, die Zahl der Toten durch Massaker, Haft und Bürgerkrieg lag deutlich höher, eher bei 40.000 und mehr. Auch führende Revolutionäre wurden Opfer, und im Juli 1794 wurde Robespierre selbst gestürzt und hingerichtet (Thermidor).",
      "Warum kam es dazu? Historiker nennen mehrere Faktoren: den Druck des Krieges und der Angst vor Verrat, die Überzeugung der Revolutionäre, dass sie die Tugend verteidigten und Gegner Feinde der Nation seien, das Fehlen eingespielter Institutionen, die Konflikte begrenzen, und die Dynamik, in der jede Gruppe der nächsten als zu zögerlich erscheint. Das Muster, dass Revolutionen sich radikalisieren und ihre eigenen Kinder fressen, wurde später zum Lehrstück, auch bei der Russischen Revolution. Der Terror ist zugleich die Kehrseite der Ideale, die man sonst feiert, und zeigt, wie Freiheit und Gewalt sich verbinden können. Zwischen 1795 und 1799 regierte das Direktorium, instabil und korrupt, bis Napoleon die Macht übernahm (Einheit 27)."
    ]},
    { h: "Was blieb? Rechte, Rechtsgleichheit und die Frage der Sklaverei", p: [
      "Trotz des Terrors veränderte die Revolution Frankreich und Europa tiefgreifend. Feudale Abgaben und Standesprivilegien fielen, Leibeigenschaft endete, das Recht galt für alle, Kirchengut wurde eingezogen und das Land neu in Departements eingeteilt. Das Metrische System wurde eingeführt, und Juden erhielten Bürgerrechte. Die Idee, dass Menschenrechte allen gelten, wurde zu einer Quelle späterer Bewegungen.",
      "Zugleich zeigte die Revolution ihre Grenzen. Die Rechte der Frauen blieben aus, Olympe de Gouges wurde hingerichtet (Einheit 24), und Frauenvereine wurden verboten. Die Frage der Sklaverei wurde zur Probe: In der Kolonie Saint-Domingue erhoben sich 1791 die Versklavten unter Toussaint Louverture, und das revolutionäre Frankreich schaffte 1794 die Sklaverei in den Kolonien ab, Napoleon führte sie 1802 wieder ein. Die Versklavten aber kämpften weiter und gründeten 1804 den Staat Haiti (Einheit 18). Die Revolution wurde so auch zu einem Test, ob Menschenrechte wirklich universell gelten sollten."
    ]},
    { h: "Deutung: Epochenbruch oder Fortsetzung?", p: [
      "Seit 1789 streitet man darüber, was die Revolution bedeutete. Edmund Burke warnte schon 1790, dass ein Bruch mit Tradition ins Chaos führe. Andere sahen den Beginn der Moderne. Historiker betonen heute beides: die Kontinuität (der zentralistische Staat Ludwigs XIV. wurde verstärkt, nicht abgeschafft) und den Bruch (die Idee der Volkssouveränität und der gleichen Rechte). Für uns ist wichtig, die Ursachenkette zu sehen: Schulden, Privilegien, Hunger, Aufklärung und das Vorbild Amerikas führen zusammen, der Krieg radikalisiert, und das Ergebnis ist ein Staat, der sich auf die Nation stützt. Dieses Muster werden wir bei späteren Revolutionen vergleichen."
    ]}
  ],

UNITS.u27 = {
  id: "u27",
  title: "Napoleon, das Ende des Alten Reichs und der Wiener Kongress",
  lead: "Wie ein General die Revolution beendet und Europa neu ordnet, warum seine Reformen bleiben, obwohl er scheitert, und welche Ordnung 1815 daraus wird.",
  body: [
    { h: "Der Aufstieg: Wie Napoleon die Macht übernahm", p: [
      "Napoleon Bonaparte, geboren 1769 auf Korsika, machte als Artillerieoffizier in der Revolution Karriere. Er siegte in Italien (1796/97), führte 1798 ein Heer nach Ägypten, um Großbritanniens Weg nach Indien zu stören, und kam 1799 zurück, als das Direktorium schwach und unbeliebt war. Im November 1799 (18. Brumaire) stürzte er mit Verbündeten die Regierung und wurde Erster Konsul. Er versprach Ordnung, was eine Bevölkerung wollte, die nach zehn Jahren Revolution und Terror Stabilität suchte. 1804 krönte er sich selbst zum Kaiser der Franzosen. Damit gelang ihm, was Revolutionen oft widerfährt: Ein Ende der Unruhe um den Preis der Freiheit.",
      "In Ägypten hatte sein Heer auch Gelehrte dabei. Ein Soldat fand 1799 bei Rosetta einen Stein mit einem Text in drei Schriften, Hieroglyphen, Demotisch und Griechisch. Mit dessen Hilfe gelang 1822 Jean-François Champollion die Entzifferung der Hieroglyphen (Einheit 2). Ein Beispiel dafür, wie Kriege und Wissenschaft sich verbinden."
    ]},
    { h: "Der Code civil: Recht für alle", p: [
      "Das dauerhafteste Werk Napoleons ist kein Sieg, sondern ein Gesetzbuch. 1804 trat der „Code civil“ in Kraft. Er galt für alle Franzosen gleich, ersetzte regional verschiedenes Recht und sicherte die Ergebnisse der Revolution: Gleichheit vor dem Gesetz, Eigentum, Vertragsfreiheit, Abschaffung der Standesprivilegien und der Leibeigenschaft. Er war zugleich konservativ, denn Frauen wurden dem Ehemann untergeordnet. Der Code baute auf dem römischen Recht auf, das Justinian gesammelt hatte (Einheit 9), und wirkte weit über Frankreich hinaus: Er wurde in den eroberten Gebieten eingeführt, später in vielen Ländern Europas und Lateinamerikas übernommen und prägt noch heute das Zivilrecht.",
      "Dazu kamen eine zentralisierte Verwaltung mit Präfekten, ein Bildungssystem mit Eliteschulen (Lycées), die Bank von Frankreich und das Konkordat mit dem Papst, das den Frieden mit der Kirche herstellte. Napoleon baute den Staat so, dass er auch ohne ihn funktionierte."
    ]},
    { h: "Eroberungen und das Ende des Alten Reichs", p: [
      "Napoleon besiegte die Koalitionen der Großmächte, Österreich und Russland 1805 bei Austerlitz, Preußen 1806 bei Jena und Auerstedt. Er setzte Verwandte als Könige ein und gliederte große Gebiete ein. In Deutschland löste er das Heilige Römische Reich auf. Südwestdeutsche Fürsten schlossen sich 1806 im Rheinbund unter französischem Schutz zusammen, und am 6. August 1806 legte Kaiser Franz II. die Krone nieder. Damit endete ein Reich, das seit Otto dem Großen 962 bestanden hatte (Einheit 8). Viele kleine geistliche und weltliche Herrschaften verschwanden, und die Zahl der deutschen Staaten sank von mehreren Hundert auf rund drei Dutzend.",
      "Gegen Großbritannien, das er nicht besiegen konnte, verhängte er 1806 die Kontinentalsperre: Kein europäischer Hafen sollte britische Waren aufnehmen. Das schädigte auch die Wirtschaft auf dem Kontinent und führte zu Schmuggel. Als Portugal die Sperre nicht einhielt, besetzte er die iberische Halbinsel und setzte seinen Bruder auf den spanischen Thron. Das löste einen Volksaufstand und einen jahrelangen Guerillakrieg aus. Zugleich gerieten die spanischen Kolonien in Amerika in eine Krise: Ohne anerkannten König begannen Bewegungen unter Simón Bolívar und anderen, die zwischen 1810 und 1825 fast ganz Lateinamerika unabhängig machten. Die Spätfolgen der Napoleonischen Kriege reichten also bis über den Atlantik."
    ]},
    { h: "Der Absturz: Russland, Leipzig, Waterloo", p: [
      "1812 zog Napoleon mit einer Armee von etwa 600.000 Mann nach Russland. Die Russen wichen aus, verbrannten Land und Moskau, und der Rückzug im Winter wurde zur Katastrophe. Die meisten Soldaten starben nicht in Schlachten, sondern an Hunger, Kälte und Krankheiten, vor allem an Fleckfieber (Typhus), das durch Läuse übertragen wird. Von der Großen Armee kehrte nur ein kleiner Teil zurück. Das Muster, dass Seuchen Heere vernichten, kannten schon Athen (Einheit 4) und das Rom Marc Aurels (Einheit 6).",
      "Nun erhoben sich Preußen, Österreich, Russland und Schweden, und in der Völkerschlacht bei Leipzig 1813 wurde Napoleon geschlagen. Er dankte 1814 ab und wurde nach Elba verbannt, kehrte 1815 zurück und wurde in den „Hundert Tagen“ erneut Herrscher, bis er bei Waterloo im Juni 1815 von Briten und Preußen endgültig besiegt wurde. Er starb 1821 auf St. Helena.",
      "Warum scheiterte er? Seine Herrschaft beruhte auf ständigen Siegen. Die Kontinentalsperre schadete der Wirtschaft, die Besetzungen weckten Widerstand, und die Ideen, die er verbreitete, nämlich Nation und Selbstbestimmung, richteten sich gegen ihn. In Preußen schufen die Reformer Stein, Hardenberg und Wilhelm von Humboldt Reformen: Bauernbefreiung, Städteordnung, Gewerbefreiheit und ein neues Bildungssystem, mit dem Ziel, aus Untertanen Bürger zu machen, die ihren Staat verteidigen."
    ]},
    { h: "Der Wiener Kongress und die Ordnung von 1815", p: [
      "1814/15 trafen sich in Wien die Vertreter der Sieger, um Europa neu zu ordnen. Die treibende Figur war der österreichische Minister Klemens von Metternich. Leitgedanken waren Legitimität (die alten Dynastien kehren zurück), Gleichgewicht (keine Macht soll übermächtig werden) und Stabilität (Revolutionen sollen verhindert werden). Frankreich wurde nicht zerstört, sondern in seine alten Grenzen zurückgeführt und in das Konzert der Mächte aufgenommen, was den Frieden stabilisierte. Preußen gewann Gebiete am Rhein, Russland bekam den größten Teil Polens, und Österreich dominierte Italien. In Deutschland entstand ein lockerer Deutscher Bund aus 39 Staaten unter österreichischem Vorsitz.",
      "Die Ordnung funktionierte für Jahrzehnte als Friedenssystem: Es gab bis zur Mitte des Jahrhunderts keinen großen europäischen Krieg. Dafür unterdrückte sie nationale und liberale Bewegungen, die durch die Revolution und Napoleon geweckt worden waren. Karlsbader Beschlüsse (1819) verschärften Zensur und Überwachung. Die Spannung zwischen Restauration und den Hoffnungen auf Freiheit und Nation bestimmt die nächsten Jahrzehnte, bis 1848 die Revolution ausbricht und die nationalen Bewegungen sich durchsetzen. Hier endet dieses Kapitel, und es beginnt die Geschichte der Industrialisierung, die Europa und die Welt in ganz anderer Weise veränderte."
    ]}
  ],

    ["Rosetta und die Entzifferung", "Der Stein von Rosetta trägt einen Erlass in drei Schriften. Champollion erkannte, dass die Hieroglyphen nicht nur Bilder, sondern zugleich Lautzeichen waren. Die Entzifferung 1822 öffnete drei Jahrtausende ägyptischer Texte. Sie zeigt, wie Schrift Geschichte zugänglich macht, und führt uns zu den ersten Einheiten zurück."],

UNITS.u28 = {
  id: "u28",
  title: "Die Industrielle Revolution in Großbritannien",
  lead: "Warum Maschinen, Kohle und Fabriken ausgerechnet im England des 18. Jahrhunderts den Anfang machten, und was sie mit Baumwolle, Sklaverei und Städten zu tun hatten.",
  body: [
    { h: "Was sich änderte und warum es ein Bruch war", p: [
      "Jahrtausendelang war die Wirtschaft von Muskelkraft, Holz, Wasser und Wind abhängig gewesen. Menschen und Tiere arbeiteten, Energie wuchs buchstäblich auf dem Feld. Das setzte Grenzen: Wenn die Bevölkerung wuchs, wurde das Land knapp, und die Menschen blieben im Schnitt arm. Ab dem späten 18. Jahrhundert änderte sich das in Großbritannien. Menschen lernten, die in Kohle gespeicherte Energie von Jahrmillionen in Maschinen zu verwandeln, und die Produktion pro Kopf wuchs dauerhaft. Das nennt man die Industrielle Revolution. „Revolution“ ist ein großes Wort für einen Prozess, der Jahrzehnte dauerte und zunächst nur wenige Branchen und Regionen erfasste, aber die Folgen sind größer als die jeder politischen Revolution: Das moderne Leben mit Fabriken, Städten, Eisenbahnen und steigendem Lebensstandard beginnt hier.",
      "Die wichtigste Frage lautet: Warum gerade in Großbritannien, und warum gerade damals? Es gibt keine einzelne Antwort, sondern ein Bündel von Bedingungen, die zusammenkamen."
    ]},
    { h: "Warum England? Ein Bündel von Bedingungen", p: [
      "Die erste Bedingung ist Kohle. Großbritannien hatte große Kohlevorkommen nahe an der Oberfläche und in der Nähe von Häfen und Flüssen. Weil Holz knapp wurde, nutzte man Kohle schon lange zum Heizen, und das Interesse, Wasser aus den Gruben zu pumpen, trieb die Erfindung der Dampfmaschine an. Thomas Newcomen baute 1712 die erste brauchbare Pumpe, James Watt verbesserte sie ab 1769 so, dass sie weniger Brennstoff brauchte und auch Maschinen antreiben konnte. Der Wirtschaftshistoriker Robert Allen betont zudem, dass in England Arbeit teuer und Energie billig war. Das machte es lohnend, Menschen durch Maschinen zu ersetzen, was anderswo, wo Arbeit billig war, weniger lohnte.",
      "Die zweite Bedingung ist die Landwirtschaft. Neue Anbaumethoden, Fruchtwechsel, besseres Vieh und die Einhegung der Gemeindeländereien (Enclosures) steigerten den Ertrag, sodass weniger Menschen mehr Nahrung erzeugten. Zugleich wurden viele Kleinbauern verdrängt und zogen in die Städte, wo sie als Arbeiter zur Verfügung standen. Die dritte Bedingung ist Kapital und Handel. Über Jahrhunderte hatten Kaufleute und Banken Vermögen angesammelt, und der Atlantikhandel mit Zucker, Tabak und Baumwolle, der auf dem Sklavenhandel beruhte (Einheit 18), brachte Gewinne und Märkte. Ob dieser Gewinn den Start der Industrialisierung entscheidend ermöglichte, ist umstritten. Sicher ist, dass die Rohbaumwolle, mit der die ersten Fabriken arbeiteten, auf Plantagen wuchs, die von Versklavten bewirtschaftet wurden, und dass die Kolonien Absatzmärkte boten.",
      "Die vierte Bedingung ist der Staat und das Recht. Eigentum war geschützt (Bill of Rights, Einheit 23), Parlament und Gerichte waren berechenbar, es gab keine Binnenzölle, und eine wirksame Marine sicherte den Handel. Patente schützten Erfinder, und es gab ein Umfeld von Handwerkern, Mechanikern und Gelehrten, die Wissen austauschten (Einheit 23). Die fünfte Bedingung ist die Neugier: Die Wissenschaftliche Revolution und die Aufklärung hatten eine Kultur geschaffen, in der man Probleme durch Experimentieren und Rechnen lösen wollte (Einheit 24). Man kann sagen: Keine einzelne dieser Bedingungen war einzigartig, aber dass sie in Großbritannien zusammentrafen, erklärt den Vorsprung."
    ]},
    { h: "Baumwolle, Maschinen und die Fabrik", p: [
      "Den Anfang machte die Textilindustrie. Indische Baumwollstoffe waren in Europa begehrt (Einheit 21), und britische Hersteller wollten sie selbst herstellen. Mehrere Erfindungen machten das möglich: die Spinning Jenny (um 1764), die Wasserspinnmaschine Richard Arkwrights (1769) und der mechanische Webstuhl (1785). Sie ersetzten Handarbeit durch Maschinen, die so schwer waren, dass man sie an Flüssen und später mit Dampfkraft in Fabriken zusammenbrachte. Arkwrights Fabrik in Cromford (1771) gilt als Prototyp. Statt zu Hause am Spinnrad zu arbeiten, arbeiteten Menschen nun nach dem Takt von Maschine und Uhr, zwölf bis sechzehn Stunden am Tag, auch Frauen und Kinder.",
      "Die Folge war eine enorme Steigerung der Produktion und ein Absinken der Preise. Britische Baumwollstoffe verdrängten bald die indischen Waren, und das hatte Folgen: Indien, das zuvor Textilien ausführte, wurde zum Lieferanten von Rohbaumwolle und zum Absatzmarkt für britische Fertigwaren. Diese Umkehr gilt als Beispiel dafür, wie die Industrialisierung die Gewichte zwischen den Weltregionen verschob (Einheiten 21 und 32)."
    ]},
    { h: "Eisen, Dampf und Eisenbahn", p: [
      "Der Bedarf an Maschinen trieb die Eisenindustrie an. Abraham Darby hatte schon 1709 gelernt, Eisen mit Koks statt Holzkohle zu schmelzen, und im 19. Jahrhundert entstanden Hochöfen, Walzwerke und Werften. Dampfmaschinen wurden zum Antrieb für Fabriken, Schiffe und Lokomotiven. 1825 fuhr die erste öffentliche Eisenbahn zwischen Stockton und Darlington, 1830 folgte die Linie von Liverpool nach Manchester. Der Effekt war gewaltig: Waren und Menschen bewegten sich schneller und billiger als je zuvor, Märkte wuchsen zusammen, und die Zeit wurde vereinheitlicht, weil Fahrpläne eine einheitliche Uhrzeit brauchten. Zwischen 1830 und 1850 entstand ein Eisenbahnnetz, das Städte und Häfen verband. Die Weltausstellung von 1851 im Kristallpalast in London zeigte stolz, wie weit Großbritannien als „Werkstatt der Welt“ gekommen war."
    ]},
    { h: "Städte, Arbeit und Not", p: [
      "Die Menschen strömten in die Industriestädte. Manchester wuchs von rund 25.000 Einwohnern im Jahr 1760 auf über 300.000 um 1850. Die Wohnungen waren eng, Kanalisation und sauberes Wasser fehlten, und der Rauch der Schlote hing über den Vierteln. Die Lebenserwartung in manchen Industriestädten lag deutlich unter der auf dem Land. Fabrikarbeit war monoton, gefährlich und schlecht bezahlt, und Kinder arbeiteten in Spinnereien und Bergwerken. Erst nach und nach begrenzten Gesetze die Kinderarbeit, etwa der Factory Act von 1833. Arbeiter reagierten unterschiedlich: Manche zerstörten Maschinen (die Ludditen 1811 bis 1816), andere schlossen sich zu Gewerkschaften zusammen, forderten das Wahlrecht (Chartisten) und Rechte am Arbeitsplatz.",
      "Hier liegt eine Spannung, über die Historiker bis heute streiten: Stieg der Lebensstandard der Mehrheit schon früh, oder erst nach der Mitte des 19. Jahrhunderts? Die Daten deuten darauf hin, dass die Löhne lange stagnierten, während die Produktion und die Gewinne wuchsen, und dass erst später breitere Schichten profitierten. Wirtschaftliches Wachstum bedeutet nicht automatisch ein besseres Leben für alle zur gleichen Zeit."
    ]},
    { h: "Seuchen der Stadt: Cholera und der Anfang der öffentlichen Gesundheit", p: [
      "Dichte Städte ohne Hygiene schufen neue Gesundheitsprobleme. 1831/32 erreichte die Cholera Großbritannien, eine Krankheit, die aus Indien über Handelswege gekommen war (Einheit 21). Man wusste nicht, wie sie sich verbreitete. Die herrschende Ansicht war die Miasmentheorie: Krankheiten entstünden durch schlechte Luft. Der Arzt John Snow, der sich zugleich mit der Anwendung von Äther und Chloroform beschäftigte (nächste Einheiten), untersuchte den Ausbruch im Londoner Stadtteil Soho 1854. Er kartierte die Todesfälle und fand heraus, dass sie sich um eine Wasserpumpe in der Broad Street häuften. Er ließ den Pumpenschwengel entfernen, und der Ausbruch ebbte ab. Das gilt als Anfang der Epidemiologie: Muster in Daten erkennen und daraus handeln.",
      "Der Verwaltungsbeamte Edwin Chadwick hatte schon 1842 in einem Bericht gezeigt, dass Armut, Schmutz und Krankheit zusammenhingen, und forderte Kanalisation und Wasserversorgung. 1848 folgte ein erstes Gesundheitsgesetz. Die Idee, dass der Staat die Gesundheit der Bevölkerung schützen muss, hatte sich durchgesetzt, nicht aus Menschenfreundlichkeit allein, sondern weil Seuchen auch die Reichen trafen und Arbeitskraft kosteten. Das ist ein Beispiel dafür, wie Not zur Verwaltung führt, ähnlich wie die Pest einst die Quarantäne hervorgebracht hatte (Einheit 13)."
    ]}
  ],

  deep: [
    ["Die Frage nach dem „Warum Europa?“ (Great Divergence)", "Historiker diskutieren, warum Europa im 19. Jahrhundert wirtschaftlich an China und Indien vorbeizog, obwohl diese um 1700 vergleichbar entwickelt waren. Kenneth Pomeranz betont zwei Zufälle: die Kohle nahe den Städten und den Zugang zu Ressourcen der Neuen Welt. Andere betonen Institutionen und Wissen. Eine einfache Antwort gibt es nicht, aber die Frage zeigt, dass der Vorsprung kein Naturgesetz war."],
    ["Zeit wird Industrie", "Mit Fabrik und Eisenbahn bekam die Uhr eine neue Rolle. Bis dahin hatte jede Stadt ihre eigene Zeit nach dem Sonnenstand, und erst die Eisenbahnen brauchten einheitliche Fahrpläne. 1847 führten die britischen Bahnen die Greenwich-Zeit ein. Aus Arbeit nach Aufgabe wurde Arbeit nach Stunden, und das prägt unser Leben bis heute."]
