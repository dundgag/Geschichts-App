    { h: "Ritter und Burgen", p: [
      "Der Ritter war ein berittener Krieger im Dienst eines Herrn. Zunächst war das ein Beruf, später wurde „Ritter“ zum Standesbegriff mit eigener Kultur: Ideale von Tapferkeit, Treue und Dienst an Schwachen und Frauen („Minne“), die in Dichtung wie dem Parzival Wolframs von Eschenbach verherrlicht wurden. Die Wirklichkeit war rauer, Fehden und Plünderungen gehörten zum Alltag. Burgen entstanden zunächst aus Holz und Erde, später aus Stein, und waren Wohnsitz, Verwaltungssitz und Festung zugleich, selten so komfortabel, wie Filme sie zeigen."
    ]},
    { h: "Städte und Handel", p: [
      "Im Hochmittelalter entstanden in Europa Hunderte neuer Städte. Sie waren meist ummauert und hatten Märkte. Wer ein Jahr und einen Tag in der Stadt lebte, konnte nach dem Grundsatz „Stadtluft macht frei“ der Hörigkeit entkommen, auch wenn das regional verschieden galt. Die Bürger organisierten sich in Zünften und Gilden, wählten Räte und strebten nach Selbstverwaltung, oft im Streit mit dem Stadtherrn. Die meisten Städte hatten nur wenige tausend Einwohner. Große Zentren wie Paris, Venedig, Mailand, Florenz oder Köln erreichten 50.000 oder mehr.",
      "Im Norden schlossen sich Kaufleute im Bund der Hanse zusammen, die vom 13. bis ins 15. Jahrhundert den Handel in Nord- und Ostsee dominierte (Lübeck, Hamburg, Danzig, Nowgorod, Bergen). Gehandelt wurden Salz, Fisch, Pelze, Holz, Getreide und Tuch. In Oberitalien machten Venedig und Genua den Mittelmeerhandel reich, mit Waren aus dem Orient wie Gewürzen und Seide. Bankiers erfanden Wechsel, Buchführung und Versicherungen."
    ]},
    { h: "Universitäten und Gelehrsamkeit", p: [
      "Ab dem 12. Jahrhundert entstanden Universitäten, zunächst als Zusammenschlüsse von Lehrenden und Lernenden: Bologna (um 1088, Rechtswissenschaft), Paris (um 1150, Theologie), Oxford, Salerno (Medizin). In Deutschland folgten Prag (1348), Wien (1365), Heidelberg (1386) und Köln (1388). Man studierte zuerst die „sieben freien Künste“, dann Theologie, Recht oder Medizin. Gelehrt wurde auf Latein, durch Lesen und Disputieren.",
      "Die Gelehrten lasen jetzt Aristoteles, dessen Schriften über arabische Vermittlung nach Europa gekommen waren (Einheit 10), und versuchten, Glauben und Vernunft zu verbinden (Scholastik). Albertus Magnus (um 1200–1280) beobachtete die Natur, Thomas von Aquin (1225–1274) schuf in der „Summa theologiae“ eine umfassende Synthese von Aristoteles und christlicher Lehre. Roger Bacon forderte Experimente."
    ]},
    { h: "Gotik, Frauen und Medizin", p: [
      "Mit der Gotik entstand ein neuer Baustil: Spitzbögen, Kreuzrippengewölbe und Strebebögen erlaubten höhere, hellere Kirchen mit riesigen Glasfenstern. Die Kathedralen von Saint-Denis (um 1140), Chartres und Reims, später der Kölner Dom (Baubeginn 1248, vollendet erst 1880) waren Jahrzehnte oder Jahrhunderte dauernde Gemeinschaftsprojekte der ganzen Stadt.",
      "Hildegard von Bingen (1098–1179), Äbtissin, Mystikerin, Komponistin und Autorin von Schriften zur Natur und Heilkunde, ist eine der bekanntesten Frauen des Mittelalters. Einige der ihr zugeschriebenen Werke werden von der Forschung kritisch betrachtet, ihr Ruhm in der heutigen Naturheilkunde geht über das hinaus, was belegt ist. In Salerno in Süditalien entstand die erste bedeutende Medizinschule des Mittelalters, an der auch Frauen lehrten. Krankenhäuser wurden meist von Klöstern und Bruderschaften betrieben, etwa das Hôtel-Dieu in Paris. Die Medizin beruhte auf der Säftelehre von Hippokrates und Galen: Gesundheit hieß Gleichgewicht von Blut, Schleim, gelber und schwarzer Galle. Praktisch halfen Diät, Kräuter, Aderlass und Chirurgie, die Barbiere und Wundärzte betrieben."
    ]}

UNITS.u12 = {
  id: "u12",
  title: "Macht und Glaube: Kaiser, Papst und Kreuzzüge",
  lead: "Wer steht über wem: der Kaiser oder der Papst? Dazu die Kreuzzüge, die Verfolgung von Abweichlern und die ersten Grenzen königlicher Macht.",
  body: [
    { h: "Der Streit um die Investitur", p: [
      "Seit Otto dem Großen setzten die deutschen Könige Bischöfe und Äbte ein und belehnten sie mit Amt und Land (Investitur). Das war für sie praktisch: Geistliche hatten keine erbberechtigten Kinder, ihre Ämter fielen an den König zurück. Im 11. Jahrhundert forderte die Kirchenreform, ausgehend vom Kloster Cluny, die Freiheit der Kirche von weltlicher Einmischung. Papst Gregor VII. (1073–1085) ging noch weiter: Im „Dictatus papae“ (1075) beanspruchte er das Recht, Kaiser abzusetzen.",
      "König Heinrich IV. widersetzte sich. 1076 erklärte er den Papst für abgesetzt, der Papst bannte ihn und löste seine Untertanen vom Treueid. Das war gefährlich, denn die Fürsten nutzten die Gelegenheit, um gegen den König zu rebellieren. Im Januar 1077 zog Heinrich über die Alpen nach Canossa in Oberitalien, wo sich der Papst aufhielt, und tat öffentlich Buße. Der Papst musste ihn vom Bann lösen. Politisch war das ein kluger Zug Heinrichs, aber der Gang nach Canossa wurde zum Sinnbild der Demütigung des Königs. Der Streit endete erst 1122 mit dem Wormser Konkordat: Der Papst vergab das geistliche Amt, der König belehnte mit dem weltlichen Besitz."
    ]},
    { h: "Der Aufruf zu den Kreuzzügen", p: [
      "1095 rief Papst Urban II. in Clermont zum Kriegszug nach Jerusalem auf. Anlass war ein Hilfegesuch des byzantinischen Kaisers Alexios I. gegen die Seldschuken (Einheit 9). Für den Papst war es auch eine Chance, die Autorität der Kirche zu erhöhen und kriegerischen Adel nach außen zu lenken. Wer teilnahm, erhielt Ablass, also den Erlass von Bußstrafen. Zu den Beweggründen zählten echte Frömmigkeit, Abenteuerlust, Aussicht auf Land und Beute und Druck von Familie und Lehnsherren. Es lohnt sich, nicht nur eine Erklärung zu suchen.",
      "Der erste Kreuzzug (1096–1099) war ein militärischer Erfolg. 1099 eroberten die Kreuzfahrer Jerusalem und töteten viele Einwohner, Muslime wie Juden. Es entstanden Kreuzfahrerstaaten an der Levante: Grafschaft Edessa, Fürstentum Antiochia, Königreich Jerusalem und Grafschaft Tripolis."
    ]},
    { h: "Pogrome und Kreuzzüge im Inneren", p: [
      "Schon vor dem Heer der Ritter zogen 1096 Scharen von Pilgern los. Einige Gruppen ermordeten in Städten am Rhein, etwa in Speyer, Worms und Mainz, jüdische Gemeinden. Manche Bischöfe versuchten, Juden zu schützen, oft ohne Erfolg. Die Verfolgungen von 1096 gelten als Beginn einer langen Reihe judenfeindlicher Gewalt im mittelalterlichen Europa, die sich bei späteren Krisen, etwa in der Pest 1348/49, wiederholte (Einheit 13). Auch 1204 richtete sich ein Kreuzzug gegen christliche Mitchristen: Der Vierte Kreuzzug eroberte Konstantinopel."
    ]},
    { h: "Der weitere Verlauf der Kreuzzüge", p: [
      "1144 eroberten muslimische Truppen Edessa, was den zweiten Kreuzzug (1147–1149) auslöste, der scheiterte. 1187 besiegte Saladin, Herrscher über Ägypten und Syrien, bei Hattin das Kreuzfahrerheer und nahm Jerusalem ein. Er ließ die Bevölkerung gegen Lösegeld frei und gilt auch im Westen als ritterlicher Gegner. Der dritte Kreuzzug (1189–1192) mit Kaiser Friedrich Barbarossa, der 1190 im Fluss Saleph in Kleinasien ertrank, Philipp II. von Frankreich und Richard Löwenherz erreichte Jerusalem nicht, sicherte aber einen Küstenstreifen und freien Pilgerzugang.",
      "Der vierte Kreuzzug (1202–1204) wurde von Venedig umgelenkt und endete mit der Plünderung Konstantinopels. 1229 erreichte Kaiser Friedrich II. durch Verhandlungen mit dem ägyptischen Sultan al-Kamil die Herausgabe Jerusalems, ohne Schlacht. 1291 fiel Akkon, die letzte Bastion der Kreuzfahrer. Insgesamt hatten die Kreuzzüge militärisch wenig dauerhaften Erfolg. Langfristig förderten sie den Handel mit dem Orient, stärkten die Position der italienischen Städte und vertieften das Misstrauen zwischen Christen und Muslimen sowie zwischen West- und Ostkirche. In der islamischen Welt nahm man sie zunächst als eine von vielen Auseinandersetzungen wahr, erst im 19. und 20. Jahrhundert wurden sie dort stark politisch aufgeladen. Neben dem Orient gab es auch Kreuzzüge im Baltikum und in Spanien."
    ]},
    { h: "Staufer und Friedrich II.", p: [
      "Die Staufer stellten von 1138 bis 1254 mehrfach die Könige und Kaiser. Friedrich I. Barbarossa (1155–1190) versuchte, die Macht in Italien durchzusetzen, scheiterte aber an den oberitalienischen Städten (Schlacht bei Legnano 1176). In Deutschland entmachtete er seinen Rivalen Heinrich den Löwen, den Herzog von Sachsen und Bayern, und stützte sich auf Lehen und Ministeriale.",
      "Sein Enkel Friedrich II. (1194–1250) wuchs in Sizilien auf, einer Region, in der lateinische, griechische und arabische Kultur zusammentrafen. Er sprach mehrere Sprachen, förderte Wissenschaft und schrieb ein Buch über die Falknerei, in dem er sich auf Beobachtung stützt und Aristoteles kritisiert. Er gründete 1224 die Universität Neapel und regierte Sizilien als straff organisierter Staat. Wegen seiner Konflikte mit den Päpsten wurde er mehrfach gebannt. Nach seinem Tod 1250 und dem Ende der Staufer begann in Deutschland das „Interregnum“, eine Zeit ohne allgemein anerkannten König (1250–1273), in der die Fürsten ihre Macht ausbauten."
    ]},
    { h: "Die Kirche auf dem Höhepunkt – und ihre Gegner", p: [
      "Unter Innozenz III. (1198–1216) erreichte das Papsttum den Gipfel seiner politischen Macht. Es verlangte Gehorsam von Königen und rief zu Kreuzzügen auf. 1215 beschloss das Vierte Laterankonzil, dass alle Gläubigen mindestens einmal jährlich beichten und kommunizieren sollen. Zugleich entstanden Bettelorden wie die Franziskaner (Franz von Assisi, 1181/82–1226) und die Dominikaner, die in den Städten predigten und ein Leben in Armut führten.",
      "Wer von der Lehre abwich, wurde als Ketzer verfolgt. Gegen die Katharer in Südfrankreich rief die Kirche 1209 zum Albigenserkreuzzug auf, der mit großer Gewalt zur Unterwerfung des Südens führte. Ab 1231 wurde die Inquisition als kirchliches Verfahren gegen Ketzer organisiert. Sie arbeitete mit Verhören, Zeugen und auch mit Folter, und die Urteile reichten von Bußen bis zur Verbrennung. Das Ausmaß wird in der Forschung differenziert beurteilt: Die Verfolgungen waren nicht überall gleich stark, und manche populäre Zahlen stammen aus späteren Epochen."
    ]},
    { h: "Recht und Grenzen der Macht: Magna Carta", p: [
      "In England zwang 1215 eine Gruppe aufständischer Barone König Johann („Ohneland“), die Magna Carta zu besiegeln. Anlass waren hohe Steuern und Willkür. Das Dokument legte fest, dass auch der König an das Recht gebunden ist. Einzelne Klauseln, etwa dass kein freier Mann ohne rechtmäßiges Urteil verhaftet werden darf, wirkten weit über ihre Zeit hinaus. Zunächst galt sie nur wenige Wochen und betraf vor allem die Rechte der Barone, aber sie wurde später mehrfach erneuert und zu einem Bezugspunkt für Rechtsstaatlichkeit. 1265 berief Simon de Montfort ein Parlament mit Vertretern der Städte ein, ein Vorläufer des englischen Parlaments."
    ]}

  title: "Spätmittelalter: Pest, Krieg und Umbruch",
  lead: "Hunger, Seuche, Krieg und Kirchenspaltung erschüttern Europa im 14. Jahrhundert. Und aus der Krise wachsen Buchdruck, Renaissance und neue Mächte.",
  body: [
    { h: "Das Ende der Wachstumszeit", p: [
      "Um 1300 stieß Europa an Grenzen. Die Bevölkerung war so stark gewachsen, dass Land knapp wurde, die Erträge sanken, und das Klima wurde kälter (die „Kleine Eiszeit“ kündigte sich an). 1315 bis 1317 führten Dauerregen und Missernten zur Großen Hungersnot in weiten Teilen Nordeuropas, bei der Hunderttausende starben. Geschwächte Menschen waren anfälliger für Krankheiten, und die Gesellschaft stand unter Druck, als 1347 die Pest kam."
    ]},
    { h: "Der Schwarze Tod", p: [
      "Die Pest erreichte Europa 1347 über genuesische Schiffe aus dem Schwarzen Meer, wohl aus Zentralasien über die Handelswege der Mongolen. Der Erreger ist das Bakterium Yersinia pestis, das durch Flöhe von Ratten und anderen Nagetieren auf Menschen übertragen wird, daneben gab es wahrscheinlich auch Ansteckung von Mensch zu Mensch. 1347 bis 1353 raffte sie, nach heutigen Schätzungen, etwa ein Drittel bis die Hälfte der Bevölkerung Europas hin, regional sehr unterschiedlich. Auch Nordafrika und der Nahe Osten waren betroffen. Es war die größte Katastrophe der europäischen Geschichte, und die Seuche kehrte in Wellen bis ins 18. Jahrhundert wieder.",
      "Man verstand die Krankheit nicht. Gelehrte machten „schlechte Luft“ (Miasmen), Planetenkonstellationen oder die Strafe Gottes verantwortlich. Dennoch entwickelte man wirksame Gegenmaßnahmen. Venedig und Ragusa (Dubrovnik) isolierten ab 1377 ankommende Schiffe für dreißig Tage (trentino), später vierzig (quaranta giorni, daher „Quarantäne“). Städte bauten Pestspitäler und führten Gesundheitsbehörden ein."
    ]},
    { h: "Folgen und Verfolgung", p: [
      "Der Mangel an Arbeitskräften führte dazu, dass Löhne stiegen und Landarbeiter bessere Bedingungen forderten. Manche Grundherren versuchten, Löhne gesetzlich zu begrenzen. Es kam zu Aufständen, etwa 1358 in Frankreich (Jacquerie) und 1381 in England (Bauernaufstand unter Wat Tyler). Auf längere Sicht schwächte die Pest in Westeuropa die Leibeigenschaft, während sie im Osten teils verschärft wurde.",
      "Auch die Verfolgung von Minderheiten nahm zu. In vielen Städten beschuldigte man Juden, die Brunnen vergiftet zu haben. Zwischen 1348 und 1351 wurden in Dutzenden Städten, darunter Straßburg, Basel, Mainz und Köln, jüdische Gemeinden ermordet oder vertrieben. Papst Clemens VI. verurteilte 1348 diese Anschuldigungen und stellte fest, dass auch Gegenden ohne Juden von der Pest heimgesucht wurden, doch er konnte die Gewalt nicht stoppen. Manche Stadträte schützten Juden, andere profitierten von ihrem Besitz."
    ]},
    { h: "Der Hundertjährige Krieg", p: [
      "Von 1337 bis 1453 führten England und Frankreich in Abständen Krieg, bekannt als Hundertjähriger Krieg. Auslöser war ein Streit um die französische Thronfolge, den der englische König Eduard III. für sich beanspruchte, dazu kamen Konflikte um englische Besitzungen in Frankreich und um Flandern. Die englischen Langbogenschützen siegten bei Crécy (1346) und Azincourt (1415). Eine Wende brachte Jeanne d'Arc, eine junge Bäuerin, die sich von Stimmen geleitet sah. 1429 führte sie ein französisches Heer zum Entsatz von Orléans. Sie wurde 1430 gefangen genommen und 1431 von einem kirchlichen Gericht in Rouen als Ketzerin verbrannt, später rehabilitiert und 1920 heiliggesprochen. 1453 endete der Krieg mit der Vertreibung der Engländer, bis auf Calais.",
      "Der Krieg stärkte die Idee von nationalen Königreichen und veränderte die Kriegführung: Söldnerheere, Bogen- und frühe Feuerwaffen minderten den Wert der schweren Ritterreiterei."
    ]},
    { h: "Die Kirche in der Krise", p: [
      "Das Papsttum geriet im 14. Jahrhundert unter Druck. Nach einem Streit mit dem französischen König Philipp IV. residierten die Päpste von 1309 bis 1377 in Avignon, zeitweilig unter starkem französischem Einfluss. Als Gregor XI. nach Rom zurückkehrte und 1378 starb, wählten die Kardinäle einen Italiener (Urban VI.), dann mehrheitlich einen Gegenpapst. Es folgte das Abendländische Schisma (1378–1417) mit zwei, zeitweise drei Päpsten, die einander bannten. Erst das Konzil von Konstanz (1414–1418) beendete die Spaltung mit der Wahl Martins V.",
      "Kritiker forderten eine Reform. John Wyclif in England und Jan Hus in Böhmen griffen den Reichtum der Kirche an und forderten Predigt in der Volkssprache und Bibel für alle. Hus wurde in Konstanz trotz zugesichertem freiem Geleit 1415 verbrannt, danach folgten die Hussitenkriege in Böhmen. Die Unruhen waren ein Vorspiel zur Reformation (folgende Kapitel)."
    ]},
    { h: "Das Reich, die Städte und die Schweiz", p: [
      "Im Heiligen Römischen Reich verfestigte sich die Macht der Fürsten. Die Goldene Bulle von 1356, ein Reichsgesetz Karls IV., legte fest, dass sieben Kurfürsten den König wählen: die Erzbischöfe von Mainz, Trier und Köln sowie der König von Böhmen, der Pfalzgraf bei Rhein, der Herzog von Sachsen und der Markgraf von Brandenburg. Karl IV. machte Prag zu einem Zentrum und gründete 1348 die erste Universität im Reich. Die Habsburger stiegen im 15. Jahrhundert auf. In den Alpen wehrte sich die Eidgenossenschaft gegen Habsburg, ein Bündnis, das 1291 begann und im 14. Jahrhundert wuchs.",
      "In den Städten stritten Zünfte und Patrizier um Macht. In Italien herrschten mächtige Familien wie die Medici in Florenz, die als Bankiers reich wurden."
    ]},
    { h: "Konstantinopel 1453 und das Osmanische Reich", p: [
      "Das Osmanische Reich entstand um 1300 in Westanatolien und dehnte sich rasch auf den Balkan aus. 1389 besiegte es auf dem Amselfeld ein serbisch geführtes Heer. 1453 eroberte Sultan Mehmed II. nach einer Belagerung von etwa 53 Tagen Konstantinopel, nicht zuletzt dank großer Kanonen. Kaiser Konstantin XI. fiel im Kampf. Damit endete das Byzantinische Reich. Konstantinopel wurde Hauptstadt des Osmanischen Reichs, das bald Südosteuropa, Kleinasien und den Nahen Osten beherrschte. Der Handel mit dem Orient lief nun stärker über osmanisch kontrollierte Wege, was europäische Mächte zur Suche nach neuen Seewegen anspornte, auch wenn der Zusammenhang komplexer ist, als er oft dargestellt wird (folgende Kapitel)."
    ]},
    { h: "Buchdruck und Renaissance", p: [
      "Um 1450 entwickelte Johannes Gutenberg in Mainz den Buchdruck mit beweglichen Metalllettern, einer Presse und öligen Druckerschwärze. Die 42-zeilige Bibel entstand um 1452 bis 1455. Das Verfahren verbreitete sich rasend schnell: Um 1500 gab es in Europa über 250 Druckorte und mehrere Millionen gedruckter Bände. Bücher wurden billiger, Ideen verbreiteten sich schneller, und die Zahl der Lesekundigen stieg. In China und Korea gab es Drucktechniken mit beweglichen Lettern schon früher, aber Gutenbergs System fand in Europa durch die Alphabetschrift ideale Bedingungen.",
      "Zugleich blühte in Italien, zuerst in Florenz, die Renaissance, also die „Wiedergeburt“ der Antike. Humanisten wie Petrarca (1304–1374) sammelten antike Texte und betonten den Wert des Menschen. Künstler wie Giotto, Brunelleschi, Leonardo da Vinci (1452–1519), Michelangelo (1475–1564) und Raffael entwickelten Perspektive und Anatomie neu. Wissenschaft und Kunst waren eng verbunden, Anatomen sezierten, Leonardo zeichnete den menschlichen Körper. Die Renaissance bereitete Neuzeit und Aufklärung vor, auch wenn die Grenze zum Mittelalter fließend ist."
    ]}
  ],

  deep: [
    ["Wie wirkte die Pest wirklich?", "Aus der Forschung: Genanalysen von Skeletten aus Pestgräbern haben Yersinia pestis nachgewiesen und bestätigt, dass es dieselbe Bakterienart wie bei späteren Pestwellen war. Offen sind die Sterberaten. Manche Regionen wurden fast verschont (Teile Polens, Böhmens), andere verloren die Hälfte. Die oft zitierte Zahl von einem Drittel ist ein grober Mittelwert."],
    ["Frauen und Medizin in der Pestzeit", "Ärzte versuchten, die Krankheit zu erklären. Das Pariser Gutachten von 1348 sah die Ursache in einer ungünstigen Planetenkonstellation. Empfehlungen waren Fernhalten von der Luft Erkrankter, leichte Kost und Räuchern. Barbiere und Ärzte, die zu den Kranken gingen, erkrankten oft selbst, und Pestärzte mit Schnabelmasken kamen erst im 17. Jahrhundert auf. Das populäre Bild gehört also nicht ins 14. Jahrhundert."],

UNITS.u14 = {
  id: "u14",
  title: "China, Mongolen und Asiens Netze",
  lead: "Zweitausend Jahre chinesische Reichsgeschichte, die Seidenstraße und die Mongolen, die den größten zusammenhängenden Landreich der Geschichte schufen.",
  body: [
    { h: "Die Einigung Chinas: Qin und Han", p: [
      "Vor 221 v. Chr. war China ein Nebeneinander konkurrierender Staaten (Zeit der Streitenden Reiche). Der Staat Qin einte sie unter Qin Shi Huangdi, dem „ersten erhabenen Kaiser“. Er vereinheitlichte Schrift, Maße, Gewichte und Münzen, baute Straßen und Kanäle und ließ erste Schutzwälle gegen Nomaden verbinden, Vorläufer der Großen Mauer. Seine Herrschaft war hart und stützte sich auf Zwang. Berühmt ist seine Grabanlage bei Xi'an mit der Terrakotta-Armee mit tausenden lebensgroßen Kriegern. Nach seinem Tod 210 v. Chr. brach die Dynastie rasch zusammen.",
      "Die Han-Dynastie (206 v. Chr.–220 n. Chr.) regierte über 400 Jahre und prägte China bis heute, weshalb sich Chinesen oft als „Han“ bezeichnen. Sie machte den Konfuzianismus zur Staatsphilosophie, baute ein Beamtensystem aus und entwickelte Technik: Papier (traditionell auf 105 n. Chr. datiert, frühere Funde existieren), Seismograph, verbessertes Eisen. Mit einer Volkszählung im Jahr 2 n. Chr. wurden rund 58 Millionen Menschen gezählt, eine der frühesten verlässlichen Zahlen eines Großstaats."
    ]},
    { h: "Konfuzius, Daoismus, Buddhismus", p: [
      "Konfuzius (551–479 v. Chr.) lehrte Ordnung durch Pflichtbewusstsein, Respekt vor Eltern und Älteren und gute Regierung durch moralisch gebildete Beamte. Der Daoismus (Laozi, Zhuangzi) betonte das Einfügen in den natürlichen Lauf der Dinge. Aus Indien kam seit dem 1. Jahrhundert der Buddhismus, der sich nach dem Zerfall der Han stark ausbreitete. Diese „drei Lehren“ ergänzten sich im Alltag vieler Menschen. Die Beamtenprüfungen, ab der Sui- und Tang-Zeit ausgebaut, machten konfuzianische Bildung zum Weg in den Staatsdienst und prägten die Gesellschaft Chinas bis 1905."
    ]},
    { h: "Teilung, Tang und Song", p: [
      "Nach 220 zerfiel China für Jahrhunderte. Erst die Sui (581–618), dann die Tang-Dynastie (618–907) einten es erneut. Die Tang-Zeit gilt als Blüte: Die Hauptstadt Chang'an hatte rund eine Million Einwohner und war eine Weltstadt, in der Händler aus Persien, Indien und Zentralasien lebten. Dichter wie Li Bai und Du Fu schrieben Verse, die bis heute gelesen werden. Der Große Kanal verband Nord und Süd. Wu Zetian regierte als einzige Frau offiziell als Kaiserin (690–705). Nach dem Aufstand des An Lushan (755) begann der Niedergang.",
      "Die Song-Dynastie (960–1279) war militärisch schwächer, aber wirtschaftlich und technisch hochentwickelt. Es gab Papiergeld, den Kompass in der Seefahrt, Schießpulver in frühen Waffen, Buchdruck mit Holzplatten und beweglichen Lettern (Bi Sheng, um 1040) und große Städte mit über einer Million Einwohnern. Der Süden mit Reisanbau und Handel wurde wohlhabender als der Norden. Ein Beamtenapparat verwaltete das Reich. Die Medizin entwickelte sich mit Akupunktur, Kräuterkunde und frühen Schriften über Gerichtsmedizin (Song Ci, 1247)."
    ]},
    { h: "Die Seidenstraße", p: [
      "Die Seidenstraße war kein einzelner Weg, sondern ein Geflecht von Handelsrouten durch Zentralasien, das China mit Indien, Persien, dem Mittelmeer und später Europa verband. Der Name stammt erst aus dem 19. Jahrhundert. Die Han-Dynastie sandte um 138 v. Chr. den Gesandten Zhang Qian nach Westen, und der Austausch wuchs. Gehandelt wurden Seide, Porzellan, Gewürze, Pferde, Glas, Silber. Ebenso reisten Religionen (Buddhismus, Christentum der Nestorianer, Manichäismus, Islam), Techniken (Papier, später Schießpulver) und leider auch Krankheiten. Kaum ein Händler reiste die ganze Strecke, die Waren wechselten viele Male den Besitzer. Karawanenstädte wie Samarkand, Buchara und Dunhuang wurden reich."
    ]},
    { h: "Die Mongolen", p: [
      "Um 1206 einte Temüdschin die mongolischen Stämme und wurde als Dschingis Khan („universeller Herrscher“) ausgerufen. Das Heer war diszipliniert, beweglich und nutzte Reiterbogenschützen, Spähnetze und Belagerungstechnik, die es von eroberten Völkern übernahm. Die Mongolen eroberten Nordchina (1211–1234), Zentralasien (Choresmien, 1219–1221), danach Russland (1237–1240, Kiew fiel 1240), stießen bis Polen und Ungarn vor (1241) und zerstörten 1258 Bagdad. Die Eroberungen waren mit enormer Gewalt verbunden, ganze Städte wurden zerstört und viele Einwohner getötet, Schätzungen zu den Opferzahlen sind unsicher und gehen weit auseinander.",
      "Das Reich teilte sich in mehrere Teilreiche (Khanate): die Goldene Horde in Russland, das Ilchanat in Persien, das Tschagatai-Khanat in Zentralasien und die Yuan-Dynastie in China unter Kublai Khan (1260–1294), der 1271 Peking zur Hauptstadt machte und 1279 die Song vollständig besiegte. Unter der „Pax Mongolica“ im 13. und 14. Jahrhundert waren Handelswege sicher wie selten zuvor. Marco Polo reiste im späten 13. Jahrhundert nach China, ob alle seine Berichte auf Selbsterlebtem beruhen, ist umstritten. Der Handel verbreitete aber auch die Pest. Zwei Versuche Kublais, Japan zu erobern (1274, 1281), scheiterten an Stürmen, die die Japaner „Kamikaze“ („Götterwind“) nannten."
    ]},
    { h: "Ming und Zheng He", p: [
      "1368 vertrieb Zhu Yuanzhang, ein Bauernsohn, die Mongolen und gründete die Ming-Dynastie (1368–1644). Peking wurde unter Kaiser Yongle zur Hauptstadt, die Verbotene Stadt entstand. Zwischen 1405 und 1433 schickte der Kaiser den Admiral Zheng He mit gewaltigen Flotten, mit zig Schiffen und mehreren zehntausend Mann, in sieben Fahrten nach Südostasien, Indien, Arabien und Ostafrika. Es ging um Ansehen, Handel und Tribut, nicht um Eroberung oder Kolonisierung. Danach wurden die Fahrten eingestellt, aus Kostengründen und wegen anderer Prioritäten, vor allem der Bedrohung durch Nomaden im Norden. Die Große Mauer, wie wir sie kennen, wurde überwiegend in der Ming-Zeit gebaut."
    ]},
    { h: "Indien, Japan, Korea und Südostasien in Kürze", p: [
      "Indien: Nach dem Maurya-Reich mit Ashoka (ca. 268–232 v. Chr.), der nach blutigen Kriegen den Buddhismus förderte, und dem Gupta-Reich (ca. 320–550) mit Mathematik (Null, Dezimalsystem) folgten viele Regionalreiche. Ab dem 13. Jahrhundert herrschte das Sultanat von Delhi. Der Hinduismus prägte die Gesellschaft, mit dem Kastensystem als sozialer Ordnung.",
      "Japan: Ab etwa 700 entstand ein Staat nach chinesischem Vorbild mit Hauptstädten in Nara und Heian-kyo (Kyoto). Am Hof entstand höfische Literatur, etwa das Genji Monogatari der Murasaki Shikibu (um 1010). Ab 1185 herrschten Krieger, die Samurai, mit einem Shogun an der Spitze. Korea: Das Königreich Goryeo (918–1392) entwickelte den Metalllettern-Druck. Unter König Sejong entstand um 1443 die Hangul-Schrift. Südostasien: Das Khmer-Reich baute Angkor, ein riesiges Tempel- und Stadtsystem, im 12. Jahrhundert Angkor Wat."
    ]}

    node.classList.add(dir > 0 ? "in-r" : dir < 0 ? "in-l" : "in-f");
    try { window.scrollTo(0, 0); } catch (e) {}
    var t = node.querySelector("h1");
    if (t) { t.setAttribute("tabindex", "-1"); try { t.focus({ preventScroll: true }); } catch (e) {} }
  }

  /* ---------- Startseite ---------- */
  function home(mode) {
    cur = { kind: "home" };
    if (mode === "replace") pushView("replace", { k: "home" });
    setProg(false);
    var due = dueItems(), pool = poolSize();
    var read = ALL.filter(function (u) { return state.done[u.id]; }).length;
    var todayText = due.length
      ? "Zur Wiederholung fällig: " + due.length + (due.length === 1 ? " Frage" : " Fragen")
      : (pool ? "Heute ist nichts zur Wiederholung fällig." : "Die Wiederholung beginnt nach deinem ersten Quiz.");
    show(h("div", { class: "wrap" },
      h("header", { class: "head" },
        h("p", { class: "eyebrow" }, "Weltgeschichte in Einheiten à 10 Minuten"),
        h("h1", null, "Zeitgerüst"),
        h("p", { class: "stat" }, "Gelesen: " + read + " von " + ALL.length + (ALL.length === 1 ? " verfügbaren Einheit" : " verfügbaren Einheiten"))
      ),
      h("section", { class: "today", "aria-label": "Wiederholung" },
        h("p", null, todayText),
        h("button", { class: "btn", type: "button", disabled: !due.length, onclick: startReview }, "Wiederholen")
      ),
      h("ol", { class: "spine" }, CHAPTERS.map(chapterNode)),
      h("p", { class: "foot" }, "Dein Fortschritt wird nur in diesem Browser auf diesem Gerät gespeichert.")
    ), 0);
    var nxt = ALL.filter(function (u) { return !state.done[u.id]; })[0] || ALL[ALL.length - 1];
    setDock([
      dbtn(read ? "Weiterlesen" : "Loslegen", "Einheit " + nxt.no, function () { unitView(nxt, 1, "push"); }, ""),
      dbtn("Wiederholen", due.length ? due.length + " fällig" : "nichts fällig", startReview, "pri", !due.length)
    ]);
  }

  function chapterNode(c) {
    var avail = c.units.length > 0;
    var doneN = c.units.filter(function (u) { return state.done[u.id]; }).length;
    var cls = "node " + (avail ? (doneN === c.units.length ? "done" : "ready") : "planned");
    var card = h("div", { class: "card" + (avail ? "" : " planned") },
      h("p", { class: "years" }, c.years),
      h("h2", null, c.title),
      h("p", { class: "blurb" }, c.blurb)
    );
    if (avail) {
      var fill = h("i");
      fill.style.width = Math.round(doneN / c.units.length * 100) + "%";
      card.append(
        h("div", { class: "units" }, c.units.map(unitRow)),
        h("div", { class: "bar", role: "img", "aria-label": doneN + " von " + c.units.length + " Einheiten abgeschlossen" }, fill)
      );
    } else {
      card.append(h("p", { class: "soon" }, "Folgt"));
    }
    return h("li", { class: cls }, card);
  }

  function unitRow(u) {
    var d = state.done[u.id];
    return h("button", { class: "urow", type: "button", onclick: function () { unitView(u, 1, "push"); } },
      h("span", { class: "no" }, "Einheit " + u.no),
      h("span", { class: "us" }, d ? "Quiz " + d.best + "/" + d.total : "ca. " + u.minutes + " Min."),
      h("span", { class: "ut" }, u.title)
    );
  }

  /* ---------- Einheit ---------- */
  function section(title, content) {
    return h("section", { class: "sect" }, h("h2", null, title), content);
  }
  function dl(rows, cls) {
    return h("dl", { class: cls }, rows.map(function (r) { return [h("dt", null, r[0]), h("dd", null, r[1])]; }));
  }

  function unitView(u, dir, mode) {
    cur = { kind: "unit", u: u };
    if (mode === "push" || mode === "replace") pushView(mode, { k: "unit", id: u.id });
    var idx = ALL.indexOf(u), prev = ALL[idx - 1], next = ALL[idx + 1];
    var box = h("section", { class: "quiz", "aria-live": "polite" });
    var kids = [
      h("button", { class: "back", type: "button", onclick: goHome }, "‹ Zeitleiste"),
      h("header", { class: "uhead" },
        h("p", { class: "eyebrow" }, "Einheit " + u.no + " · " + u.chapter.title + " · ca. " + u.minutes + " Min. Lesezeit"),
        h("h1", { class: "utitle" }, u.title),
        h("p", { class: "lead" }, u.lead),
        u.body ? h("div", { class: "chips", "aria-label": "Springe zu einem Abschnitt" }, u.body.map(function (b, i) {
          return h("button", { class: "chip", type: "button", onclick: function () {
            var el = document.getElementById("s-" + i);
            if (el) { try { el.scrollIntoView({ behavior: "smooth", block: "start" }); } catch (e) { el.scrollIntoView(); } }
          } }, b.h);
        })) : null,
        state.sw ? null : h("p", { class: "swhint" }, "Tipp: Nach rechts wischen geht zurück zur Zeitleiste, nach links wischen zur nächsten Einheit.")
      )
    ];
    (u.body || []).forEach(function (b, i) {
      kids.push(h("section", { class: "sect prose", id: "s-" + i }, h("h2", null, b.h), b.p.map(function (t) { return h("p", null, t); })));
    });
    if (u.people) kids.push(section("Schlüsselbegriffe und Personen", dl(u.people, "tl reg")));
    if (u.timeline) kids.push(section("Die wichtigsten Daten", dl(u.timeline, "tl")));
    if (u.parallel) kids.push(section("Gleichzeitig in der Welt", dl(u.parallel, "tl reg")));
    if (u.relevance) kids.push(section("Warum das heute zählt", h("ul", { class: "rel" }, u.relevance.map(function (t) { return h("li", null, t); }))));
    if (u.deep) {
      kids.push(h("section", { class: "sect" },
        h("h2", null, "Vertiefung"),
        h("p", { class: "hint", style: "margin-bottom:12px" }, "Für Tage mit mehr Zeit."),
        u.deep.map(function (d) { return h("details", null, h("summary", null, d[0]), h("p", null, d[1])); })
      ));
    }
    kids.push(section("Kurzer Check", box));
    show(h("div", { class: "wrap" }, kids), dir);
    setProg(true);
    setDock([
      dbtn("‹ Zurück", prev ? "Einheit " + prev.no : "", function () { unitView(prev, -1, "replace"); }, "", !prev),
      dbtn("Zeitleiste", u.no + " / " + ALL.length, goHome, ""),
      dbtn("Weiter ›", next ? "Einheit " + next.no : "", function () { unitView(next, 1, "replace"); }, "pri", !next)
    ]);
    quizStart(box, u);
  }

  function quizStart(box, u) {
    var d = state.done[u.id];
    box.replaceChildren(
      h("p", null, d
        ? "Letztes Ergebnis: " + d.last + " von " + d.total + " richtig. Bestes Ergebnis: " + d.best + "."
        : u.quiz.length + " Fragen zur Einheit. Falsch beantwortete Fragen kommen in der Wiederholung früher wieder."),
      h("button", { class: "btn", type: "button", onclick: function () { unitQuiz(box, u); } }, d ? "Quiz wiederholen" : "Quiz starten")
    );
  }

  function unitQuiz(box, u) {
    var items = u.quiz.map(function (q, i) { return { id: u.id + "-" + i, q: q }; });
    runQuiz(box, items, function (score) {
      var prev = state.done[u.id], total = items.length;
      state.done[u.id] = { last: score, best: Math.max(score, prev ? prev.best : 0), total: total, at: Date.now() };
      save();
      var nxt = ALL[ALL.indexOf(u) + 1];
      box.replaceChildren(
        h("h3", { class: "q-text" }, score + " von " + total + " richtig"),
        h("p", { style: "margin-top:10px" }, score === total
          ? "Alles richtig. Die Fragen kommen später noch einmal zur Wiederholung."
          : "Die falsch beantworteten Fragen kommen bald in der Wiederholung wieder."),
        h("div", { class: "row", style: "margin-top:16px" },
          nxt ? h("button", { class: "btn", type: "button", onclick: function () { unitView(nxt, 1, "replace"); } }, "Nächste Einheit") : null,
          h("button", { class: nxt ? "btn ghost" : "btn", type: "button", onclick: goHome }, "Zur Zeitleiste")
        ),
        nxt ? null : h("p", { class: "hint", style: "margin-top:14px" }, "Weitere Einheiten folgen.")
      );
    });
  }

  /* ---------- Wiederholung ---------- */
  function startReview() {
    var items = dueItems().sort(function (a, b) { return state.q[a.id].due - state.q[b.id].due; }).slice(0, 10);
    if (!items.length) { home("none"); return; }
    cur = { kind: "review" };
    pushView("push", { k: "review" });
    setProg(false);
    var box = h("section", { class: "quiz", "aria-live": "polite" });
    setDock([dbtn("Zeitleiste", "", goHome, "")]);
    show(h("div", { class: "wrap" },
      h("button", { class: "back", type: "button", onclick: goHome }, "‹ Zeitleiste"),
      h("header", { class: "uhead", style: "margin-bottom:20px" },
        h("p", { class: "eyebrow" }, "Wiederholung"),
        h("h1", { class: "utitle" }, "Das Wichtige festigen")
      ),
      box
    ), 1);
    runQuiz(box, items, function (score) {
      box.replaceChildren(
        h("h3", { class: "q-text" }, score + " von " + items.length + " richtig"),
        h("p", { style: "margin-top:10px" }, "Richtig beantwortete Fragen kommen in größeren Abständen wieder."),
        h("button", { class: "btn", type: "button", onclick: goHome }, "Zur Zeitleiste")
      );
    });
  }

  /* ---------- Quiz-Ablauf (Einheit und Wiederholung) ---------- */
  function runQuiz(box, items, finish) {
    var i = 0, score = 0;
    function step() {
      var it = items[i], q = it.q, answered = false;
      advanceFn = null;
      var opts = h("div", { class: "opts" });
      var expl = h("p", { class: "expl", hidden: true });
      var last = i === items.length - 1;
      var next = h("button", {
        class: "btn", type: "button", hidden: true,
        onclick: function () { i++; if (i < items.length) step(); else finish(score); }
      }, last ? "Ergebnis" : "Weiter");
      var buttons = q.o.map(function (label, idx) {
        var b = h("button", { class: "opt", type: "button" }, label);
        b.addEventListener("click", function () {
          if (answered) return;
          answered = true;
          var ok = idx === q.a;
          if (ok) score++;
          buttons.forEach(function (x, j) {
            x.disabled = true;
            if (j === q.a) x.classList.add("right");
            else if (j === idx) x.classList.add("wrong");
          });
          record(it.id, ok);
          tick(ok ? 1 : 2);
          advanceFn = function () { next.click(); };
          expl.textContent = (ok ? "Richtig. " : "Nicht ganz. ") + q.e;
          expl.hidden = false;
          next.hidden = false;
          try { next.focus({ preventScroll: true }); } catch (e) {}
        });
        return b;
      });
      buttons.forEach(function (b) { opts.append(b); });
      box.replaceChildren(
        h("p", { class: "eyebrow" }, (it.u ? "Einheit " + it.u.no + " · " : "") + "Frage " + (i + 1) + " von " + items.length),
        h("h3", { class: "q-text" }, q.q),
        opts, expl, next
      );
    }
    step();
  }

  /* ---------- Wischgesten ----------
     Rechts wischen: zurück zur Zeitleiste. Links wischen: nächste Einheit, im Quiz nach der Antwort: nächste Frage. */
  var sx = null, sy = 0, st = 0, sT = null;
  document.addEventListener("touchstart", function (e) {
    if (e.touches.length !== 1) { sx = null; return; }
    var t = e.touches[0];
    sx = t.clientX; sy = t.clientY; st = Date.now(); sT = e.target;
  }, { passive: true });
  document.addEventListener("touchend", function (e) {
    if (sx === null) return;
    var t = e.changedTouches[0], dx = t.clientX - sx, dy = t.clientY - sy, tg = sT;
    sx = null;
    if (Date.now() - st > 700 || Math.abs(dx) < 70 || Math.abs(dx) < Math.abs(dy) * 2) return;
    if (tg && tg.closest && tg.closest(".chips")) return;
    try { if (String(window.getSelection())) return; } catch (x) {}
    var inQuiz = tg && tg.closest && tg.closest(".quiz");
    if (cur.kind === "home") return;
    if (dx > 0) { state.sw = 1; save(); tick(1); goHome(); return; }   /* nach rechts wischen = zurück */
    if (inQuiz) {
      if (advanceFn) { var f = advanceFn; advanceFn = null; f(); }
      return;
    }
    if (cur.kind !== "unit") return;
    var target = ALL[ALL.indexOf(cur.u) + 1];
    if (!target) return;
    state.sw = 1; save(); tick(1);
    unitView(target, 1, "replace");
  }, { passive: true });

  home("none");
})();
</script>
</html>
