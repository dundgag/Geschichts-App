<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Zeitgerüst"><meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="theme-color" content="#F4EEE2" media="(prefers-color-scheme: light)"><meta name="theme-color" content="#1B1712" media="(prefers-color-scheme: dark)"><meta name="format-detection" content="telephone=no"><link rel="apple-touch-icon" href="apple-touch-icon.png"><script>if("serviceWorker" in navigator&&location.protocol==="https:"){window.addEventListener("load",function(){navigator.serviceWorker.register("sw.js").catch(function(){})})}</script><style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}</style><title>Zeitgerüst</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: eine schmale Lesespalte (max. 640px).
   Startseite = senkrechter Zeitstrahl mit Epochen, Einheit = Lesetext + Quiz. */
:root{
  --font-display:"Iowan Old Style","Palatino Linotype",Palatino,"Book Antiqua",Georgia,"Times New Roman",serif;
  --font-body:Charter,"Iowan Old Style","Bitstream Charter",Georgia,"Times New Roman",serif;
  --font-ui:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --font-mono:ui-monospace,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace;
  --bg:#F8F3E9;
  --surface:#FFFCF5;
  --fg:#2B2620;
  --muted:#6B6154;
  --line:#D9CDB8;
  --accent:#8A3B24;
  --accent-ink:#FFFFFF;
  --mark:#8A3B24;
  --good:#2F7A45;
  --good-bg:#E3EFD9;
  --bad:#A8342B;
  --bad-bg:#F5DFD6;
  --sea:#DCE3DB;
  --land:#EADFC4;
  --coast:#A8977A;
  --grat:rgba(110,90,60,.20);
  --halo:rgba(251,247,238,.92);
  --pgrid:transparent;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#1B1712;
    --surface:#241F18;
    --fg:#EFE6D6;
    --muted:#B8AC98;
    --line:#3A3226;
    --accent:#E3A584;
    --accent-ink:#1B1712;
    --mark:#E3A584;
    --good:#6FCB8E;
    --good-bg:#1D2E1F;
    --bad:#F08E80;
    --bad-bg:#3A201B;
    --sea:#1A211E;
    --land:#2E2A20;
    --coast:#8C7E64;
    --grat:rgba(224,200,160,.14);
    --halo:rgba(27,23,18,.88);
  --pgrid:transparent;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#1B1712;
  --surface:#241F18;
  --fg:#EFE6D6;
  --muted:#B8AC98;
  --line:#3A3226;
  --accent:#E3A584;
  --accent-ink:#1B1712;
  --mark:#E3A584;
  --good:#6FCB8E;
  --good-bg:#1D2E1F;
  --bad:#F08E80;
  --bad-bg:#3A201B;
  --sea:#1A211E;
  --land:#2E2A20;
  --coast:#8C7E64;
  --grat:rgba(224,200,160,.14);
  --halo:rgba(27,23,18,.88);
  --pgrid:transparent;
  color-scheme:dark;
}

*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent}
button,summary,.chip{touch-action:manipulation;-webkit-user-select:none;user-select:none}
body{
  margin:0;
  background:var(--bg);
  color:var(--fg);
  font-family:var(--font-body);
  font-size:18px;
  line-height:1.6;
  padding-block:20px 120px;
  overscroll-behavior-x:none;
  background-image:linear-gradient(var(--pgrid) 1px,transparent 1px),linear-gradient(90deg,var(--pgrid) 1px,transparent 1px);
  background-size:56px 56px;
  background-position:-1px -1px;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
}
.wrap{max-width:640px;margin:0 auto}
h1,h2,h3{font-family:var(--font-display);text-wrap:balance;line-height:1.15;margin:0;font-weight:700}
h1:focus{outline:none}
p{margin:0}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
button{font:inherit;color:inherit}

.eyebrow{font-family:var(--font-mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);line-height:1.4}
.hint{font-size:15px;color:var(--muted)}

/* Startseite */
.head h1{font-size:clamp(42px,12vw,64px);letter-spacing:-.02em;margin-top:8px}
.stat{font-family:var(--font-mono);font-size:12px;color:var(--muted);margin-top:12px}
.today{
  display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px 16px;
  margin-top:22px;padding-block:14px;border-block:1px solid var(--line);
}
.today p{font-size:16px;min-width:0}

.spine{list-style:none;margin:28px 0 0;padding:0 0 0 28px;position:relative}
.spine::before{content:"";position:absolute;left:7px;top:10px;bottom:10px;width:0;border-left:2px dashed var(--coast)}
.node{position:relative;margin:0 0 14px}
.node::before{
  content:"";position:absolute;box-sizing:border-box;left:-27px;top:25px;width:14px;height:14px;border-radius:3px;transform:rotate(45deg);
  background:var(--bg);border:2px solid var(--coast);
}
.node.ready::before{border-color:var(--accent);background:var(--bg)}
.node.done::before{border-color:var(--accent);background:var(--accent)}

.card{background:var(--surface);border:1px solid var(--coast);border-radius:6px;padding:16px 18px;box-shadow:inset 0 0 0 3px var(--surface),inset 0 0 0 4px var(--line)}
.card.planned{background:transparent;border-style:dashed}
.card.planned h2,.card.planned .blurb{color:var(--muted)}
.years{font-family:var(--font-mono);font-size:12px;letter-spacing:.04em;color:var(--mark)}
.card h2{font-size:21px;margin:4px 0 4px}
.blurb{font-size:15px;color:var(--muted);line-height:1.45}
.soon{font-family:var(--font-mono);font-size:12px;color:var(--muted);margin-top:10px}
.units{display:flex;flex-direction:column;gap:8px;margin-top:14px}
.chead{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;align-items:center;width:100%;text-align:left;background:none;border:0;padding:0;margin:0;color:inherit;font:inherit;cursor:pointer;min-height:48px}
.chead .ct{grid-column:1}.chead .chev{grid-column:2;grid-row:1/span 3;width:32px;height:32px;display:grid;place-items:center;border:1px solid var(--line);border-radius:50%;color:var(--accent);font-size:15px;transition:transform .2s ease}
.chead[aria-expanded="true"] .chev{transform:rotate(180deg)}
.chead .cmeta{font-family:var(--font-mono);font-size:12px;color:var(--muted);margin-top:4px}
.cbody[hidden]{display:none}
.ctools{display:flex;justify-content:flex-end;margin-top:20px}
.ctools button{background:none;border:0;color:var(--accent);font:inherit;font-size:15px;text-decoration:underline;text-underline-offset:3px;padding:10px 0;min-height:44px;cursor:pointer}
.urow{
  display:grid;grid-template-columns:1fr auto;gap:2px 12px;align-items:baseline;
  width:100%;text-align:left;padding:12px 14px;min-height:56px;cursor:pointer;
  background:var(--bg);border:1px solid var(--line);border-radius:8px;
}
@media (hover:hover){.urow:hover{border-color:var(--accent)}}
.urow .no,.urow .us{font-family:var(--font-mono);font-size:12px;color:var(--muted)}
.urow .ut{grid-column:1/-1;font-family:var(--font-display);font-weight:600;font-size:17px;line-height:1.3}
.bar{height:4px;background:var(--line);border-radius:2px;overflow:hidden;margin-top:12px}
.bar i{display:block;height:100%;background:var(--accent)}
.foot{margin-top:28px;font-family:var(--font-mono);font-size:12px;color:var(--muted)}

/* Einheit */
.back{background:none;border:0;padding:10px 12px 10px 0;min-height:48px;cursor:pointer;color:var(--accent);font-family:var(--font-display);font-weight:500;font-size:16px}
.uhead{margin-top:6px}
.utitle{font-size:clamp(30px,8vw,42px);letter-spacing:-.015em;margin-top:8px}
.lead{font-size:20px;line-height:1.5;margin-top:16px}
.toc{margin-top:14px;font-family:var(--font-mono);font-size:12px;line-height:1.7;color:var(--muted)}
.sect{margin-top:36px}
.sect>h2{font-size:23px;margin-bottom:14px}
.prose p{margin-bottom:1em;line-height:1.65}
.prose p:last-child{margin-bottom:0}
.tl{display:grid;grid-template-columns:minmax(88px,116px) minmax(0,1fr);gap:16px 16px;margin:0}
.tl dt{font-family:var(--font-mono);font-size:13px;line-height:1.45;color:var(--mark);padding-top:4px;min-width:0;overflow-wrap:break-word}
.tl dd{margin:0;font-size:17px;line-height:1.55;min-width:0}
.tl.reg{grid-template-columns:minmax(100px,136px) minmax(0,1fr)}
.tl.reg dt{font-family:var(--font-display);font-weight:700;font-size:16px;color:var(--accent);padding-top:2px}
.wl{list-style:none;margin:0;padding:0}.wl li{border-bottom:1px solid var(--line)}.wl a{display:block;padding:13px 2px;min-height:24px;color:var(--accent);text-underline-offset:3px;overflow-wrap:anywhere}
.rel{margin:0;padding-left:1.2em}
.rel li{margin-bottom:.5em;padding-left:.2em}
.rel li::marker{color:var(--accent)}
details{border-top:1px solid var(--line);padding-block:12px}
details:last-of-type{border-bottom:1px solid var(--line)}
summary{cursor:pointer;list-style:none;font-family:var(--font-display);font-weight:600;font-size:18px;line-height:1.3;display:flex;gap:12px;min-height:32px;align-items:baseline}
summary::-webkit-details-marker{display:none}
summary::before{content:"+";font-family:var(--font-mono);color:var(--accent);width:1ch;flex:none}
details[open] summary::before{content:"–"}
details p{margin-top:10px;font-size:17px;line-height:1.6}

.quiz{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px}
.q-text{font-size:21px;margin-top:8px}
.opts{display:flex;flex-direction:column;gap:10px;margin-top:16px}
.opt{
  display:block;width:100%;text-align:left;padding:14px 16px;min-height:54px;cursor:pointer;
  background:var(--bg);border:1px solid var(--line);border-radius:12px;font-size:17px;line-height:1.4;
}
@media (hover:hover){.opt:hover:not(:disabled){border-color:var(--accent)}}
.opt:disabled{cursor:default;color:var(--fg)}
.opt.right{border-color:var(--good);background:var(--good-bg)}
.opt.wrong{border-color:var(--bad);background:var(--bad-bg)}
.expl{margin-top:16px;font-size:16px;line-height:1.5}
.quiz .btn{margin-top:16px}
.row{display:flex;flex-wrap:wrap;gap:10px}
.row .btn{margin-top:0}
.btn{
  display:inline-flex;align-items:center;justify-content:center;min-height:50px;padding:0 22px;
  border:1px solid var(--accent);border-radius:12px;background:var(--accent);color:var(--accent-ink);
  font-family:var(--font-display);font-weight:700;font-size:16px;cursor:pointer;
}
.btn.ghost{background:transparent;color:var(--fg);border-color:var(--line)}
.btn:disabled{opacity:.45;cursor:default}

@media (prefers-reduced-motion:no-preference){
  .urow,.opt,.btn,.dbtn,.chip{transition:border-color .15s ease,transform .12s ease,opacity .12s ease}
  .in-r{animation:inr .26s ease-out}
  .in-l{animation:inl .26s ease-out}
  .in-f{animation:inf .22s ease-out}
}
@keyframes inr{from{opacity:0;transform:translateX(28px)}to{opacity:1;transform:none}}
@keyframes inl{from{opacity:0;transform:translateX(-28px)}to{opacity:1;transform:none}}
@keyframes inf{from{opacity:0}to{opacity:1}}
.urow:active,.opt:active:not(:disabled),.btn:active:not(:disabled),.dbtn:active:not(:disabled),.chip:active{transform:scale(.97);opacity:.85}

/* Zusammenhänge */
.xref{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.xbtn,.tstop,.tcard{display:grid;gap:4px;width:100%;text-align:left;background:var(--surface);color:var(--fg);border:1px solid var(--line);border-radius:12px;padding:14px 16px;min-height:48px;cursor:pointer;font:inherit}
.xno{font-family:var(--font-mono);font-size:12px;color:var(--mark)}
.xtt{font-family:var(--font-display);font-weight:700;font-size:17px;color:var(--accent);line-height:1.3}
.xtx{font-size:16px;line-height:1.5}
.xbtn:active,.tstop:active,.tcard:active{transform:scale(.98)}
.chain{list-style:none;margin:0;padding:0;counter-reset:c}
.chain li{position:relative;padding:0 0 18px 40px;counter-increment:c}
.chain li::before{content:counter(c);position:absolute;left:0;top:0;width:28px;height:28px;border-radius:50%;background:var(--accent);color:var(--accent-ink);font:700 14px/28px var(--font-mono);text-align:center}
.chain li::after{content:"";position:absolute;left:13px;top:32px;bottom:4px;width:2px;background:var(--line)}
.chain li:last-child{padding-bottom:0}.chain li:last-child::after{display:none}
.chain .cs{font-weight:700;line-height:1.4}
.chain .cw{margin-top:4px;color:var(--muted);font-size:16px;line-height:1.5}
.chain .cw::before{content:"↓ ";color:var(--mark)}
.think{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px;margin-bottom:14px}
.think .q-text{margin:6px 0 12px}
.think .note{display:block;width:100%;box-sizing:border-box;font:inherit;font-size:17px;line-height:1.5;color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:12px;margin-bottom:12px;resize:vertical}
.think .mh{font-family:var(--font-mono);font-size:12px;color:var(--muted);margin:12px 0 8px}
.model ul{margin:0;padding-left:1.2em}.model li{margin-bottom:.45em;line-height:1.5}
.model li::marker{color:var(--accent)}
.selfchk{display:flex;flex-wrap:wrap;gap:8px}
.selfchk .sc{flex:1 1 90px;margin:0;padding:10px 8px}
.selfchk .sc.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.mcol{display:grid;gap:8px}
.mbtn{display:flex;gap:10px;align-items:flex-start;text-align:left;width:100%;background:var(--bg);color:var(--fg);border:1px solid var(--line);border-radius:10px;padding:12px;min-height:48px;cursor:pointer;font:inherit;font-size:16px;line-height:1.45}
.mbtn .mb{flex:0 0 22px;height:22px;border-radius:50%;border:1px solid var(--line);font:700 12px/20px var(--font-mono);text-align:center}
.mbtn.sel{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent)}
.mbtn.ok{border-color:var(--accent);background:var(--sea)}
.mbtn.ok .mb{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.mbtn.bad{border-color:var(--mark);animation:shk .3s}
@keyframes shk{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
.mmsg{margin-top:12px}
.thread{list-style:none;margin:28px 0 0;padding:0}
.thread li{position:relative;padding:0 0 14px 22px;border-left:3px solid var(--mark);margin-left:6px}
.thread li.rd{border-left-color:var(--accent)}
.threads{margin-top:28px}.threads>h2{font-size:23px;margin-bottom:4px}.threads .hint{margin-bottom:12px}
.tgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.tcard{align-content:space-between}
.tcard .tt{font-family:var(--font-display);font-weight:700;font-size:17px;color:var(--accent);line-height:1.25}
.tcard .tn{font-family:var(--font-mono);font-size:12px;color:var(--muted)}

/* iPhone: Daumenzone unten, Lesefortschritt oben, Chips zum Springen */
.sect{scroll-margin-top:calc(env(safe-area-inset-top,0px) + 14px)}
.chips{display:flex;flex-direction:column;gap:8px;margin-top:20px}
.chips-h{margin:0 0 -2px;font-family:var(--font-mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.chip{display:flex;align-items:baseline;gap:12px;width:100%;text-align:left;min-height:48px;padding:11px 14px;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--fg);font-family:var(--font-display);font-size:16px;font-weight:600;line-height:1.3;cursor:pointer}
.chip .cn{flex:none;font-family:var(--font-mono);font-size:12px;font-weight:500;color:var(--mark);min-width:1.6em}
.swhint{margin-top:10px;font-family:var(--font-mono);font-size:12px;color:var(--muted)}
.dock{
  position:fixed;left:0;right:0;bottom:0;z-index:20;
  padding:10px max(16px,env(safe-area-inset-right,0px)) calc(10px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));
  background:var(--bg);border-top:1px solid var(--line);
}
@supports (backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px)){
  .dock{background:color-mix(in srgb,var(--bg) 84%,transparent);-webkit-backdrop-filter:saturate(1.4) blur(18px);backdrop-filter:saturate(1.4) blur(18px)}
}
.dock-in{max-width:640px;margin:0 auto;display:flex;gap:10px}
.dbtn{
  flex:1;min-width:0;min-height:52px;padding:0 10px;border:1px solid var(--line);border-radius:14px;
  background:var(--surface);color:var(--fg);cursor:pointer;
  font-family:var(--font-display);font-weight:600;font-size:15px;line-height:1.15;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;text-align:center;
}
.dbtn small{font-family:var(--font-mono);font-size:11px;font-weight:500;color:var(--muted);max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dbtn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.dbtn.pri small{color:var(--accent-ink);opacity:.8}
.dbtn:disabled{opacity:.38;cursor:default}
.prog{position:fixed;left:0;top:env(safe-area-inset-top,0px);height:3px;width:0;background:var(--accent);z-index:30;pointer-events:none}

/* Kartenlook: Ozean, Land, Schalter, Kompass */
.head{display:flex;align-items:center;justify-content:space-between;gap:12px}
.head>div{min-width:0}
.dial{flex:none;width:112px;height:112px}
.dial .ring{fill:none;stroke:var(--grat);stroke-width:1}
.dial .seg{fill:none;stroke:var(--line);stroke-width:9}
.dial .seg.on{stroke:var(--accent)}
.dial .star{fill:var(--line)}
.dial .nn{font-family:var(--font-mono);font-size:7px;fill:var(--mark);font-weight:500}
.dial .cnt{font-family:var(--font-display);font-weight:700;font-size:17px;fill:var(--fg)}
.dial .cap{font-family:var(--font-mono);font-size:6.5px;fill:var(--muted);letter-spacing:.06em}
.sw{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;background:none;border:0;padding:6px 0;min-height:46px;cursor:pointer;font-family:var(--font-display);font-weight:600;font-size:16px;color:var(--fg);text-align:left}
.sw .trk{width:52px;height:32px;border-radius:16px;background:var(--line);position:relative;flex:none}
.sw .trk::after{content:"";position:absolute;top:3px;left:3px;width:26px;height:26px;border-radius:50%;background:var(--surface);box-shadow:0 1px 3px rgba(0,0,0,.35)}
.sw[aria-checked="true"] .trk{background:var(--accent)}
.sw[aria-checked="true"] .trk::after{transform:translateX(20px)}
@media (prefers-reduced-motion:no-preference){
  .sw .trk{transition:background .2s ease}
  .sw .trk::after{transition:transform .2s ease}
}
.readrow{margin-top:18px;padding:2px 16px;border:1px solid var(--coast);border-radius:8px;background:var(--surface)}
.filter{padding:2px 0;border-bottom:1px solid var(--line)}
.urow-wrap{display:flex;gap:8px;align-items:stretch}
.urow-wrap .urow{flex:1;min-width:0}
.rchk{flex:none;width:50px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--line);font-size:22px;line-height:1;cursor:pointer;display:flex;align-items:center;justify-content:center}
.rchk.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.urow.is-read .ut{color:var(--muted)}
.allread{font-family:var(--font-mono);font-size:12px;color:var(--good);margin-top:12px}
.map{margin:22px 0 0;border:2px solid var(--coast);border-radius:4px;background:var(--sea);overflow:hidden;box-shadow:0 0 0 4px var(--bg),0 0 0 5px var(--coast)}
.mapsvg{display:block;width:100%;height:auto}
.mapsvg .grat{fill:none;stroke:var(--grat);stroke-width:1;vector-effect:non-scaling-stroke}
.mapsvg .land{fill:var(--land);stroke:var(--coast);stroke-width:1;stroke-linejoin:round;vector-effect:non-scaling-stroke}
.mapsvg .lake{fill:var(--sea);stroke:var(--coast);stroke-width:1;stroke-linejoin:round;vector-effect:non-scaling-stroke}
.mapsvg .mk{fill:var(--mark);stroke:var(--halo);stroke-width:1.5;vector-effect:non-scaling-stroke}

    ["Der Papyrus Edwin Smith: Medizin vor 3600 Jahren", "In dieser Abschrift eines noch älteren Textes (um 1600 v. Chr.) sind 48 Fälle beschrieben, vor allem Verletzungen. Jeder folgt einem festen Schema: Untersuchung, Diagnose, Behandlung. Am Ende steht das Urteil, ob man die Verletzung behandeln kann, versuchen soll oder gar nicht. Der Text ist weitgehend nüchtern und beobachtend. Er zeigt, dass es empirische Medizin schon lange vor den Griechen gab."],
    ["Warum war das Alphabet so wichtig?", "Keilschrift und Hieroglyphen hatten Hunderte Zeichen, Schreiben zu lernen dauerte Jahre und war Beruf einer kleinen Schicht. Ein Alphabet mit etwa 22 Zeichen lässt sich in kurzer Zeit lernen. Ob es allein die Lese- und Schreibfähigkeit ausgeweitet hat, ist unter Fachleuten umstritten. Klar ist aber, dass es Schrift beweglicher und billiger machte und damit für Handel, Literatur und später Verwaltung offener."]
  ],
  quiz: [
    { q: "Wo ist der Beginn von Ackerbau und Viehzucht um 10.000 v. Chr. am besten belegt?", o: ["Im Nildelta allein", "Im Fruchtbaren Halbmond", "In Mitteleuropa", "Am Gelben Fluss allein"], a: 1,

UNITS.u3 = {
  id: "u3",
  title: "Das antike Griechenland: Polis, Demokratie und Perserkriege",
  lead: "Ein Land aus Stadtstaaten, das Politik, Philosophie und Wissenschaft neu erfand. Und warum ein so kleines Gebiet die Welt so stark prägte.",
  body: [
    { h: "Dunkle Jahrhunderte und die Polis", p: [
      "Nach dem Zusammenbruch der mykenischen Palastkultur um 1200 v. Chr. verlor Griechenland Schrift, Fernhandel und große Bauten. Man spricht von den „Dunklen Jahrhunderten“, auch wenn die Forschung heute betont, dass Leben und Handel nie ganz abrissen. Im 8. Jahrhundert v. Chr. ging es wieder aufwärts. Die Griechen übernahmen das phönizische Alphabet, die Epen Ilias und Odyssee, Homer zugeschrieben, wurden aufgeschrieben, und ab 776 v. Chr. (traditionelles Datum) fanden in Olympia regelmäßig Wettkämpfe statt.",
      "Die Landschaft prägte die Politik. Gebirge und Inseln teilen Griechenland in viele kleine Räume. Es entstand kein Einheitsstaat, sondern Hunderte unabhängiger Stadtstaaten, die Poleis (Einzahl: Polis). Eine Polis bestand aus einer Stadt mit Umland, einer Burg (Akropolis) und dem Marktplatz (Agora), auf dem gehandelt und politisiert wurde. Gemeinsame Sprache, Götter, Orakel und die Spiele ließen die Griechen sich als Kulturgemeinschaft fühlen, politisch blieben sie zerstritten.",
      "Weil das Land für die wachsende Bevölkerung zu klein war, gründeten viele Poleis zwischen 750 und 550 v. Chr. Tochterstädte rund um das Mittelmeer und das Schwarze Meer: in Süditalien und Sizilien (Syrakus, Neapel), in Südfrankreich (Marseille) und an der Küste des Schwarzen Meeres. So verbreitete sich griechische Kultur weit über das Mutterland hinaus."
    ]},
    { h: "Athen: der Weg zur Demokratie", p: [
      "In den meisten Poleis herrschte zunächst der Adel. In Athen verschuldeten sich im 7. und 6. Jahrhundert v. Chr. viele Kleinbauern und gerieten in Schuldknechtschaft. Um 594 v. Chr. erhielt Solon den Auftrag, die Krise zu lösen. Er schaffte die Schuldknechtschaft ab, erließ Schulden und teilte die Bürger nach Vermögen in Klassen ein, mit Rechten je nach Klasse. Danach herrschte Peisistratos als Alleinherrscher. Man nannte solche Herrscher Tyrannen, damals noch ohne den heutigen schlechten Klang.",
      "Entscheidend wurde 508/507 v. Chr. die Reform des Kleisthenes. Er teilte die Bürger neu ein, in zehn Stämme (Phylen), die bewusst Stadt, Küste und Binnenland mischten, damit Adelsfamilien ihre regionale Macht verloren. Ein Rat der 500 bereitete Beschlüsse vor, die Volksversammlung (Ekklesia) entschied. Dort durfte jeder Bürger reden und abstimmen. Viele Ämter wurden per Los besetzt, damit nicht nur Reiche und Redegewandte zum Zug kamen. Das Scherbengericht (Ostrakismos) erlaubte es, einen zu mächtigen Politiker für zehn Jahre zu verbannen.",
      "Unter Perikles (ab etwa 460 v. Chr. einflussreich) wurden Ämter bezahlt, sodass auch Ärmere teilnehmen konnten. Das war direkte Demokratie: keine gewählten Vertreter, sondern die Bürger selbst. Aber wer war Bürger? Nur freie, in Athen geborene Männer. Frauen, Sklaven und Zugezogene (Metöken) waren ausgeschlossen, also die Mehrheit der Bewohner."
    ]},
    { h: "Sparta: der Gegenentwurf", p: [
      "Sparta wählte einen anderen Weg. Die Spartiaten eroberten im 8. und 7. Jahrhundert v. Chr. Nachbargebiete und machten die Bevölkerung zu Heloten, unfreien Bauern, die für sie das Land bestellten. Weil die Heloten die Spartiaten zahlenmäßig weit übertrafen, lebte die Elite in dauernder Angst vor Aufständen. Ihre Antwort war ein Staat, der ganz auf Kriegertum ausgerichtet war. Jungen kamen mit sieben Jahren in die staatliche Erziehung (Agoge) und lernten Gehorsam, Härte und Kampf. Spartiaten arbeiteten nicht als Handwerker oder Händler, sie waren Berufssoldaten.",
      "Die Verfassung war eine Mischung: zwei Könige mit vor allem militärischen Aufgaben, ein Rat der Alten (Gerusia), eine Versammlung der Spartiaten und fünf jährlich gewählte Ephoren, die die Könige kontrollierten. Sparta führte den Peloponnesischen Bund an, ein Bündnis zahlreicher Poleis der Halbinsel. Kunst und Philosophie blühten dort kaum, die Heere aber galten als die besten Griechenlands."
    ]},
    { h: "Die Perserkriege", p: [
      "Im Osten war inzwischen ein Riesenreich entstanden. Die Perser unter Kyros II. (gestorben 530 v. Chr.) und Dareios I. beherrschten von Ägypten bis zum Indus das größte Reich, das die Welt bis dahin gesehen hatte, mit Provinzverwaltung (Satrapien) und der Königsstraße. Zu diesem Reich gehörten auch griechische Städte in Kleinasien. 499 v. Chr. erhoben sie sich gegen die Perser, Athen schickte Hilfe. Nach der Niederschlagung des Aufstands wollte Dareios Athen bestrafen.",
      "490 v. Chr. landete ein persisches Heer bei Marathon. Die Athener siegten dort überraschend unter Miltiades. Zehn Jahre später kam Dareios' Sohn Xerxes mit einem riesigen Heer und einer Flotte. 480 v. Chr. hielt eine kleine griechische Streitmacht unter dem Spartanerkönig Leonidas den Engpass bei den Thermopylen mehrere Tage, bevor sie über einen Umgehungspfad umgangen wurde. Athen wurde geräumt und von den Persern niedergebrannt. Aber in der Seeschlacht von Salamis besiegte die von Themistokles vorbereitete griechische Flotte die persische. 479 v. Chr. folgte der Landsieg bei Plataiai.",
      "Für die Griechen wurde das zum Gründungsmythos: freie Bürger gegen den Großkönig. Der Historiker Herodot schrieb darüber das erste große Geschichtswerk. Praktisch folgte eine Machtverschiebung. Athen führte seit 478/477 v. Chr. den Delisch-Attischen Seebund, der die Perser abwehren sollte, sich aber zu einem Herrschaftsinstrument Athens entwickelte."
    ]},
    { h: "Das goldene Zeitalter Athens", p: [
      "Mit den Einnahmen des Seebundes machte Perikles Athen im 5. Jahrhundert v. Chr. zum kulturellen Zentrum. Auf der Akropolis entstand ab 447 v. Chr. der Parthenon. Im Theater führten Aischylos, Sophokles und Euripides Tragödien auf, Aristophanes Komödien. Dort wurden Fragen nach Gerechtigkeit, Schuld und Macht öffentlich verhandelt. In Athen lehrten Philosophen: Sokrates (469–399 v. Chr.), der durch Fragen die Annahmen seiner Gesprächspartner prüfte und wegen angeblicher Gottlosigkeit zum Tode verurteilt wurde; sein Schüler Platon (um 428–348 v. Chr.), der um 387 die Akademie gründete; und Platons Schüler Aristoteles (384–322 v. Chr.), der fast alle Wissensgebiete systematisch ordnete.",
      "Das Entscheidende war eine Haltung. Griechische Denker fragten, wie sich die Welt ohne Götterwillen erklären lässt. Schon im 6. Jahrhundert v. Chr. suchte Thales von Milet nach natürlichen Ursachen, später dachte Demokrit über unteilbare Bausteine der Materie (Atome) nach. In der Medizin trennte Hippokrates von Kos (um 460–370 v. Chr.) die Heilkunst von Magie und Religion. Krankheiten hatten für ihn natürliche Ursachen, und die Aufgabe des Arztes war genaue Beobachtung. Thukydides schrieb Geschichte als Analyse von Ursachen und Macht, nicht als Götter- oder Heldenerzählung."
    ]},
    { h: "Die Grenzen des Modells", p: [
      "Man sollte das Bild nicht verklären. Die athenische Wirtschaft beruhte stark auf Sklavenarbeit, auch in den Silberminen von Laureion. Frauen hatten keine politischen Rechte. Der Seebund wurde ein Machtinstrument, mit dem Athen Verbündete zur Zahlung zwang und Abfallversuche bestrafte. Und die Demokratie war verletzlich: Redegewandte Politiker konnten die Versammlung zu Fehlentscheidungen treiben, und die Verurteilung des Sokrates 399 v. Chr. zeigt, dass Mehrheiten auch ungerecht entscheiden können. Genau darüber haben Platon und Aristoteles später nachgedacht."
    ]}
  ],

  relevance: [
    "Das Wort Demokratie kommt aus dem Griechischen („Herrschaft des Volkes“). Viele Fragen sind bis heute offen: direkte oder repräsentative Demokratie, Schutz von Minderheiten, Rolle von Rednern und Medien.",
    "Wissenschaft als Fragen und Begründen statt Glauben und Tradition hat hier ihre Wurzeln. Viele Fachwörter in Medizin und Naturwissenschaft sind griechisch.",
    "Die Perserkriege prägten das Bild von „Westen“ gegen „Osten“, das bis in heutige Debatten nachwirkt, historisch aber stark vereinfacht ist.",

  deep: [
    ["Wie demokratisch war Athen wirklich?", "Nur ein kleiner Teil der Bewohner hatte das Bürgerrecht. Wer es hatte, war aber ungewöhnlich stark beteiligt. Die Volksversammlung tagte im 4. Jahrhundert v. Chr. etwa vierzigmal im Jahr, Rat und viele Gerichte wurden per Los besetzt, sodass ein durchschnittlicher Bürger im Lauf seines Lebens mehrfach ein Amt übernahm. Für das Scherbengericht verlangte man nach antiken Berichten mindestens 6000 abgegebene Stimmen, damit es gültig war."],
    ["Hippokrates und der Eid", "Unter dem Namen Hippokrates ist eine Sammlung von rund 60 Schriften überliefert, vermutlich von mehreren Autoren. Eine davon argumentiert, die „heilige Krankheit“ (meist Epilepsie) sei nicht göttlich, sondern habe wie jede andere Krankheit natürliche Ursachen. Der berühmte Eid stammt wohl nicht von Hippokrates selbst und wurde im Lauf der Zeit stark umgedeutet. Das Genfer Gelöbnis des Weltärztebundes von 1948 ist seine moderne Nachfolgeform."],
    ["Die Achsenzeit", "Der Philosoph Karl Jaspers beobachtete, dass zwischen etwa 800 und 200 v. Chr. in Griechenland, Indien, China und im Vorderen Orient unabhängig voneinander Denker auftraten, die die Welt grundsätzlich neu deuteten: Sokrates und Platon, Buddha, Konfuzius und Laozi, die Propheten Israels. Er nannte das die Achsenzeit. Ob es wirklich einen gemeinsamen Wandel gab, ist umstritten. Auffällig bleibt die Gleichzeitigkeit."]

UNITS.u4 = {
  id: "u4",
  title: "Alexander und die hellenistische Welt",
  lead: "Wie sich die Griechen selbst zerrieben, Makedonien aufstieg und Alexander in zwölf Jahren die Welt veränderte. Und warum danach eine ganz neue Epoche begann.",
  body: [
    { h: "Der Peloponnesische Krieg (431–404 v. Chr.)", p: [
      "Nach den Perserkriegen wurde Athen zur Seemacht, Sparta blieb die führende Landmacht. Der Historiker Thukydides sah darin den Kern des Konflikts: Sparta fürchtete Athens wachsende Macht und hielt einen Krieg schließlich für unausweichlich. Heute spricht man in der Politik oft von der „Thukydides-Falle“, wenn eine aufsteigende Macht eine etablierte herausfordert. 431 v. Chr. begann der Peloponnesische Krieg zwischen dem Attischen Seebund und dem Peloponnesischen Bund. Er dauerte 27 Jahre.",
      "Perikles' Strategie war defensiv: Die Landbevölkerung zog hinter die Mauern Athens, die Flotte sicherte die Versorgung über See. In der überfüllten Stadt brach 430 v. Chr. eine Seuche aus, die einen großen Teil der Bevölkerung tötete. 429 starb auch Perikles. Thukydides, der selbst erkrankte, beschrieb den Verlauf so genau, dass Mediziner bis heute rätseln, was es war. Es folgten Fehlentscheidungen: Die Sizilische Expedition (415–413 v. Chr.), ein Großangriff auf Syrakus, endete in einer Katastrophe. Sparta baute mit persischem Geld eine Flotte, schlug 405 bei Aigospotamoi die Athener, und 404 kapitulierte Athen. Es folgte eine kurze Gewaltherrschaft der „Dreißig Tyrannen“, danach wurde die Demokratie wiederhergestellt.",
      "Der Krieg erschöpfte ganz Griechenland. Sparta hatte gesiegt, konnte seine Vormacht aber nicht halten. 371 v. Chr. schlug Theben unter Epaminondas die Spartaner bei Leuktra. Die Poleis kämpften weiter gegeneinander, während im Norden eine neue Macht heranwuchs."
    ]},
    { h: "Makedonien steigt auf", p: [
      "Makedonien lag am Rand der griechischen Welt, viele Griechen hielten es für halbbarbarisch, und es war ein Königreich, kein Stadtstaat. Philipp II. (359–336 v. Chr.) machte es zur Großmacht. Er reformierte das Heer: lange Spieße (Sarissen) in dichter Phalanx, schwere Reiterei, Berufssoldaten, Belagerungstechnik. Er nutzte Gold- und Silberminen, schloss Bündnisse und griff ein, wenn die Griechen sich stritten. 338 v. Chr. besiegte er Athen und Theben bei Chaironeia. Der Redner Demosthenes hatte vergeblich vor ihm gewarnt. Philipp einte die Griechen im Korinthischen Bund für einen gemeinsamen Zug gegen Persien. 336 v. Chr. wurde er bei einer Hochzeitsfeier ermordet."
    ]},
    { h: "Alexander der Große (336–323 v. Chr.)", p: [
      "Sein Sohn Alexander war 20 Jahre alt, als er König wurde. Er war von Aristoteles unterrichtet worden und ein hervorragender Reiter und Heerführer. Zunächst sicherte er seine Herrschaft, zerstörte 335 v. Chr. das aufständische Theben und brach 334 v. Chr. nach Asien auf. In vier Jahren schlug er die Perser in drei großen Schlachten: am Granikos (334), bei Issos (333) und bei Gaugamela (331). Dazwischen eroberte er Syrien und Ägypten (332), wo er Alexandria gründete. 330 v. Chr. fiel Persepolis, der persische König Dareios III. wurde auf der Flucht ermordet.",
      "Doch Alexander hörte nicht auf. Er zog weiter nach Baktrien und Sogdien (im heutigen Afghanistan und Zentralasien) und 326 v. Chr. nach Indien, wo er am Hydaspes den König Poros besiegte. Dann meuterte sein erschöpftes Heer, und er musste umkehren. 323 v. Chr. starb er in Babylon mit etwa 32 Jahren, vermutlich an einem Fieber. Die genaue Ursache ist unklar.",
      "Wie bewertet man ihn? Er war ein militärisches Genie, das in kurzer Zeit ein Reich vom Mittelmeer bis nach Indien schuf. Er gründete zahlreiche Städte, versuchte Griechen und Perser zu verbinden und heiratete selbst persische Prinzessinnen (Massenhochzeit von Susa 324 v. Chr.). Er war aber auch ein Eroberer, der Städte wie Theben und Tyros brutal erobern ließ, Gegner hart bestrafte und zuletzt auch gegen eigene Vertraute Gewalt einsetzte. Der Beiname „der Große“ stammt aus der Antike und wird bis heute diskutiert."
    ]},
    { h: "Diadochen und Hellenismus", p: [
      "Nach Alexanders Tod gab es keinen Nachfolger, der das Reich zusammenhielt. Seine Generäle, die Diadochen (Nachfolger), führten jahrzehntelang Kriege. Am Ende standen drei große Reiche: die Ptolemäer in Ägypten, die Seleukiden in Syrien, Mesopotamien und Iran und die Antigoniden in Makedonien. Dazu kamen kleinere Staaten wie Pergamon. Die Zeit von Alexanders Tod (323 v. Chr.) bis zur römischen Eroberung Ägyptens (30 v. Chr.) nennt man Hellenismus.",
      "Typisch war die Verbindung griechischer und orientalischer Kultur. Griechisch wurde als Koine zur Weltsprache zwischen Sizilien und Indien. Die neuen Städte hatten Theater, Sportstätten und Marktplätze nach griechischem Vorbild, aber die Bevölkerung war gemischt. Die Herrscher übernahmen einheimische Traditionen: Die Ptolemäer ließen sich als Pharaonen verehren. Im heutigen Afghanistan und Pakistan entstand das griechisch-baktrische Reich, dort prägte griechische Kunst später die ersten Darstellungen des Buddha (Gandhara-Kunst). Auch das Judentum kam mit der griechischen Welt in Berührung: In Alexandria wurde im 3. und 2. Jahrhundert v. Chr. die hebräische Bibel ins Griechische übersetzt (Septuaginta)."
    ]},
    { h: "Wissenschaft und Medizin in Alexandria", p: [
      "Das Zentrum der hellenistischen Wissenschaft war Alexandria. Die Ptolemäer gründeten um 280 v. Chr. das Museion, eine Forschungsstätte mit Bibliothek, die Gelehrte aus der ganzen Welt anzog. Euklid ordnete um 300 v. Chr. die Geometrie in den „Elementen“, die über 2000 Jahre als Lehrbuch dienten. Archimedes in Syrakus (um 287–212 v. Chr.) fand Hebelgesetze und das Prinzip des Auftriebs. Eratosthenes (um 276–194 v. Chr.) berechnete den Erdumfang erstaunlich genau. Aristarch von Samos vermutete schon, dass die Erde die Sonne umkreist. Das setzte sich nicht durch, weil man keine Beobachtung hatte, die es bewies.",
      "Auch die Medizin machte Fortschritte. In Alexandria erforschten Herophilos und Erasistratos um 300 v. Chr. den menschlichen Körper durch Sektionen. Das war in der Antike selten, weil das Öffnen von Leichen sonst als Tabu galt. Herophilos beschrieb Gehirn, Nerven, Augen und Gefäße genauer als alle vor ihm und unterschied Nerven von Sehnen. Später wurden solche Sektionen wieder aufgegeben, und Wissen ging teilweise verloren. Erst im späten Mittelalter wurden Leichenöffnungen in Europa wieder üblich."
    ]},

      "Roms Aufstieg beendete diese Welt Stück für Stück. 146 v. Chr. wurde Makedonien römische Provinz, im selben Jahr zerstörten römische Truppen Korinth. 133 v. Chr. erbte Rom das Reich von Pergamon. 31 v. Chr. besiegte Oktavian bei Aktium Antonius und Kleopatra VII., die letzte Herrscherin der Ptolemäer, die 30 v. Chr. starb. Ägypten wurde römisch. Die griechische Kultur überlebte dennoch: Rom bewunderte griechische Bildung, Kunst und Philosophie und übernahm sie, und das Oströmische Reich sprach später Griechisch. Man kann sagen, dass Griechenland politisch unterlag, kulturell aber siegte."
    ]}

    ["Thukydides und die Seuche von Athen", "Thukydides beschreibt Fieber, gerötete Augen, einen blutigen Rachen, Husten, Erbrechen, Pusteln und quälenden Durst. Er schildert, dass Ärzte besonders oft starben, weil sie sich ansteckten, und dass die Ordnung zerbrach, weil Menschen Gesetze und Götter nicht mehr achteten. Welche Krankheit es war, ist bis heute umstritten. Genannt werden unter anderem Typhus, Pocken und Masern. Eine Untersuchung von Zähnen aus einem Massengrab nannte 2006 Typhus als Ursache, das Ergebnis ist aber umstritten."],

UNITS.u5 = {
  id: "u5",
  title: "Die römische Republik",
  lead: "Wie aus einer kleinen Stadt am Tiber die Herrin des Mittelmeers wurde. Und warum eine Verfassung, die Alleinherrschaft verhindern sollte, an ihrem eigenen Erfolg zerbrach.",
  body: [
    { h: "Von der Königsstadt zur Republik", p: [
      "Nach der Legende gründete Romulus Rom 753 v. Chr. Archäologisch wuchs die Stadt aus Siedlungen auf den Hügeln am Tiber zusammen, seit dem 10. und 9. Jahrhundert v. Chr. Rom lag günstig: an einer Furt, am Salzhandel, zwischen Etruskern im Norden und Griechen im Süden. Die Etrusker prägten die frühe Stadt, auch die Herrschaft von Königen. Nach der Überlieferung vertrieben die Römer 509 v. Chr. den letzten König, Tarquinius Superbus, und gründeten die Republik („res publica“, die öffentliche Sache).",
      "Die Verfassung beruhte auf der Angst vor Alleinherrschaft. Zwei Konsuln führten für ein Jahr Staat und Heer und konnten sich gegenseitig blockieren. Der Senat, ein Rat ehemaliger Amtsträger, bestimmte faktisch die Politik. Dazu kamen Volksversammlungen und Volkstribune, die die Plebejer, die einfachen Bürger, vor Willkür schützen konnten. In den „Ständekämpfen“ (5. bis 3. Jahrhundert v. Chr.) erkämpften sich die Plebejer Schritt für Schritt Rechte, darunter um 450 v. Chr. die Aufzeichnung der Gesetze in den Zwölf Tafeln und 367 v. Chr. den Zugang zum Konsulat. Den Alltag regelten Familie, Patronage (Schutz gegen Gefolgschaft) und Tradition (mos maiorum)."
    ]},
    { h: "Wie Rom Italien eroberte", p: [
      "Roms Erfolg beruhte weniger auf überlegenen Waffen als auf einem klugen System. Besiegte Gegner wurden nicht vernichtet, sondern zu Verbündeten gemacht. Sie behielten ihre Selbstverwaltung, mussten aber Soldaten stellen und Roms Außenpolitik folgen. Manche erhielten das römische Bürgerrecht, andere nur Teilrechte, und Rom gründete Kolonien auf eroberten Gebieten. Dadurch hatte Rom früh ein riesiges Reservoir an Soldaten. Das Heer bestand aus Bürgern, die ihren eigenen Besitz verteidigten. Rückschläge wie die Plünderung Roms durch Gallier (387 v. Chr.) und die kostspieligen Siege über Pyrrhus von Epirus (280/279 v. Chr.) warfen Rom nicht um. Um 270 v. Chr. beherrschte es ganz Italien bis zur Po-Ebene."
    ]},
    { h: "Die Punischen Kriege", p: [
      "Im westlichen Mittelmeer stand Rom nun der Handelsmacht Karthago gegenüber, einer phönizischen Gründung im heutigen Tunesien. Der Erste Punische Krieg (264–241 v. Chr.) ging um Sizilien. Rom, bis dahin Landmacht, baute eine Flotte und siegte. Sizilien wurde die erste römische Provinz.",
      "Im Zweiten Punischen Krieg (218–201 v. Chr.) griff der karthagische Feldherr Hannibal Rom über die Alpen von Norden an. 216 v. Chr. vernichtete er bei Cannae ein römisches Heer durch eine Umfassung. Zehntausende Römer fielen, die Quellen schwanken. Doch Rom gab nicht auf, hielt die meisten Bundesgenossen und mied Entscheidungsschlachten, bis Publius Cornelius Scipio (später Africanus genannt) den Krieg nach Afrika trug und Hannibal 202 v. Chr. bei Zama schlug.",
      "Im Dritten Punischen Krieg (149–146 v. Chr.) zerstörte Rom Karthago völlig. Cato der Ältere soll damals jede Rede mit der Forderung beendet haben, Karthago müsse zerstört werden. Im selben Jahr 146 fiel Korinth. Rom war nun Herr des westlichen Mittelmeers und griff nach Osten. Es entstanden Provinzen in Sizilien, Sardinien, Spanien, Africa, Makedonien und Griechenland."
    ]},
    { h: "Der Preis des Erfolgs", p: [
      "Die Eroberungen machten Rom reich, aber sie zerstörten das Gleichgewicht im Inneren. Bauern leisteten jahrelang Kriegsdienst, ihre Höfe verfielen, und sie verschuldeten sich. Reiche Römer kauften das Land und bewirtschafteten es mit Sklaven aus den Kriegen (Latifundien). Verarmte Bauern zogen nach Rom und lebten dort von Getreideverteilungen. Gleichzeitig bereicherten sich Senatoren und Steuerpächter in den Provinzen.",
      "Der Volkstribun Tiberius Gracchus wollte 133 v. Chr. mit einer Landreform gegensteuern und wurde von Gegnern im Senat erschlagen. Sein Bruder Gaius versuchte es 123/122 und starb 121. Zum ersten Mal wurde politische Gewalt in Rom offen eingesetzt. Dazu kam, dass Roms Verbündete in Italien, die Soldaten stellten, aber keine Bürgerrechte hatten, 91 bis 88 v. Chr. im Bundesgenossenkrieg aufbegehrten und schließlich das Bürgerrecht bekamen.",
      "Folgenreich war auch die Heeresreform des Marius (107 v. Chr.): Er nahm auch Besitzlose auf. Soldaten wurden Berufssoldaten, die nicht mehr vom Staat, sondern von ihrem Feldherrn versorgt wurden. Wer ihnen Land und Beute verschaffen konnte, hatte ihre Loyalität. So entstanden Privatarmeen ehrgeiziger Männer. 88 v. Chr. marschierte Sulla mit seinen Truppen auf Rom, später ließ er sich zum Diktator ernennen (82–79 v. Chr.) und Gegner listenweise töten (Proskriptionen). 73 bis 71 v. Chr. erhob sich der Gladiator Spartacus mit Zehntausenden Sklaven und wurde blutig niedergeschlagen."
    ]},
    { h: "Caesar und das Ende der Republik", p: [
      "Ab etwa 70 v. Chr. beherrschten drei Männer die Politik: Pompeius, Crassus und Caesar, die 60 v. Chr. ein Bündnis (Triumvirat) schlossen. Gaius Julius Caesar eroberte 58 bis 50 v. Chr. Gallien, wurde reich und berühmt und besaß ein ergebenes Heer. Der Senat verlangte, dass er die Truppen entlässt. 49 v. Chr. überschritt er mit seinen Legionen den Rubikon, die Grenze Italiens, und löste damit einen Bürgerkrieg aus. 48 v. Chr. besiegte er Pompeius bei Pharsalos. Anschließend ließ er sich zum Diktator auf Lebenszeit ernennen.",
      "Am 15. März 44 v. Chr. ermordeten ihn Senatoren um Brutus und Cassius, die die Republik retten wollten. Das Ergebnis war das Gegenteil: ein neuer Bürgerkrieg zwischen Caesars Erben Oktavian und seinem Gefolgsmann Antonius, der 31 v. Chr. bei Aktium endete. Oktavian blieb allein übrig.",
      "Warum scheiterte die Republik? Die Institutionen einer Stadt waren für ein Weltreich zu klein. Die Eliten konkurrierten um Ruhm, Ämter und Provinzen. Soziale Not und Landlosigkeit lieferten Anhänger für Populisten. Und das Heer war nicht mehr dem Staat, sondern seinen Anführern loyal. Historiker streiten, welcher Faktor zählte. Meist verweist man auf das Zusammenspiel."
    ]}

  deep: [
    ["Hannibal und Cannae", "Hannibal (247–183 v. Chr.) überquerte 218 v. Chr. mit Elefanten die Alpen. Cannae gilt bis heute als Lehrbuchbeispiel der Umfassung: Er ließ die Mitte seiner Linie zurückweichen, sodass die Römer vorstießen und von den Flügeln und der Reiterei eingeschlossen wurden. Strategisch scheiterte er trotzdem. Die meisten italischen Bundesgenossen blieben Rom treu, Nachschub kam kaum, und Rom griff Karthago selbst an. Das römische Bündnissystem erwies sich als stärker als sein taktisches Genie."],
    ["Römisches Recht", "Mit den Zwölf Tafeln begann die Verschriftlichung des Rechts. Römische Juristen entwickelten bis in die Kaiserzeit Begriffe wie Eigentum, Vertrag und Haftung. Kaiser Justinian ließ sie im 6. Jahrhundert im Corpus Iuris Civilis sammeln. Dieses Werk wurde im Mittelalter wiederentdeckt und prägt das Recht in weiten Teilen Europas, auch das deutsche Bürgerliche Gesetzbuch, bis heute."],

UNITS.u6 = {
  id: "u6",
  title: "Das römische Kaiserreich: Augustus bis Marc Aurel",
  lead: "Wie Augustus die Republik beendete, ohne es zuzugeben, und was der „römische Friede“ für Millionen Menschen zwischen Britannien und Syrien bedeutete.",
  body: [
    { h: "Augustus und das Prinzipat", p: [
      "Nach Aktium war Oktavian Alleinherrscher, aber er wusste, was Caesar zum Verhängnis geworden war: Wer wie ein König auftritt, wird gestürzt. Also ging er geschickt vor. 27 v. Chr. gab er seine Sondervollmachten dem Senat „zurück“, bekam dafür den Ehrentitel Augustus („der Erhabene“) und behielt, was zählte: den Oberbefehl über die meisten Legionen und die wichtigsten Provinzen. Er nannte sich nicht König, sondern Princeps, „erster Bürger“. Ämter, Senat und Wahlen blieben bestehen, aber alle wichtigen Entscheidungen lagen bei ihm. Diese Ordnung heißt Prinzipat.",
      "Augustus regierte bis 14 n. Chr. und stabilisierte Rom nach hundert Jahren Bürgerkriegen. Er schuf ein stehendes Heer von rund 25 bis 28 Legionen mit Berufssoldaten, vom Kaiser bezahlt, dazu die Prätorianergarde in Rom. Er baute die Stadt um, schuf Feuerwehr und Polizei, ordnete Verwaltung und Steuern in den Provinzen und förderte Dichter wie Vergil und Horaz, die sein Zeitalter verherrlichten. Rom wurde zur Dynastie: Auf Augustus folgten Tiberius, Caligula, Claudius und Nero, bis 68 n. Chr. Nach Neros Tod folgte 69 das „Vierkaiserjahr“, aus dem Vespasian als Sieger hervorging."
    ]},
    { h: "Pax Romana: Frieden und Grenzen", p: [
      "Die Zeit von etwa 27 v. Chr. bis 180 n. Chr. gilt als Pax Romana, römischer Friede. Gemeint ist: Im Inneren gab es kaum noch Bürgerkriege, Straßen und Meere waren relativ sicher, und der Handel blühte. Frieden bedeutete aber nicht, dass nicht gekämpft wurde. An den Grenzen führte Rom ständig Kriege, und der Friede beruhte auf Unterwerfung. Der Historiker Tacitus lässt einen britannischen Anführer sagen, die Römer machten eine Wüste und nennten es Frieden. Es gab also auch die Sicht der Unterworfenen.",
      "Die größte Ausdehnung erreichte das Reich 117 n. Chr. unter Trajan, der Dakien (heutiges Rumänien) erobert hatte und kurzzeitig auch Mesopotamien. Sein Nachfolger Hadrian gab Eroberungen auf und sicherte die Grenzen: In Britannien entstand der Hadrianswall, in Germanien wuchs der Limes zu einer Kette aus Kastellen und Wachtürmen. Ein Rückschlag war 9 n. Chr. die Varusschlacht, in der drei Legionen im Teutoburger Wald von Germanen unter Arminius vernichtet wurden. Rom verzichtete danach darauf, Germanien bis zur Elbe zu erobern."
    ]},
    { h: "Leben im Reich", p: [
      "Im Reich lebten, grob geschätzt, 50 bis 70 Millionen Menschen. Rom selbst hatte vermutlich rund eine Million Einwohner, mehr als jede europäische Stadt danach bis ins 19. Jahrhundert. Getreide kam aus Ägypten und Nordafrika, Öl aus Spanien, Wein aus Gallien. Der Staat verteilte Getreide an Bedürftige und bot Spiele, die der Dichter Juvenal spöttisch „Brot und Spiele“ nannte. Im Kolosseum, 80 n. Chr. eröffnet, fanden Tierhetzen und Gladiatorenkämpfe statt.",
      "Das Reich war durch Straßen (oft werden rund 80.000 Kilometer genannt), Häfen und eine gemeinsame Verwaltung verbunden. Erstaunlich dünn war dabei der Staatsapparat: Die Städte verwalteten sich weitgehend selbst durch lokale Eliten, die Statthalter hatten nur kleine Stäbe. Rom bot den Eliten Aufstiegschancen: Wer sich romanisierte, wurde Bürger. 212 n. Chr. verlieh Kaiser Caracalla (Constitutio Antoniniana) das Bürgerrecht an fast alle freien Reichsbewohner, wohl auch, um die Steuerbasis zu erweitern.",
      "Im Westen entstanden Städte mit Foren, Bädern und Theatern, auch in Germanien: Köln, Trier, Mainz, Augsburg und Regensburg gehen auf römische Gründungen zurück. Latein setzte sich im Westen durch und wurde zur Grundlage von Französisch, Spanisch, Italienisch, Portugiesisch und Rumänisch. Im Osten blieb Griechisch die Verkehrssprache der Gebildeten. Die Wirtschaft beruhte auf Landwirtschaft, Handwerk und Handel, aber auch stark auf Sklaverei. Die meisten Menschen lebten als Bauern und blieben arm."

    { h: "Medizin im Imperium: Galen und die Seuche", p: [
      "Die Römer waren keine großen Erfinder der Wissenschaft, aber gute Organisatoren. Medizinisch überragte alle Galen von Pergamon (129 bis etwa 216 n. Chr.). Er begann als Arzt der Gladiatoren in seiner Heimatstadt, ging nach Rom und wurde Leibarzt von Kaisern, darunter Marc Aurel. Galen führte Tierversuche und Sektionen an Tieren durch, schrieb Hunderte Werke und verband die Säftelehre des Hippokrates (vier Körpersäfte) mit eigenen Beobachtungen. Seine Lehren galten über 1300 Jahre lang als unumstößlich, in Europa und in der islamischen Welt. Weil Leichenöffnungen am Menschen in Rom verboten waren, übertrug er viele Befunde von Tieren auf den Menschen, und manche Fehler hielten sich dadurch jahrhundertelang.",
      "Die römische Armee hatte Lazarette (valetudinaria), Wasser kam über Aquädukte, Abwasser floss durch Kanäle wie die Cloaca Maxima. Trotzdem war die Sterblichkeit hoch, vor allem bei Kindern. 165 bis 180 n. Chr. wütete die Antoninische Pest, vermutlich Pocken, die Soldaten aus dem Osten mitbrachten. Die Opferzahlen sind unsicher, aber sie waren hoch, und die Seuche schwächte das Reich."
    ]},
    { h: "Judentum, Jesus und das frühe Christentum", p: [
      "Judäa, die Heimat der Juden, wurde 6 n. Chr. römische Provinz. Dort wirkte um das Jahr 30 n. Chr. Jesus von Nazaret, ein jüdischer Wanderprediger, der unter dem Statthalter Pontius Pilatus gekreuzigt wurde. Seine Anhänger glaubten an seine Auferstehung und gründeten Gemeinden. Paulus, ein jüdischer Gelehrter, der zum Anhänger wurde, trug die Botschaft in die Städte des Mittelmeerraums und öffnete sie für Nichtjuden. Seine Briefe gehören zu den ältesten Texten des Neuen Testaments.",
      "Das Verhältnis zu Rom war angespannt. Die Christen weigerten sich, den Kaiser als Gott zu verehren und an den Staatsopfern teilzunehmen, und galten deshalb als gefährlich. Nach dem Brand Roms 64 n. Chr. machte Nero sie zu Sündenböcken. Verfolgungen waren aber lange regional und zeitlich begrenzt, reichsweite Verfolgungen gab es erst im 3. Jahrhundert. Das Christentum wuchs trotzdem, getragen von Gemeinden, die Arme, Kranke und Witwen unterstützten und eine Zugehörigkeit unabhängig von Stand und Herkunft anboten.",
      "Für das Judentum brachte die Römerzeit Katastrophen. Nach dem Jüdischen Krieg (66–70 n. Chr.) zerstörten die Römer 70 den Tempel in Jerusalem, nach dem Bar-Kochba-Aufstand (132–135 n. Chr.) wurde Juden der Zutritt zu Jerusalem verboten. Das Judentum entwickelte sich danach als Religion der Schrift und der Synagoge weiter, geprägt vom Rabbinertum, und jüdische Gemeinden lebten in der Diaspora im ganzen Reich."
    ]}

  title: "Spätantike: Krise, Konstantin und das Ende Westroms",
  lead: "Vom Chaos des 3. Jahrhunderts über Konstantin und die Reichsteilung bis 476. Und warum „Untergang“ nur die halbe Wahrheit ist.",
  body: [
    { h: "Die Krise des 3. Jahrhunderts", p: [
      "Zwischen 235 und 284 n. Chr. geriet das Reich an den Rand des Zusammenbruchs. In 50 Jahren gab es über zwanzig Kaiser, fast alle von Soldaten erhoben und meist von Soldaten ermordet („Soldatenkaiser“). Gleichzeitig drohten Gefahren von außen: Im Osten lösten 224 die Sassaniden die Parther ab und führten das Perserreich aggressiver. 260 geriet Kaiser Valerian in persische Gefangenschaft, ein einmaliger Vorgang. Germanische Gruppen brachen über Rhein und Donau ein. Teile des Reichs machten sich selbständig, so das Gallische Sonderreich (260–274) und Palmyra unter Königin Zenobia.",
      "Die Kosten für das Heer trieben die Kaiser zur Münzverschlechterung: Der Silbergehalt der Münzen sank, Preise stiegen, und die Menschen misstrauten dem Geld. Dazu kamen Seuchen, vor allem die Cyprianische Pest um 250. Städte und Reiche verarmten, viele Stadteliten zogen sich zurück. Das System des Prinzipats, das ein wohlhabendes Hinterland voraussetzte, war an seine Grenzen gestoßen."
    ]},
    { h: "Diokletian und die Tetrarchie", p: [
      "Diokletian (284–305), ein Offizier einfacher Herkunft, stabilisierte das Reich mit harten Mitteln. Er erkannte, dass ein Mann allein das Reich nicht lenken kann, und schuf 293 die Tetrarchie, die Herrschaft von vier Männern: zwei Hauptkaiser (Augusti) und zwei Unterkaiser (Caesares), mit jeweils eigenem Gebiet. Er verdoppelte fast die Zahl der Provinzen, trennte zivile und militärische Verwaltung, vergrößerte das Heer und reformierte das Steuersystem. 301 versuchte er mit einem Höchstpreisedikt, die Inflation per Gesetz zu bremsen, was scheiterte. Der Kaiser trat nun als gottähnlicher Herrscher mit Hofzeremoniell auf, nicht mehr als „erster Bürger“.",
      "303 begann unter Diokletian die letzte und härteste Christenverfolgung, wohl auch, weil das Christentum inzwischen groß und organisiert war. 305 dankte Diokletian freiwillig ab und lebte in seinem Palast bei Split. Sein Nachfolgesystem brach rasch in Machtkämpfen zusammen."
    ]},
    { h: "Konstantin und die Wende zum Christentum", p: [
      "Nach Kämpfen mehrerer Thronanwärter setzte sich Konstantin durch. 306 in York zum Kaiser ausgerufen, besiegte er 312 an der Milvischen Brücke bei Rom seinen Rivalen Maxentius. Der Überlieferung nach hatte er vor der Schlacht eine Vision des Kreuzzeichens und stellte sein Heer unter den Schutz des Christengottes. 313 vereinbarte er mit dem Mitkaiser Licinius in Mailand Religionsfreiheit: Das Christentum wurde geduldet, die Kirche erhielt Besitz zurück. 324 besiegte er Licinius und regierte als Alleinherrscher.",
      "Konstantin förderte die Kirche massiv. Er ließ Kirchen bauen (Lateran, Alt-St.-Peter), gab Bischöfen Rechte und berief 325 das Konzil von Nicäa ein, um einen Streit über das Wesen Christi (Arianismus) zu beenden. Dort entstand ein gemeinsames Glaubensbekenntnis. Ob er aus Überzeugung oder aus politischer Berechnung handelte, ist umstritten. Er ließ sich erst kurz vor seinem Tod 337 taufen, was damals nicht unüblich war.",
      "330 weihte er Konstantinopel als neue Hauptstadt am Bosporus ein, an der Stelle des alten Byzantion. Die Stadt war strategisch günstig, leicht zu verteidigen und kontrollierte den Handel zwischen Schwarzem Meer und Mittelmeer. Konstantin schuf außerdem eine stabile Goldmünze, den Solidus, der Jahrhunderte Bestand hatte."
    ]},
    { h: "Vom Christentum zur Staatsreligion", p: [
      "Konstantins Nachfolger setzten die Förderung des Christentums fort, mit einer Ausnahme: Julian (361–363) versuchte, die alten Kulte zu stärken, und wird deshalb „Apostata“, der Abtrünnige, genannt. Nach seinem frühen Tod kehrte man zum christlichen Kurs zurück. 380 erklärte Kaiser Theodosius I. mit dem Edikt von Thessaloniki das nicänische Christentum zur Reichsreligion, in den folgenden Jahren wurden heidnische Kulte verboten.",
      "Die Kirche war nun nicht nur Glaubensgemeinschaft, sondern auch Machtfaktor. Bischöfe übernahmen in den Städten Aufgaben der Verwaltung und der Fürsorge. Wichtige Kirchenlehrer prägten das Denken: Hieronymus übersetzte die Bibel ins Lateinische (Vulgata), Augustinus (354–430) schrieb die „Bekenntnisse“ und „Vom Gottesstaat“. Auch das Mönchtum entstand, zunächst in Ägypten. Zugleich begann die Kirche, mit staatlicher Hilfe Abweichler zu verfolgen. Die Religionsfreiheit von 313 war damit überholt."
    ]},
    { h: "Völkerwanderung und das Ende Westroms", p: [
      "375/376 n. Chr. begann die Völkerwanderung in ihrer folgenreichsten Phase. Die Hunnen, Reiterkrieger aus der Steppe, drängten Goten an die Donau. Die Goten baten um Aufnahme im Reich und wurden schlecht behandelt. 378 vernichteten sie bei Adrianopel ein römisches Heer, Kaiser Valens fiel. 395 starb Theodosius, und das Reich wurde endgültig in einen östlichen und einen westlichen Teil geteilt, die nicht mehr vereinigt wurden.",
      "Im Westen ging es nun bergab. Am 31. Dezember 406 überschritten Vandalen, Sueben und Alanen den zugefrorenen Rhein. 410 plünderte der Westgote Alarich Rom, ein Schock für die Zeitgenossen. Römische Heerführer, oft selbst Germanen, kämpften gegeneinander, während Provinzen verloren gingen: Britannien um 410, Spanien und Gallien Stück für Stück, Nordafrika an die Vandalen (439 Karthago). 451 wehrten Römer und Westgoten auf den Katalaunischen Feldern den Hunnenkönig Attila ab, 455 plünderten Vandalen Rom.",
      "476 setzte der germanische Heerführer Odoaker den letzten westlichen Kaiser Romulus Augustulus ab, einen Jugendlichen. Er schickte die Insignien nach Konstantinopel und regierte Italien selbst. Den Zeitgenossen erschien das kaum als Epochenwende, erst später wurde 476 zum Datum des „Untergangs“.",
      "Warum fiel der Westen, aber nicht der Osten? Der Osten war reicher, städtischer, hatte eine bessere Steuerbasis, kürzere Grenzen und mit Konstantinopel eine Hauptstadt hinter gewaltigen Mauern (ab 413). Der Westen verlor wichtige Steuerprovinzen wie Nordafrika, hatte ein Heer, das stark von germanischen Verbänden abhing, und litt unter ständigem Streit der Heermeister und Usurpatoren."
    ]},
    { h: "Ende oder Wandel?", p: [
      "Ob 476 ein Ende oder ein Wandel war, ist eine der großen Debatten der Geschichtswissenschaft. Auf römischem Boden entstanden germanische Königreiche: der Ostgoten in Italien (unter Theoderich, ab 493 in Ravenna), der Westgoten in Spanien und Südgallien, der Vandalen in Nordafrika, der Franken in Gallien und der Angelsachsen in Britannien. Römische Verwaltung, Recht, Latein und die Kirche überlebten und wurden von den neuen Herrschern genutzt.",
      "Eine Forschungsrichtung (etwa Peter Brown) betont deshalb den Wandel: die „Spätantike“ als eigenständige, kreative Epoche. Eine andere (etwa Bryan Ward-Perkins) betont den Bruch: Funde zeigen, dass Handel, Städte, Keramikproduktion und Lebensstandard im Westen stark sanken. Beides stimmt teilweise. Für Eliten ging vieles weiter, für viele einfache Menschen wurde das Leben ärmer und unsicherer. Der Osten blieb als Byzanz bestehen, und der Westen entwickelte sich zum Mittelalter."
    ]}

UNITS.u8 = {
  id: "u8",
  title: "Das frühe Mittelalter: von Chlodwig zu Otto dem Großen",
  lead: "Wie aus den Trümmern des Weströmischen Reichs ein neues Europa entstand: Klöster, Franken, Karl der Große und die Anfänge des Heiligen Römischen Reichs.",
  body: [
    { h: "Europa nach Rom", p: [
      "Nach 476 bestand die Welt des Westens aus einem Flickenteppich germanischer Königreiche auf römischem Boden. Die Eroberer waren eine kleine Minderheit, die mit Hilfe römischer Beamter und der Kirche regierte. Städte schrumpften, Handel über weite Strecken ging zurück, Bildung wurde seltener. Das Leben verlagerte sich aufs Land. In Ravenna regierte der Ostgote Theoderich (493–526) mit römischen Beratern wie Boethius und Cassiodor.",
      "Im 6. Jahrhundert erschütterten zwei Ereignisse den Raum. Kaiser Justinian versuchte, den Westen zurückzuerobern, und führte 535 bis 554 den Gotenkrieg, der Italien verwüstete. Und 541/542 kam die erste große Pestpandemie, die „Justinianische Pest“, die sehr viele Menschen tötete. 568 drangen die Langobarden in Italien ein und gründeten ein Königreich im Norden."
    ]},
    { h: "Klöster und Mission", p: [
      "In dieser unsicheren Zeit wurden die Klöster zu Inseln der Stabilität. Benedikt von Nursia gründete um 529 das Kloster Monte Cassino und schrieb eine Regel, die das Mönchsleben ordnete: Gebet, Arbeit, Lesen, Gehorsam, gemeinsames Leben. Die Benediktinerregel wurde zum Modell für Europa. In den Klöstern wurden Handschriften abgeschrieben, Felder bewirtschaftet, Kranke gepflegt und Kinder unterrichtet. Ohne die Klöster wären viele antike Texte verloren gegangen.",
      "Papst Gregor der Große (590–604) stärkte das Papsttum und schickte Missionare zu den Angelsachsen. Irische und schottische Mönche zogen aufs Festland, Bonifatius (um 672–754) missionierte in Hessen und Thüringen. Das Christentum breitete sich nördlich der Alpen aus und band Europa an die lateinische Kirche."
    ]},
    { h: "Die Franken steigen auf", p: [
      "Das wichtigste Reich im Westen wurde das der Franken. Chlodwig (481–511), König der Merowinger, einigte die fränkischen Gruppen und eroberte große Teile Galliens. Um 500 ließ er sich mit seinen Kriegern katholisch taufen, die Datierung schwankt zwischen etwa 496 und 508. Anders als viele andere germanische Könige, die Arianer waren, gewann er so die Unterstützung der katholischen Bischöfe und der römischen Bevölkerung.",
      "Später schwächten Erbteilungen die Merowinger, und die Hausmeier, die Verwalter am Hof, übernahmen die Macht. Karl Martell stoppte 732 bei Tours und Poitiers ein arabisches Heer, dessen Bedeutung spätere Autoren stark überhöht haben. Sein Sohn Pippin ließ sich 751 mit Zustimmung des Papstes zum König krönen. Als Gegenleistung half er dem Papst gegen die Langobarden und schenkte ihm Gebiete in Mittelitalien (Pippinische Schenkung 756). Damit war das Bündnis von fränkischem Königtum und Papsttum geschlossen, das Europa über Jahrhunderte prägte, und der Grundstein des Kirchenstaats gelegt."
    ]},
    { h: "Karl der Große", p: [
      "Pippins Sohn Karl (768–814) machte aus diesem Königreich ein Großreich. Er führte fast jedes Jahr Krieg. 774 unterwarf er das Langobardenreich, ab 772 führte er die Sachsenkriege, die bis 804 dauerten. Sie waren besonders grausam. Nach den Reichsannalen ließ er 782 bei Verden an der Aller 4500 Sachsen hinrichten, die Zahl ist umstritten, das Ereignis aber nicht. Die Sachsen wurden zwangschristianisiert. Dazu kamen Eroberungen in Bayern, gegen die Awaren und im Norden Spaniens.",
      "Am Weihnachtstag 800 krönte ihn Papst Leo III. in Rom zum Kaiser. Das war ein Bruch: Im Osten gab es schon einen Kaiser in Konstantinopel, der das als Anmaßung empfand. Karl verstand sich als Schutzherr der Christenheit. Sein Reich reichte vom Atlantik bis zur Elbe und von der Nordsee bis nach Mittelitalien.",
      "Regiert wurde es durch Grafen als königliche Beamte, kontrolliert von Königsboten (missi dominici), und durch Gesetze (Kapitularien). Weil es kaum Städte und Straßen gab, zog der Herrscher mit seinem Hof von Pfalz zu Pfalz, am liebsten nach Aachen, wo er 814 starb."
    ]},
    { h: "Die karolingische Bildungsreform", p: [
      "Karl wollte seine Priester und Beamten besser ausbilden und holte Gelehrte wie Alkuin von York an den Hof. Klöster und Domschulen sollten Lesen und Schreiben lehren. Es entstand eine klare, gut lesbare Schrift, die karolingische Minuskel, aus der sich unsere heutigen Kleinbuchstaben entwickelten. Weil Mönche antike Werke in dieser Schrift abschrieben, sind viele lateinische Texte nur in karolingischen Abschriften erhalten. Man spricht von einer „karolingischen Renaissance“.",
      "Auch die Medizin profitierte. Karl ordnete auf seinen Gütern den Anbau von Heilpflanzen an. Im Kloster Lorsch entstand um 795 das Lorscher Arzneibuch, eine frühe Sammlung medizinischen Wissens, die zum UNESCO-Dokumentenerbe zählt. Klostermedizin beruhte auf antiken Texten (Galen, Hippokrates), Kräuterwissen und Gebet."
    ]},
    { h: "Zerfall und neue Bedrohungen", p: [
      "Karls Sohn Ludwig der Fromme (814–840) konnte das Reich nicht zusammenhalten. Nach fränkischer Sitte sollte geteilt werden, und seine Söhne stritten. Im Vertrag von Verdun 843 wurde das Reich in drei Teile geteilt: ein Westreich (später Frankreich), ein Ostreich (später Deutschland) und ein Mittelreich dazwischen, das bald zerfiel. Die Straßburger Eide von 842 sind die ältesten schriftlichen Zeugnisse des Altfranzösischen und des Althochdeutschen und zeigen, dass sich zwei Sprachräume bildeten.",
      "Gleichzeitig kamen Angreifer von allen Seiten: Wikinger, die ab 793 (Lindisfarne) Küsten und Flüsse plünderten und sich teils ansiedelten (911 Normandie), Sarazenen im Mittelmeer und Ungarn aus der Steppe. Gegen sie schützte nicht mehr der König, sondern der lokale Adel mit Burgen und Gefolgschaften. Die Macht verlagerte sich nach unten. So entstanden Lehnswesen und Grundherrschaft, die das Hochmittelalter prägten (Einheit 11)."
    ]},
    { h: "Otto der Große und das Reich", p: [
      "Im Ostfrankenreich starb 911 die Linie der Karolinger aus. Die Herzöge wählten Könige aus ihrer Mitte, 919 den Sachsen Heinrich I. Sein Sohn Otto I. (936–973) festigte die Königsmacht, schlug 955 auf dem Lechfeld die Ungarn und stützte sich stark auf Bischöfe und Äbte, die er mit Land und Ämtern ausstattete (Reichskirche). Am 2. Februar 962 wurde er in Rom zum Kaiser gekrönt. Das Reich, das daraus entstand, hieß später „Heiliges Römisches Reich“ und bestand bis 1806.",
      "Es war kein Nationalstaat und keine zentrale Monarchie. Der Kaiser war ein gewählter Herrscher mit starken Fürsten, und er beanspruchte zugleich die Führung über Italien und die Christenheit, was zu Konflikten mit dem Papst führte (Einheit 12). Diese Spannung zwischen Kaiser, Fürsten und Papst prägte die deutsche Geschichte für Jahrhunderte."
    ]}
  ],

UNITS.u9 = {
  id: "u9",
  title: "Byzanz und die slawische Welt",
  lead: "Das Römische Reich, das tausend Jahre länger lebte: Byzanz zwischen Persern, Arabern, Slawen und Kreuzfahrern, und seine Spuren in Osteuropa.",
  body: [
    { h: "Ein römisches Reich mit griechischem Gesicht", p: [
      "Das Römische Reich endete 476 nur im Westen. Im Osten lebte es weiter, mit der Hauptstadt Konstantinopel, noch fast tausend Jahre. Die Bewohner nannten sich Römer (Rhomaioi) und ihr Reich das Römische Reich. Der Name „Byzantinisches Reich“ wurde erst im 16. Jahrhundert von westlichen Gelehrten geprägt, nach dem alten Namen der Stadt, Byzantion. Die Sprache wandelte sich: Aus Latein als Amtssprache wurde ab dem 7. Jahrhundert Griechisch.",
      "Konstantinopel war eine der größten Städte der Welt: strategisch am Bosporus gelegen, wo Europa und Asien sich nähern, geschützt von Meer und gewaltigen Landmauern, Drehscheibe des Handels zwischen Schwarzem Meer und Mittelmeer. Der Kaiser (Basileus) galt als von Gott eingesetzt, hatte eine professionelle Verwaltung, ein Steuersystem und eine stabile Goldwährung, den Solidus, der über 600 Jahre lang kaum an Wert verlor. Das machte das Reich reich."
    ]},
    { h: "Justinian: Glanz und Überdehnung", p: [
      "Justinian I. (527–565) wollte das römische Weltreich erneuern. Seine Frau Theodora hatte großen Einfluss. Als 532 beim Nika-Aufstand Teile der Hauptstadt brannten und Justinian fliehen wollte, soll sie ihn zum Bleiben bewegt haben. Der Aufstand wurde blutig niedergeschlagen, danach ließ Justinian die Hagia Sophia bauen (geweiht 537), mit einer Kuppel, die Zeitgenossen wie schwebend erschien.",
      "Seine Feldherren, vor allem Belisar, eroberten das Vandalenreich in Nordafrika (533/534) und in langen Kämpfen Italien (535–554) von den Ostgoten. Parallel ließ er das römische Recht ordnen: Das Corpus Iuris Civilis (529–534) sammelte Gesetze, Rechtsmeinungen und ein Lehrbuch. Doch die Kriege kosteten ein Vermögen und verwüsteten Italien. 541/542 traf die Pest, wohl Yersinia pestis, Konstantinopel und den Mittelmeerraum und riss sehr viele Menschen in den Tod. Nach Justinian war das Reich erschöpft, und die Langobarden eroberten 568 große Teile Italiens."
    ]},
    { h: "Existenzkampf im 7. Jahrhundert", p: [
      "Das 7. Jahrhundert wurde zur Überlebensprobe. Im Krieg gegen die Perser (602–628) verlor das Reich zunächst Syrien, Ägypten und Jerusalem (614). Kaiser Herakleios gelang ab 622 ein Gegenschlag, der die Perser besiegte. Doch beide Reiche waren erschöpft, und aus Arabien kam ein neuer Gegner. Die Araber eroberten zwischen 634 und 642 Syrien, Palästina und Ägypten, die reichsten Provinzen von Byzanz.",
      "Das Reich schrumpfte auf Kleinasien, Teile des Balkans und Südostitaliens. Es überlebte, weil man das Heer neu organisierte: Soldatenbauern in Militärbezirken (Themen) sicherten das Land. Konstantinopel hielt 674–678 und 717–718 arabischen Belagerungen stand, auch mit dem „Griechischen Feuer“, einer Brandwaffe, die selbst auf Wasser brannte. Wäre die Stadt damals gefallen, wäre die arabische Expansion nach Südosteuropa womöglich nicht aufzuhalten gewesen."
    ]},
    { h: "Bilderstreit und Schisma", p: [
      "Im 8. und 9. Jahrhundert erschütterte ein Streit um Bilder das Reich. Die Kaiser verboten ab 726 die Verehrung von Ikonen (Bilderstreit, Ikonoklasmus), weil sie darin Götzendienst sahen, möglicherweise auch beeinflusst vom Islam. Es gab Zerstörungen, Verfolgungen und viel Streit. 843 wurde die Bilderverehrung endgültig wieder erlaubt, bis heute als „Triumph der Orthodoxie“ gefeiert.",
      "Der Streit vertiefte die Entfremdung zwischen Ost und West. Papst und Kaiser in Konstantinopel stritten über Vorrang und Lehre, etwa über das Wort „filioque“ im Glaubensbekenntnis. 1054 verhängten päpstliche Gesandte und der Patriarch von Konstantinopel gegenseitig den Kirchenbann. Das gilt als Datum des Morgenländischen Schismas, der Trennung in römisch-katholische und orthodoxe Kirche. Die Entfremdung hatte aber lange gedauert und wurde erst nach 1204 wirklich unumkehrbar."
    ]},
    { h: "Höhepunkt und Niedergang", p: [
      "Zwischen etwa 867 und 1056 erlebte Byzanz unter der makedonischen Dynastie seine zweite Blüte. Basileios II. (976–1025) eroberte Bulgarien, nachdem er 1014 das bulgarische Heer besiegt hatte (daher „Bulgarentöter“), und das Reich reichte vom Balkan bis nach Armenien. Es war reich, gebildet, mit einer eigenen Rechtsordnung und einer starken Verwaltung. Byzantinische Ärzte sammelten antikes Wissen, gründeten Spitäler und bewahrten die Werke von Hippokrates und Galen.",
      "Der Niedergang begann nach 1025. 1071 schlugen die türkischen Seldschuken das byzantinische Heer bei Manzikert und eroberten bald Anatolien. Der Kaiser bat im Westen um Hilfe, was 1095 zum Aufruf zum ersten Kreuzzug beitrug. Doch die Kreuzfahrer wurden zu unsicheren Verbündeten: 1204 eroberten und plünderten die Teilnehmer des Vierten Kreuzzugs, gelenkt von Venedig, Konstantinopel selbst. Es entstand ein „lateinisches Kaiserreich“. 1261 nahmen die Byzantiner die Stadt zurück, aber das Reich blieb ein Rumpf."
    ]},
    { h: "Byzanz und die slawische Welt", p: [
      "Die Slawen siedelten ab dem 6. Jahrhundert auf dem Balkan. Byzanz missionierte sie. Die Brüder Kyrill und Method aus Thessaloniki entwickelten um 863 eine Schrift für die slawische Sprache und übersetzten Texte. Ihre Schüler schufen daraus die kyrillische Schrift, die heute in Russland, der Ukraine, Bulgarien, Serbien und weiteren Ländern genutzt wird. Bulgarien nahm 864/865 das Christentum an.",
      "988 ließ sich Fürst Wladimir von Kiew taufen und führte die Kiewer Rus', ein Reich ostslawischer Stämme, in den orthodoxen Glauben ein. Auf dieses Erbe beziehen sich heute Ukrainer, Russen und Belarussen, und die Deutung ist politisch umstritten. Klar ist: Die orthodoxe Welt Osteuropas geht auf Byzanz zurück."
    ]},
    { h: "Das Erbe", p: [
      "Byzanz bewahrte antike Literatur und Recht und gab sie weiter. Als 1453 die Osmanen Konstantinopel eroberten, flohen Gelehrte nach Italien und brachten Handschriften mit, die der Renaissance Impulse gaben (Einheit 13). Konstantinopel heißt heute Istanbul. Die Hagia Sophia war Kirche, ab 1453 Moschee, ab 1935 Museum und ist seit 2020 wieder Moschee."
    ]}
  ],

    ["Die Hagia Sophia", "Die „Heilige Weisheit“ wurde 537 geweiht und hat eine Kuppel von rund 31 Metern Durchmesser. Sie war fast tausend Jahre lang die größte Kirche der Welt. Ein Erdbeben ließ die erste Kuppel 558 teilweise einstürzen, danach wurde sie höher wiederaufgebaut. Das Bauwerk steht beispielhaft für die Verbindung von Kaisermacht und Glauben."],
    ["Wie sicher ist das Jahr 1054?", "Im Sommer 1054 legten päpstliche Gesandte unter Kardinal Humbert eine Bannbulle auf den Altar der Hagia Sophia, der Patriarch Michael Kerullarios antwortete mit einem Gegenbann. Allerdings war Papst Leo IX. zu diesem Zeitpunkt schon tot, die Gesandten hatten also streng genommen kein Mandat mehr, und der Bann galt nur den Personen, nicht den Kirchen. Zeitgenossen sahen darin nicht den endgültigen Bruch, sondern einen weiteren Streit. Die tatsächliche Spaltung zog sich über Jahrhunderte."]
