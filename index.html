  "Man sieht, dass Japans Niederlage lange vor den Atombomben absehbar war. Die Führung diskutierte jedoch, ob man die Kapitulation durch einen letzten Schlag erleichtern könnte, und zögerte, die bedingungslose Kapitulation zu akzeptieren. Das Beharren auf der Stellung des Kaisers war ein Streitpunkt. Dass der Kaiser selbst in einer Rundfunkansprache am 15. August 1945 das Ende verkündete, zeigte die Stellung des Kaisers im Staat. Die Debatte, welches Gewicht Atombomben, Sowjetangriff und Blockade jeweils hatten, ist ein Beispiel für schwierige historische Kausalfragen."
]});
addEnd(UNITS.u41, { h: "Die neue Weltordnung genauer: UNO, Menschenrechte, Wirtschaft", p: [
  "Die Vereinten Nationen wurden im Oktober 1945 in San Francisco gegründet. Sie haben mehrere Organe: die Generalversammlung, in der alle Mitglieder je eine Stimme haben, den Sicherheitsrat mit fünf ständigen Mitgliedern mit Vetorecht, das Sekretariat und den Internationalen Gerichtshof in Den Haag. Dazu kommen Sonderorganisationen wie die WHO (Gesundheit, 1948), die UNESCO (Bildung, Kultur), die FAO (Ernährung) und die Weltbank. Die Charta verbietet Gewalt zwischen Staaten, außer zur Selbstverteidigung oder mit Zustimmung des Sicherheitsrates. In der Praxis blockierte das Veto im Kalten Krieg und danach oft Entscheidungen (Einheit 43).",
  "Die Allgemeine Erklärung der Menschenrechte (1948), maßgeblich von Eleanor Roosevelt, René Cassin und anderen formuliert, begründete ein Verständnis, dass Rechte allen Menschen zustehen. Sie ist rechtlich keine bindende Konvention, wirkte aber als Maßstab. 1950 folgte die Europäische Menschenrechtskonvention, 1951 die Genfer Flüchtlingskonvention. Die Genfer Konventionen von 1949 stärkten den Schutz von Zivilisten im Krieg. Das Völkerstrafrecht entwickelte sich weiter: Tribunale für Jugoslawien und Ruanda in den 1990ern, der Internationale Strafgerichtshof (2002).",
  "Wirtschaftlich schuf Bretton Woods ein System fester Wechselkurse mit dem Dollar als Leitwährung, gestützt auf Gold. Es wurde 1971 aufgegeben. Der IWF sollte Länder in Zahlungsproblemen stützen, die Weltbank den Wiederaufbau finanzieren, das GATT (1947) die Zölle senken. Der Welthandel wuchs in den folgenden Jahrzehnten stark. Die Konstruktion zeigt, dass Planer aus den Fehlern von Protektionismus und Abwertungswettläufen der 1930er (Einheit 36) lernten. Die Ordnung begünstigte vor allem die Industrieländer, und viele neue Staaten (Einheiten 45 und 46) fühlten sich benachteiligt, was zu Forderungen nach einer „neuen Weltwirtschaftsordnung“ führte."
]});

addEnd(UNITS.u42, { h: "Wie die Supermächte sich sahen: Bilder, Ängste, Propaganda", p: [
  "Der Kalte Krieg war auch ein Krieg der Bilder. Die USA verstanden sich als Verteidiger der Freiheit, der Marktwirtschaft und des „American Way of Life“. Dahinter stand die Erfahrung, dass Appeasement gegenüber Hitler gescheitert war (Einheit 39); man wollte nicht noch einmal nachgeben. In den frühen 1950er-Jahren steigerte sich die Angst vor kommunistischer Unterwanderung zu einer Hysterie, benannt nach Senator Joseph McCarthy („McCarthyismus“), bei der Menschen wegen vermuteter Sympathien Arbeit verloren. Die Sowjetunion sah sich als Land, das den Faschismus besiegt hatte und vom „imperialistischen“ Westen bedroht wurde. Ihre Propaganda zeichnete den Westen als Ausbeuter, wie umgekehrt der Osten als Unterdrücker dargestellt wurde.",
  "Beide Seiten bauten Feindbilder auf, die Wahrnehmung verzerrten. Der Historiker spricht vom „Sicherheitsdilemma“: Jede Maßnahme, die eine Seite für defensiv hielt, wirkte auf die andere bedrohlich. Die Sowjetunion hatte große Verluste erlitten und bildete einen Sicherheitsgürtel, der im Westen als Expansion verstanden wurde; die USA sicherten Verbündete und Stützpunkte, die in Moskau als Einkreisung galten. Solche Dynamiken kannte man schon vor 1914 (Einheit 33). Man erkennt: Auch ohne Absicht zur Aggression kann Misstrauen in Konfrontation münden.",
  "Der Kalte Krieg spielte sich auch im Alltag ab. In den USA gab es Luftschutzübungen („duck and cover“) und Bunker; in der Sowjetunion Zivilschutz. Kultur wurde politisch: Jazz-Tourneen, Ballett, Filme, Radio Free Europe und der Rias in Berlin. Sport wurde Prestigekampf, Olympia wurde zum Wettstreit der Systeme. Wissenschaftler wurden in den Wettlauf einbezogen. Diese Verflechtung von Politik und Alltag erklärt, warum das Ende des Kalten Krieges 1989–91 das Leben so vieler Menschen beeinflusste (Einheit 44)."
]});
addEnd(UNITS.u42, { h: "Europa wird neu gebaut: Von der Montanunion zur Westbindung", p: [
  "Der europäische Einigungsprozess hatte Wurzeln in der Erfahrung zweier Weltkriege. Der französische Außenminister Robert Schuman legte 1950 einen Plan vor, die Kohle- und Stahlproduktion Frankreichs und Deutschlands unter eine gemeinsame Behörde zu stellen. Kohle und Stahl waren die Grundlage der Rüstung, und wer sie gemeinsam verwaltete, machte Krieg „nicht nur undenkbar, sondern materiell unmöglich“. 1951 gründeten Frankreich, die Bundesrepublik, Italien, Belgien, die Niederlande und Luxemburg die Montanunion. Der Versuch einer gemeinsamen Armee scheiterte 1954 in der französischen Nationalversammlung, doch 1957 folgten die Römischen Verträge mit der Wirtschaftsgemeinschaft.",
  "Für die Bundesrepublik bedeutete die Westbindung Souveränität und Sicherheit, aber auch die Teilung. Adenauer akzeptierte, dass die Einheit vorerst zurückstehen musste; die Opposition (Kurt Schumacher, SPD) kritisierte das. Die Stalin-Note von 1952, die ein neutrales Gesamtdeutschland anbot, wurde abgelehnt; ob sie ernst gemeint war, wird bis heute diskutiert. 1955 erhielt die Bundesrepublik ihre Souveränität, die Bundeswehr entstand 1955/56 mit der Wehrpflicht. Die Wiederbewaffnung war umstritten, auch wegen der Erinnerung an den Krieg.",
  "Das Verhältnis zur Vergangenheit blieb schwierig. 1952 schloss die Bundesrepublik ein Abkommen mit Israel über Wiedergutmachung, gegen starken Widerstand im Land. Viele ehemalige NS-Funktionäre kehrten in Ämter zurück (Einheit 41), und der Frankfurter Auschwitz-Prozess (1963–65) und die 68er-Generation zwangen später zur Auseinandersetzung. Im Vergleich dazu betonte die DDR ihren antifaschistischen Gründungsmythos, was die eigene Verantwortung ebenfalls verdrängte. Beide Gesellschaften brauchten Jahrzehnte, um sich der Geschichte zu stellen (Einheit 40)."
]});

addEnd(UNITS.u43, { h: "Die Kubakrise Tag für Tag: Wie Entscheidungen unter Druck fielen", p: [
  "Die Krise zeigt, wie Menschen unter Zeitdruck und unvollständigen Informationen handeln. Am 16. Oktober 1962 wurde Kennedy über die Raketenfunde informiert und bildete ein Beratergremium (ExComm). Die Optionen reichten vom Luftangriff über die Invasion bis zur Blockade. Die Militärs drängten zum Angriff; Kennedy, geprägt von der Erinnerung an die Fehler von 1914 (er hatte Barbara Tuchmans „August 1914“ gelesen), wählte die Seeblockade, um Zeit zu gewinnen. Am 22. Oktober verkündete er sie im Fernsehen und stellte den Atomkrieg als Möglichkeit dar. Sowjetische Schiffe näherten sich der Blockadelinie und drehten am 24. Oktober ab.",
  "Am 26. Oktober schickte Chruschtschow einen versöhnlichen Brief, am 27. kam eine härtere Forderung (Abzug der US-Raketen aus der Türkei) und ein US-Aufklärungsflugzeug U-2 wurde über Kuba abgeschossen. Kennedy ging auf den ersten Brief ein und bot zusätzlich insgeheim über seinen Bruder Robert den Abbau der Jupiter-Raketen in der Türkei an. Am 28. Oktober gab Chruschtschow nach. Beide Seiten konnten das Ergebnis als Erfolg darstellen, wobei die Geheimzusage lange unbekannt blieb. Später zeigte sich, dass auf Kuba bereits taktische Atomwaffen und über 40.000 sowjetische Soldaten waren, was die US-Planer nicht wussten.",
  "Mehrere Lehren sind gezogen worden. Erstens: Kommunikation muss auch zwischen Gegnern möglich sein (Heißer Draht, 1963). Zweitens: Dem Gegner muss ein Ausweg gelassen werden, ohne Gesichtsverlust. Drittens: Die Gefahr kommt nicht nur von Absicht, sondern von Fehlern und Missverständnissen. Viertens: Gegen Eskalationsdruck können einzelne Menschen mit klarem Kopf entscheidend sein, wie Archipow auf dem U-Boot B-59. Diese Lehren sind bis heute Teil der Sicherheitspolitik, etwa bei Verhandlungen über Rüstungskontrolle (Einheit 44) und in Debatten über nukleare Abschreckung."
]});
addEnd(UNITS.u43, { h: "Vietnam und die Heimatfront: Protest, Medien, Gesellschaft", p: [
  "Der Vietnamkrieg war der erste „Fernsehkrieg“. Bilder von Kämpfen, Verwundeten, dem Napalm-Mädchen (Foto von Nick Ut, 1972) und der Hinrichtung eines Gefangenen in Saigon (1968) erreichten die Wohnzimmer. Berichte über My Lai, wo US-Soldaten 1968 mehrere hundert Zivilisten töteten, erschienen 1969. Die Veröffentlichung der „Pentagon Papers“ 1971 zeigte, dass die Regierung die Öffentlichkeit getäuscht hatte. Das Vertrauen in Politik und Militär sank. Die Wehrpflicht („Draft“) betraf junge Männer und machte den Krieg zum Thema in Familien.",
  "Die Protestbewegung entstand an den Universitäten, verband sich mit der Bürgerrechtsbewegung (Martin Luther King kritisierte den Krieg 1967) und der Gegenkultur. Auch in Europa gingen Studenten auf die Straße, in der Bundesrepublik im Zusammenhang mit der „68er-Bewegung“, die zugleich die Generation der Eltern nach der NS-Vergangenheit befragte (Einheit 42). Die Bewegungen veränderten Gesellschaften: Frauenbewegung, Umweltbewegung, mehr Mitbestimmung. In den USA beschränkte der Kongress nach 1973 die Kriegsvollmachten des Präsidenten (War Powers Resolution) und schaffte die Wehrpflicht ab.",
  "Für die Vietnamesen blieb der Krieg eine Katastrophe, die auch nach 1975 fortwirkte: Wiedervereinigung unter kommunistischer Führung, Umerziehungslager, Flucht von Hunderttausenden („Boat People“), Dioxin-Folgen. Zugleich öffnete sich Vietnam ab 1986 mit der Politik „Đổi mới“ zur Marktwirtschaft und entwickelte sich schnell. 1995 nahmen die USA und Vietnam diplomatische Beziehungen auf. Das Beispiel zeigt, wie sich Feindschaft wandeln kann, aber auch, wie lange Wunden bleiben. Es gibt kein einfaches Urteil, sondern ein Bündel von Erfahrungen auf allen Seiten."
]});

addEnd(UNITS.u44, { h: "Die Menschen hinter den Revolutionen: Wie 1989 möglich wurde", p: [
  "Revolutionen werden von Menschen gemacht, und 1989 war ein Prozess, der lange vorbereitet wurde. In Polen entstand 1980 nach Streiks auf der Danziger Werft die unabhängige Gewerkschaft Solidarność unter Lech Wałęsa, mit zehn Millionen Mitgliedern. Das Regime verhängte 1981 das Kriegsrecht, doch die Bewegung überlebte im Untergrund, gestützt von der Kirche und Papst Johannes Paul II., dessen Besuch 1979 die Polen ermutigte. In der Tschechoslowakei sammelte die Charta 77 um Václav Havel Menschenrechtsaktivisten. In der DDR bildeten sich unter dem Dach der evangelischen Kirche Friedens- und Umweltgruppen. Intellektuelle schrieben von der „Macht der Machtlosen“: Das System lebe davon, dass die Menschen mitspielen; wenn genug aufhören, bricht es zusammen.",
  "1989 beschleunigte sich alles. Im Februar begannen in Polen Gespräche am Runden Tisch, die zu teilfreien Wahlen im Juni führten, bei denen Solidarność fast alle freien Sitze gewann. Ungarn öffnete im Mai den Grenzzaun zu Österreich, im September durften DDR-Flüchtlinge ausreisen. Zehntausende verließen die DDR. Zugleich wuchsen die Montagsdemonstrationen in Leipzig: Am 9. Oktober gingen etwa 70.000 Menschen auf die Straße, und die Sicherheitskräfte griffen nicht ein. Die Entscheidung gegen Gewalt, getroffen von lokalen Verantwortlichen, war ein Wendepunkt. Am 18. Oktober trat Honecker zurück, am 4. November demonstrierten in Berlin Hunderttausende, am 9. November fiel die Mauer. In Prag folgte die „Samtene Revolution“, in Bulgarien und Rumänien kam es zu Umstürzen, in Rumänien blutig.",
  "In China war es anders: Im Juni 1989 ließ die Führung die Studentenproteste auf dem Tian’anmen-Platz von der Armee niederschlagen. Das Beispiel zeigt, dass Machthaber auch anders entscheiden konnten, und erinnert daran, wie offen die Lage war. In China blieb die Partei an der Macht und verband Marktwirtschaft mit politischer Kontrolle. Dass das Ergebnis unterschiedlich ausfiel, hing von Institutionen, Armee, Außenlage und Entscheidungen einzelner ab."
]});
addEnd(UNITS.u44, { h: "Was das Ende des Kalten Krieges bedeutete: Hoffnungen und offene Fragen", p: [
  "Nach 1990 herrschte Optimismus: Der Politologe Francis Fukuyama sprach vom „Ende der Geschichte“, dem Sieg der liberalen Demokratie. Die USA blieben als einzige Supermacht übrig, Abrüstung begann (START-Verträge), Atomwaffen in Kasachstan, Belarus und der Ukraine wurden nach dem Budapester Memorandum (1994) an Russland übergeben, im Gegenzug wurden diesen Ländern Sicherheitsgarantien gegeben. Die NATO nahm 1999 Polen, Tschechien und Ungarn auf, später weitere Staaten. Russland sah darin eine Bedrohung, und die Debatte, ob Zusagen gebrochen wurden, dauert an.",
  "Zugleich zeigte sich, dass das Ende des Konflikts neue Probleme brachte. Staaten zerfielen (Jugoslawien, Teile der Sowjetunion), ethnische Konflikte brachen auf (Tschetschenien, Kaukasus, Balkan), in Afrika und im Nahen Osten fielen Stellvertreter-Finanzierungen weg. Die Globalisierung beschleunigte sich, die Welt wurde wirtschaftlich enger verflochten, mit Gewinnern und Verlierern. Viele ehemals kommunistische Länder durchliefen schwierige Reformen (Einheit 47). Die Hoffnung, dass Demokratie und Marktwirtschaft sich überall durchsetzen würden, erfüllte sich nur teilweise.",
  "Historiker bewerten die Epoche unterschiedlich. Ein Teil betont den Sieg des Westens, ein anderer die innere Schwäche des Ostblocks, ein dritter die Rolle von Individuen und Bürgerbewegungen. Für die Gegenwart ist wichtig, wie unterschiedlich die Erinnerung in Ost und West, in Russland, Polen, Deutschland und den USA ist, und wie sie politische Haltungen prägt. Wer 1989 verstehen will, sollte beides sehen: den Triumph der Freiheit und die Brüche, die der Wandel für viele Menschen bedeutete."
]});

addEnd(UNITS.u45, { h: "Wie Unabhängigkeit erkämpft wurde: Methoden und Gegenmittel", p: [
  "Die Wege zur Unabhängigkeit unterschieden sich erheblich und lassen sich in Typen fassen. Erstens der gewaltlose Massenprotest, wie ihn Gandhi in Indien einsetzte: Boykotte, Streiks, Märsche und zivilen Ungehorsam, die den Kolonialstaat beschäftigten und seine Legitimität untergruben. Zweitens der bewaffnete Befreiungskampf, wie in Indonesien, Vietnam, Algerien oder später Angola, oft als Guerillakrieg gegen eine überlegene Armee. Drittens verhandelte Übergänge, wie in Malaya oder Ghana, in denen Eliten Machtübergabe aushandelten. Viertens der parlamentarische Weg, wie auf Ceylon.",
  "Die Kolonialmächte setzten unterschiedliche Mittel ein: Zugeständnisse, Teile-und-herrsche, Gewalt und Zensur. Großbritannien reagierte in Malaya mit „Umsiedlungsdörfern“, in Kenia mit Lagern (Einheit 46); Frankreich in Vietnam und Algerien mit Armee und Folter; die Niederlande in Indonesien mit „Polizeiaktionen“. Sie scheiterten, weil die Kosten stiegen, die öffentliche Meinung zu Hause sich wandte und internationale Organisationen, die USA und die Sowjetunion Druck ausübten. Auch moralisch verlor der Kolonialismus: Nach dem Kampf gegen Rassenideologie im Zweiten Weltkrieg war es schwer, Herrschaft über Menschen aufgrund ihrer Herkunft zu rechtfertigen.",
  "Man erkennt, dass es nicht ein einziges Muster gab. Der Erfolg hing von der Stärke der Bewegung, von der Entschlossenheit der Kolonialmacht, von Siedlerinteressen und von der internationalen Lage ab. Dort, wo wenige Siedler lebten und Rohstoffinteressen gering waren, war der Rückzug einfacher. Dort, wo Siedlerminderheiten Land und Macht besaßen (Algerien, Kenia, Südafrika, Rhodesien), war er härter. Diese Typologie hilft, spätere Konflikte zu verstehen, etwa die Gewaltgeschichte in Südafrika, Zimbabwe und Algerien."
]});
addEnd(UNITS.u45, { h: "Nach der Fahne: Wirtschaft, Gesundheit und Bildung in den neuen Staaten", p: [
  "Die ersten Jahrzehnte nach der Unabhängigkeit standen im Zeichen von Aufbau und Enttäuschung. Die neuen Regierungen wollten Industrie, Schulen und Krankenhäuser schaffen. Die Alphabetisierung stieg: In Indien wuchs der Anteil der Lesekundigen von etwa 18 Prozent (1951) auf über 70 Prozent heute. Die Lebenserwartung in Entwicklungsländern stieg zwischen 1950 und 1990 um etwa 20 Jahre, vor allem durch Impfungen, sauberes Wasser, Antibiotika und Rückgang der Kindersterblichkeit. Die „Grüne Revolution“ der 1960er-Jahre, mit ertragreichen Weizen- und Reissorten (Norman Borlaug, M. S. Swaminathan), verhinderte Hungersnöte in Indien und Südostasien, hatte aber ökologische und soziale Nebenwirkungen.",
  "Zugleich blieben Armut und Ungleichheit. Viele Länder waren von wenigen Exportprodukten abhängig, deren Preise schwankten. Die Schulden stiegen in den 1970er- und 1980er-Jahren, die Strukturanpassungsprogramme des IWF forderten Kürzungen bei Gesundheit und Bildung, was Kritik auslöste. Der Gesundheitssektor litt unter Mangel an Ärzten (Abwanderung, „Brain Drain“) und Ressourcen. Zugleich gründeten Staaten eigene Institute, medizinische Hochschulen und Impfprogramme. Das Beispiel der Pocken und später der Polio zeigt, was gemeinsame Anstrengung erreichen kann.",
  "Einige Länder zeigen, wie unterschiedlich Entwicklung verlief. Südkorea war 1960 ärmer als viele afrikanische Länder und gehört heute zu den reichsten Staaten der Erde; dahinter standen Landreform, Investitionen in Bildung, staatliche Industriepolitik und Exportorientierung. Indien wuchs langsam bis 1991 und dann schneller. China verzehnfachte sein Einkommen seit 1978. Andere Länder blieben in Konflikten stecken. Aus der Spannbreite folgt, dass koloniales Erbe einflussreich war, aber nicht allein entschied; Politik, Institutionen und internationale Lage prägten die Wege."
]});

addEnd(UNITS.u46, { h: "Nasser, Panarabismus und die Kriege im Nahen Osten", p: [
  "Im Nahen Osten entstand nach 1945 eine neue politische Landschaft. In Ägypten stürzten 1952 „Freie Offiziere“ den König, und Gamal Abdel Nasser wurde zum Gesicht des Panarabismus, der Idee einer Einheit der arabischen Völker. 1956 verstaatlichte er den Suezkanal, was Großbritannien, Frankreich und Israel zum Angriff veranlasste (Suezkrise). Das Ende des Angriffs durch Druck der USA und der Sowjetunion machte Nasser zum Helden der arabischen Welt und zeigte das Ende der alten Kolonialmächte (Einheit 43). Er suchte Hilfe bei der Sowjetunion (Assuan-Staudamm) und war ein Führer der Blockfreien.",
  "Der Sechstagekrieg 1967 war eine Niederlage für Ägypten, Syrien und Jordanien. Israel besetzte Sinai, Gazastreifen, Westjordanland, Ostjerusalem und Golan, und das Thema der „besetzten Gebiete“ und der Flüchtlinge prägt den Konflikt bis heute. Der Panarabismus verlor an Kraft, Islamismus und Nationalismus gewannen. 1973 griffen Ägypten und Syrien am Jom-Kippur an; die arabischen Ölstaaten verhängten ein Ölembargo, der Ölpreis vervierfachte sich, und die Weltwirtschaft geriet in eine Krise. Es zeigte sich, wie sehr Industrieländer von Öl aus der Region abhingen (Einheit 38).",
  "Verhandlungen brachten 1978/79 das Camp-David-Abkommen: Ägypten erkannte Israel an, bekam den Sinai zurück, und Präsident Sadat wurde 1981 von Islamisten ermordet. Zugleich veränderte die Revolution im Iran 1979 die Region: Der Schah wurde gestürzt, Ayatollah Khomeini errichtete eine islamische Republik, die sich gegen die USA wandte. Der Iran-Irak-Krieg (1980–88) kostete Hunderttausende Menschen das Leben und wurde mit Giftgas geführt. Diese Entwicklungen zeigen, dass der Nahe Osten nicht nur durch den Konflikt mit Israel bestimmt wurde, sondern durch viele Linien: Öl, Staatsbildung, Religion, Großmachtinteressen, Gesellschaftswandel."
]});
addEnd(UNITS.u46, { h: "Panafrikanismus, Entwicklung und Verantwortung: Afrika im Wandel", p: [
  "Nach der Unabhängigkeit suchten viele afrikanische Führer einen eigenen Weg. Nkrumah forderte die Einheit des Kontinents („Afrika muss sich vereinen“), Julius Nyerere in Tansania entwarf den „Ujamaa“-Sozialismus mit Dorfgemeinschaften, Léopold Senghor im Senegal verband Dichtung und Politik. Die Organisation für Afrikanische Einheit (1963), seit 2002 Afrikanische Union, sollte Zusammenarbeit fördern. Die Hoffnung auf schnelle Entwicklung wurde oft enttäuscht: Putsche, Einparteienherrschaft und Korruption nahmen zu, die Preise für Rohstoffe fielen, die Schulden stiegen. Bürgerkriege wie in Biafra, Angola, Mosambik, Liberia, Sierra Leone und dem Sudan forderten Millionen Opfer.",
  "Doch das Bild ist nicht einheitlich. Viele Länder erlebten Wachstum, besonders seit den 2000ern; Handys und mobile Zahlungssysteme (M-Pesa in Kenia) sprangen über Festnetzstufen, und eine junge, wachsende Bevölkerung bringt Chancen und Druck. Demokratie breitete sich nach 1990 aus: In Südafrika, Ghana, Senegal, Botswana und Malawi gab es friedliche Machtwechsel. Gesundheitlich war die AIDS-Epidemie besonders schwer: In Südafrika und Botswana sank die Lebenserwartung in den 1990er-Jahren stark. Erst Medikamente (antiretrovirale Therapie), Aufklärung und internationale Programme brachten Fortschritte; die Auseinandersetzung um Patente und bezahlbare Medikamente (Südafrika 2001) ist ein Beispiel für globale Gerechtigkeitsfragen.",
  "Kolonialgeschichte bleibt in der Gegenwart präsent: in Debatten über Rückgabe von Kulturgütern (Benin-Bronzen, Einheit 15), Entschädigung, Erinnerung und Schulbücher. Deutschland erkannte 2021 den Völkermord an Herero und Nama an (Einheit 32), und Belgien, Frankreich und Großbritannien debattieren über ihre Vergangenheit. Wer Geschichte als Zusammenhang versteht, sieht, dass diese Debatten keine bloßen Symbolpolitik sind, sondern Fragen nach Verantwortung, Gerechtigkeit und gemeinsamer Zukunft stellen."
]});

addEnd(UNITS.u47, { h: "Westdeutschland, DDR und die Frage der Erinnerung", p: [
  "Um 1989/90 und seine Folgen zu verstehen, hilft der Blick auf die beiden deutschen Gesellschaften. Die Bundesrepublik hatte durch Westbindung, Wirtschaftswunder, Mitbestimmung und Sozialstaat Stabilität gewonnen, die Auseinandersetzung mit dem Nationalsozialismus kam zögerlich, aber wirkte (Weizsäcker-Rede 1985, Historikerstreit 1986). Die DDR erlebte die Diktatur der SED mit Mauer, Stasi und eingeschränkter Reisefreiheit, aber auch mit sozialer Sicherung, Kinderbetreuung und hoher Frauenerwerbstätigkeit. Die Erfahrungen waren ambivalent: Viele Menschen fanden sich in dem System zurecht, andere litten unter Überwachung und Verfolgung. Rund 250.000 Menschen waren aus politischen Gründen inhaftiert, und die Stasi hatte etwa 90.000 hauptamtliche und rund 170.000 inoffizielle Mitarbeiter.",
  "Nach 1990 wurde die Stasi-Unterlagenbehörde geschaffen, damit Bürger ihre Akten einsehen konnten, ein neues Modell der Aufarbeitung. Es gab Debatten über Schuld und Verantwortung, über „Ostalgie“ und über die Bewertung von Biografien. In Gerichtsverfahren wurden Mauerschützen und Funktionäre verurteilt. Zugleich bleibt umstritten, wie differenziert die DDR beurteilt werden soll: als Unrechtsstaat, in dem es auch Alltag gab. Viele Ostdeutsche empfinden es als Herabsetzung, wenn ihr Leben nur als Unterdrückung beschrieben wird; viele Opfer erwarten zu Recht Anerkennung. Beides zusammenzubringen ist eine Aufgabe der Erinnerungskultur.",
  "Auch die Perspektiven im Westen verdienen Beachtung. Die Einheit kostete über Jahre hunderte Milliarden Euro, die Steuerzahler im Westen und Osten trugen, und löste Debatten um Gerechtigkeit aus. Zugleich profitierten viele Westdeutsche von neuen Märkten. Das Land lernte, dass innere Einheit länger dauert als staatliche. Der Blick auf die Erinnerung zeigt, dass Gesellschaften sich ständig neu verständigen müssen, wer sie sind und wie sie auf ihre Vergangenheit schauen."
]});
addEnd(UNITS.u47, { h: "Europa nach 1990: Erweiterung, Krisen und die Frage der Ordnung", p: [
  "Mit dem Ende des Kalten Krieges stellte sich die Frage nach einer neuen Ordnung Europas. Die EU und die NATO erweiterten sich nach Osten. Die Staaten Mittel- und Osteuropas wollten Sicherheit und Wohlstand, weil sie die sowjetische Dominanz erlebt hatten. Russland wurde Partner in Foren wie dem NATO-Russland-Rat (2002), empfand die Erweiterung aber als Zurückdrängung. Die Spannungen führten zu Konflikten: Georgien 2008, die Annexion der Krim 2014 und der Krieg in der Ostukraine, 2022 der großangelegte Angriff auf die Ukraine. Die Debatten über Ursachen und Verantwortung sind politisch und historisch umkämpft; Historiker verweisen auf russisches Imperium, sowjetisches Erbe, nationale Identitäten und Sicherheitsfragen.",
  "Die EU selbst stand vor Zerreißproben. Die Finanzkrise 2008 und die Euro-Schuldenkrise ab 2010 führten zu harten Sparauflagen in Griechenland, Spanien, Portugal und Irland und zu Streit zwischen „Nord“ und „Süd“. 2015/16 kamen über eine Million Schutzsuchende, vor allem aus Syrien, und die Verteilung wurde ein Streit. Der Brexit 2016/2020 war der erste Austritt eines Mitgliedstaates. Die Pandemie 2020 führte zu einem gemeinsamen Aufbaufonds. Diese Krisen zeigen, dass Integration kein linearer Fortschritt ist, sondern ein Aushandlungsprozess.",
  "Rückblickend stellt sich die Frage nach den Lehren. Die EU hat Frieden zwischen früheren Feinden geschaffen, ein Erfolg, den man leicht unterschätzt, weil Frieden unauffällig ist. Zugleich bleiben Fragen der demokratischen Legitimation, der Verteilung von Lasten und der Gestaltung der Außenpolitik. Historische Beispiele helfen beim Einordnen: Das Reich nach 1648 (Einheit 20), das Konzert der Mächte nach 1815 (Einheit 27) und die Ordnung nach 1945 (Einheit 41) waren jeweils Versuche, Souveränität und Zusammenarbeit zu verbinden. Wer das kennt, kann aktuelle Debatten gelassener und genauer führen. Für sie bietet das Kapitel „Die Welt heute“ den nächsten Schritt."
]});

      ].filter(Boolean));
      var head = h("button", { class: "chead", type: "button", "aria-expanded": open ? "true" : "false", "aria-controls": "cb-" + c.id,
        onclick: function () {
          var on = head.getAttribute("aria-expanded") !== "true";
          head.setAttribute("aria-expanded", on ? "true" : "false");
          body.hidden = !on; tick(1);
          state.open = state.open || {}; state.open[c.id] = on ? 1 : 0; save();
        } },
        h("span", { class: "years ct" }, c.years),
        h("h2", { class: "ct" }, c.title),
        h("span", { class: "blurb ct" }, c.blurb),
        h("span", { class: "cmeta ct" }, doneN + " von " + c.units.length + " gelesen · " + c.units.length + (c.units.length === 1 ? " Einheit" : " Einheiten")),
        h("span", { class: "chev", "aria-hidden": "true" }, "▾"));
      add(card, [head,
        h("div", { class: "bar", role: "img", "aria-label": doneN + " von " + c.units.length + " Einheiten abgeschlossen" }, fill),
        body]);
    } else {
      add(card, [h("p", { class: "years" }, c.years), h("h2", null, c.title), h("p", { class: "blurb" }, c.blurb), h("p", { class: "soon" }, "Folgt")]);
    }
    return h("li", { class: cls }, card);
  }

  function unitRow(u) {
    var d = state.done[u.id], rd = isRead(u);
    var main = h("button", { class: "urow" + (rd ? " is-read" : ""), type: "button", onclick: function () { unitView(u, 1, "push"); } },
      h("span", { class: "no" }, "Einheit " + u.no),
      h("span", { class: "us" }, d ? "Quiz " + d.best + "/" + d.total : "ca. " + u.minutes + " Min."),
      h("span", { class: "ut" }, u.title)
    );
    var chk = h("button", { class: "rchk" + (rd ? " on" : ""), type: "button", "aria-pressed": rd ? "true" : "false",
      "aria-label": "Einheit " + u.no + (rd ? ": als ungelesen markieren" : ": als gelesen markieren"),
      onclick: function () {
        markRead(u, !isRead(u)); tick(1);
        var y = window.scrollY; home("none"); try { window.scrollTo(0, y); } catch (e) {}
      } }, "✓");
    return h("div", { class: "urow-wrap" }, main, chk);
  }

  /* ---------- Einheit ---------- */
  function section(title, content) {
    return h("section", { class: "sect" }, h("h2", null, title), content);
  }
  function dl(rows, cls) {
    return h("dl", { class: cls }, rows.map(function (r) { return [h("dt", null, r[0]), h("dd", null, r[1])]; }));
  }


  /* ---------- Zusammenhänge: Verweise, Ketten, Verständnisaufgaben, Rote Fäden ---------- */
  var THREAD_BY = {};
  if (typeof THREADS !== "undefined") THREADS.forEach(function (t) { THREAD_BY[t.id] = t; });
  function threadsOf(id) {
    var out = [];
    (typeof THREADS !== "undefined" ? THREADS : []).forEach(function (t) {
      t.steps.forEach(function (s, i) { if (s[0] === id) out.push({ t: t, i: i, s: s }); });
    });
    return out;
  }
  function openUnit(u, from) {   /* von einem Verweis aus: nur ein Verlaufseintrag über der Zeitleiste */
    tick(1);
    unitView(u, 1, depth === 0 ? "push" : "replace", from);
  }
  function xrefList(rows, from) {
    return h("ul", { class: "xref" }, rows.map(function (r) {
      var t = UNITS[r[0]];
      if (!t) return null;
      return h("li", null, h("button", { class: "xbtn", type: "button", onclick: function () { openUnit(t, from); } },
        h("span", { class: "xno" }, "Einheit " + t.no),
        h("span", { class: "xtt" }, t.title),
        h("span", { class: "xtx" }, r[1])));
    }));
  }
  function chainNode(steps) {
    return h("ol", { class: "chain" }, steps.map(function (s, i) {
      return h("li", null,
        h("p", { class: "cs" }, s[0]),
        i < steps.length - 1 ? h("p", { class: "cw" }, s[1]) : null);
    }));
  }
  var THINK_LABEL = { why: "Warum?", cmp: "Vergleichen", "if": "Was wäre wenn?" };
  function thinkCard(u, q, i) {
    var key = u.id + "-" + i, saved = state.notes[key] || "", sc = state.sc[key];
    var ta = h("textarea", { class: "note", rows: 3, placeholder: "Deine Antwort in eigenen Worten (optional, bleibt auf diesem Gerät)", "aria-label": "Deine Antwort" });
    ta.value = saved;
    var tmr = 0;
    ta.addEventListener("input", function () {
      clearTimeout(tmr);
      tmr = setTimeout(function () { if (ta.value.trim()) state.notes[key] = ta.value; else delete state.notes[key]; save(); }, 400);
    });
    var model = h("div", { class: "model", hidden: true },
      h("p", { class: "mh" }, "Das gehört in eine gute Antwort"),
      h("ul", null, q.m.map(function (m) { return h("li", null, m); })),
      h("p", { class: "mh", style: "margin-top:14px" }, "Wie nah warst du dran?"));
    var opts = [["Hatte ich", 2], ["Teilweise", 1], ["Noch nicht", 0]];
    var row = h("div", { class: "selfchk", role: "group", "aria-label": "Selbsteinschätzung" });
    function paint() {
      row.querySelectorAll("button").forEach(function (b, j) {
        var on = state.sc[key] === opts[j][1];
        b.classList.toggle("on", on); b.setAttribute("aria-pressed", on ? "true" : "false");
      });
    }
    opts.forEach(function (o) {
      row.append(h("button", { class: "btn ghost sc", type: "button", onclick: function () { state.sc[key] = o[1]; save(); tick(1); paint(); } }, o[0]));
    });
    model.append(row);
    var reveal = h("button", { class: "btn", type: "button", onclick: function () {
      model.hidden = !model.hidden; reveal.textContent = model.hidden ? "Musterantwort zeigen" : "Musterantwort verbergen";
    } }, "Musterantwort zeigen");
    paint();
    return h("div", { class: "think" },
      h("p", { class: "eyebrow" }, THINK_LABEL[q.k] || "Denken"),
      h("h3", { class: "q-text" }, q.q), ta, reveal, model);
  }
  function seeded(id, n) {   /* feste Mischung je Einheit, damit die Aufgabe nach dem Neuladen gleich aussieht */
    var s = 0, a = [], i, j, tmp;
    for (i = 0; i < id.length; i++) s = (s * 31 + id.charCodeAt(i)) % 9973;
    for (i = 0; i < n; i++) a.push(i);
    for (i = n - 1; i > 0; i--) { s = (s * 131 + 17) % 9973; j = s % (i + 1); tmp = a[i]; a[i] = a[j]; a[j] = tmp; }
    var same = a.every(function (v, k) { return v === k; });
    if (same) a.push(a.shift());
    return a;
  }
  function matchCard(u, pairs) {
    var n = pairs.length, order = seeded(u.id, n), pickC = -1, found = {}, cnt = 0;
    var msg = h("p", { class: "hint mmsg", role: "status", "aria-live": "polite" }, "Tippe erst eine Ursache an, dann die passende Folge.");
    var cBtns = [], eBtns = [];
    function mk(txt, onpick) { return h("button", { class: "mbtn", type: "button", onclick: onpick }, h("span", { class: "mb" }), h("span", null, txt)); }
    pairs.forEach(function (p, i) {
      cBtns.push(mk(p[0], function () {
        if (found[i] !== undefined) return;
        pickC = pickC === i ? -1 : i;
        cBtns.forEach(function (b, k) { b.classList.toggle("sel", k === pickC); });
        msg.textContent = pickC < 0 ? "Tippe erst eine Ursache an, dann die passende Folge." : "Welche Folge passt dazu?";
      }));
    });
    order.forEach(function (oi) {
      var b = mk(pairs[oi][1], function () {
        if (pickC < 0) { msg.textContent = "Wähle zuerst links oben eine Ursache."; return; }
        if (b.classList.contains("ok")) return;
        if (pickC === oi) {
          cnt++; found[oi] = cnt;
          [cBtns[oi], b].forEach(function (x) { x.classList.remove("sel"); x.classList.add("ok"); x.querySelector(".mb").textContent = String(cnt); });
          pickC = -1; tick(1);
          if (cnt === n) { msg.textContent = "Alles richtig zugeordnet."; state.mt[u.id] = 1; save(); }
          else msg.textContent = "Richtig. Weiter mit der nächsten Ursache.";
        } else {
          tick(2); b.classList.add("bad");
          setTimeout(function () { b.classList.remove("bad"); }, 450);
          msg.textContent = "Das passt nicht ganz. Überlege, was direkt aus der Ursache folgt.";
        }
      });
      eBtns.push(b);
    });
    var body = h("div", { class: "think match" },
      h("p", { class: "eyebrow" }, "Ursache und Folge zuordnen"),
      h("h3", { class: "q-text" }, "Was führt zu was?"),
      h("p", { class: "mh" }, "Ursachen"), h("div", { class: "mcol" }, cBtns),
      h("p", { class: "mh" }, "Folgen"), h("div", { class: "mcol" }, eBtns),
      msg);
    if (state.mt[u.id]) msg.textContent = "Schon einmal gelöst. Du kannst es noch einmal versuchen.";
    return body;
  }

  function threadView(t, dir, mode) {
    cur = { kind: "thread", t: t };
    if (mode === "push" || mode === "replace") pushView(mode, { k: "thread", id: t.id });
    setProg(false);
    var steps = t.steps.map(function (s, i) {
      var u = UNITS[s[0]];
      return h("li", { class: isRead(u) ? "rd" : "" },
        h("button", { class: "tstop", type: "button", onclick: function () { tick(1); unitView(u, 1, "push", t.id); } },
          h("span", { class: "xno" }, "Station " + (i + 1) + " · Einheit " + u.no + (isRead(u) ? " · gelesen" : "")),
          h("span", { class: "xtt" }, u.title),
          h("span", { class: "xtx" }, s[1])));
    });
    show(h("div", { class: "wrap" },
      h("button", { class: "back", type: "button", onclick: goHome }, "‹ Zeitleiste"),
      h("header", { class: "uhead" },
        h("p", { class: "eyebrow" }, "Roter Faden · " + t.steps.length + " Stationen"),
        h("h1", { class: "utitle" }, t.title),
        h("p", { class: "lead" }, t.blurb)),
      h("ol", { class: "thread" }, steps)
    ), dir);
    setDock([dbtn("Zeitleiste", "", goHome, "")]);
  }
  function threadList() {
    if (typeof THREADS === "undefined") return null;
    return h("section", { class: "threads", id: "threads", "aria-label": "Rote Fäden" },
      h("h2", null, "Rote Fäden"),
      h("p", { class: "hint" }, "Ein Thema durch alle Epochen verfolgen."),
      h("div", { class: "tgrid" }, THREADS.map(function (t) {
        var n = t.steps.filter(function (s) { return isRead(UNITS[s[0]]); }).length;
        return h("button", { class: "tcard", type: "button", onclick: function () { tick(1); threadView(t, 1, "push"); } },
          h("span", { class: "tt" }, t.title),
          h("span", { class: "tn" }, n + " von " + t.steps.length + " gelesen"));
      })));
  }

  function unitView(u, dir, mode, from) {
    cur = { kind: "unit", u: u, from: from };
    if (mode === "push" || mode === "replace") pushView(mode, from ? { k: "unit", id: u.id, f: from } : { k: "unit", id: u.id });
    var L = (typeof LINKS !== "undefined" && LINKS[u.id]) || null;
    var idx = ALL.indexOf(u), prev = ALL[idx - 1], next = ALL[idx + 1];
    var box = h("section", { class: "quiz", "aria-live": "polite" });
    var kids = [
      h("button", { class: "back", type: "button", onclick: from && THREAD_BY[from] ? goBack : goHome }, from && THREAD_BY[from] ? "‹ " + THREAD_BY[from].title : "‹ Zeitleiste"),
      h("header", { class: "uhead" },
        h("p", { class: "eyebrow" }, "Einheit " + u.no + " · " + u.chapter.title + " · ca. " + u.minutes + " Min. Lesezeit"),
        h("h1", { class: "utitle" }, u.title),
        h("p", { class: "lead" }, u.lead),
        h("div", { class: "readrow" }, mkSwitch(isRead(u), isRead(u) ? "Gelesen" : "Nicht gelesen", function (on, btn) {
          markRead(u, on);
          btn.querySelector(".slab").textContent = on ? "Gelesen" : "Nicht gelesen";
        })),
        ttsBar(u),
        mapFig(u),
        u.body ? h("nav", { class: "chips", "aria-label": "Springe zu einem Abschnitt" },
          h("p", { class: "chips-h" }, "In dieser Einheit"),
          u.body.map(function (b, i) {
            return h("button", { class: "chip", type: "button", onclick: function () {
              var el = document.getElementById("s-" + i);
              if (el) { try { el.scrollIntoView({ behavior: "smooth", block: "start" }); } catch (e) { el.scrollIntoView(); } }
            } }, h("span", { class: "cn" }, String(i + 1)), h("span", null, b.h));
          })) : null
      )
    ];
    if (L && L.back && L.back.length) kids.push(section("Das kennst du schon", [h("p", { class: "hint", style: "margin-bottom:12px" }, "Darauf baut diese Einheit auf. Tippe, um nachzuschlagen."), xrefList(L.back, from)]));
    (u.body || []).forEach(function (b, i) {
      kids.push(h("section", { class: "sect prose", id: "s-" + i }, h("h2", null, b.h), b.p.map(function (t) { return h("p", null, t); })));
    });
    if (L && L.chain && L.chain.length) kids.push(section("Eins führt zum anderen", [h("p", { class: "hint", style: "margin-bottom:12px" }, "Die Kette dieser Einheit: Jeder Schritt hat einen Grund."), chainNode(L.chain)]));
    if (L && L.fwd && L.fwd.length) kids.push(section("Das wirkt weiter", [h("p", { class: "hint", style: "margin-bottom:12px" }, "Hier taucht das Thema wieder auf."), xrefList(L.fwd, from)]));
    if (u.people) kids.push(section("Schlüsselbegriffe und Personen", dl(u.people, "tl reg")));
    if (u.timeline) kids.push(section("Die wichtigsten Daten", dl(u.timeline, "tl")));
    if (u.parallel) kids.push(section("Gleichzeitig in der Welt", dl(u.parallel, "tl reg")));
    if (u.relevance) kids.push(section("Warum das heute zählt", h("ul", { class: "rel" }, u.relevance.map(function (t) { return h("li", null, t); }))));
    if (u.deep) {
      kids.push(h("section", { class: "sect" },
        h("h2", null, "Vertiefung"),
        h("p", { class: "hint", style: "margin-bottom:12px" }, "Für Tage mit mehr Zeit."),
        u.deep.map(function (d) { return h("details", null, h("summary", null, d[0]), h("p", null, d[1])); })
      ));
    }
    var ths = threadsOf(u.id);
    if (ths.length) kids.push(section("Rote Fäden in dieser Einheit", h("ul", { class: "xref" }, ths.map(function (x) {
      return h("li", null, h("button", { class: "xbtn", type: "button", onclick: function () {
        tick(1);
        if (from === x.t.id) goBack(); else threadView(x.t, 1, depth === 0 ? "push" : "replace");
      } }, h("span", { class: "xno" }, "Station " + (x.i + 1) + " von " + x.t.steps.length), h("span", { class: "xtt" }, x.t.title), h("span", { class: "xtx" }, x.s[1])));
    }))));
    if (L && L.think) {
      var tk = [h("p", { class: "hint", style: "margin-bottom:12px" }, "Zum Verstehen, nicht zum Abfragen. Erst selbst überlegen, dann die Musterantwort ansehen.")];
      L.think.forEach(function (q, i) { tk.push(thinkCard(u, q, i)); });
      if (L.match) tk.push(matchCard(u, L.match));
      kids.push(section("Verstehen statt Auswendiglernen", tk));
    }
    kids.push(section("Kurzer Check", box));
    if (WIKI[u.id]) kids.push(section("Weiterlesen auf Wikipedia", h("ul", { class: "wl" }, WIKI[u.id].map(function (w) {
      return h("li", null, h("a", { href: w[1], target: "_blank", rel: "noopener" }, w[0] + " ↗"));
    }))));
    show(h("div", { class: "wrap" }, kids), dir);
    setProg(true);
    setDock([
      dbtn("‹ Zurück", prev ? "Einheit " + prev.no : "", function () { unitView(prev, -1, "replace", from); }, "", !prev),
      dbtn("Zeitleiste", u.no + " / " + ALL.length, goHome, ""),
      dbtn("Weiter ›", next ? "Einheit " + next.no : "", function () { markRead(u, true, true); unitView(next, 1, "replace", from); }, "pri", !next)
    ]);
    quizStart(box, u);
  }

  function quizStart(box, u) {
    var d = state.done[u.id];
    box.replaceChildren(
      h("p", null, d
        ? "Letztes Ergebnis: " + d.last + " von " + d.total + " richtig. Bestes Ergebnis: " + d.best + "."
        : u.quiz.length + " Fragen zur Einheit. Falsch beantwortete Fragen kommen in der Wiederholung früher wieder."),
      h("button", { class: "btn", type: "button", onclick: function () { unitQuiz(box, u); } }, d ? "Quiz wiederholen" : "Quiz starten")
    );
  }

  function unitQuiz(box, u) {
    var items = u.quiz.map(function (q, i) { return { id: u.id + "-" + i, q: q }; });
    runQuiz(box, items, function (score) {
      var prev = state.done[u.id], total = items.length;
      state.done[u.id] = { last: score, best: Math.max(score, prev ? prev.best : 0), total: total, at: Date.now() };
      state.read[u.id] = true;
      save();
      var nxt = ALL[ALL.indexOf(u) + 1];
      box.replaceChildren(
        h("h3", { class: "q-text" }, score + " von " + total + " richtig"),
        h("p", { style: "margin-top:10px" }, score === total
          ? "Alles richtig. Die Fragen kommen später noch einmal zur Wiederholung."
          : "Die falsch beantworteten Fragen kommen bald in der Wiederholung wieder."),
        h("div", { class: "row", style: "margin-top:16px" },
          nxt ? h("button", { class: "btn", type: "button", onclick: function () { markRead(u, true, true); unitView(nxt, 1, "replace"); } }, "Nächste Einheit") : null,
          h("button", { class: nxt ? "btn ghost" : "btn", type: "button", onclick: goHome }, "Zur Zeitleiste")
        ),
        nxt ? null : h("p", { class: "hint", style: "margin-top:14px" }, "Weitere Einheiten folgen.")
      );
    });
  }

  /* ---------- Wiederholung ---------- */
  function startReview() {
    var items = dueItems().sort(function (a, b) { return state.q[a.id].due - state.q[b.id].due; }).slice(0, 10);
    if (!items.length) { home("none"); return; }
    cur = { kind: "review" };
    pushView("push", { k: "review" });
    setProg(false);
    var box = h("section", { class: "quiz", "aria-live": "polite" });
    setDock([dbtn("Zeitleiste", "", goHome, "")]);
    show(h("div", { class: "wrap" },
      h("button", { class: "back", type: "button", onclick: goHome }, "‹ Zeitleiste"),
      h("header", { class: "uhead", style: "margin-bottom:20px" },
        h("p", { class: "eyebrow" }, "Wiederholung"),
        h("h1", { class: "utitle" }, "Das Wichtige festigen")
      ),
      box
    ), 1);
    runQuiz(box, items, function (score) {
      box.replaceChildren(
        h("h3", { class: "q-text" }, score + " von " + items.length + " richtig"),
        h("p", { style: "margin-top:10px" }, "Richtig beantwortete Fragen kommen in größeren Abständen wieder."),
        h("button", { class: "btn", type: "button", onclick: goHome }, "Zur Zeitleiste")
      );
    });
  }

  /* ---------- Quiz-Ablauf (Einheit und Wiederholung) ---------- */
  function runQuiz(box, items, finish) {
    var i = 0, score = 0;
    function step() {
      var it = items[i], q = it.q, answered = false;
      advanceFn = null;
      var opts = h("div", { class: "opts" });
      var expl = h("p", { class: "expl", hidden: true });
      var last = i === items.length - 1;
      var next = h("button", {
        class: "btn", type: "button", hidden: true,
        onclick: function () { i++; if (i < items.length) step(); else finish(score); }
      }, last ? "Ergebnis" : "Weiter");
      var buttons = q.o.map(function (label, idx) {
        var b = h("button", { class: "opt", type: "button" }, label);
        b.addEventListener("click", function () {
          if (answered) return;
          answered = true;
          var ok = idx === q.a;
          if (ok) score++;
          buttons.forEach(function (x, j) {
            x.disabled = true;
            if (j === q.a) x.classList.add("right");
            else if (j === idx) x.classList.add("wrong");
          });
          record(it.id, ok);
          tick(ok ? 1 : 2);
          advanceFn = function () { next.click(); };
          expl.textContent = (ok ? "Richtig. " : "Nicht ganz. ") + q.e;
          expl.hidden = false;
          next.hidden = false;
          try { next.focus({ preventScroll: true }); } catch (e) {}
        });
        return b;
      });
      buttons.forEach(function (b) { opts.append(b); });
      box.replaceChildren(
        h("p", { class: "eyebrow" }, (it.u ? "Einheit " + it.u.no + " · " : "") + "Frage " + (i + 1) + " von " + items.length),
        h("h3", { class: "q-text" }, q.q),
        opts, expl, next
      );
    }
    step();
  }

  /* ---------- Wischgesten ----------
     Rechts wischen: zurück zur Zeitleiste. Links wischen: nächste Einheit, im Quiz nach der Antwort: nächste Frage. */
  var sx = null, sy = 0, st = 0, sT = null;
  document.addEventListener("touchstart", function (e) {
    if (e.touches.length !== 1) { sx = null; return; }
    var t = e.touches[0];
    sx = t.clientX; sy = t.clientY; st = Date.now(); sT = e.target;
  }, { passive: true });
  document.addEventListener("touchend", function (e) {
    if (sx === null) return;
    var t = e.changedTouches[0], dx = t.clientX - sx, dy = t.clientY - sy, tg = sT;
    sx = null;
    if (Date.now() - st > 700 || Math.abs(dx) < 70 || Math.abs(dx) < Math.abs(dy) * 2) return;
    try { if (String(window.getSelection())) return; } catch (x) {}
    if (cur.kind === "home") return;
    if (tg && tg.closest && tg.closest("textarea")) return;
    if (dx > 0) { tick(1); goBack(); }   /* nach rechts wischen = zurück; sonst nichts per Wisch */
  }, { passive: true });

  home("none");
})();
</script>
</html>
