UNITS.u43 = {
  id: "u43",
  title: "Heiße Konflikte im Kalten Krieg: Korea, Kuba, Vietnam",
  lead: "Wie die Supermächte Konflikte an den Rändern austrugen, warum die Kubakrise die Welt an den Abgrund brachte und was die Kriege für die beteiligten Gesellschaften bedeuteten.",
  body: [
    { h: "Korea und China: der Kalte Krieg wird heiß", p: [
      "1949 siegten die Kommunisten unter Mao in China (Einheit 38), Chiang Kai-shek floh nach Taiwan, und die Volksrepublik China wurde ausgerufen. Für die USA war das ein Schock: Das bevölkerungsreichste Land der Erde schien auf die Seite der Sowjetunion gewechselt zu sein. Korea, 1945 an der 38. Breitengrad geteilt, lieferte den ersten heißen Konflikt. Im Juni 1950 griff das kommunistische Nordkorea unter Kim Il-sung Südkorea an, mit Zustimmung Stalins. Ein UN-Mandat erlaubte den Einsatz unter US-Führung, möglich, weil die Sowjetunion den Sicherheitsrat boykottiert hatte und kein Veto einlegte. Als die UN-Truppen bis zur chinesischen Grenze vorrückten, griff China ein.",
      "Der Krieg erstarrte um den 38. Breitengrad und endete 1953 mit einem Waffenstillstand, nicht mit einem Friedensvertrag. Etwa drei Millionen Menschen starben, mehrheitlich Zivilisten. Korea blieb geteilt, bis heute. Der Süden entwickelte sich nach autoritären Jahrzehnten zu einer Demokratie und Industrienation, der Norden zu einer abgeschotteten Diktatur mit Atomwaffen. Das Beispiel zeigt, wie eine Teilung, die als vorläufig gedacht war, zur Dauerlösung wird, ähnlich wie in Deutschland (Einheit 42) und Indien (Einheit 45)."
    ]},
    { h: "Atomare Gefahr: die Kubakrise 1962", p: [
      "1959 stürzte Fidel Castro auf Kuba den Diktator Batista und näherte sich der Sowjetunion an. Die USA versuchten 1961 mit der Invasion in der Schweinebucht, exilkubanische Truppen anzulanden, und scheiterten. Im Sommer 1962 begann die Sowjetunion, Mittelstreckenraketen mit Atomsprengköpfen auf Kuba zu stationieren, zum Schutz Kubas und zum Ausgleich amerikanischer Raketen in der Türkei und Italien. Am 14. Oktober entdeckten US-Aufklärungsflugzeuge Abschussrampen. Präsident Kennedy verhängte eine Seeblockade („Quarantäne“) und forderte den Abzug. Dreizehn Tage lang stand die Welt am Rand eines Atomkrieges.",
      "Die Krise löste sich durch Diplomatie: Chruschtschow erklärte sich bereit, die Raketen abzuziehen, wenn die USA nicht in Kuba einmarschierten, und Kennedy sagte insgeheim zu, die Raketen in der Türkei abzubauen. Wie knapp es war, zeigte sich später: Auf einem sowjetischen U-Boot verweigerte Wassili Archipow die Zustimmung zum Einsatz eines Atomtorpedos. Die Beteiligten richteten danach einen direkten Draht („Heißer Draht“) zwischen Washington und Moskau ein und unterzeichneten 1963 ein Teilverbot von Kernwaffentests. Die Krise gilt als Lehrstück dafür, wie Fehlwahrnehmung, Zeitdruck und Prestige Staaten in Gefahr bringen (Einheit 33), und wie Verhandlungen und Zurückhaltung Katastrophen abwenden können."
    ]},
    { h: "Vietnam: ein Krieg um Unabhängigkeit und Ideologie", p: [
      "Vietnam war französische Kolonie (Einheit 32). Im Zweiten Weltkrieg besetzte Japan das Land, und Ho Chi Minh gründete die Unabhängigkeitsbewegung Viet Minh. 1945 rief er die Republik aus, Frankreich wollte die Kolonie zurückerobern, und es kam zum Indochinakrieg, den Frankreich 1954 bei Dien Bien Phu verlor. Das Genfer Abkommen teilte Vietnam am 17. Breitengrad, mit freien Wahlen, die nie stattfanden. Die USA unterstützten den Süden aus Furcht, ein Land nach dem anderen werde kommunistisch („Dominotheorie“). Der Norden unterstützte die Guerilla im Süden, den Vietcong.",
      "Nach dem Tonkin-Zwischenfall (1964) weiteten die USA den Krieg massiv aus: bis 1968 über 500.000 Soldaten, Flächenbombardements, Entlaubungsmittel (Agent Orange) und Napalm. Die Gewalt traf vor allem Zivilisten; Massaker wie My Lai (1968) erschütterten die Öffentlichkeit. Der Tet-Angriff Anfang 1968 zeigte, dass der Krieg nicht zu gewinnen war. Die Berichterstattung im Fernsehen und eine Protestbewegung in den USA und Europa veränderten die Haltung. 1973 zogen die USA ab, 1975 eroberte der Norden Saigon. Insgesamt starben mehr als zwei Millionen Vietnamesen und 58.000 US-Soldaten. Folgen waren auch gesundheitlich: Dioxin-Schäden und Traumata bei Veteranen (Einheit 34).",
      "Vietnam zeigt die Grenzen militärischer Überlegenheit gegen eine Bevölkerung, die für Unabhängigkeit kämpft. Es verknüpft Dekolonisierung mit Kaltem Krieg: Für die Vietnamesen ging es um nationale Selbstbestimmung, für die USA um Eindämmung des Kommunismus. Solche unterschiedlichen Deutungen desselben Konflikts gab es oft."
    ]},
    { h: "Stellvertreterkriege und die Welt der Blockfreien", p: [
      "Der Kalte Krieg wurde häufig in der „Dritten Welt“ ausgetragen. Die Supermächte lieferten Waffen, Berater und Geld an Verbündete: In Afrika (Angola, Kongo, Äthiopien), Lateinamerika (Guatemala 1954, Chile 1973) und Asien (Afghanistan, Indonesien) wurden Regierungen gestürzt oder gestützt. Die Folgen waren oft verheerend: Bürgerkriege, Diktaturen, Zerstörung. Der Iran erlebte 1953 den von CIA und britischem Geheimdienst unterstützten Sturz des Premierministers Mossadegh, der Ölindustrie verstaatlichen wollte; das beeinflusste das Misstrauen gegenüber dem Westen und die Revolution von 1979.",
      "Zugleich versuchten viele neue Staaten, sich nicht festzulegen. Auf der Konferenz von Bandung (1955) trafen sich 29 asiatische und afrikanische Staaten, 1961 entstand die Bewegung der Blockfreien mit Nehru, Nasser, Tito und Sukarno (Einheiten 45 und 46). Sie wollten Unabhängigkeit und Entwicklung, ohne Teil der Blöcke zu sein, und nutzten die Rivalität der Supermächte für eigene Vorteile. Das erklärt, warum der Kalte Krieg nicht nur ein Konflikt zwischen zwei Staaten war, sondern die Weltpolitik insgesamt prägte."

    ["Warum eskalierten Korea und Vietnam, Berlin und Kuba aber nicht?", "In Europa, wo beide Blöcke direkt aneinandergrenzten, galten Regeln und Linien als klar, und ein Fehler hätte sofort Atomkrieg bedeutet. An den Rändern waren Einsätze begrenzt, und Supermächte ließen Verbündete kämpfen. Die Kubakrise war die Ausnahme, in der beide Seiten die Gefahr erkannten und einlenkten."],

UNITS.u44 = {
  id: "u44",
  title: "Entspannung, Stagnation und das Ende des Ostblocks",
  lead: "Wie Rüstungskontrolle und Dialog den Kalten Krieg dämpften, warum der Ostblock wirtschaftlich zurückfiel und wie 1989 die Mauer fiel und die Sowjetunion zerfiel.",
  body: [
    { h: "Reformversuche im Ostblock und ihre Niederschlagung", p: [
      "Nach Stalins Tod 1953 begann eine vorsichtige Lockerung. Chruschtschow verurteilte 1956 in einer Geheimrede Stalins Verbrechen. Das weckte Hoffnungen: In Polen und Ungarn forderten Menschen Reformen. Im Oktober 1956 erhob sich Ungarn, Imre Nagy kündigte den Austritt aus dem Warschauer Pakt an, und sowjetische Panzer schlugen den Aufstand nieder; Tausende starben, Zehntausende flohen. 1968 versuchte die Tschechoslowakei unter Alexander Dubček im „Prager Frühling“ einen „Sozialismus mit menschlichem Antlitz“ mit Pressefreiheit und Reformen. Im August marschierten Truppen des Warschauer Paktes ein. Die Breschnew-Doktrin verkündete, die Sowjetunion dürfe eingreifen, wenn der Sozialismus in einem Bündnisstaat bedroht sei.",
      "Das Muster zeigt ein Grundproblem: Die Führungen konnten Reformen nicht zulassen, ohne ihre Macht zu gefährden, und setzten auf Zwang. Wirtschaftliche Probleme wurden nicht gelöst, sondern überdeckt. Der Preis war der Verlust an Legitimität, die sich nur noch durch Überwachung und Angst sichern ließ."
    ]},
    { h: "Entspannung und Verhandlungen (1960er–1970er)", p: [
      "Nach der Kubakrise (Einheit 43) suchten beide Seiten Wege, Risiken zu verringern. In der Bundesrepublik leiteten Willy Brandt und Egon Bahr ab 1969 die „Neue Ostpolitik“ ein: „Wandel durch Annäherung“. Verträge mit der Sowjetunion und Polen (1970) erkannten die bestehenden Grenzen an; Brandts Kniefall vor dem Denkmal des Warschauer Ghettos wurde Symbol der Verantwortung (Einheit 40). 1972 folgte der Grundlagenvertrag mit der DDR. Die USA und die Sowjetunion schlossen Abkommen zur Begrenzung strategischer Waffen (SALT I, 1972). Die Konferenz für Sicherheit und Zusammenarbeit in Europa verabschiedete 1975 in Helsinki die Schlussakte, die Grenzen anerkannte und zugleich Menschenrechte betonte, worauf sich später Bürgerrechtsgruppen beriefen (Charta 77, Solidarność).",
      "Die Entspannung war nicht frei von Konflikten. In den 1970er-Jahren stieg der Einfluss der Sowjetunion in Afrika und Asien, 1979 marschierte sie in Afghanistan ein, ein Krieg, der zehn Jahre dauerte und sie wirtschaftlich und moralisch schwächte. Der NATO-Doppelbeschluss (1979) reagierte auf neue sowjetische Mittelstreckenraketen mit dem Angebot von Verhandlungen und der Drohung mit Nachrüstung und löste eine große Friedensbewegung aus. Anfang der 1980er-Jahre verschärfte sich der Ton unter US-Präsident Reagan, der die Sowjetunion das „Reich des Bösen“ nannte und ein Raketenabwehrprogramm (SDI) ankündigte."
    ]},
    { h: "Warum der Ostblock zurückfiel", p: [
      "Ab den 1970er-Jahren wurde der wirtschaftliche Unterschied sichtbar. Planwirtschaften konnten Schwerindustrie aufbauen, taten sich aber schwer mit Innovation, Qualität und Konsumgütern. Preise wurden politisch festgesetzt, wodurch Knappheit entstand, Betriebe hatten wenig Anreiz zu effizienter Produktion, und Kritik wurde unterdrückt. Der Westen erlebte nach den Ölkrisen (1973, 1979) Umbrüche, aber Marktwirtschaften passten sich an, der Osten verschuldete sich bei westlichen Banken. Zugleich sahen Menschen im Ostblock über Radio und Fernsehen den Lebensstandard im Westen. Der Vergleich in Deutschland, wo dasselbe Volk in zwei Systemen lebte, war besonders deutlich.",
      "Rüstung belastete die Sowjetunion stark, sie gab einen weit höheren Anteil der Wirtschaftsleistung für das Militär aus als die USA. Die Gesellschaft alterte, Gesundheit und Lebenserwartung sanken im Gegensatz zum Westen, auch durch Alkohol und mangelhafte Versorgung. Das Gesundheitssystem verfügte über viele Ärzte, aber wenig moderne Technik. Diese Stagnation, die Zeit unter Breschnew (1964–1982), bereitete den Boden für Veränderungen, die kaum jemand erwartet hatte."
    ]},
    { h: "Gorbatschow, 1989 und das Ende der Sowjetunion", p: [
      "1985 wurde Michail Gorbatschow Generalsekretär. Er wollte das System retten durch „Glasnost“ (Offenheit) und „Perestroika“ (Umbau). Die Tschernobyl-Katastrophe 1986 zeigte die Mängel von Geheimhaltung und Technik. Gorbatschow suchte Abrüstung (INF-Vertrag 1987 über Mittelstreckenraketen) und gab den Satellitenstaaten zu verstehen, dass die Sowjetunion nicht mehr eingreifen werde. Damit fiel die Stütze der Regime weg. In Polen gewann die Gewerkschaft Solidarność 1989 die teilfreien Wahlen, in Ungarn öffnete sich im Mai die Grenze zu Österreich, und tausende DDR-Bürger flohen über Ungarn und Botschaften in Prag. Montagsdemonstrationen in Leipzig und anderen Städten forderten Freiheit („Wir sind das Volk“).",
      "Am 9. November 1989 öffnete die DDR-Führung nach einer missverständlichen Pressekonferenz die Grenze, und Menschen strömten durch die Mauer. Binnen eines Jahres folgten die Wiedervereinigung (3. Oktober 1990, Einheit 47), das Ende der kommunistischen Regime in Osteuropa und 1991 der Zerfall der Sowjetunion, nachdem ein Putschversuch von Hardlinern im August scheiterte. Am 25. Dezember trat Gorbatschow zurück; 15 Nachfolgestaaten entstanden. Der Kalte Krieg war zu Ende, ohne direkten Krieg zwischen den Blöcken. Wie dieser Prozess zu erklären ist, ist Gegenstand von Debatten: als Folge des Wettrüstens, innerer Schwächen, Gorbatschows Politik oder des Drucks der Bürgerbewegungen. Vermutlich wirkten alle zusammen."
    ]}

    ["Warum blieb der Umbruch 1989 weitgehend friedlich?", "Gorbatschow verzichtete auf Gewalt, die Regime verloren den Rückhalt, auch bei den Sicherheitskräften, und die Opposition blieb gewaltfrei. In Rumänien kam es dagegen zu blutigen Kämpfen und zur Hinrichtung des Diktators Ceaușescu. Das Beispiel zeigt, wie sehr der Verlauf von Entscheidungen einzelner Akteure abhängt."],

    { q: "Warum fiel der Ostblock wirtschaftlich zurück?", o: ["Planwirtschaft hemmte Innovation, Rüstung belastete, und die Länder verschuldeten sich", "Wegen Rohstoffmangel allein", "Wegen zu viel Handel", "Wegen des Marshallplans"], a: 0, e: "Der Vergleich mit dem Westen war ab den 1970ern deutlich." },
    { q: "Welche Rolle spielte Gorbatschow 1989?", o: ["Er verzichtete auf militärisches Eingreifen und ermöglichte so die Umbrüche", "Er schlug die Proteste nieder", "Er gründete den Warschauer Pakt", "Er trat 1985 zurück"], a: 0, e: "Ohne diese Entscheidung wären die Revolutionen kaum friedlich verlaufen." },
    { q: "Wie endete die Sowjetunion?", o: ["Durch Auflösung im Dezember 1991 in 15 Nachfolgestaaten nach dem gescheiterten Putsch im August", "Durch einen Krieg mit den USA", "Durch Annexion", "Durch Teilung in zwei Staaten"], a: 0, e: "Gorbatschow trat am 25. Dezember zurück." }

UNITS.u45 = {
  id: "u45",
  title: "Das Ende der Kolonialreiche in Asien",
  lead: "Wie Indien, Indonesien, Vietnam und andere Länder nach 1945 ihre Unabhängigkeit erlangten, welche Rolle Krieg und Weltordnung spielten und warum die Teilung Indiens so blutig war.",
  body: [
    { h: "Warum die Kolonialreiche 1945 nicht mehr zu halten waren", p: [
      "Die Kolonialmächte gingen aus dem Zweiten Weltkrieg geschwächt hervor. Großbritannien und Frankreich waren verschuldet, ihre Wirtschaft zerstört, und Japans Siege 1941/42 hatten bewiesen, dass die Europäer nicht unbesiegbar waren (Einheit 41). Zugleich waren die Nationalbewegungen gewachsen (Einheit 38). Die Atlantik-Charta von 1941 hatte das Recht der Völker proklamiert, ihre Regierung zu wählen. Die Kolonisierten fragten, warum dies nicht auch für sie gelte. Die UNO-Charta nahm das Selbstbestimmungsrecht auf. Die beiden neuen Supermächte USA und Sowjetunion lehnten, wenn auch aus unterschiedlichen Gründen, Kolonialherrschaft ab. Hinzu kam, dass Bildungsschichten in den Kolonien entstanden waren, die moderne Ideen kannten und Führung beanspruchten.",
      "Wie schnell die Veränderung ging, zeigt ein Vergleich: 1945 lebte rund ein Drittel der Menschheit in Kolonien oder abhängigen Gebieten, 1975 kaum noch ein Prozent. Die UNO hatte 1945 51 Mitglieder, heute sind es 193. Dieser Wandel gehört zu den größten Umbrüchen des 20. Jahrhunderts."
    ]},
    { h: "Indien und Pakistan: Unabhängigkeit und Teilung", p: [
      "Nach dem Krieg war die britische Regierung unter Premier Attlee bereit, Indien zu entlassen. Die Frage war, wie. Der Kongress unter Nehru wollte einen vereinten Staat, die Muslimliga unter Jinnah einen eigenen für die Muslime (Einheit 38). Die Verhandlungen scheiterten, 1946 kam es in Kalkutta zu Massakern („Great Calcutta Killings“) und zu Gewalt in anderen Regionen. Lord Mountbatten, der letzte Vizekönig, legte das Datum der Unabhängigkeit vor, auf den 15. August 1947, und die Teilung entlang religiöser Mehrheiten wurde in aller Eile entschieden. Eine Kommission unter Cyril Radcliffe, der Indien kaum kannte, zog in wenigen Wochen die Grenzen durch Punjab und Bengalen.",
      "Die Folgen waren verheerend. Rund 15 Millionen Menschen flohen oder wurden vertrieben, Hindus und Sikhs nach Indien, Muslime nach Pakistan. Es kam zu Massakern, Vergewaltigungen und Zügen voller Leichen. Schätzungen der Toten reichen von einer bis zu zwei Millionen. Der Konflikt um Kaschmir, dessen Fürst sich für Indien entschied, führte zu Kriegen 1947, 1965 und 1971 (in dem Ostpakistan als Bangladesch unabhängig wurde). Gandhi, der gegen die Teilung war und für Versöhnung fastete, wurde im Januar 1948 von einem hinduistischen Nationalisten ermordet. Indien wurde eine Demokratie mit Verfassung (1950) und blieb es trotz Armut, Vielfalt und Konflikten; Pakistan erlebte mehrere Militärherrschaften. Die Teilung gilt als Beispiel dafür, dass übereilte Grenzziehungen Konflikte erzeugen (Einheit 35)."
    ]},
    { h: "Südostasien: Indonesien, Vietnam, Malaya, Philippinen", p: [
      "In Indonesien riefen Sukarno und Hatta kurz nach der japanischen Kapitulation im August 1945 die Unabhängigkeit aus. Die Niederlande versuchten, die Kolonie zurückzuerobern, stießen aber auf Widerstand und internationalen Druck, auch der USA, und mussten 1949 die Unabhängigkeit anerkennen. In Vietnam erlebte Frankreich seine Niederlage bei Dien Bien Phu 1954, die Teilung und der folgende Krieg (Einheit 43) zeigten, wie Dekolonisierung und Kalter Krieg verschmolzen. Großbritannien entließ Birma und Ceylon 1948 in die Unabhängigkeit. In Malaya bekämpfte es einen kommunistischen Aufstand („Emergency“, 1948–60) und gab 1957 Unabhängigkeit. Die USA entließen die Philippinen 1946.",
      "Die Wege unterschieden sich: friedlich (Indien nach langen Kampagnen), bewaffnet (Indonesien, Vietnam), verhandelt mit Vorbehalten (Malaya). Wo Siedlerminderheiten fehlten und die Kolonialmacht müde war, ging es schneller. Wo Wirtschaftsinteressen (Kautschuk, Öl, Zinn) oder Prestige hineinspielten, wurde um den Besitz gekämpft. Man erkennt, wie wichtig Machtverhältnisse und Interessen für den Verlauf sind."
    ]},
    { h: "Herausforderungen der neuen Staaten", p: [
      "Die Unabhängigkeit löste nicht alle Probleme. Die neuen Staaten übernahmen Grenzen, die nicht ihrer Geschichte entsprachen (Einheiten 32 und 35), mit Minderheiten und Konflikten. Wirtschaftlich waren viele auf den Export einzelner Rohstoffe angewiesen (Kautschuk, Zinn, Jute, Tee) und besaßen wenig Industrie. Zudem fehlte es an ausgebildetem Personal: Ärzte, Ingenieure und Verwaltungsfachleute waren selten, etwa gab es in Indien bei der Unabhängigkeit eine geringe Zahl von Ärzten pro Kopf, und Gesundheit wurde ein zentrales Thema. Impfkampagnen, getragen von der WHO (gegründet 1948), erreichten Erfolge: Die Pocken wurden 1980 für ausgerottet erklärt, nachdem eine große Kampagne unter anderem in Indien und Bangladesch die letzten Fälle beseitigt hatte (Einheit 24).",
      "Die Staaten wählten verschiedene Entwicklungswege. Indien setzte auf Planwirtschaft und Selbstversorgung, öffnete sich ab 1991 für Märkte. Südkorea, Taiwan, Singapur und Hongkong (die „Tigerstaaten“) setzten auf Export, Bildung und staatliche Lenkung und stiegen auf. China ging unter Mao einen sozialistischen Weg mit furchtbaren Folgen (Großer Sprung nach vorn, 1958–62, mit Hungersnot und vermutlich Dutzenden Millionen Toten) und öffnete sich ab 1978 unter Deng Xiaoping. Der Vergleich zeigt, dass Unabhängigkeit eine Voraussetzung, aber keine Garantie für Wohlstand war, und dass Politik und Institutionen entscheidend sind."
    ]}

    ["War die Teilung Indiens vermeidbar?", "Historiker streiten. Manche machen die Politik der Briten (Teilung als Instrument) verantwortlich, andere die Führung des Kongresses, andere Jinnahs Forderungen. Sicher ist, dass die überstürzte Umsetzung 1947 Gewalt begünstigte. Ein Satz fasst es zusammen: Man teilte ein Land in wenigen Wochen, dessen Verflechtung Jahrhunderte gewachsen war."],

UNITS.u46 = {
  id: "u46",
  title: "Afrika und der Nahe Osten: Unabhängigkeit, Israel, Apartheid",
  lead: "Wie Afrika seit 1957 unabhängig wurde, welche Kriege und Probleme folgten, wie Israel entstand und der Nahostkonflikt begann und warum die Apartheid in Südafrika erst 1994 endete.",
  body: [
    { h: "Afrika wird unabhängig: 1957 bis 1975", p: [
      "1957 wurde Ghana unter Kwame Nkrumah die erste unabhängige Kolonie im subsaharischen Afrika. 1960, das „Afrikajahr“, erlangten 17 Staaten die Unabhängigkeit, darunter Nigeria, Senegal, Kongo und Somalia. Hintergrund waren der Druck der Nationalbewegungen, die Schwäche der Kolonialmächte, der Einfluss der Idee des Panafrikanismus und die Weigerung vieler Soldaten und Beamter, weiter zu dienen. Großbritannien zog sich meist verhandelt zurück, Frankreich gab 1958 Gebiete in eine „Gemeinschaft“ und 1960 ihre Unabhängigkeit, doch behielt es wirtschaftlichen und militärischen Einfluss („Françafrique“). Die belgische und portugiesische Herrschaft endete später und blutiger: Portugal verließ Angola und Mosambik erst nach der Nelkenrevolution 1974/75.",
      "In manchen Ländern wehrten sich Siedler und Kolonialmacht. In Kenia führte der Mau-Mau-Aufstand (1952–60) zu brutaler britischer Unterdrückung mit Lagern und Folter, die erst später öffentlich debattiert wurde. In Algerien kämpfte die Front de Libération Nationale (FLN) 1954–62 gegen Frankreich, dessen Armee Folter einsetzte. Eine Million europäische Siedler lebte dort, und der Krieg kostete Hunderttausende Algerier das Leben. Er erschütterte Frankreichs Politik, brachte 1958 de Gaulle an die Macht und endete mit der Unabhängigkeit 1962, worauf fast alle Siedler flohen."
    ]},
    { h: "Der Kongo und die Probleme der jungen Staaten", p: [
      "Der Kongo ist ein Beispiel dafür, wie schwierig der Übergang war (Einheit 32). Belgien entließ ihn 1960 fast unvorbereitet: Es gab kaum afrikanische Akademiker, Offiziere oder Verwaltungsfachleute. Kurz nach der Unabhängigkeit meuterte die Armee, die reiche Provinz Katanga spaltete sich ab, und die UNO griff ein. Premierminister Patrice Lumumba, der Hilfe auch bei der Sowjetunion suchte, wurde 1961 mit Beteiligung belgischer und amerikanischer Interessen ermordet. Mobutu, mit Rückhalt des Westens, regierte das Land dann über drei Jahrzehnte als Diktator und bereicherte sich. Rohstoffe wie Kupfer, Kobalt und Diamanten blieben Motor für Konflikte.",
      "Die jungen Staaten hatten mit gemeinsamen Problemen zu kämpfen: willkürliche Grenzen, die Ethnien trennten oder zusammenzwangen, schwache Institutionen, Abhängigkeit von Rohstoffexporten, Folgen des Kalten Krieges mit Stellvertreterkonflikten (Einheit 43). Viele Länder wurden Einparteienstaaten oder Militärdiktaturen. Die Organisation für Afrikanische Einheit (1963) beschloss, die Grenzen nicht zu ändern, um weitere Kriege zu vermeiden. Der Biafra-Krieg in Nigeria (1967–70) und der Völkermord in Ruanda 1994, bei dem etwa 800.000 Tutsi und gemäßigte Hutu in hundert Tagen ermordet wurden, zeigen die Folgen ethnisierter Politik, die Kolonialmächte (Belgien) mit der Einteilung von Gruppen verstärkt hatten. Man sollte aber nicht nur Probleme sehen: Viele Länder bauten Schulen, Krankenhäuser und Straßen, und die Lebenserwartung stieg."
    ]},
    { h: "Israel und Palästina: ein Konflikt mit mehreren Wahrheiten", p: [
      "Die Wurzeln liegen im Zionismus und der Balfour-Erklärung (Einheit 35) sowie in der arabischen Nationalbewegung. Nach dem Holocaust (Einheit 40) drängten Überlebende nach Palästina, wo die britische Mandatsmacht die Einwanderung begrenzte. 1947 beschloss die UNO einen Teilungsplan für einen jüdischen und einen arabischen Staat, den die jüdische Seite annahm und die arabische ablehnte. Am 14. Mai 1948 rief David Ben-Gurion den Staat Israel aus. Arabische Nachbarstaaten griffen an. Im Krieg 1948/49 siegte Israel; rund 700.000 Palästinenser flohen oder wurden vertrieben („Nakba“, Katastrophe), während später rund 600.000 Juden aus arabischen Ländern nach Israel kamen oder vertrieben wurden.",
      "Es folgten weitere Kriege: Suezkrise 1956 (Israel, Großbritannien und Frankreich greifen Ägypten an, USA und Sowjetunion zwingen sie zum Rückzug, was das Ende der alten Kolonialmächte als Weltmächte markiert), Sechstagekrieg 1967 (Israel besetzt Westjordanland, Gazastreifen, Ostjerusalem, Sinai, Golan), Jom-Kippur-Krieg 1973. Der Konflikt hat zwei Seiten mit je eigener Erfahrung: Juden, die nach Jahrhunderten der Verfolgung einen sicheren Staat suchten, und Palästinenser, die ihre Heimat verloren und unter Besatzung leben. Verhandlungen brachten Teilerfolge: Frieden mit Ägypten (1979) und Jordanien (1994), die Oslo-Abkommen (1993) mit Selbstverwaltung, doch Siedlungsbau, Terror und Gewalt verhinderten eine Lösung. Eine kluge Betrachtung vermeidet einfache Schuldzuweisungen und fragt nach den Interessen und Ängsten beider Seiten."
    ]},
    { h: "Südafrika und die Apartheid", p: [
      "Nach der britischen Eroberung und dem Burenkrieg (1899–1902) wurde Südafrika 1910 ein Dominion der Weißen. Nach 1948 führte die Nationale Partei die Apartheid („Getrenntheit“) ein: Die Bevölkerung wurde nach „Rassen“ eingeteilt, Schwarze verloren Bürgerrechte, mussten in Reservaten („Homelands“) und Townships leben, brauchten Passbücher, und gemischte Ehen waren verboten. Der Staat nutzte Gesetze, Polizei und Gewalt. Das Massaker von Sharpeville (1960), bei dem Polizisten 69 Demonstranten erschossen, lenkte die Aufmerksamkeit der Welt auf das System. Nelson Mandela, Führer des ANC, wurde 1964 zu lebenslanger Haft verurteilt und saß 27 Jahre auf Robben Island und in anderen Gefängnissen.",
      "Der Druck wuchs von innen (Streiks, Schüleraufstand in Soweto 1976, Bürgerrechtsbewegung unter Steve Biko, der 1977 in Haft starb) und von außen (Sanktionen, Boykotte, Sportausschluss). Mit dem Ende des Kalten Krieges (Einheit 44) fiel das westliche Argument weg, Südafrika sei ein Bollwerk gegen den Kommunismus. Präsident de Klerk ließ Mandela 1990 frei, verhandelte über eine neue Ordnung, und 1994 gewann der ANC die ersten freien Wahlen. Mandela wurde Präsident und setzte auf Versöhnung: die Wahrheits- und Versöhnungskommission unter Erzbischof Desmond Tutu ermöglichte Aussagen von Opfern und Tätern. Die Ungleichheit blieb groß, doch der friedliche Übergang gilt als Beispiel gelungener Verhandlung."
    ]}

UNITS.u47 = {
  id: "u47",
  title: "1989/90: Wiedervereinigung, Osteuropa und die EU",
  lead: "Wie Deutschland sich vereinigte, wie Osteuropa den Wandel erlebte, warum Jugoslawien zerfiel und wie die Europäische Union wuchs.",
  body: [
    { h: "Von der Mauer zur Einheit (1989–1990)", p: [
      "Nach dem 9. November 1989 (Einheit 44) ging es schnell. Die Menschen in der DDR wollten nicht mehr nur Reisefreiheit, sondern die Einheit. Auf den Montagsdemonstrationen wandelte sich der Ruf „Wir sind das Volk“ zu „Wir sind ein Volk“. Bundeskanzler Helmut Kohl legte im November einen Zehn-Punkte-Plan vor. Im März 1990 gewann bei den ersten freien Wahlen in der DDR die „Allianz für Deutschland“, die eine rasche Einheit versprach. Am 1. Juli 1990 trat die Währungsunion in Kraft: Löhne und Renten wurden 1:1 umgetauscht, Ersparnisse teilweise 2:1.",
      "Außenpolitisch musste die Einheit mit den vier Siegermächten geregelt werden. Der Zwei-plus-Vier-Vertrag (September 1990) gab Deutschland die volle Souveränität, bestätigte die Grenze zu Polen (Oder-Neiße-Linie), schrieb den Verzicht auf Atomwaffen fest und regelte den Abzug sowjetischer Truppen. Das vereinte Deutschland blieb in der NATO. Am 3. Oktober 1990 trat die DDR der Bundesrepublik bei. Gorbatschow stimmte zu, auch gegen Widerstand in der eigenen Führung, wofür Deutschland Kredite gab. Frankreich und Großbritannien hatten Vorbehalte, wegen der Erinnerung an die Vergangenheit (Einheit 39); Kohl band die Einheit deshalb an die europäische Integration (Euro)."
    ]},
    { h: "Die Transformation: Chancen, Brüche, Erfahrungen", p: [
      "Der Übergang von der Plan- zur Marktwirtschaft war für Menschen in Ostdeutschland und Osteuropa eine tiefe Erfahrung. In der DDR privatisierte die Treuhandanstalt tausende Betriebe; viele waren nicht konkurrenzfähig, Millionen Menschen verloren ihre Arbeit, die Arbeitslosigkeit stieg stark. Zugleich gewannen sie Reisefreiheit, Demokratie und Konsum. Westdeutsche Transfers, der Solidaritätszuschlag und Investitionen bauten Infrastruktur auf, trotzdem blieb die Angleichung der Lebensverhältnisse ein langer Prozess. Bis heute unterscheiden sich Einkommen, Vermögen und politische Einstellungen zwischen Ost und West. Viele Ostdeutsche erlebten Entwertung ihrer Biografien, andere Befreiung.",
      "In Polen, Tschechien und Ungarn gelang der Übergang mit „Schocktherapie“ und Reformen relativ erfolgreich; sie traten 2004 der EU bei. In Russland führte die Privatisierung zu Verarmung für viele und zu Reichtum einer kleinen Schicht („Oligarchen“), die Lebenserwartung sank in den 1990er-Jahren stark, was auch gesundheitlich sichtbar war (Alkohol, Herz-Kreislauf-Erkrankungen). Diese Erfahrung prägte das Misstrauen vieler Russen gegenüber dem Westen und den Wunsch nach einem starken Staat. Man sieht, dass dieselben Ereignisse sehr verschieden erlebt wurden."
    ]},
    { h: "Jugoslawien: Zerfall und Krieg", p: [
      "Jugoslawien war ein Vielvölkerstaat aus Serben, Kroaten, Slowenen, Bosniern, Mazedoniern, Montenegrinern und Albanern, zusammengehalten von Tito (gest. 1980), dem blockfreien Kommunisten (Einheit 43), und von einer föderalen Ordnung. Nach seinem Tod und mit der Wirtschaftskrise gewannen Nationalismen an Kraft. Slobodan Milošević in Serbien nutzte den Nationalismus, Kroatien und Slowenien erklärten 1991 die Unabhängigkeit. Es folgten Kriege: in Kroatien (1991–95), in Bosnien (1992–95) und im Kosovo (1998/99). Die Kriege kosteten rund 130.000 bis 140.000 Menschen das Leben, es gab „ethnische Säuberungen“, Belagerung Sarajevos und im Juli 1995 den Völkermord von Srebrenica, bei dem über 8.000 muslimische Männer und Jungen ermordet wurden. Europa und die UNO griffen zu spät ein; das Abkommen von Dayton (1995) beendete den Krieg in Bosnien, die NATO bombardierte 1999 Serbien. Das Kriegsverbrechertribunal in Den Haag verurteilte Verantwortliche.",
      "Die Jugoslawienkriege zeigten, dass Nationalismus (Einheit 31) und Machtstreben nach dem Ende des Kalten Krieges in Europa wieder Gewalt auslösen konnten, und prägten die Debatte über humanitäre Interventionen und die „Schutzverantwortung“ der Staatengemeinschaft."
    ]},
    { h: "Die Europäische Union: Integration und Streit", p: [
      "Der Weg begann nach 1945 mit dem Gedanken, Kriege durch Verflechtung unmöglich zu machen. Die Montanunion (1951) legte Kohle und Stahl in gemeinsame Verwaltung, die Römischen Verträge (1957) gründeten die Wirtschaftsgemeinschaft. Schritt für Schritt kamen Zollunion, Binnenmarkt (1993) und der Vertrag von Maastricht (1992), der die Europäische Union und den Euro vorsah, der 2002 als Bargeld kam. Die Erweiterung nach 1989 umfasste Staaten Mittel- und Osteuropas (2004, 2007, 2013). Die EU ist weder ein Staat noch ein bloßer Staatenbund, sondern eine einzigartige Form mit gemeinsamen Institutionen (Kommission, Parlament, Rat, Gerichtshof).",
      "Sie hat Erfolge: Frieden zwischen früheren Feinden, Freizügigkeit, Binnenmarkt, Austauschprogramme wie Erasmus. Sie hat Konflikte: die Euro- und Schuldenkrise ab 2010, der Umgang mit Migration 2015, Streit um Rechtsstaatlichkeit in einigen Mitgliedstaaten, und der Austritt Großbritanniens 2020 nach dem Referendum von 2016. Die Debatten darüber, wie viel Souveränität Staaten abgeben sollen, ziehen sich durch die Geschichte (Einheit 20: Staatenordnung von 1648). Wer die Entstehung der EU kennt, versteht, dass sie ein Kind der Lehren aus zwei Weltkriegen ist."
    ]}

  deep: [
    ["War die Einheit „Anschluss“ oder „Vereinigung“?", "Rechtlich erfolgte sie nach Artikel 23 des Grundgesetzes als Beitritt, politisch war sie das Ergebnis von Verhandlungen und Wahlen. Streit besteht, ob eine neue Verfassung nach Artikel 146 hätte entstehen sollen. Manche Ostdeutsche sehen Einheit als Übernahme, andere als Befreiung. Beides prägt Erinnerung."],

UNITS.u48 = {
  id: "u48",
  title: "Finanzkrise, Arabischer Frühling, Syrien und Migration (2008–2019)",
  lead: "Wie die Finanzkrise von 2008 Wirtschaft und Politik erschütterte, warum der Arabische Frühling in Krieg und Flucht mündete und wie digitale Technik die Welt veränderte.",
  body: [
    { h: "2008: Die Finanzkrise und ihre politischen Folgen", p: [
      "Im September 2008 brach die amerikanische Investmentbank Lehman Brothers zusammen. Auslöser war eine Blase auf dem US-Immobilienmarkt: Banken hatten Hypotheken an Kunden mit schwacher Bonität vergeben, sie gebündelt und als scheinbar sichere Wertpapiere weiterverkauft. Als die Preise fielen und Kredite ausfielen, verloren diese Papiere ihren Wert, und weil Banken weltweit verflochten waren, sprang die Krise über. Staaten retteten Banken mit Milliardensummen, Notenbanken senkten die Zinsen und kauften Anleihen, und die Weltwirtschaft schrumpfte 2009 erstmals seit Jahrzehnten. Der Vergleich mit 1929 (Einheit 36) liegt nahe, und tatsächlich lernten die Verantwortlichen aus der Weltwirtschaftskrise: Man ließ nicht alle Banken fallen und stützte die Nachfrage, sodass keine Depression wie in den 1930ern entstand.",
      "Die Folgen waren dennoch tief. Aus der Bankenkrise wurde in Europa eine Staatsschuldenkrise: Griechenland, Irland, Portugal, Spanien und Zypern gerieten in Finanznot und erhielten Hilfen nur gegen Sparauflagen. Die Arbeitslosigkeit stieg in Südeuropa stark, bei Jüngeren in Griechenland und Spanien über 50 Prozent. Der Streit zwischen Ländern, die sparen wollten, und solchen, die Hilfe brauchten, belastete die EU (Einheit 47). Politisch gewannen Parteien an den Rändern, links wie rechts, und das Vertrauen in Eliten und Institutionen sank. Viele Historiker sehen in dieser Krise einen Ausgangspunkt für den Populismus des folgenden Jahrzehnts, auch wenn weitere Gründe wie Migration, Globalisierung und kulturelle Verschiebungen hinzukamen."
    ]},
    { h: "Der Arabische Frühling (2010/11) und was daraus wurde", p: [
      "Im Dezember 2010 zündete sich der tunesische Gemüsehändler Mohamed Bouazizi aus Verzweiflung über Schikane durch Behörden an. Proteste gegen Korruption, Arbeitslosigkeit und Repression erfassten Tunesien, dessen Präsident Ben Ali im Januar 2011 floh. Dann folgten Ägypten (Sturz Mubaraks im Februar 2011 nach Protesten auf dem Tahrir-Platz), Libyen, Jemen, Bahrain und Syrien. Soziale Medien halfen, Proteste zu organisieren, doch sie lösten sie nicht aus: Die Ursachen lagen in einer jungen Bevölkerung ohne Perspektive, steigenden Lebensmittelpreisen und autoritären Regimen, die jahrzehntelang an der Macht waren. Die Hoffnung auf Demokratie war groß.",
      "Die Ergebnisse waren sehr verschieden. Tunesien erhielt eine demokratische Verfassung (2014), die jedoch später unter Präsident Saied wieder eingeschränkt wurde. In Ägypten gewann 2012 der Islamist Mohammed Mursi die Wahl, wurde 2013 vom Militär unter al-Sisi gestürzt, und das Land wurde wieder autoritär. In Libyen stürzte ein Aufstand mit NATO-Luftunterstützung Gaddafi 2011, doch das Land zerfiel in rivalisierende Regierungen und Milizen. In Jemen führte der Machtkampf zu einem Krieg, den ab 2015 eine saudisch geführte Koalition gegen die Huthi-Rebellen führte, mit einer der schwersten humanitären Krisen der Welt. Man sieht, wie unterschiedlich Revolutionen ausgehen können, je nachdem, ob Armee, Institutionen und äußere Mächte den Wandel tragen oder bekämpfen (Einheit 35)."
    ]},
    { h: "Syrien: Bürgerkrieg, Flucht und Wandel der Region", p: [
      "In Syrien reagierte das Regime von Baschar al-Assad auf Proteste 2011 mit Gewalt. Aus Demonstrationen wurde ein Bürgerkrieg, in den Staaten und Milizen eingriffen: Russland und der Iran stützten Assad, die Türkei, Golfstaaten und die USA unterstützten verschiedene Rebellengruppen, Kurden bildeten eigene Verwaltung im Nordosten. Der „Islamische Staat“ (IS) errichtete 2014 ein Kalifat in Teilen Syriens und des Irak, wurde aber bis 2019 militärisch zurückgedrängt. Das Regime setzte Fassbomben und Chemiewaffen ein (Ghouta 2013), belagerte Städte wie Aleppo, und Hunderttausende Menschen starben, über die Hälfte der Bevölkerung wurde vertrieben, rund fünf bis sechs Millionen flohen ins Ausland, vor allem in die Türkei, den Libanon und Jordanien. Ende 2024 stürzten Rebellen unter Führung der Gruppe HTS das Assad-Regime; die Entwicklung danach ist weiterhin offen.",
      "2015/16 erreichten über eine Million Schutzsuchende Europa, vor allem über die Türkei und Griechenland sowie die Balkanroute nach Deutschland. Bundeskanzlerin Merkel entschied im September 2015, Flüchtlinge aus Ungarn aufzunehmen („Wir schaffen das“). Die Reaktionen waren gespalten: Viele engagierten sich ehrenamtlich, andere fürchteten Überforderung, und der Streit um Verteilung in der EU blieb ungelöst. Das EU-Türkei-Abkommen (2016) verringerte die Zahlen. Migration wurde zu einem der zentralen politischen Themen und stärkte Parteien wie die AfD in Deutschland. Historisch eingeordnet knüpft die Frage an frühere Wanderungen an, von den Vertriebenen nach 1945 (Einheit 41) über „Gastarbeiter“ bis zu Kolonialmigration (Einheit 45), und fragt nach Zugehörigkeit, Integration und Verantwortung."
    ]},
    { h: "Digitale Revolution und neue Konfliktlinien", p: [
      "Seit 2007 das iPhone erschien, wurde das Smartphone zum Alltagsgerät. Soziale Netzwerke, Streaming, Onlinehandel und Plattformunternehmen veränderten Kommunikation, Arbeit und Politik. Information verbreitete sich schneller, aber Desinformation auch; Algorithmen sortieren, was Menschen sehen. Der Skandal um Cambridge Analytica (2018) zeigte, wie Daten für politische Beeinflussung genutzt werden. Staaten entdeckten die digitale Sphäre als Konfliktfeld: Cyberangriffe, Wahlbeeinflussung, Überwachung. Zugleich öffnete sie Räume, wie Proteste in Hongkong 2019, und half der Medizin (Telemedizin, digitale Akten) und der Forschung.",
      "Politisch markieren die Jahre 2016/17 einen Wendepunkt in westlichen Demokratien: das Brexit-Referendum in Großbritannien (Juni 2016) und die Wahl Donald Trumps zum US-Präsidenten (November 2016) gelten als Ausdruck von Unzufriedenheit mit Globalisierung, Eliten und Migration. In China stärkte Xi Jinping, seit 2012 Parteichef, die Rolle der Partei und ließ 2018 die Amtszeitbegrenzung für den Präsidenten aufheben. Russland annektierte 2014 die Krim und unterstützte Separatisten im Donbas (Einheit 47). Die Hoffnung der 1990er-Jahre auf eine liberale Weltordnung geriet unter Druck. Diese Jahre bilden die Vorgeschichte der Gegenwart, zu der die nächsten Einheiten führen (Einheiten 49 und 50)."
    ]}

UNITS.u49 = {
  id: "u49",
  title: "Pandemie, Krieg in der Ukraine und Kriege im Nahen Osten (2020–2026)",
  lead: "Wie Covid-19 die Welt veränderte, warum Russland die Ukraine angriff, was in Gaza, Libanon und Iran geschah und wie unsicher der Stand heute ist. Stand: Oktober 2026.",
  body: [
    { h: "Covid-19: eine Pandemie im vernetzten Zeitalter", p: [
      "Ende 2019 trat in Wuhan, China, ein neues Coronavirus (SARS-CoV-2) auf. Es breitete sich über Flüge und Reisen rasch aus, und die Weltgesundheitsorganisation erklärte am 11. März 2020 eine Pandemie. Staaten reagierten mit Kontaktbeschränkungen, Schulschließungen, Masken und Grenzkontrollen, ähnlich wie frühere Gesellschaften mit Quarantäne gegen die Pest (Einheit 13) und die Spanische Grippe (Einheit 35). Der Unterschied: Medizin und Wissenschaft konnten das Virus binnen Tagen entschlüsseln. Impfstoffe, darunter erstmals zugelassene mRNA-Impfstoffe (BioNTech/Pfizer, Moderna), standen schon Ende 2020 zur Verfügung, ein Tempo, das ohne jahrzehntelange Vorarbeit nicht möglich gewesen wäre.",
      "Die Bilanz ist groß: Offiziell wurden rund sieben Millionen Todesfälle gemeldet, Schätzungen der Übersterblichkeit liegen deutlich höher. Die Pandemie verschärfte soziale Ungleichheit, belastete Pflegekräfte und Ärzte, störte Lieferketten und löste staatliche Hilfsprogramme in nie gekannter Höhe aus. Sie führte zu Streit über Freiheitsrechte, Schutzmaßnahmen, Impfungen und Desinformation, und wurde zu einem Prüfstein für Vertrauen in Wissenschaft und Politik. Die Aufarbeitung dauert an: Wie wirksam waren Maßnahmen? Welche Folgen hatten Schulschließungen? Wie lässt sich die Zusammenarbeit der Länder verbessern? Für Menschen in der Medizin ist diese Zeit eine prägende Erfahrung, und sie zeigt, dass die Geschichte der Seuchen (Roter Faden) nicht abgeschlossen ist."
    ]},
    { h: "Russland und die Ukraine: vom Angriff 2022 zum Stand 2026", p: [
      "Der Konflikt hat Wurzeln im Zerfall der Sowjetunion (Einheit 44), in der Frage von Einflusssphären und im Streit um die Identität der Ukraine (Einheit 9). 2014 annektierte Russland die Krim und unterstützte Separatisten im Donbas. Am 24. Februar 2022 begann Russland einen umfassenden Angriff auf die Ukraine, den Präsident Putin als „militärische Spezialoperation“ bezeichnete; er begründete ihn unter anderem mit historischen Behauptungen und der Sorge vor der NATO. Die Völkerrechtswidrigkeit des Angriffs ist von der UN-Generalversammlung mit großer Mehrheit festgestellt worden. Entgegen den Erwartungen Moskaus leisteten die Ukrainer starken Widerstand; Kiew wurde nicht erobert. Der Krieg wurde zu einem langen Abnutzungskrieg mit Drohnen, Artillerie und Raketen, mit Zerstörung von Städten wie Mariupol und massiven Angriffen auf die Energieversorgung.",
      "Westliche Staaten verhängten Sanktionen und lieferten Waffen und Finanzhilfen. Deutschland sprach von einer „Zeitenwende“, beschloss ein Sondervermögen für die Bundeswehr und löste sich von russischem Gas. Millionen Ukrainer flohen, viele nach Polen und Deutschland, mehrere Millionen sind innerhalb des Landes vertrieben. Die Opferzahlen sind schwer zu bestimmen und Gegenstand von Schätzungen; sie gehen auf beiden Seiten in die Hunderttausende. Der Internationale Strafgerichtshof erließ 2023 Haftbefehl gegen Putin, unter anderem wegen der Verschleppung ukrainischer Kinder.",
      "Zum Stand: Nach Berichten (Al Jazeera, Oktober 2026) erklärte Präsident Selenskyj Anfang Oktober 2026, die Ukraine sei bereit zu von den USA unterstützten Dreiergesprächen mit Russland, die später im Monat stattfinden könnten. Zuvor war die US-Vermittlung zeitweise pausiert, weil die USA im Iran Krieg führten. Eine kurze Waffenruhe zu Ostern (11. bis 13. April 2026, 32 Stunden) hielt nicht; die Ukraine zählte 469 russische Verstöße, danach gingen die Kämpfe sofort weiter. Beide Seiten kündigten an, die Angriffe auf weit entfernte Ziele zu verstärken, Russland insbesondere auf die Energieversorgung vor dem Winter. Berichte, Putin habe eine Waffenruhe ausgeschlossen, sind in den Quellen nur als Überschrift belegt; der Stand ändert sich schnell und sollte aktuell geprüft werden. Wichtig ist: Ob und wie der Krieg endet, ist offen, und die Fragen der Grenzen, Sicherheitsgarantien und Verantwortung sind ungelöst."
    ]},
    { h: "Der 7. Oktober 2023, der Krieg in Gaza und der Waffenstillstand seit Oktober 2025", p: [
      "Am 7. Oktober 2023 griff die Hamas Israel an, tötete etwa 1.200 Menschen, vor allem Zivilisten, und verschleppte rund 250 Geiseln nach Gaza, der schwerste Angriff auf Juden seit dem Holocaust (Einheit 46). Israel antwortete mit einem Krieg im Gazastreifen, der große Teile des Gebiets zerstörte; die Zahl der Toten in Gaza liegt nach Angaben der von der Hamas kontrollierten Gesundheitsbehörde, die von UN-Stellen als glaubwürdig angesehen wird, bei rund 73.700 (Stand September 2026). Der Krieg weitete sich aus: auf den Libanon (Hisbollah), Jemen (Huthi), Syrien und Iran. Internationale Gerichte befassen sich mit den Vorwürfen, Israel begehe Völkermord, was Israel zurückweist, sowie mit Haftbefehlen gegen Politiker beider Seiten. Die Debatte wird auch in Deutschland leidenschaftlich geführt.",
      "Am 10. Oktober 2025 trat eine Waffenruhe auf Grundlage des 20-Punkte-Plans von US-Präsident Trump in Kraft. Die lebenden Geiseln kamen frei, Israel entließ palästinensische Gefangene und zog sich teilweise zurück. Ein „Board of Peace“ sollte als Übergangsverwaltung dienen, der UN-Sicherheitsrat erkannte ihn im November an. Nach Berichten (Al Jazeera, Oktober 2026) ist die Bilanz nach einem Jahr ernüchternd: Der Wiederaufbau hat kaum begonnen, die Hilfslieferungen liegen unter dem Vereinbarten, die geplante internationale Stabilisierungstruppe ist nicht im Einsatz, Israel kontrolliert etwa 60 Prozent des Gebiets, und um die Entwaffnung der Hamas gibt es eine Blockade. Seit der Waffenruhe wurden nach diesen Angaben über 1.400 Palästinenser getötet. Etwa 1,4 Millionen Menschen sind von Hunger bedroht."
    ]},
    { h: "Der Iran-Krieg 2026 und seine Folgen für die Weltwirtschaft", p: [
      "Am 28. Februar 2026 griffen die USA und Israel Iran an, während Verhandlungen über das Atomprogramm liefen. Bei den Angriffen wurde unter anderem der Oberste Führer Ali Chamenei getötet. Iran antwortete mit Raketen und Drohnen gegen Israel, Golfstaaten und US-Stützpunkte; die Hisbollah und die Huthi griffen in den Krieg ein, und Israel begann eine Bodenoffensive im Südlibanon. Iran sperrte die Straße von Hormus, durch die ein großer Teil des Welthandels mit Öl und Flüssiggas läuft. Der Krieg verursachte laut Quellen die größte Störung der Ölversorgung, die je verzeichnet wurde, und trieb Energiepreise sowie Preise für Dünger und Flugverkehr in die Höhe.",
      "Der Verlauf war wechselhaft: Eine Waffenruhe am 8. April hielt nur kurz, Gespräche in Islamabad scheiterten, die USA verhängten eine Seeblockade, im Juni unterzeichneten die Präsidenten beider Länder ein Memorandum zur Beendigung des Krieges, und Ende Juni wurde vereinbart, Angriffe einzustellen. Am 8. Juli brach die Waffenruhe zusammen, nachdem Iran Schiffe in der Meerenge angegriffen hatte. Zu den Opfern: Nach Angaben der iranischen Regierung wurden rund 3.500 Menschen getötet; in Israel starben nach den dortigen Angaben etwa 70 Menschen, bei den US-Streitkräften 19 Soldaten, dazu kamen Tote in den Golfstaaten und über 1.000 getötete Hisbollah-Kämpfer (nach deren Angaben). Die Zahlen unterscheiden sich je nach Quelle. Die Rechtmäßigkeit des Angriffs ist umstritten; Kritiker sprechen von einem Verstoß gegen das Völkerrecht. Nach den Quellen vom Herbst gilt der Krieg weiter als nicht beendet: Die Hormus-Krise dauert an, und Hisbollah und Israel kämpfen wieder."
    ]}

UNITS.u50 = {
  id: "u50",
  title: "Ordnung im Umbruch: Klima, USA–China, KI und Deutschland (Stand Oktober 2026)",
  lead: "Welche langfristigen Linien die Gegenwart prägen: Erderwärmung, der Wettbewerb der Großmächte, Künstliche Intelligenz und Deutschlands neue Rolle. Und wie man mit unsicheren Nachrichten umgeht.",
  body: [
    { h: "Klima: Wissen, Abkommen und die Lücke dazwischen", p: [
      "Dass Menschen das Klima verändern, ist seit Jahrzehnten wissenschaftlich gut belegt. Der Treibhauseffekt wurde im 19. Jahrhundert beschrieben, die Verbrennung von Kohle, Öl und Gas seit der Industrialisierung (Einheit 29) hat den CO₂-Gehalt der Atmosphäre stark erhöht. 1992 wurde in Rio die Klimarahmenkonvention beschlossen, 1997 das Kyoto-Protokoll, 2015 das Pariser Abkommen: Die Staaten verpflichteten sich, die Erwärmung auf deutlich unter zwei Grad, möglichst 1,5 Grad gegenüber vorindustrieller Zeit zu begrenzen. Jedes Land legt seine Beiträge selbst fest; Sanktionen gibt es nicht.",
      "Genau darin liegt die Schwäche: Zwischen Zusagen und tatsächlicher Politik klafft eine Lücke. Der aktuelle UN-Emissions-Gap-Report (Oktober 2026) zeigt nach Berichten, dass die bisherigen Pläne nicht ausreichen, um die Ziele von Paris zu erreichen. Hinzu kommt der Streit um Gerechtigkeit: Industrieländer haben historisch die meisten Emissionen verursacht, Schwellenländer wie China und Indien emittieren heute viel, und die ärmsten Länder leiden am stärksten. Die nächste Weltklimakonferenz (COP31) findet ab dem 9. November 2026 in Antalya statt. Die Kriege der letzten Jahre haben Energiepolitik wieder zur Sicherheitsfrage gemacht: Mal rückt der Ausbau erneuerbarer Energien in den Vordergrund, mal die Sicherung fossiler Lieferungen. Für die Medizin sind Hitzewellen, neue Infektionsgebiete und Luftverschmutzung bereits Alltag."
    ]},
    { h: "USA und China: Wettbewerb statt Weltordnung?", p: [
      "Seit 1978 öffnete sich China wirtschaftlich (Einheit 46), trat 2001 der WTO bei und wurde zur „Werkbank der Welt“, später zur zweitgrößten Volkswirtschaft. Unter Xi Jinping setzt das Land stärker auf Kontrolle durch die Partei, technische Unabhängigkeit und militärische Modernisierung. Die USA sehen darin eine Herausforderung ihrer Rolle, ähnlich wie Großbritannien um 1900 das aufstrebende Deutschland (Einheit 33). Der Vergleich hilft, ist aber nicht deckungsgleich: Beide Volkswirtschaften sind eng verflochten, und Atomwaffen machen einen direkten Krieg extrem riskant.",
      "In Trumps zweiter Amtszeit (seit Januar 2025) wurden Zölle zu einem zentralen Instrument. Im Mai 2026 besuchte Trump Peking; nach Berichten vom Herbst 2026 verschob die US-Regierung zusätzliche Zölle auf chinesische Waren bis Ende 2026 und verlängerte die Zollpause bis Januar. Die Lage bleibt Verhandlungssache. Brennpunkte sind Halbleiter und Technologie, seltene Erden, der Status Taiwans und das Südchinesische Meer. Für Europa heißt das: Es muss zwischen zwei Großmächten eigene Interessen definieren. Der Globale Süden, etwa Indien, Brasilien, Indonesien oder die Golfstaaten, verfolgt zunehmend eigene Wege und tritt nicht automatisch einem Block bei, wie schon in der Zeit der Blockfreien (Einheit 45)."
    ]},
    { h: "Künstliche Intelligenz: Technik, die Gesellschaft und Medizin verändert", p: [
      "Seit etwa 2012 haben lernende Systeme dank großer Datenmengen und leistungsfähiger Chips rasch Fortschritte gemacht. Ab 2022 wurden Sprachmodelle für die breite Öffentlichkeit nutzbar. KI schreibt Texte, übersetzt, programmiert und unterstützt die Auswertung von Bildern in der Medizin, etwa in Radiologie oder Pathologie. Historisch gehört sie in eine Reihe von Technologien, die Arbeit und Macht verschoben haben, vom Buchdruck (Einheit 16) über die Dampfmaschine (Einheit 28) bis zum Computer. Wie damals stellt sich die Frage, wer profitiert, wer Arbeit verliert und wer regelt.",
      "Die Europäische Union hat mit dem KI-Gesetz (in Kraft seit 2024, mit schrittweise geltenden Pflichten) einen ersten umfassenden Rechtsrahmen geschaffen, der Anwendungen nach Risiko einstuft. Die USA setzen stärker auf Marktdynamik, China auf staatliche Lenkung. Offen sind Fragen von Verantwortung, Datenschutz, Urheberrecht, Fehlern und Verzerrungen sowie des Energieverbrauchs. In der Medizin geht es um Haftung, Aufklärung und darum, dass Ärztinnen und Ärzte Entscheidungen verantworten, auch wenn Werkzeuge helfen. Wie bei jeder neuen Technik lässt sich die Wirkung erst mit Abstand sicher beurteilen."
    ]},
    { h: "Deutschland, Europa und der Umgang mit Gegenwart", p: [
      "Deutschland hat sich seit 2022 stark verändert. Die „Zeitenwende“ bedeutete mehr Verteidigungsausgaben und das Ende der Abhängigkeit von russischem Gas. Der Bundeshaushalt 2026 (rund 525 Milliarden Euro) sieht für Verteidigung etwa 83 Milliarden Euro im Etat vor; je nach Abgrenzung, etwa mit Sondervermögen, nennen Berichte über 100 Milliarden; nach der Bundestagswahl 2025 führt Friedrich Merz (CDU) die Regierung, die zusammen mit der SPD regiert. Debattiert werden Wehrdienst, Wirtschaftswachstum, Energiepreise, Migration, Infrastruktur und Schulden. Die Erinnerung an 1933 (Einheit 36), 1945 (Einheit 41) und 1990 (Einheit 47) prägt die deutsche Politik: die Skepsis gegenüber Militär, die Bindung an Europa, die Verantwortung für Israel und die Frage, wie man mit Extremismus umgeht.",
      "Europa steht vor Aufgaben, die über einzelne Länder hinausgehen: eigene Sicherheit, Erweiterung der EU (Ukraine, Moldau, Westbalkan), gemeinsame Verteidigung, Energie, Wettbewerbsfähigkeit. Weltweit wachsen Zweifel an Regeln, die nach 1945 aufgebaut wurden (Einheit 41); Vereinte Nationen, WTO und Völkerrecht werden häufiger missachtet. Zugleich gibt es Zusammenarbeit, etwa in Forschung und Gesundheit.",
      "Zum Umgang mit der Gegenwart: Nachrichten sind der erste Entwurf der Geschichte. Hilfreiche Fragen sind: Wer berichtet, mit welcher Quelle, welche Zahl ist belegt, welche geschätzt? Welche langfristige Ursache steckt hinter dem Ereignis? Welche früheren Fälle sind ähnlich, und wo unterscheiden sie sich? Genau dafür sind die vorherigen Einheiten gedacht: nicht als Vorhersage, sondern als Werkzeug, Zusammenhänge zu erkennen. Für die Freitags-Rückschau im Chat gilt dieselbe Haltung."
    ]}

function addAfter(u, head, sec) {

}

addEnd(UNITS.u2, { h: "Warum entstanden Staaten gerade dort? Die Logik der Flusstäler", p: [
  "Auffällig ist, dass die frühesten Hochkulturen alle an großen Flüssen entstanden: Euphrat und Tigris, Nil, Indus, Gelber Fluss. Das ist kein Zufall, aber auch kein Automatismus. Flusstäler boten fruchtbaren Boden, der durch Überschwemmungen jedes Jahr neu mit Schlamm gedüngt wurde, und Wasser für Bewässerung. Wer Kanäle baut und Dämme unterhält, braucht aber Planung: Jemand muss Arbeit verteilen, Vorräte verwalten und Streit um Wasser schlichten. So entstehen Verwaltung, Priester oder Beamte und schließlich Herrscher. Man sagt manchmal, der Staat sei eine „Antwort“ auf die Probleme großer Bewässerungssysteme. Dieser Gedanke erklärt vieles, ist aber nicht unumstritten, denn manche frühen Städte entstanden schon, bevor es große zentrale Kanalsysteme gab.",
  "Entscheidend ist ein Kreislauf. Mehr Nahrung bedeutet mehr Menschen. Mehr Menschen bedeuten, dass nicht mehr alle Bauern sein müssen, und es entstehen Handwerker, Händler, Schreiber, Priester und Soldaten. Diese Spezialisten leben vom Überschuss der Bauern, und deshalb muss jemand den Überschuss einsammeln: Steuern in Form von Getreide oder Arbeit. Wer sammelt, muss zählen, und wer zählt, braucht Zeichen. So führt der Überschuss zu Verwaltung, Verwaltung zu Schrift und Schrift zu der Möglichkeit, noch größere Verwaltungen zu führen. Man kann hier gut sehen, dass Schrift nicht aus Dichtung, sondern aus Buchhaltung entstand: Die ältesten Tontafeln aus Uruk verzeichnen Getreide, Bier und Vieh.",
  "Ein weiterer Gedanke betrifft Ungleichheit. Wo es Überschuss gibt, gibt es etwas zu verteilen, zu besitzen und zu verteidigen. In den Gräbern der Jungsteinzeit finden sich noch ähnliche Beigaben, in den Gräbern der frühen Städte dagegen riesige Unterschiede zwischen Reichen und Armen. Die Herrscher rechtfertigten ihre Stellung religiös: Der König war Stellvertreter der Götter (Mesopotamien) oder selbst ein Gott (Ägypten). Das Beispiel zeigt, dass Macht in Gesellschaften immer eine Erzählung braucht, warum sie rechtmäßig ist. Dieser Gedanke zieht sich durch die ganze Geschichte, vom Gottkönigtum bis zum Gottesgnadentum (Einheit 23) und zur Volkssouveränität (Einheit 26)."
]});
addEnd(UNITS.u2, { h: "Der Preis der Zivilisation: Gesundheit, Arbeit, Ungleichheit", p: [
  "Der Übergang zur Landwirtschaft war für die Menschen nicht automatisch ein Fortschritt. Skelettfunde zeigen, dass frühe Bauern oft kleiner, kränker und schlechter ernährt waren als Jäger und Sammler. Ihre Nahrung war einseitiger, Getreide führte zu Karies und Mangelerscheinungen, und bei Missernten drohte Hunger. Auch die Arbeit war härter. Dazu kam, dass das enge Zusammenleben mit Tieren und in dichten Siedlungen Krankheiten begünstigte: Masern, Pocken und Tuberkulose stammen vermutlich aus Tierkrankheiten, die auf den Menschen übersprangen. Hier beginnt ein Thema, das durch die Geschichte läuft (Roter Faden Seuchen): Je dichter Menschen leben und je mehr sie handeln, desto leichter breiten sich Krankheiten aus.",
  "Warum setzte sich die Landwirtschaft trotzdem durch? Der Grund ist einfach und zugleich wichtig: Ein Hektar Ackerland ernährt viel mehr Menschen als ein Hektar Jagdgebiet. Wenn eine Gruppe Ackerbau betreibt, wächst sie schneller und verdrängt oder übernimmt Nachbarn, auch wenn der einzelne Mensch nicht besser lebt. Die Mehrheit gewinnt, auch wenn die Lebensqualität sinkt. Das ist ein Muster, das wir später bei der Industrialisierung wieder sehen werden (Einheit 28): Neue Techniken setzen sich durch, weil sie Macht und Zahl erhöhen, nicht unbedingt, weil sie das Leben des Einzelnen sofort verbessern.",
  "Ein zweites Muster: Staaten sind verletzlich. Dieselben Strukturen, die Überschuss schaffen, machen abhängig von Wetter, Wasser und Ernte. Ein paar trockene Jahre konnten ein ganzes Reich ins Wanken bringen. Der Zusammenbruch der Bronzezeit um 1200 v. Chr. (siehe Abschnitt „Zusammenbruch und Alphabet“) hing wohl mit Dürre, Erdbeben, Kriegen und der Abhängigkeit weit verzweigter Handelsnetze zusammen. Komplexität bringt Leistung, aber auch Anfälligkeit. Diese Einsicht hilft, spätere Zusammenbrüche wie den Roms (Einheit 7) besser zu verstehen: Sie sind selten die Folge eines einzigen Ereignisses, sondern von mehreren gleichzeitigen Belastungen."
]});

addAfter(UNITS.u3, "Athen: der Weg zur Demokratie", { h: "Warum gerade Athen? Die Logik hinter der Demokratie", p: [
  "Dass in Athen die Bürger selbst entschieden, war kein Zufall und auch kein Sieg der Vernunft über die Dummheit. Es folgte aus Bedingungen, die sich gegenseitig verstärkten. Erstens: die Art, wie man Krieg führte. Seit dem 7. Jahrhundert v. Chr. kämpften die Griechen in der Phalanx, einer geschlossenen Reihe schwer bewaffneter Fußsoldaten (Hopliten). Eine Phalanx funktioniert nur, wenn jeder Mann hält. Es kam also nicht mehr auf einzelne adlige Reiter an, sondern auf viele wohlhabende Bauern, die sich eine Rüstung leisten konnten. Wer sein Leben für die Polis einsetzt, will auch mitreden. Das ist eine alte Beobachtung: Rechte folgen oft auf Pflichten.",
  "Zweitens: das Meer. Athen war eine Seemacht, und eine Flotte braucht Ruderer, in Athen Zehntausende. Das waren die Ärmsten, die Theten, die sich keine Rüstung leisteten. Als Athen im 5. Jahrhundert seine Sicherheit auf die Flotte gründete, wurden sie unverzichtbar. Ein Zeitgenosse, den man den „Alten Oligarchen“ nennt, schrieb bissig, es sei nur gerecht, dass die Armen mehr Macht hätten als die Edlen, denn sie bewegten die Schiffe. Das erklärt auch, warum Perikles später Ämter bezahlen ließ: Ein Ruderer konnte nicht tagelang auf der Versammlung sitzen, wenn er davon nichts zu essen hatte.",
  "Drittens: der Streit des Adels. Nach dem Sturz des Tyrannen Hippias 510 v. Chr. kämpften adelige Familien um die Vorherrschaft. Isagoras bekam die Hilfe Spartas, Kleisthenes holte sich Rückhalt beim Volk. Seine Reform von 508/507 war deshalb auch ein Machtkalkül: Wer das Volk auf seiner Seite hat, besiegt die Rivalen. Das Volk erhob sich tatsächlich gegen Isagoras und die Spartaner, und damit hatte die Bürgerschaft zum ersten Mal erfahren, dass sie politisch etwas durchsetzen kann.",
  "Viertens: die Größe. Direkte Demokratie funktioniert nur im kleinen Raum. Athen hatte vielleicht 30.000 bis 40.000 Bürger, und auf dem Hügel Pnyx fanden einige tausend Platz. Man kannte sich, man sah sich auf der Agora, man kannte die Redner. Je größer ein Staat wird, desto weniger geht das, und deshalb haben später Rom mit seinem Senat (Einheit 5) und das mittelalterliche England mit seinem Parlament (Einheit 12) andere Wege gefunden, Beteiligung zu organisieren. Die athenische Demokratie ist also kein fertiges Vorbild, sondern eine Antwort auf ganz bestimmte Umstände: Bürgersoldaten, Seemacht, zerstrittener Adel und ein überschaubarer Stadtstaat."
] });
addAfter(UNITS.u3, "Die Grenzen des Modells", { h: "Wie Athens Aufstieg seinen Absturz vorbereitete", p: [
  "Die Perserkriege, das goldene Zeitalter und der Peloponnesische Krieg (Einheit 4) gehören zu einer einzigen Geschichte. Man sieht sie am besten als Kette. Der Sieg über die Perser machte Athen zum Anführer des Seebundes. Die Bundesgenossen zahlten Beiträge, und weil Athen die Flotte stellte, floss das Geld nach Athen. 454 v. Chr. wurde die Bundeskasse von der Insel Delos nach Athen verlegt. Damit hatte der Bund aufgehört, ein Bündnis unter Gleichen zu sein. Aus dem Geld wurden Schiffe, Löhne für Ruderer und der Parthenon bezahlt. Kultur, Demokratie und Imperium hingen also eng zusammen: Die Ämterbezahlung und die Tempel wurden mit Tributen von Verbündeten finanziert, die sich nicht frei entscheiden konnten, ob sie dabeibleiben wollten.",
  "Sparta sah das mit wachsender Sorge. Ein Athen, das auf dem Meer herrschte, bedrohte das Gleichgewicht der griechischen Welt, und die Bundesgenossen Spartas fürchteten um ihren eigenen Handel. Der Konflikt, der 431 v. Chr. ausbrach, war deshalb nicht bloß ein Streit um Einzelheiten, sondern ein Zusammenprall zweier Systeme und zweier Machtblöcke. Die Seuche von 430 v. Chr., die ein Viertel oder mehr der Stadtbevölkerung tötete, riss Athen mitten im Krieg in die Tiefe und nahm ihm Perikles. Wer die Demokratie später kritisierte, nannte oft die Fehlentscheidungen nach seinem Tod, etwa die Sizilische Expedition, als Beleg dafür, dass eine Versammlung sich von Rednern verführen lässt.",
  "Man kann daraus zwei Lehren ziehen, die in den folgenden Einheiten wiederkehren. Erstens: Macht und Kultur hängen zusammen. Große Kulturleistungen entstehen oft dort, wo Geld und Sicherheit konzentriert sind, und dieses Geld hat oft eine Kehrseite (Seebund, Sklavenarbeit, später die Ausbeutung der Provinzen Roms). Zweitens: Siegreiche Systeme geraten durch ihren Erfolg in neue Probleme. Das gilt für Athen, später für Rom (Einheit 5) und im Kleinen für viele Staaten."
] });

addEnd(UNITS.u4, { h: "Warum ein Reich so schnell wuchs und so schnell zerfiel", p: [
  "Alexanders Eroberungen wirken wie ein Wunder, doch sie hatten Voraussetzungen. Sein Vater Philipp II. hatte Makedonien zu einem Staat mit einem stehenden Heer gemacht: Die Phalanx mit langen Lanzen (Sarissen), kombiniert mit der schweren Reiterei, war für damalige Verhältnisse eine überlegene Kampfform. Philipp hatte außerdem Goldminen erschlossen, die den Sold bezahlten, und die zerstrittenen griechischen Städte unter seine Führung gebracht. Alexander erbte also ein gut ausgerüstetes Heer und eine Idee, den Krieg gegen Persien als „panhellenischen“ Rachezug auszugeben.",
  "Zugleich war das Perserreich nicht so stark, wie es aussah. Es war riesig, aber der Zusammenhalt beruhte auf lokalen Statthaltern, den Satrapen, und auf der Loyalität des Adels. In der Schlacht bei Gaugamela (331 v. Chr.) traf Alexander auf ein Heer, das ihm zahlenmäßig überlegen war, aber schlecht koordiniert. Als König Dareios floh und später ermordet wurde, übernahm Alexander dessen Stellung, ließ sich als Nachfolger verstehen und behielt viele persische Verwaltungsformen bei. Das ist ein wiederkehrendes Muster: Eroberer, die dauerhaft herrschen wollen, übernehmen bestehende Verwaltungen, statt alles neu zu machen (so auch die Mongolen, Einheit 14, und die Osmanen, Einheit 21).",
  "Der Zerfall nach 323 v. Chr. folgt ebenfalls einer inneren Logik. Alexander starb mit etwa 32 Jahren ohne geeigneten Nachfolger, sein Sohn wurde erst nach seinem Tod geboren. Die Generäle, die Diadochen, kannten das Heer, hatten Truppen hinter sich und wollten ihre Stellung sichern. Ein Reich, dessen Zusammenhalt allein auf der Person des Königs und dem Heer beruht, hat keine Institutionen, die es ohne ihn tragen. Das erklärt, warum aus Alexanders Reich innerhalb einer Generation drei große Königreiche wurden: das Ptolemäerreich in Ägypten, das Seleukidenreich in Asien und Makedonien unter den Antigoniden. Im Vergleich dazu hielt das römische Reich (Einheiten 5 und 6) länger, weil es Institutionen, Recht und Bürgerrecht entwickelt hatte, die nicht an einen Mann gebunden waren."
]});
addEnd(UNITS.u4, { h: "Was die Griechen im Osten mitbrachten, und was sie dort fanden", p: [
  "Der Hellenismus war keine Einbahnstraße. Griechische Städte entstanden von Ägypten bis Afghanistan, die Sprache Koine wurde zur gemeinsamen Verkehrssprache, und griechische Architektur, Theater und Gymnasien prägten das Stadtbild. Zugleich übernahmen die Griechen im Osten vieles: Die babylonische Astronomie mit ihren langen Beobachtungsreihen ermöglichte griechischen Gelehrten erst genaue Modelle des Himmels. Die ägyptische Medizin und Mumifizierung gaben Hinweise auf Anatomie, die in Alexandria zu den ersten systematischen Sektionen führten (Herophilos und Erasistratos). Griechische Kunst nahm im Reich Gandhara am Rand Indiens buddhistische Motive auf, und es entstanden die ersten Buddha-Statuen in menschlicher Gestalt.",
  "Man sollte diese Mischkultur nicht idealisieren. Die griechisch-makedonische Oberschicht herrschte über die einheimische Bevölkerung, und der Zugang zu Ämtern und Bildung blieb vielen verwehrt. Aufstände gab es immer wieder, etwa die Makkabäer in Judäa gegen den Versuch, jüdische Bräuche zu unterdrücken (2. Jahrhundert v. Chr.). Das Beispiel zeigt, wie Anpassung und Widerstand nebeneinander bestehen können. Es erinnert daran, dass Kulturkontakt oft über Macht läuft, und dass die Betroffenen das sehr genau wahrnehmen.",
  "Warum ist das für das Verständnis später wichtig? Zum einen bildete der Hellenismus die Brücke, über die griechisches Wissen nach Rom und später in die islamische Welt gelangte (Einheit 10), und von dort wieder nach Europa. Zum anderen war er das erste große Beispiel einer globalisierten Welt vor der Moderne, in der Handel, Sprache und Ideen weite Räume verbanden. Die Seidenstraße (Einheit 14) setzte dieses Netz in Asien fort. Wer die Geschichte als Abfolge solcher Netze liest, versteht besser, warum Ideen oft an ganz anderen Orten weiterwirken, als sie entstanden sind."
]});

addEnd(UNITS.u5, { h: "Warum Rom Erfolg hatte: Bürger, Bündnisse und Lernbereitschaft", p: [
  "Die Römer eroberten Italien und später das Mittelmeer nicht, weil sie die besten Soldaten oder die klügsten Feldherren gehabt hätten. Viele Schlachten verloren sie, am schlimmsten gegen Hannibal bei Cannae (216 v. Chr.), wo innerhalb eines Tages vielleicht 50.000 Mann fielen. Entscheidend war, dass Rom Niederlagen verkraften konnte. Der Grund liegt in seiner Struktur. Unterworfene Städte in Italien wurden nicht einfach ausgeplündert, sondern in ein Bündnissystem eingebunden: Sie behielten Selbstverwaltung, mussten aber Soldaten stellen. Manche erhielten das römische Bürgerrecht. Als Hannibal nach Cannae darauf setzte, dass die Bundesgenossen abfallen würden, blieb die Mehrheit treu, weil sie sich durch Rom geschützt und beteiligt sahen.",
  "Daraus ergab sich ein Reservoir an Soldaten, das kein Gegner erreichte. Karthago dagegen kämpfte mit Söldnern und war auf wenige Führer angewiesen. Rom lernte zudem schnell. Als es gegen Karthago die Seeherrschaft brauchte, kopierte es ein gestrandetes karthagisches Schiff und baute eine Flotte; die Römer entwickelten den „Corvus“, eine Enterbrücke, die Seeschlachten in Landkämpfe verwandelte. Diese Lernbereitschaft, verbunden mit Ausdauer, erklärt viel. Man kann sagen: Rom gewann nicht, weil es nie scheiterte, sondern weil es nach Rückschlägen nicht aufgab und Fehler korrigierte.",
  "Auch die politische Ordnung trug dazu bei. Die Republik verteilte Macht: Zwei Konsuln regierten gemeinsam und nur ein Jahr, der Senat beriet, die Volksversammlungen wählten. Das verhinderte, dass ein Einzelner zu mächtig wurde, und sorgte dafür, dass viele Männer der Oberschicht in Amt und Ehre aufstiegen und am Erfolg beteiligt waren. Das Ziel war Konsens in der Elite. Aber dieses System war für einen Stadtstaat gemacht, nicht für ein Weltreich. Genau daran zerbrach es später."
]});
addEnd(UNITS.u5, { h: "Wie der Erfolg die Republik zerstörte: eine Kette von Ursachen", p: [
  "Die Eroberungen veränderten Rom von innen. Siegreiche Feldherren brachten Beute und Sklaven in Massen nach Italien. Reiche Senatoren kauften Land und bewirtschafteten es mit Sklaven in großen Gütern („Latifundien“). Kleine Bauern, die als Soldaten jahrelang im Ausland dienten, kamen heim und fanden ihre Höfe verfallen oder konnten gegen die billige Sklavenarbeit nicht bestehen. Viele zogen nach Rom und lebten dort als Arme. Der Kreis schloss sich: Das Heer bestand aus Bauern, und ohne Bauern fehlten Soldaten. Die Brüder Tiberius und Gaius Gracchus versuchten um 133 und 123 v. Chr., Land an Arme zu verteilen, und wurden von Gegnern im Senat ermordet. Das war ein Wendepunkt, denn erstmals wurde politischer Streit mit Gewalt gelöst.",
  "Eine zweite Folge betraf das Heer. Weil Landlose keinen Besitz hatten, den sie hätten verteidigen können, reformierte Marius um 107 v. Chr. das Heer und ließ auch Besitzlose eintreten. Diese Berufssoldaten hofften auf Sold und Land am Ende der Dienstzeit, und das erhielten sie nicht vom Staat, sondern von ihrem Feldherrn. Dadurch wurde die Loyalität der Soldaten persönlich: Sie folgten ihrem General, nicht dem Senat. Sulla marschierte 88 v. Chr. mit seinen Truppen auf Rom, Caesar überschritt 49 v. Chr. den Rubikon. Die Mittel zur Eroberung wurden zum Mittel der Machtübernahme im Inneren.",
  "Man erkennt hier eine allgemeine Einsicht: Institutionen, die für eine bestimmte Größe und Lage geschaffen wurden, geraten in Not, wenn sich die Umstände ändern. Die Republik war darauf angelegt, Einzelne zu begrenzen, aber sie konnte nicht verhindern, dass Einzelne durch Armee und Reichtum größer wurden als der Staat. Als Augustus nach Jahren des Bürgerkriegs das Prinzipat einführte (Einheit 6), tat er das nicht gegen die Römer, sondern mit deren Zustimmung, weil viele Frieden wollten. Dass Freiheit und Ordnung in Spannung stehen, ist ein Gedanke, den wir in der Französischen Revolution und bei Napoleon wiederfinden (Einheiten 26 und 27)."
]});

addEnd(UNITS.u6, { h: "Wie ein Weltreich zusammenhält: Straßen, Städte, Recht, Heer", p: [
  "Das Römische Reich umfasste um 117 n. Chr. gut fünf Millionen Quadratkilometer und vielleicht 60 bis 70 Millionen Menschen. Wie hielt man so etwas zusammen, ohne Telefon, ohne Eisenbahn? Die Antwort besteht aus mehreren sich ergänzenden Bausteinen. Erstens das Straßennetz von über 80.000 Kilometern, das ursprünglich für Truppen angelegt war, aber auch Händler, Boten und Reisende nutzten. Eine Nachricht konnte mit dem cursus publicus, dem staatlichen Kurierdienst, an einem Tag etwa 70 bis 80 Kilometer zurücklegen. Zweitens die Städte: Rom gründete oder förderte Städte mit Forum, Tempeln, Bädern, Aquädukten und Theatern, in denen die lokale Oberschicht die Verwaltung übernahm und sich dadurch mit dem Reich identifizierte.",
  "Drittens das Recht. Römisches Recht entwickelte Grundsätze, die wir bis heute kennen: Verträge müssen gehalten werden, wer anklagt, muss beweisen, Eigentum ist geschützt. Provinzbewohner waren anfangs Untertanen, später wurden immer mehr Menschen Bürger, und 212 n. Chr. verlieh Caracalla praktisch allen freien Reichsbewohnern das Bürgerrecht. Viertens das Heer von etwa 300.000 Mann, stationiert an den Grenzen und oft sesshaft. Soldaten heirateten, ihre Lager wurden zu Städten (Köln, Wien, Mainz gehen auf römische Lager zurück) und brachten Geld in die Region. Fünftens Religion: Rom duldete fremde Kulte, solange sie den Kaiserkult mitmachten. Wer sich weigerte, wie Christen und Juden zeitweise, geriet in Konflikt.",
  "Man erkennt eine Mischung aus Zwang und Angebot. Rom herrschte mit Gewalt, bot den lokalen Eliten aber Aufstieg, Sicherheit und Wohlstand. Die Römer verstanden, dass Herrschaft billiger ist, wenn die Beherrschten mitmachen. Das erklärt, warum viele Provinzen sich bald als „römisch“ verstanden. Es erklärt auch, warum das Reich im 3. und 4. Jahrhundert in Schwierigkeiten geriet, als die Mittel zur Bezahlung von Heer und Verwaltung knapp wurden (Einheit 7): Der Zusammenhalt beruhte auf Geld, und wenn das Geld wertlos wird, löst er sich."
]});
addEnd(UNITS.u6, { h: "Wer trug das Reich? Sklaven, Frauen und die Provinzen", p: [
  "Das Bild von Kaisern und Legionen verdeckt, wer die Arbeit tat. Schätzungen gehen davon aus, dass in Italien etwa jede dritte bis vierte Person unfrei war, im ganzen Reich weniger. Sklaven arbeiteten in Bergwerken, auf Gütern, im Haushalt, als Lehrer und Ärzte. Ihr Schicksal war sehr unterschiedlich: Wer in einem Bergwerk starb, hatte kaum Aussicht, wer als gebildeter Haussklave diente, konnte freigelassen werden und aufsteigen; Freigelassene und ihre Söhne gründeten Vermögen. Sklaverei war dennoch ein System aus Gewalt und völliger Rechtlosigkeit, das Aufstände wie den von Spartacus (73–71 v. Chr.) hervorbrachte. Es ist wichtig, das nicht zu beschönigen, auch wenn die Antike oft als Vorbild gilt (siehe Einheit 18 zum atlantischen Sklavenhandel als anderem System).",
  "Frauen hatten kein Wahlrecht und keine politischen Ämter, aber in der Praxis mehr Spielraum, als man denkt. Römische Frauen konnten Eigentum besitzen und erben, Geschäfte führen und sich scheiden lassen. In Inschriften finden sich Händlerinnen, Hebammen und Ärztinnen. Dennoch war die Gesellschaft patriarchalisch, und der Hausvater hatte weitreichende Rechte. Auch die Provinzbewohner prägten das Reich: Spätere Kaiser kamen aus Spanien (Trajan, Hadrian), Nordafrika (Septimius Severus) und dem Balkan (Diokletian, Konstantin). Das Reich wandelte sich vom Reich der Römer zum Reich vieler Völker.",
  "Für das Verständnis ist wichtig: Roms Stabilität beruhte auf einem Gleichgewicht aus Ausbeutung und Integration. Solange Provinzen wirtschaftlich blühten und ihre Eliten aufsteigen konnten, hielt das Reich. Die Medizin des Galen und die große Seuche der Antoninischen Pest (165 n. Chr., vermutlich Pocken) zeigen, dass auch ein gut organisiertes Reich gegen Seuchen wenig tun konnte, weil man die Ursachen nicht kannte. Der Verkehr, der das Reich verband, trug Krankheiten über weite Entfernungen. Verbindung bringt Nutzen und Risiko zugleich, ein Gedanke, den wir bei der Pest (Einheit 13) und bei der Spanischen Grippe (Einheit 35) wiederfinden."
]});

addAfter(UNITS.u7, "Die Krise des 3. Jahrhunderts", { h: "Ein Teufelskreis: wie die Krise sich selbst verstärkte", p: [
  "Die Krise des 3. Jahrhunderts wirkt auf den ersten Blick wie ein Durcheinander aus Kaisern, Kriegen und Seuchen. Dahinter steckt aber eine Logik, in der jedes Problem das nächste verschärfte. Am Anfang stand der Druck an den Grenzen: Sassaniden im Osten, Germanen am Rhein und an der Donau. Die Verteidigung verlangte mehr Soldaten und schnellere Reaktion. Mehr Soldaten kosteten Geld, und das Reich hatte kaum neue Einnahmen, denn die Zeit der großen Eroberungen, die Beute und Sklaven gebracht hatten (Einheit 5), war vorbei.",
  "Also griffen die Kaiser zu dem Mittel, das am schnellsten wirkte: Sie mischten billigeres Metall in das Silber der Münzen. Das hilft für kurze Zeit, denn der Staat kann mit derselben Silbermenge mehr Münzen prägen. Aber die Händler merken es, und die Preise steigen. Soldaten und Beamte, die in schlechterem Geld bezahlt werden, verlangen mehr, und der Staat prägt noch mehr schlechtes Geld. So entsteht eine Inflation. Steuern wurden daraufhin zunehmend in Naturalien erhoben, also in Getreide, Öl und Wolle, was die Wirtschaft schwerfälliger machte.",
  "Die Folgen trafen die Städte. Die wohlhabenden Bürger, die bisher aus eigenem Vermögen Straßen, Bäder und Feste finanziert hatten, wurden mit Abgaben belastet oder verarmten. Wer konnte, zog sich auf sein Landgut zurück. Die Städte verloren ihre Führungsschicht, und mit ihr das, was das Reich im Alltag zusammengehalten hatte. Dazu kamen die Seuche (Cyprianische Pest) und die ständigen Kämpfe. Das Heer war inzwischen der einzige Faktor, auf den man sich verlassen musste, und genau dadurch bekamen die Soldaten die Macht, Kaiser zu machen und zu stürzen. Jeder neue Kaiser musste sich ihre Treue mit Geld erkaufen, was die Kassen weiter leerte. Und weil Kaiser oft im Kampf um die Macht im Inneren gebunden waren, blieben die Grenzen schwächer geschützt.",
  "Diokletians Reformen lassen sich als Antwort auf genau diesen Kreislauf lesen: Die Tetrarchie sollte Zuständigkeit und Reaktionszeit verbessern, die Verwaltungsreform und das größere Heer die Grenzen sichern, die Steuerreform die Einnahmen berechenbar machen. Der Preis war ein straffer, teurer und zwanghafter Staat. Das erklärt, warum man später von einem „Zwangsstaat“ der Spätantike spricht, in dem Berufe vererbt und Bauern an die Scholle gebunden wurden. Hier liegt eine Wurzel dessen, was im Mittelalter als Grundherrschaft (Einheit 11) wiederkehrt."
] });
addAfter(UNITS.u7, "Konstantin und die Wende zum Christentum", { h: "Warum förderte Konstantin das Christentum? Drei Erklärungen", p: [
  "Die Frage, warum ein römischer Kaiser eine zuvor verfolgte Minderheit förderte, ist eine der spannendsten der Antike. Die Forschung nennt im Wesentlichen drei Erklärungen, die sich nicht ausschließen.",
  "Die erste lautet: persönliche Überzeugung. Konstantin berichtete selbst von einem Erlebnis vor der Schlacht an der Milvischen Brücke, und er blieb sein Leben lang dabei. Die zweite lautet: politisches Kalkül. Das Reich war nach Jahrzehnten der Krise gespalten, und der Kaiser brauchte etwas, das die Menschen verband. Das Christentum hatte etwas, was die alten Kulte nicht boten, nämlich eine Organisation über das ganze Reich mit Bischöfen, Gemeinden, Armenfürsorge und einem festen Glaubensbekenntnis. Der Kaiser gewann einen Verbündeten, der in jeder Stadt Einfluss hatte, und sicherte sich damit göttliche Rückendeckung. Die dritte Erklärung betrifft die Entwicklung der Kirche selbst: Gerade in der Krise des 3. Jahrhunderts hatten viele Menschen in den Gemeinden Halt, Hilfe in Notzeiten und eine Hoffnung gefunden, die ihnen der Staat nicht bot (Einheit 6). Das Christentum war also schon so stark, dass ein Kaiser es kaum mehr ignorieren konnte. Man kann auch sagen: Konstantin hat die Entwicklung nicht ausgelöst, aber er hat sie beschleunigt und ihr eine Form gegeben.",
  "Die Folgen sind groß, und sie führen weit in die späteren Einheiten. Mit Konstantin wird die Frage wichtig, wer über religiöse Fragen entscheidet: der Kaiser, der das Konzil von Nicäa einberief, oder die Bischöfe? Im Osten blieb der Kaiser eng mit der Kirche verbunden (Einheit 9), im Westen, wo es nach 476 keinen Kaiser mehr gab, wurde der Papst zur eigenständigen Macht. Daraus entsteht der Streit zwischen Kaiser und Papst, der im Hochmittelalter eskaliert (Einheit 12). Einer der großen roten Fäden dieser Geschichte beginnt also hier."
] });

addEnd(UNITS.u8, { h: "Warum ausgerechnet die Franken? Die Logik des Aufstiegs", p: [
  "Nach dem Ende des Weströmischen Reiches (Einheit 7) entstanden germanische Königreiche: Ostgoten in Italien, Westgoten in Spanien, Vandalen in Nordafrika, Burgunder, Langobarden. Die meisten verschwanden innerhalb weniger Generationen. Das Frankenreich dagegen blieb und wurde zur Grundlage des mittelalterlichen Europa. Warum? Ein erster Grund ist die Lage. Die Franken siedelten im Nordosten Galliens, in einem fruchtbaren Gebiet mit Rhein und Nordseehandel, und blieben mit ihrem Rücken am germanischen Raum. Sie konnten stets neue Krieger und Land gewinnen. Die Vandalen und Goten dagegen herrschten als kleine Minderheit über große römische Bevölkerungen und waren zudem Arianer, also Christen einer Richtung, die die römische Mehrheit als Ketzerei ansah.",
  "Der zweite Grund ist die Entscheidung Chlodwigs um 500, sich nach katholischem Ritus taufen zu lassen. Damit gewann er die Unterstützung der gallo-römischen Bischöfe, die über Bildung, Verwaltung und Einfluss verfügten. Für die Römer in Gallien war er kein Fremdherrscher mehr, sondern ein Glaubensbruder. Das ist ein klassisches Beispiel dafür, wie Religion politische Legitimation schafft. Der dritte Grund liegt in der Verwaltung. Die Franken übernahmen viel von der römischen Praxis, etwa Grafschaften und Schriftlichkeit, wenn auch vereinfacht.",
