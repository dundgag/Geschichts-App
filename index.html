UNITS.u10 = {
  id: "u10",
  title: "Die islamische Welt: von Mekka bis Bagdad",
  lead: "Wie aus den Stämmen der Arabischen Halbinsel in hundert Jahren ein Reich von Spanien bis zum Indus wurde. Und warum Bagdad zeitweise die Wissenschaftshauptstadt der Welt war.",
  body: [
    { h: "Arabien vor dem Islam", p: [
      "Vor dem Islam war Arabien ein Land der Wüsten, Oasen und Stämme. Beduinen zogen mit Kamelen und Herden, Händler betrieben Karawanenhandel zwischen dem Indischen Ozean und dem Mittelmeer. Mekka war ein Handelsplatz und Pilgerort mit dem Heiligtum der Kaaba. Es gab Christen, Juden und Anhänger vieler Stammesgötter. Die beiden Großmächte der Region, Byzanz und das Sassanidenreich, hatten sich jahrzehntelang bekämpft und waren zu Beginn des 7. Jahrhunderts erschöpft."
    ]},
    { h: "Muhammad und die erste Gemeinde", p: [
      "Muhammad wurde um 570 in Mekka geboren, als Händler. Um 610 erlebte er nach islamischer Überlieferung die erste Offenbarung, deren Texte im Koran gesammelt sind. Er verkündete den einen Gott (Allah), Gerechtigkeit und Fürsorge für Schwache. Das brachte ihn in Konflikt mit mächtigen Mekkanern, deren Wohlstand von den Pilgerfahrten zu den alten Heiligtümern abhing. 622 wanderte er mit seinen Anhängern nach Medina aus, die Hidschra. Dieses Jahr ist der Beginn der islamischen Zeitrechnung. In Medina entstand die erste Gemeinde (Umma), die religiöse und politische Gemeinschaft zugleich war. 630 kehrte Muhammad nach Mekka zurück, 632 starb er.",
      "Die fünf Säulen des Islam sind das Glaubensbekenntnis, das tägliche Gebet, das Almosengeben, das Fasten im Monat Ramadan und die Pilgerfahrt nach Mekka. Neben dem Koran gelten die überlieferten Aussprüche und Handlungen Muhammads (Hadith, Sunna) als Quelle des Rechts."
    ]},
    { h: "Die Eroberungen", p: [
      "Nach Muhammads Tod führten die Kalifen („Nachfolger“) die Gemeinde. In atemberaubendem Tempo eroberten arabische Heere die Nachbarreiche. 636 schlugen sie die Byzantiner am Jarmuk, 637/638 die Perser bei Kadesia, 638 fiel Jerusalem, bis 642 war Ägypten erobert, 651 das Sassanidenreich untergegangen. Im Westen folgten Nordafrika (Karthago 698) und 711 die Iberische Halbinsel, wo das westgotische Reich schnell zusammenbrach. 732 wurde ein Vorstoß nach Gallien bei Tours und Poitiers gestoppt. Im Osten reichte das Reich bis nach Zentralasien und an den Indus.",
      "Warum gelang das so schnell? Byzanz und Persien waren erschöpft, die Eroberer waren beweglich und diszipliniert, und die Bevölkerung vieler Provinzen war des Steuerdrucks und der religiösen Streitigkeiten müde. Die Eroberer ließen Christen, Juden und andere Religionsgemeinschaften zunächst weitgehend in Ruhe, wenn sie eine Sondersteuer (Dschizya) zahlten und die Herrschaft anerkannten. Zwangsbekehrungen im großen Stil waren die Ausnahme, der Übertritt zum Islam geschah über Jahrhunderte, auch weil er Steuervorteile brachte. Arabisch wurde Sprache der Verwaltung und später der Wissenschaft."
    ]},
    { h: "Sunniten und Schiiten", p: [
      "Schon in der ersten Generation spaltete sich die Gemeinde über die Frage, wer Muhammad nachfolgen soll. Eine Gruppe hielt Muhammads Cousin und Schwiegersohn Ali und seine Nachkommen für die rechtmäßigen Führer. Sie wurden „Partei Alis“ (Schia) genannt. Die Mehrheit akzeptierte die Wahl der Kalifen aus der Gemeinde und folgte der Sunna, sie sind die Sunniten. Ali wurde 656 vierter Kalif und 661 ermordet. Danach übernahm die Familie der Umayyaden das Kalifat und regierte von Damaskus aus (661–750). 680 wurde Alis Sohn Husain mit seinen Anhängern bei Kerbela von umayyadischen Truppen getötet. Dieses Ereignis ist bis heute das zentrale Trauerereignis der Schiiten (Aschura).",
      "Heute sind etwa neun von zehn Muslimen Sunniten. Die Schiiten sind die Mehrheit im Iran, im Irak und in Bahrain und stellen große Minderheiten in vielen weiteren Ländern. Der Konflikt hat theologische Wurzeln, wurde aber in der Geschichte oft politisch genutzt."
    ]},
    { h: "Bagdad und das Haus der Weisheit", p: [
      "750 stürzten die Abbasiden die Umayyaden. Sie verlegten den Schwerpunkt nach Osten, in das alte Persien und Mesopotamien, und gründeten 762 Bagdad als Hauptstadt, eine kreisförmig geplante Stadt am Tigris. Sie wurde zu einer der größten Städte der Welt. Unter Kalif Harun al-Raschid (786–809) und seinem Sohn al-Ma'mun (813–833) blühten Handel, Kunst und Gelehrsamkeit. Nach der Schlacht am Talas (751) war die Papierherstellung aus China in die islamische Welt gelangt, 794 gab es in Bagdad eine Papiermühle, und Bücher wurden billiger.",
      "Im Haus der Weisheit in Bagdad und an vielen anderen Orten arbeiteten Übersetzer, oft Christen, Juden und Perser, im Auftrag der Kalifen und reicher Mäzene. Sie übersetzten griechische Schriften von Aristoteles, Euklid, Ptolemäus, Hippokrates und Galen ins Arabische, dazu persische und indische Werke. Der Wissenstransfer war enorm, aber er blieb nicht bei der Übersetzung stehen."
    ]},
    { h: "Wissenschaft, Medizin und Wirtschaft", p: [
      "Der Gelehrte al-Chwarizmi (um 780–850) schrieb ein Lehrbuch über das Rechnen mit Gleichungen, dessen Titel „al-jabr“ uns das Wort Algebra gab. Sein Name wurde zu „Algorithmus“. Er brachte das indische Zahlensystem mit der Null in die arabische Welt, von dort kamen die „arabischen Ziffern“ nach Europa. Ibn al-Haytham (965–1040) untersuchte das Sehen und das Licht experimentell und gilt als Mitbegründer der Optik und der experimentellen Methode.",
      "Auch die Medizin blühte. Al-Razi (Rhazes, um 865–925), leitender Arzt an Bagdader Spitälern, unterschied als Erster klar Pocken von Masern und schrieb ein riesiges Sammelwerk. Ibn Sina (Avicenna, 980–1037) fasste im „Kanon der Medizin“ (um 1025) das Wissen seiner Zeit zusammen, das Werk wurde in Europa bis ins 17. Jahrhundert gelehrt. Al-Zahrawi (936–1013) beschrieb in Córdoba chirurgische Instrumente und Eingriffe. Es gab Krankenhäuser (Bimaristane) mit ausgebildeten Ärzten, Abteilungen für verschiedene Krankheiten und Prüfungen für Ärzte.",
      "Die Wirtschaft profitierte von einem riesigen Handelsraum vom Atlantik bis nach Indien. Neue Pflanzen wie Zuckerrohr, Baumwolle, Zitrusfrüchte und Reis verbreiteten sich im Mittelmeerraum, dazu fortgeschrittene Bewässerungstechnik."
    ]},
    { h: "Zerfall und neue Mächte", p: [
      "Politisch zerfiel das Abbasidenreich ab dem 9. und 10. Jahrhundert in mehrere Herrschaftsbereiche. In Spanien herrschten die Umayyaden von Córdoba, die 929 ein eigenes Kalifat ausriefen, in Ägypten die schiitischen Fatimiden (Kairo gegründet 969, Al-Azhar-Moschee 970), im Osten türkische Dynastien. 1055 übernahmen die türkischen Seldschuken die Kontrolle über Bagdad. Die Kreuzzüge (ab 1095) brachten christliche Heere in die Region, bis Saladin 1187 Jerusalem zurückeroberte. 1258 zerstörten die Mongolen Bagdad und töteten den letzten abbasidischen Kalifen. 1260 stoppten die ägyptischen Mamluken sie bei Ain Dschalut.",
      "In Spanien verdrängten die christlichen Königreiche die muslimische Herrschaft in der Reconquista: Toledo fiel 1085, Córdoba 1236, und Granada, das letzte muslimische Reich auf der Halbinsel, 1492. Gerade in Toledo wurden arabische Werke im 12. Jahrhundert ins Lateinische übersetzt und gaben Europas Universitäten entscheidende Impulse."
    ]}
  ],

  deep: [
    ["Das Haus der Weisheit: wie viel ist Legende?", "Das Bild einer großen Bibliothek mit Universität stammt vor allem aus späteren Berichten. Sicher ist, dass die Kalifen eine große Übersetzungsbewegung förderten und Gelehrte um sich sammelten. Wie das Haus der Weisheit genau organisiert war, ist in der Forschung umstritten. Fest steht, dass im 9. Jahrhundert innerhalb weniger Jahrzehnte ein großer Teil der griechischen Wissenschaft ins Arabische übertragen wurde."],
    ["Wie kam das Wissen nach Europa?", "Über mehrere Wege. Im spanischen Toledo übersetzten ab dem 12. Jahrhundert Gelehrte arabische Werke ins Lateinische, in Süditalien und Sizilien trafen lateinische, griechische und arabische Kultur aufeinander, und im 11. Jahrhundert übersetzte Constantinus Africanus in Süditalien medizinische Texte. Mit ihnen erreichte Europa den Kanon des Ibn Sina, Schriften al-Razis und einen Großteil der Werke Galens und des Aristoteles. Die Scholastik und die Universitäten bauten darauf auf."],
    ["Rhazes und die Pocken", "Al-Razi schrieb um 910 eine Abhandlung über Pocken und Masern. Er beschrieb den Verlauf beider Krankheiten, wies auf Unterschiede hin und gab Empfehlungen zur Pflege. Er stützte sich dabei auf Beobachtung und eigene Erfahrung im Krankenhaus. Sein Ansatz, Lehrmeinungen kritisch an Beobachtungen zu messen, gilt als vorbildlich für die empirische Medizin."]

UNITS.u11 = {
  id: "u11",
  title: "Hochmittelalter: Ordnung und Alltag",
  lead: "Wie Menschen zwischen 1000 und 1300 lebten: Bauern, Ritter, Städter, Mönche. Und wie in dieser Zeit Städte, Universitäten und gotische Kathedralen entstanden.",
  body: [
    { h: "Aufschwung nach 1000", p: [
      "Ab etwa 1000 wuchs Europa spürbar. Die Wikingerüberfälle und Ungarneinfälle hatten nachgelassen, das Klima war mild (die „mittelalterliche Warmzeit“), und neue Techniken steigerten die Erträge: der schwere Räderpflug mit Streichbrett, das Kummet für Pferde, die Dreifelderwirtschaft und Wassermühlen. Mehr Nahrung bedeutete mehr Menschen. Die Bevölkerung Europas stieg zwischen 1000 und 1300 grob von etwa 35 auf 70 bis 80 Millionen. Wälder wurden gerodet, Sümpfe entwässert, und im Osten siedelten Deutsche neue Dörfer und Städte (Ostsiedlung)."
    ]},
    { h: "Die Ständeordnung", p: [
      "Die Zeitgenossen sahen ihre Gesellschaft als von Gott geordnet in drei Gruppen: die, die beten (Klerus), die, die kämpfen (Adel), und die, die arbeiten (Bauern). Das war ein Ideal. In Wirklichkeit gab es viele Zwischenstufen, und das Leben der meisten verlief in engen Grenzen. Rund 80 bis 90 Prozent der Menschen lebten auf dem Land.",
      "Die Grundlage war die Grundherrschaft: Ein Herr (Adliger, Kloster oder Bischof) besaß das Land, Bauern bewirtschafteten es und mussten dafür Abgaben und Dienste leisten, also einen Teil der Ernte abliefern, Frondienste verrichten und Gebühren zahlen. Viele Bauern waren nicht frei, sondern „Hörige“, die an das Land gebunden waren, aber nicht wie Sklaven verkauft werden konnten. Es gab große regionale Unterschiede, in manchen Gegenden lebten viele freie Bauern.",
      "Das Lehnswesen regelte das Verhältnis innerhalb des Adels. Ein Lehnsherr gab einem Vasallen ein Lehen (Land oder Amt) und versprach Schutz, der Vasall leistete Treue und Kriegsdienst. Das System war nie so einheitlich, wie es spätere Lehrbücher zeigten. Die Forschung betont heute, dass persönliche Bindungen, Verträge und Gewohnheiten sehr unterschiedlich waren."
    ]},
    { h: "Alltag auf dem Dorf", p: [
      "Das bäuerliche Leben richtete sich nach den Jahreszeiten und dem Kirchenjahr. Gearbeitet wurde von Sonnenaufgang bis Sonnenuntergang, gegessen wurden vor allem Getreidebrei, Brot, Gemüse, Hülsenfrüchte und nur selten Fleisch. Missernten bedeuteten Hunger. Häuser waren klein, aus Holz und Lehm, Menschen und Vieh lebten oft unter einem Dach. Die Lebenserwartung bei der Geburt lag bei etwa 30 Jahren, vor allem wegen der hohen Säuglings- und Kindersterblichkeit. Wer das Erwachsenenalter erreichte, konnte durchaus 50 oder 60 Jahre alt werden.",
      "Die Kirche war Mittelpunkt des Dorfes: Sie begleitete Geburt, Heirat und Tod, und der Sonntag sowie die vielen Feiertage unterbrachen die Arbeit. Frauen arbeiteten auf dem Hof, in der Textilherstellung und beim Brauen. Die gesamte Familie war ein Wirtschaftsbetrieb."
    ]},
    { h: "Ritter und Burgen", p: [
      "Der Ritter war ein berittener Krieger im Dienst eines Herrn. Zunächst war das ein Beruf, später wurde „Ritter“ zum Standesbegriff mit eigener Kultur: Ideale von Tapferkeit, Treue und Dienst an Schwachen und Frauen („Minne“), die in Dichtung wie dem Parzival Wolframs von Eschenbach verherrlicht wurden. Die Wirklichkeit war rauer, Fehden und Plünderungen gehörten zum Alltag. Burgen entstanden zunächst aus Holz und Erde, später aus Stein, und waren Wohnsitz, Verwaltungssitz und Festung zugleich, selten so komfortabel, wie Filme sie zeigen."
    ]},
    { h: "Städte und Handel", p: [
      "Im Hochmittelalter entstanden in Europa Hunderte neuer Städte. Sie waren meist ummauert und hatten Märkte. Wer ein Jahr und einen Tag in der Stadt lebte, konnte nach dem Grundsatz „Stadtluft macht frei“ der Hörigkeit entkommen, auch wenn das regional verschieden galt. Die Bürger organisierten sich in Zünften und Gilden, wählten Räte und strebten nach Selbstverwaltung, oft im Streit mit dem Stadtherrn. Die meisten Städte hatten nur wenige tausend Einwohner. Große Zentren wie Paris, Venedig, Mailand, Florenz oder Köln erreichten 50.000 oder mehr.",
      "Im Norden schlossen sich Kaufleute im Bund der Hanse zusammen, die vom 13. bis ins 15. Jahrhundert den Handel in Nord- und Ostsee dominierte (Lübeck, Hamburg, Danzig, Nowgorod, Bergen). Gehandelt wurden Salz, Fisch, Pelze, Holz, Getreide und Tuch. In Oberitalien machten Venedig und Genua den Mittelmeerhandel reich, mit Waren aus dem Orient wie Gewürzen und Seide. Bankiers erfanden Wechsel, Buchführung und Versicherungen."
    ]},
    { h: "Universitäten und Gelehrsamkeit", p: [
      "Ab dem 12. Jahrhundert entstanden Universitäten, zunächst als Zusammenschlüsse von Lehrenden und Lernenden: Bologna (um 1088, Rechtswissenschaft), Paris (um 1150, Theologie), Oxford, Salerno (Medizin). In Deutschland folgten Prag (1348), Wien (1365), Heidelberg (1386) und Köln (1388). Man studierte zuerst die „sieben freien Künste“, dann Theologie, Recht oder Medizin. Gelehrt wurde auf Latein, durch Lesen und Disputieren.",
      "Die Gelehrten lasen jetzt Aristoteles, dessen Schriften über arabische Vermittlung nach Europa gekommen waren (Einheit 10), und versuchten, Glauben und Vernunft zu verbinden (Scholastik). Albertus Magnus (um 1200–1280) beobachtete die Natur, Thomas von Aquin (1225–1274) schuf in der „Summa theologiae“ eine umfassende Synthese von Aristoteles und christlicher Lehre. Roger Bacon forderte Experimente."
    ]},
    { h: "Gotik, Frauen und Medizin", p: [
      "Mit der Gotik entstand ein neuer Baustil: Spitzbögen, Kreuzrippengewölbe und Strebebögen erlaubten höhere, hellere Kirchen mit riesigen Glasfenstern. Die Kathedralen von Saint-Denis (um 1140), Chartres und Reims, später der Kölner Dom (Baubeginn 1248, vollendet erst 1880) waren Jahrzehnte oder Jahrhunderte dauernde Gemeinschaftsprojekte der ganzen Stadt.",
      "Hildegard von Bingen (1098–1179), Äbtissin, Mystikerin, Komponistin und Autorin von Schriften zur Natur und Heilkunde, ist eine der bekanntesten Frauen des Mittelalters. Einige der ihr zugeschriebenen Werke werden von der Forschung kritisch betrachtet, ihr Ruhm in der heutigen Naturheilkunde geht über das hinaus, was belegt ist. In Salerno in Süditalien entstand die erste bedeutende Medizinschule des Mittelalters, an der auch Frauen lehrten. Krankenhäuser wurden meist von Klöstern und Bruderschaften betrieben, etwa das Hôtel-Dieu in Paris. Die Medizin beruhte auf der Säftelehre von Hippokrates und Galen: Gesundheit hieß Gleichgewicht von Blut, Schleim, gelber und schwarzer Galle. Praktisch halfen Diät, Kräuter, Aderlass und Chirurgie, die Barbiere und Wundärzte betrieben."
    ]}
  ],

UNITS.u12 = {
  id: "u12",
  title: "Macht und Glaube: Kaiser, Papst und Kreuzzüge",
  lead: "Wer steht über wem: der Kaiser oder der Papst? Dazu die Kreuzzüge, die Verfolgung von Abweichlern und die ersten Grenzen königlicher Macht.",
  body: [
    { h: "Der Streit um die Investitur", p: [
      "Seit Otto dem Großen setzten die deutschen Könige Bischöfe und Äbte ein und belehnten sie mit Amt und Land (Investitur). Das war für sie praktisch: Geistliche hatten keine erbberechtigten Kinder, ihre Ämter fielen an den König zurück. Im 11. Jahrhundert forderte die Kirchenreform, ausgehend vom Kloster Cluny, die Freiheit der Kirche von weltlicher Einmischung. Papst Gregor VII. (1073–1085) ging noch weiter: Im „Dictatus papae“ (1075) beanspruchte er das Recht, Kaiser abzusetzen.",
      "König Heinrich IV. widersetzte sich. 1076 erklärte er den Papst für abgesetzt, der Papst bannte ihn und löste seine Untertanen vom Treueid. Das war gefährlich, denn die Fürsten nutzten die Gelegenheit, um gegen den König zu rebellieren. Im Januar 1077 zog Heinrich über die Alpen nach Canossa in Oberitalien, wo sich der Papst aufhielt, und tat öffentlich Buße. Der Papst musste ihn vom Bann lösen. Politisch war das ein kluger Zug Heinrichs, aber der Gang nach Canossa wurde zum Sinnbild der Demütigung des Königs. Der Streit endete erst 1122 mit dem Wormser Konkordat: Der Papst vergab das geistliche Amt, der König belehnte mit dem weltlichen Besitz."
    ]},
    { h: "Der Aufruf zu den Kreuzzügen", p: [
      "1095 rief Papst Urban II. in Clermont zum Kriegszug nach Jerusalem auf. Anlass war ein Hilfegesuch des byzantinischen Kaisers Alexios I. gegen die Seldschuken (Einheit 9). Für den Papst war es auch eine Chance, die Autorität der Kirche zu erhöhen und kriegerischen Adel nach außen zu lenken. Wer teilnahm, erhielt Ablass, also den Erlass von Bußstrafen. Zu den Beweggründen zählten echte Frömmigkeit, Abenteuerlust, Aussicht auf Land und Beute und Druck von Familie und Lehnsherren. Es lohnt sich, nicht nur eine Erklärung zu suchen.",
      "Der erste Kreuzzug (1096–1099) war ein militärischer Erfolg. 1099 eroberten die Kreuzfahrer Jerusalem und töteten viele Einwohner, Muslime wie Juden. Es entstanden Kreuzfahrerstaaten an der Levante: Grafschaft Edessa, Fürstentum Antiochia, Königreich Jerusalem und Grafschaft Tripolis."
    ]},
    { h: "Pogrome und Kreuzzüge im Inneren", p: [
      "Schon vor dem Heer der Ritter zogen 1096 Scharen von Pilgern los. Einige Gruppen ermordeten in Städten am Rhein, etwa in Speyer, Worms und Mainz, jüdische Gemeinden. Manche Bischöfe versuchten, Juden zu schützen, oft ohne Erfolg. Die Verfolgungen von 1096 gelten als Beginn einer langen Reihe judenfeindlicher Gewalt im mittelalterlichen Europa, die sich bei späteren Krisen, etwa in der Pest 1348/49, wiederholte (Einheit 13). Auch 1204 richtete sich ein Kreuzzug gegen christliche Mitchristen: Der Vierte Kreuzzug eroberte Konstantinopel."
    ]},
    { h: "Der weitere Verlauf der Kreuzzüge", p: [
      "1144 eroberten muslimische Truppen Edessa, was den zweiten Kreuzzug (1147–1149) auslöste, der scheiterte. 1187 besiegte Saladin, Herrscher über Ägypten und Syrien, bei Hattin das Kreuzfahrerheer und nahm Jerusalem ein. Er ließ die Bevölkerung gegen Lösegeld frei und gilt auch im Westen als ritterlicher Gegner. Der dritte Kreuzzug (1189–1192) mit Kaiser Friedrich Barbarossa, der 1190 im Fluss Saleph in Kleinasien ertrank, Philipp II. von Frankreich und Richard Löwenherz erreichte Jerusalem nicht, sicherte aber einen Küstenstreifen und freien Pilgerzugang.",
      "Der vierte Kreuzzug (1202–1204) wurde von Venedig umgelenkt und endete mit der Plünderung Konstantinopels. 1229 erreichte Kaiser Friedrich II. durch Verhandlungen mit dem ägyptischen Sultan al-Kamil die Herausgabe Jerusalems, ohne Schlacht. 1291 fiel Akkon, die letzte Bastion der Kreuzfahrer. Insgesamt hatten die Kreuzzüge militärisch wenig dauerhaften Erfolg. Langfristig förderten sie den Handel mit dem Orient, stärkten die Position der italienischen Städte und vertieften das Misstrauen zwischen Christen und Muslimen sowie zwischen West- und Ostkirche. In der islamischen Welt nahm man sie zunächst als eine von vielen Auseinandersetzungen wahr, erst im 19. und 20. Jahrhundert wurden sie dort stark politisch aufgeladen. Neben dem Orient gab es auch Kreuzzüge im Baltikum und in Spanien."
    ]},
    { h: "Staufer und Friedrich II.", p: [
      "Die Staufer stellten von 1138 bis 1254 mehrfach die Könige und Kaiser. Friedrich I. Barbarossa (1155–1190) versuchte, die Macht in Italien durchzusetzen, scheiterte aber an den oberitalienischen Städten (Schlacht bei Legnano 1176). In Deutschland entmachtete er seinen Rivalen Heinrich den Löwen, den Herzog von Sachsen und Bayern, und stützte sich auf Lehen und Ministeriale.",
      "Sein Enkel Friedrich II. (1194–1250) wuchs in Sizilien auf, einer Region, in der lateinische, griechische und arabische Kultur zusammentrafen. Er sprach mehrere Sprachen, förderte Wissenschaft und schrieb ein Buch über die Falknerei, in dem er sich auf Beobachtung stützt und Aristoteles kritisiert. Er gründete 1224 die Universität Neapel und regierte Sizilien als straff organisierter Staat. Wegen seiner Konflikte mit den Päpsten wurde er mehrfach gebannt. Nach seinem Tod 1250 und dem Ende der Staufer begann in Deutschland das „Interregnum“, eine Zeit ohne allgemein anerkannten König (1250–1273), in der die Fürsten ihre Macht ausbauten."
    ]},
    { h: "Die Kirche auf dem Höhepunkt – und ihre Gegner", p: [
      "Unter Innozenz III. (1198–1216) erreichte das Papsttum den Gipfel seiner politischen Macht. Es verlangte Gehorsam von Königen und rief zu Kreuzzügen auf. 1215 beschloss das Vierte Laterankonzil, dass alle Gläubigen mindestens einmal jährlich beichten und kommunizieren sollen. Zugleich entstanden Bettelorden wie die Franziskaner (Franz von Assisi, 1181/82–1226) und die Dominikaner, die in den Städten predigten und ein Leben in Armut führten.",
      "Wer von der Lehre abwich, wurde als Ketzer verfolgt. Gegen die Katharer in Südfrankreich rief die Kirche 1209 zum Albigenserkreuzzug auf, der mit großer Gewalt zur Unterwerfung des Südens führte. Ab 1231 wurde die Inquisition als kirchliches Verfahren gegen Ketzer organisiert. Sie arbeitete mit Verhören, Zeugen und auch mit Folter, und die Urteile reichten von Bußen bis zur Verbrennung. Das Ausmaß wird in der Forschung differenziert beurteilt: Die Verfolgungen waren nicht überall gleich stark, und manche populäre Zahlen stammen aus späteren Epochen."
    ]},
    { h: "Recht und Grenzen der Macht: Magna Carta", p: [
      "In England zwang 1215 eine Gruppe aufständischer Barone König Johann („Ohneland“), die Magna Carta zu besiegeln. Anlass waren hohe Steuern und Willkür. Das Dokument legte fest, dass auch der König an das Recht gebunden ist. Einzelne Klauseln, etwa dass kein freier Mann ohne rechtmäßiges Urteil verhaftet werden darf, wirkten weit über ihre Zeit hinaus. Zunächst galt sie nur wenige Wochen und betraf vor allem die Rechte der Barone, aber sie wurde später mehrfach erneuert und zu einem Bezugspunkt für Rechtsstaatlichkeit. 1265 berief Simon de Montfort ein Parlament mit Vertretern der Städte ein, ein Vorläufer des englischen Parlaments."
    ]}
  ],

  deep: [
    ["Warum zogen Menschen ins Heilige Land?", "Die Forschung nennt viele Motive: Buße und Frömmigkeit (die Pilgerfahrt war eine verbreitete Frömmigkeitsübung), Aussicht auf Land und Ruhm, Verpflichtung gegenüber Lehnsherren, Kirchenpropaganda, aber auch das Gefühl, Christen im Osten zu helfen. Ein jüngerer Zweig der Forschung zeigt, dass viele Kreuzfahrer hohe Kosten hatten und oft verschuldet zurückkehrten oder nie zurückkamen. Reichtum war also nicht der Hauptantrieb."],
    ["Der Gang nach Canossa", "Heinrich soll drei Tage im Büßergewand vor der Burg gewartet haben. So berichten es Quellen, die dem Papst nahestehen. Ob die Szene so dramatisch war, wird diskutiert. Politisch gewann Heinrich Zeit und löste das Bündnis der Fürsten gegen sich auf. Den Konflikt entschied er später militärisch und ließ den Papst vertreiben."],

UNITS.u13 = {
  id: "u13",
  title: "Spätmittelalter: Pest, Krieg und Umbruch",
  lead: "Hunger, Seuche, Krieg und Kirchenspaltung erschüttern Europa im 14. Jahrhundert. Und aus der Krise wachsen Buchdruck, Renaissance und neue Mächte.",
  body: [
    { h: "Das Ende der Wachstumszeit", p: [
      "Um 1300 stieß Europa an Grenzen. Die Bevölkerung war so stark gewachsen, dass Land knapp wurde, die Erträge sanken, und das Klima wurde kälter (die „Kleine Eiszeit“ kündigte sich an). 1315 bis 1317 führten Dauerregen und Missernten zur Großen Hungersnot in weiten Teilen Nordeuropas, bei der Hunderttausende starben. Geschwächte Menschen waren anfälliger für Krankheiten, und die Gesellschaft stand unter Druck, als 1347 die Pest kam."
    ]},
    { h: "Der Schwarze Tod", p: [
      "Die Pest erreichte Europa 1347 über genuesische Schiffe aus dem Schwarzen Meer, wohl aus Zentralasien über die Handelswege der Mongolen. Der Erreger ist das Bakterium Yersinia pestis, das durch Flöhe von Ratten und anderen Nagetieren auf Menschen übertragen wird, daneben gab es wahrscheinlich auch Ansteckung von Mensch zu Mensch. 1347 bis 1353 raffte sie, nach heutigen Schätzungen, etwa ein Drittel bis die Hälfte der Bevölkerung Europas hin, regional sehr unterschiedlich. Auch Nordafrika und der Nahe Osten waren betroffen. Es war die größte Katastrophe der europäischen Geschichte, und die Seuche kehrte in Wellen bis ins 18. Jahrhundert wieder.",
      "Man verstand die Krankheit nicht. Gelehrte machten „schlechte Luft“ (Miasmen), Planetenkonstellationen oder die Strafe Gottes verantwortlich. Dennoch entwickelte man wirksame Gegenmaßnahmen. Venedig und Ragusa (Dubrovnik) isolierten ab 1377 ankommende Schiffe für dreißig Tage (trentino), später vierzig (quaranta giorni, daher „Quarantäne“). Städte bauten Pestspitäler und führten Gesundheitsbehörden ein."
    ]},
    { h: "Folgen und Verfolgung", p: [
      "Der Mangel an Arbeitskräften führte dazu, dass Löhne stiegen und Landarbeiter bessere Bedingungen forderten. Manche Grundherren versuchten, Löhne gesetzlich zu begrenzen. Es kam zu Aufständen, etwa 1358 in Frankreich (Jacquerie) und 1381 in England (Bauernaufstand unter Wat Tyler). Auf längere Sicht schwächte die Pest in Westeuropa die Leibeigenschaft, während sie im Osten teils verschärft wurde.",
      "Auch die Verfolgung von Minderheiten nahm zu. In vielen Städten beschuldigte man Juden, die Brunnen vergiftet zu haben. Zwischen 1348 und 1351 wurden in Dutzenden Städten, darunter Straßburg, Basel, Mainz und Köln, jüdische Gemeinden ermordet oder vertrieben. Papst Clemens VI. verurteilte 1348 diese Anschuldigungen und stellte fest, dass auch Gegenden ohne Juden von der Pest heimgesucht wurden, doch er konnte die Gewalt nicht stoppen. Manche Stadträte schützten Juden, andere profitierten von ihrem Besitz."
    ]},
    { h: "Der Hundertjährige Krieg", p: [
      "Von 1337 bis 1453 führten England und Frankreich in Abständen Krieg, bekannt als Hundertjähriger Krieg. Auslöser war ein Streit um die französische Thronfolge, den der englische König Eduard III. für sich beanspruchte, dazu kamen Konflikte um englische Besitzungen in Frankreich und um Flandern. Die englischen Langbogenschützen siegten bei Crécy (1346) und Azincourt (1415). Eine Wende brachte Jeanne d'Arc, eine junge Bäuerin, die sich von Stimmen geleitet sah. 1429 führte sie ein französisches Heer zum Entsatz von Orléans. Sie wurde 1430 gefangen genommen und 1431 von einem kirchlichen Gericht in Rouen als Ketzerin verbrannt, später rehabilitiert und 1920 heiliggesprochen. 1453 endete der Krieg mit der Vertreibung der Engländer, bis auf Calais.",
      "Der Krieg stärkte die Idee von nationalen Königreichen und veränderte die Kriegführung: Söldnerheere, Bogen- und frühe Feuerwaffen minderten den Wert der schweren Ritterreiterei."
    ]},
    { h: "Die Kirche in der Krise", p: [
      "Das Papsttum geriet im 14. Jahrhundert unter Druck. Nach einem Streit mit dem französischen König Philipp IV. residierten die Päpste von 1309 bis 1377 in Avignon, zeitweilig unter starkem französischem Einfluss. Als Gregor XI. nach Rom zurückkehrte und 1378 starb, wählten die Kardinäle einen Italiener (Urban VI.), dann mehrheitlich einen Gegenpapst. Es folgte das Abendländische Schisma (1378–1417) mit zwei, zeitweise drei Päpsten, die einander bannten. Erst das Konzil von Konstanz (1414–1418) beendete die Spaltung mit der Wahl Martins V.",
      "Kritiker forderten eine Reform. John Wyclif in England und Jan Hus in Böhmen griffen den Reichtum der Kirche an und forderten Predigt in der Volkssprache und Bibel für alle. Hus wurde in Konstanz trotz zugesichertem freiem Geleit 1415 verbrannt, danach folgten die Hussitenkriege in Böhmen. Die Unruhen waren ein Vorspiel zur Reformation (folgende Kapitel)."
    ]},
    { h: "Das Reich, die Städte und die Schweiz", p: [
      "Im Heiligen Römischen Reich verfestigte sich die Macht der Fürsten. Die Goldene Bulle von 1356, ein Reichsgesetz Karls IV., legte fest, dass sieben Kurfürsten den König wählen: die Erzbischöfe von Mainz, Trier und Köln sowie der König von Böhmen, der Pfalzgraf bei Rhein, der Herzog von Sachsen und der Markgraf von Brandenburg. Karl IV. machte Prag zu einem Zentrum und gründete 1348 die erste Universität im Reich. Die Habsburger stiegen im 15. Jahrhundert auf. In den Alpen wehrte sich die Eidgenossenschaft gegen Habsburg, ein Bündnis, das 1291 begann und im 14. Jahrhundert wuchs.",
      "In den Städten stritten Zünfte und Patrizier um Macht. In Italien herrschten mächtige Familien wie die Medici in Florenz, die als Bankiers reich wurden."
    ]},
    { h: "Konstantinopel 1453 und das Osmanische Reich", p: [
      "Das Osmanische Reich entstand um 1300 in Westanatolien und dehnte sich rasch auf den Balkan aus. 1389 besiegte es auf dem Amselfeld ein serbisch geführtes Heer. 1453 eroberte Sultan Mehmed II. nach einer Belagerung von etwa 53 Tagen Konstantinopel, nicht zuletzt dank großer Kanonen. Kaiser Konstantin XI. fiel im Kampf. Damit endete das Byzantinische Reich. Konstantinopel wurde Hauptstadt des Osmanischen Reichs, das bald Südosteuropa, Kleinasien und den Nahen Osten beherrschte. Der Handel mit dem Orient lief nun stärker über osmanisch kontrollierte Wege, was europäische Mächte zur Suche nach neuen Seewegen anspornte, auch wenn der Zusammenhang komplexer ist, als er oft dargestellt wird (folgende Kapitel)."
    ]},
    { h: "Buchdruck und Renaissance", p: [
      "Um 1450 entwickelte Johannes Gutenberg in Mainz den Buchdruck mit beweglichen Metalllettern, einer Presse und öligen Druckerschwärze. Die 42-zeilige Bibel entstand um 1452 bis 1455. Das Verfahren verbreitete sich rasend schnell: Um 1500 gab es in Europa über 250 Druckorte und mehrere Millionen gedruckter Bände. Bücher wurden billiger, Ideen verbreiteten sich schneller, und die Zahl der Lesekundigen stieg. In China und Korea gab es Drucktechniken mit beweglichen Lettern schon früher, aber Gutenbergs System fand in Europa durch die Alphabetschrift ideale Bedingungen.",
      "Zugleich blühte in Italien, zuerst in Florenz, die Renaissance, also die „Wiedergeburt“ der Antike. Humanisten wie Petrarca (1304–1374) sammelten antike Texte und betonten den Wert des Menschen. Künstler wie Giotto, Brunelleschi, Leonardo da Vinci (1452–1519), Michelangelo (1475–1564) und Raffael entwickelten Perspektive und Anatomie neu. Wissenschaft und Kunst waren eng verbunden, Anatomen sezierten, Leonardo zeichnete den menschlichen Körper. Die Renaissance bereitete Neuzeit und Aufklärung vor, auch wenn die Grenze zum Mittelalter fließend ist."
    ]}
  ],

    ["Wie wirkte die Pest wirklich?", "Aus der Forschung: Genanalysen von Skeletten aus Pestgräbern haben Yersinia pestis nachgewiesen und bestätigt, dass es dieselbe Bakterienart wie bei späteren Pestwellen war. Offen sind die Sterberaten. Manche Regionen wurden fast verschont (Teile Polens, Böhmens), andere verloren die Hälfte. Die oft zitierte Zahl von einem Drittel ist ein grober Mittelwert."],

UNITS.u14 = {
  id: "u14",
  title: "China, Mongolen und Asiens Netze",
  lead: "Zweitausend Jahre chinesische Reichsgeschichte, die Seidenstraße und die Mongolen, die den größten zusammenhängenden Landreich der Geschichte schufen.",
  body: [
    { h: "Die Einigung Chinas: Qin und Han", p: [
      "Vor 221 v. Chr. war China ein Nebeneinander konkurrierender Staaten (Zeit der Streitenden Reiche). Der Staat Qin einte sie unter Qin Shi Huangdi, dem „ersten erhabenen Kaiser“. Er vereinheitlichte Schrift, Maße, Gewichte und Münzen, baute Straßen und Kanäle und ließ erste Schutzwälle gegen Nomaden verbinden, Vorläufer der Großen Mauer. Seine Herrschaft war hart und stützte sich auf Zwang. Berühmt ist seine Grabanlage bei Xi'an mit der Terrakotta-Armee mit tausenden lebensgroßen Kriegern. Nach seinem Tod 210 v. Chr. brach die Dynastie rasch zusammen.",
      "Die Han-Dynastie (206 v. Chr.–220 n. Chr.) regierte über 400 Jahre und prägte China bis heute, weshalb sich Chinesen oft als „Han“ bezeichnen. Sie machte den Konfuzianismus zur Staatsphilosophie, baute ein Beamtensystem aus und entwickelte Technik: Papier (traditionell auf 105 n. Chr. datiert, frühere Funde existieren), Seismograph, verbessertes Eisen. Mit einer Volkszählung im Jahr 2 n. Chr. wurden rund 58 Millionen Menschen gezählt, eine der frühesten verlässlichen Zahlen eines Großstaats."
    ]},
    { h: "Konfuzius, Daoismus, Buddhismus", p: [
      "Konfuzius (551–479 v. Chr.) lehrte Ordnung durch Pflichtbewusstsein, Respekt vor Eltern und Älteren und gute Regierung durch moralisch gebildete Beamte. Der Daoismus (Laozi, Zhuangzi) betonte das Einfügen in den natürlichen Lauf der Dinge. Aus Indien kam seit dem 1. Jahrhundert der Buddhismus, der sich nach dem Zerfall der Han stark ausbreitete. Diese „drei Lehren“ ergänzten sich im Alltag vieler Menschen. Die Beamtenprüfungen, ab der Sui- und Tang-Zeit ausgebaut, machten konfuzianische Bildung zum Weg in den Staatsdienst und prägten die Gesellschaft Chinas bis 1905."
    ]},
    { h: "Teilung, Tang und Song", p: [
      "Nach 220 zerfiel China für Jahrhunderte. Erst die Sui (581–618), dann die Tang-Dynastie (618–907) einten es erneut. Die Tang-Zeit gilt als Blüte: Die Hauptstadt Chang'an hatte rund eine Million Einwohner und war eine Weltstadt, in der Händler aus Persien, Indien und Zentralasien lebten. Dichter wie Li Bai und Du Fu schrieben Verse, die bis heute gelesen werden. Der Große Kanal verband Nord und Süd. Wu Zetian regierte als einzige Frau offiziell als Kaiserin (690–705). Nach dem Aufstand des An Lushan (755) begann der Niedergang.",
      "Die Song-Dynastie (960–1279) war militärisch schwächer, aber wirtschaftlich und technisch hochentwickelt. Es gab Papiergeld, den Kompass in der Seefahrt, Schießpulver in frühen Waffen, Buchdruck mit Holzplatten und beweglichen Lettern (Bi Sheng, um 1040) und große Städte mit über einer Million Einwohnern. Der Süden mit Reisanbau und Handel wurde wohlhabender als der Norden. Ein Beamtenapparat verwaltete das Reich. Die Medizin entwickelte sich mit Akupunktur, Kräuterkunde und frühen Schriften über Gerichtsmedizin (Song Ci, 1247)."
    ]},
    { h: "Die Seidenstraße", p: [
      "Die Seidenstraße war kein einzelner Weg, sondern ein Geflecht von Handelsrouten durch Zentralasien, das China mit Indien, Persien, dem Mittelmeer und später Europa verband. Der Name stammt erst aus dem 19. Jahrhundert. Die Han-Dynastie sandte um 138 v. Chr. den Gesandten Zhang Qian nach Westen, und der Austausch wuchs. Gehandelt wurden Seide, Porzellan, Gewürze, Pferde, Glas, Silber. Ebenso reisten Religionen (Buddhismus, Christentum der Nestorianer, Manichäismus, Islam), Techniken (Papier, später Schießpulver) und leider auch Krankheiten. Kaum ein Händler reiste die ganze Strecke, die Waren wechselten viele Male den Besitzer. Karawanenstädte wie Samarkand, Buchara und Dunhuang wurden reich."
    ]},
    { h: "Die Mongolen", p: [
      "Um 1206 einte Temüdschin die mongolischen Stämme und wurde als Dschingis Khan („universeller Herrscher“) ausgerufen. Das Heer war diszipliniert, beweglich und nutzte Reiterbogenschützen, Spähnetze und Belagerungstechnik, die es von eroberten Völkern übernahm. Die Mongolen eroberten Nordchina (1211–1234), Zentralasien (Choresmien, 1219–1221), danach Russland (1237–1240, Kiew fiel 1240), stießen bis Polen und Ungarn vor (1241) und zerstörten 1258 Bagdad. Die Eroberungen waren mit enormer Gewalt verbunden, ganze Städte wurden zerstört und viele Einwohner getötet, Schätzungen zu den Opferzahlen sind unsicher und gehen weit auseinander.",
      "Das Reich teilte sich in mehrere Teilreiche (Khanate): die Goldene Horde in Russland, das Ilchanat in Persien, das Tschagatai-Khanat in Zentralasien und die Yuan-Dynastie in China unter Kublai Khan (1260–1294), der 1271 Peking zur Hauptstadt machte und 1279 die Song vollständig besiegte. Unter der „Pax Mongolica“ im 13. und 14. Jahrhundert waren Handelswege sicher wie selten zuvor. Marco Polo reiste im späten 13. Jahrhundert nach China, ob alle seine Berichte auf Selbsterlebtem beruhen, ist umstritten. Der Handel verbreitete aber auch die Pest. Zwei Versuche Kublais, Japan zu erobern (1274, 1281), scheiterten an Stürmen, die die Japaner „Kamikaze“ („Götterwind“) nannten."
    ]},
    { h: "Ming und Zheng He", p: [
      "1368 vertrieb Zhu Yuanzhang, ein Bauernsohn, die Mongolen und gründete die Ming-Dynastie (1368–1644). Peking wurde unter Kaiser Yongle zur Hauptstadt, die Verbotene Stadt entstand. Zwischen 1405 und 1433 schickte der Kaiser den Admiral Zheng He mit gewaltigen Flotten, mit zig Schiffen und mehreren zehntausend Mann, in sieben Fahrten nach Südostasien, Indien, Arabien und Ostafrika. Es ging um Ansehen, Handel und Tribut, nicht um Eroberung oder Kolonisierung. Danach wurden die Fahrten eingestellt, aus Kostengründen und wegen anderer Prioritäten, vor allem der Bedrohung durch Nomaden im Norden. Die Große Mauer, wie wir sie kennen, wurde überwiegend in der Ming-Zeit gebaut."
    ]},
    { h: "Indien, Japan, Korea und Südostasien in Kürze", p: [
      "Indien: Nach dem Maurya-Reich mit Ashoka (ca. 268–232 v. Chr.), der nach blutigen Kriegen den Buddhismus förderte, und dem Gupta-Reich (ca. 320–550) mit Mathematik (Null, Dezimalsystem) folgten viele Regionalreiche. Ab dem 13. Jahrhundert herrschte das Sultanat von Delhi. Der Hinduismus prägte die Gesellschaft, mit dem Kastensystem als sozialer Ordnung.",
      "Japan: Ab etwa 700 entstand ein Staat nach chinesischem Vorbild mit Hauptstädten in Nara und Heian-kyo (Kyoto). Am Hof entstand höfische Literatur, etwa das Genji Monogatari der Murasaki Shikibu (um 1010). Ab 1185 herrschten Krieger, die Samurai, mit einem Shogun an der Spitze. Korea: Das Königreich Goryeo (918–1392) entwickelte den Metalllettern-Druck. Unter König Sejong entstand um 1443 die Hangul-Schrift. Südostasien: Das Khmer-Reich baute Angkor, ein riesiges Tempel- und Stadtsystem, im 12. Jahrhundert Angkor Wat."
    ]}
  ],

    "China ist die älteste durchgehende Staatsidee der Welt. Wer die heutige Rolle Chinas verstehen will, braucht das Bild eines langen Zyklus von Einheit und Zerfall.",

  deep: [
    ["Warum wurde China nicht zur Kolonialmacht?", "Die Fahrten Zheng Hes zeigen, dass China die technischen Mittel hatte. Gründe, warum es keine Kolonialreiche aufbaute, werden diskutiert: andere Prioritäten (Grenzsicherung gegen Nomaden), Kritik der Beamten an den Kosten, fehlender Anreiz, da Handel auch ohne Gebietsherrschaft Gewinn brachte. Eine einzige Antwort gibt es nicht."],
    ["Dschingis Khan: Zerstörer und Staatsgründer", "Die Mongolen führten eine Schriftsprache ein, schützten Händler, tolerierten viele Religionen und schufen ein Postsystem (Yam). Zugleich waren die Eroberungen verheerend. Je nach Land fällt das Bild unterschiedlich aus. In der Mongolei wird Dschingis Khan als Nationalheld verehrt, in Iran oder Russland steht die Zerstörung im Vordergrund."],
    ["Die Beamtenprüfung", "Seit der Tang- und Song-Zeit konnten Männer aus verschiedenen Schichten durch Prüfungen in konfuzianischen Klassikern Beamte werden. Es war eine harte Auslese mit Tausenden Bewerbern pro Stelle. Das System war leistungsorientierter als der Erbadel in Europa, begünstigte aber Familien, die sich Bildung leisten konnten. Es endete 1905."]

UNITS.u15 = {
  id: "u15",
  title: "Afrika und Amerika vor 1500",
  lead: "Reiche, Städte und Netzwerke außerhalb von Europa und Asien: von Aksum und Mali bis zu Maya, Azteken und Inka.",
  body: [
    { h: "Ein Wort vorab", p: [
      "Afrika und Amerika werden in Geschichtsbüchern oft erst mit der Ankunft der Europäer behandelt. Das verzerrt das Bild. Beide Kontinente hatten lange vor 1500 komplexe Gesellschaften. Bei vielen gibt es allerdings weniger schriftliche Quellen, und manche Schriftquellen stammen von Außenstehenden. Archäologie, mündliche Überlieferung und Sprachforschung spielen eine große Rolle."
    ]},
    { h: "Nordostafrika: Ägypten, Kusch und Aksum", p: [
      "Südlich von Ägypten lag Kusch (Nubien) mit Hauptstädten wie Napata und später Meroë. Die kuschitischen Könige herrschten im 8. Jahrhundert v. Chr. sogar über Ägypten (25. Dynastie). Meroë war ein Zentrum der Eisenverarbeitung und hatte eigene Schrift und Pyramiden, in großer Zahl.",
      "Das Reich Aksum im heutigen Äthiopien und Eritrea war vom 1. bis 7. Jahrhundert eine Handelsmacht zwischen Rom, Indien und Arabien. Es prägte eigene Münzen, errichtete riesige Steinstelen und nahm unter König Ezana um 330 das Christentum an. Die äthiopisch-orthodoxe Kirche besteht bis heute. Mit dem Aufstieg des Islam im 7. Jahrhundert verlor Aksum an Bedeutung."
    ]},
    { h: "Westafrika: Ghana, Mali, Songhai", p: [
      "Westafrikanische Reiche lebten vom Transsaharahandel: Gold und Sklaven gingen nach Norden, Salz, Kupfer, Stoffe und Pferde nach Süden. Das Reich Ghana (nicht das heutige Land) blühte etwa vom 8. bis 11. Jahrhundert. Mali entstand im 13. Jahrhundert unter Sundiata Keita. Der berühmteste Herrscher war Mansa Musa (um 1312–1337), der 1324/25 mit riesigem Gefolge und viel Gold nach Mekka pilgerte. In Kairo soll der Goldpreis spürbar gefallen sein. Dadurch erschien Westafrika auf europäischen Karten, etwa im Katalanischen Weltatlas von 1375.",
      "Timbuktu wurde ein Zentrum islamischer Gelehrsamkeit mit der Sankore-Moschee und Tausenden Handschriften. Im 15. Jahrhundert löste das Songhai-Reich unter Sonni Ali und Askia Muhammad Mali als Großmacht ab. Weiter südlich bestanden Königreiche wie Ife und Benin, deren Bronzearbeiten Weltruf haben. Die sogenannten Benin-Bronzen, 1897 von britischen Truppen geraubt, sind heute Gegenstand von Rückgabeverhandlungen."
    ]},
    { h: "Ostafrika und das südliche Afrika", p: [
      "An der ostafrikanischen Küste bildeten Hafenstädte wie Kilwa, Mombasa und Sansibar die Swahili-Kultur: afrikanische Bantu-Sprache, stark arabisch beeinflusst, muslimisch geprägt, mit Handel über den Indischen Ozean bis nach Arabien, Indien und China. Kilwa war im 14. Jahrhundert eine reiche Stadt mit Steinbauten. Im Landesinneren lag Großsimbabwe (ca. 11.–15. Jahrhundert), eine Stadt mit mächtigen Steinmauern, reich durch Goldhandel und Viehzucht. Das Wort Simbabwe bedeutet wohl „Steinhaus“. Im 19. und 20. Jahrhundert bestritten europäische Beobachter lange, dass Afrikaner solche Bauten errichtet haben könnten, was inzwischen klar widerlegt ist."
    ]},
    { h: "Mesoamerika: Olmeken, Maya, Teotihuacan, Azteken", p: [
      "In Mittelamerika entwickelten sich Hochkulturen ohne Kontakt zur Alten Welt. Die Olmeken (ab etwa 1200 v. Chr.) errichteten Zeremonialzentren und riesige Steinköpfe. Teotihuacan bei Mexiko-Stadt war um 450 n. Chr. mit weit über 100.000 Einwohnern eine der größten Städte der Welt, mit der Sonnen- und der Mondpyramide.",
      "Die Maya (Blütezeit ca. 250–900) lebten in Stadtstaaten wie Tikal, Palenque und Copán, hatten eine Schrift, die inzwischen großenteils entziffert ist, einen präzisen Kalender, Astronomie und ein Zahlensystem mit der Null. Die Städte im südlichen Tiefland wurden um 800–900 weitgehend aufgegeben, wohl durch ein Zusammenspiel von Dürre, Kriegen und Überbevölkerung. Die Maya selbst verschwanden nicht, heute sprechen Millionen Menschen Maya-Sprachen.",
      "Die Azteken (Mexica) gründeten um 1325 auf einer Insel im Texcoco-See die Stadt Tenochtitlan, die um 1500 mit etwa 200.000 Einwohnern größer war als die meisten europäischen Städte. Der Aztekenbund (Dreibund) beherrschte ab 1428 weite Teile Mexikos und trieb Tribute ein. Religion und Kriegsführung waren eng verbunden, Menschenopfer spielten eine große Rolle. Unterworfene Völker hassten die Tributforderungen, was Cortés später ausnutzte."
    ]},
    { h: "Die Anden: Inka", p: [
      "In den Anden gab es bereits früh Kulturen wie Caral (ab ca. 3000 v. Chr.), Chavín, Nazca (mit den Geoglyphen) und Tiwanaku. Die Inka stiegen im 15. Jahrhundert aus der Region Cusco auf und schufen unter Pachacútec (ab 1438) das größte Reich Amerikas, Tawantinsuyu („Vier Weltgegenden“), vom heutigen Ecuador bis Chile mit vielleicht 10 Millionen Menschen. Straßen von rund 40.000 Kilometern, Läufer und Vorratshäuser verbanden das Reich. Eine Schrift im engeren Sinn gab es nicht, aber Knotenschnüre (Quipu) für Zahlen und vielleicht mehr. Die Verwaltung beruhte auf Arbeitsdienst (Mit'a) statt Geld. Machu Picchu entstand um 1450 als Anlage für den Herrscher."
    ]},
    { h: "Nordamerika und Ozeanien", p: [
      "In Nordamerika lebten vielfältige Gesellschaften. Cahokia am Mississippi war um 1100 mit vielleicht 10.000 bis 20.000 Einwohnern die größte Stadt nördlich von Mexiko, mit gewaltigen Erdhügeln. Die Pueblo-Kulturen (Anasazi) im Südwesten errichteten Felswohnungen. Im Nordosten schlossen sich mehrere Völker zum Irokesenbund zusammen, dessen Entstehung auf etwa 1142 bis 1450 geschätzt wird. Insgesamt lebten in Amerika vor 1492 viele Millionen Menschen, über die Zahl streiten sich Forscher, Schätzungen reichen von etwa 8 bis über 60 Millionen.",
      "Die Polynesier besiedelten mit Doppelrumpfbooten und Navigation nach Sternen, Wind und Wellen den Pazifik: Tonga und Samoa (um 1000 v. Chr.), Hawaii, Osterinsel und zuletzt Neuseeland (um 1250–1300 n. Chr.). Es war die größte Seefahrer-Besiedlung der Weltgeschichte."
    ]},
    { h: "Was das für den Blick auf 1492 bedeutet", p: [
      "Als europäische Schiffe ab dem 15. Jahrhundert Afrika umsegelten und 1492 Amerika erreichten, trafen sie auf Gesellschaften mit eigenen Ordnungen, Handelsnetzen und Konflikten. Die Folgen waren je nach Region unterschiedlich: In Amerika brachten eingeschleppte Krankheiten wie Pocken und Masern, gegen die es keine Immunität gab, in kurzer Zeit zum Tod von Millionen. In Afrika verstärkte sich der atlantische Sklavenhandel. Davon handelt das nächste Kapitel (Entdeckungen)."
    ]}

UNITS.u16 = {
  id: "u16",
  title: "Aufbruch zu den Ozeanen: Portugal, Spanien und die neue Weltkarte",
  lead: "Zwischen 1415 und 1522 segeln Europäer um Afrika, nach Indien und um die Erde. Warum gerade sie, warum gerade damals, und was veränderte sich dadurch?",
  body: [
    { h: "Warum Europa aufbrach", p: [
      "Dass Europäer um 1500 die Ozeane befuhren, war nicht selbstverständlich. China hatte eine größere Flotte gehabt (Einheit 14), die islamische Welt kannte den Indischen Ozean seit Jahrhunderten. Die Frage lautet also: Warum wurden ausgerechnet die kleinen Königreiche am westlichen Rand Europas zu Pionieren der Weltmeere? Es lohnt sich, mehrere Antworten nebeneinanderzulegen, statt eine einzige zu suchen.",
      "Die erste Antwort ist wirtschaftlich. Gewürze wie Pfeffer, Zimt und Muskat, dazu Seide und Porzellan, kamen aus Asien über viele Zwischenstationen nach Europa. Jede Station, von Händlern in Indien über arabische Kaufleute bis zu den Venezianern und Genuesen, verdiente mit. Wer die Zwischenhändler umgehen konnte, würde den Preis drücken und selbst verdienen. Häufig liest man, der Fall Konstantinopels 1453 (Einheit 13) habe die Handelswege gesperrt und Europa zum Aufbruch gezwungen. Das ist zu einfach: Der Handel mit dem Osmanischen Reich ging weiter, und die Portugiesen hatten ihre Fahrten schon Jahrzehnte vorher begonnen. Richtig ist aber, dass die Seemächte Italiens den Handel im Mittelmeer beherrschten, und dass Staaten ohne Zugang zu diesem Geschäft einen Anreiz hatten, andere Wege zu suchen.",
      "Die zweite Antwort betrifft Gold. Europa litt im 15. Jahrhundert unter Edelmetallmangel, und Gold kam im Wesentlichen aus Westafrika über die Sahara (Einheit 15). Wer an die Küste gelangte, konnte hoffen, den Karawanenhandel zu umgehen. Die dritte Antwort ist politisch. Portugal war ein kleines Land, dessen Könige nach der Vertreibung der Mauren (Reconquista) keine Nachbarn mehr hatten, an denen sie wachsen konnten, außer über das Meer. Die Idee, den Kampf gegen den Islam jenseits der Meerenge fortzusetzen, verband sich mit dem Wunsch nach Ruhm. Die vierte Antwort ist religiös: Man suchte das Reich des legendären Priesterkönigs Johannes, mit dem man gemeinsam den Islam in die Zange nehmen wollte, und die Kirche gab Segen und Rechtfertigung.",
      "Die fünfte Antwort betrifft den Staat. Portugal und Spanien waren früh zentralisierte Monarchien, die Steuern erheben, Schiffe finanzieren und Monopole vergeben konnten. Der Ertrag einer Fahrt kam der Krone zugute, und die Krone konnte Risiken streuen. Das ist ein Unterschied zu den kleinteiligen Fürstentümern des Reichs. Jede einzelne dieser Ursachen hätte für sich nicht gereicht, zusammen erzeugten sie einen Sog."
    ]},
    { h: "Portugal: Schritt für Schritt um Afrika", p: [
      "Der Anfang war bescheiden. 1415 eroberte Portugal Ceuta an der marokkanischen Küste. Prinz Heinrich, später „der Seefahrer“ genannt, förderte danach Fahrten entlang der Westküste Afrikas, aber er war weniger ein Forscher als ein Unternehmer und Ritter. Man besiedelte zuerst Madeira und die Azoren und baute dort Zucker an, ein Muster, das sich später in der Karibik wiederholte (Einheit 18). Jahr für Jahr tastete man sich weiter nach Süden. Das Kap Bojador, lange eine psychologische Grenze, wurde 1434 umsegelt. In den 1440er-Jahren begannen die Portugiesen, Menschen an der Küste zu rauben und zu kaufen, 1482 errichteten sie mit Elmina (São Jorge da Mina) an der Goldküste ihren ersten festen Stützpunkt.",
      "1488 umrundete Bartolomeu Dias die Südspitze Afrikas, das spätere Kap der Guten Hoffnung. 1497/98 fuhr Vasco da Gama weiter, ließ sich ab Malindi (Ostafrika) von einem ortskundigen Lotsen leiten und erreichte im Mai 1498 Calicut an der indischen Südwestküste. Damit war die Route um Afrika offen. Es folgte kein Handel unter Gleichen, sondern der Versuch, ein Gewaltmonopol auf See durchzusetzen. Portugiesische Schiffe trugen Kanonen, und im Indischen Ozean waren Handelsschiffe meist unbewaffnet, weil dort kein einzelner Staat die Meere kontrollierte. 1510 nahm Afonso de Albuquerque Goa, 1511 Malakka, 1515 Hormuz ein. So entstand ein Netz von Stützpunkten, ein „Estado da Índia“, das keine große Fläche beherrschte, aber die wichtigsten Engpässe. 1500 war Pedro Álvares Cabral bei seiner Indienfahrt weit nach Westen abgetrieben worden und hatte Brasilien erreicht.",
      "Für Europa war das ein Schock auf der Preisseite: Pfeffer wurde zeitweise billiger, Lissabon wurde zum wichtigsten Handelsplatz der Gewürze, und Venedig verlor einen Teil seines Geschäfts. Allerdings blieb der Landweg durch Syrien und Ägypten länger bedeutend, als man oft annimmt, und auch die Portugiesen verloren viele Schiffe und Menschen. Die Gewinne kamen der Krone und wenigen Kaufleuten zugute, und Portugal selbst blieb ein kleines, bald überfordertes Land."
    ]},
    { h: "Technik und Wissen: was die Fahrten möglich machte", p: [
      "Ozeanfahrten setzten Technik voraus, die nicht aus Europa allein stammte. Der Kompass kam aus China über die islamische Welt nach Europa (Einheit 14), das Dreiecksegel (lateinisches Segel), das das Kreuzen gegen den Wind erleichtert, wurde im Mittelmeerraum und im Indischen Ozean genutzt. Die Portugiesen entwickelten daraus die Karavelle, ein wendiges Schiff, das sich gut an der Küste und gegen den Wind steuern ließ, später die größere Karacke für Fracht. Wichtig war auch das Wissen über Wind: Man erkannte, dass man nach Süden segeln, dann weit in den Atlantik hinausfahren und mit den Westwinden zurückkehren musste („volta do mar“). Diese Entdeckung war so wertvoll wie jedes Schiff.",
      "Zur Positionsbestimmung nutzte man das Astrolabium und den Quadranten, mit denen man den Stand von Sonne und Gestirnen maß. Die Breite ließ sich so recht gut bestimmen, die Länge dagegen kaum, weil es keine genaue Uhr auf See gab. Das Problem blieb bis ins 18. Jahrhundert ungelöst. Karten wurden gesammelt, kopiert und als Staatsgeheimnis gehütet, und viele Seeleute und Kartografen waren jüdischer oder muslimischer Herkunft, etwa Abraham Zacuto, dessen astronomische Tafeln die Portugiesen nutzten. Der Buchdruck (Einheit 13) verbreitete dann das Wissen: Die Geografie des Ptolemäus wurde gedruckt, und Berichte über neue Länder erreichten schnell ein breites Publikum. Das Entdecken war also ein Gemeinschaftswerk eines Wissensnetzes, in dem Griechen, Araber, Chinesen und Europäer ihre Teile beitrugen."
    ]},
    { h: "Kolumbus und Spanien", p: [
      "Spanien entstand 1469 durch die Heirat von Isabella von Kastilien und Ferdinand von Aragón und schloss 1492 mit der Eroberung Granadas die Reconquista ab. Im selben Jahr wurden die Juden aus Spanien vertrieben, wer blieb, musste sich taufen lassen. In diese Stimmung hinein kam Christoph Kolumbus, ein Genuese in portugiesischen und spanischen Diensten, mit einem Plan: Man könne Asien erreichen, indem man nach Westen segelte. Die Idee war nicht neu, und die Kugelgestalt der Erde war den Gebildeten seit der Antike bekannt, Eratosthenes hatte den Erdumfang schon um 240 v. Chr. recht genau berechnet (Einheit 4). Die Gelehrten am portugiesischen Hof lehnten Kolumbus ab, weil sie meinten, die Entfernung sei viel zu groß. Sie hatten recht. Kolumbus hatte den Erdumfang unterschätzt und Asien zu weit nach Osten gerückt. Sein Glück war, dass dazwischen ein unbekannter Kontinent lag.",
      "Am 12. Oktober 1492 landete er auf einer Insel der Bahamas, die er San Salvador nannte. Er hielt bis zu seinem Tod 1506 daran fest, in Asien gewesen zu sein, und nannte die Bewohner „Indios“. Auf drei weiteren Reisen erkundete er die Karibik. Kolumbus war ein hervorragender Seemann, aber ein schlechter Verwalter, und er wurde 1500 sogar in Ketten nach Spanien zurückgebracht. Er steht für ein Muster: Die neuen Länder wurden von Anfang an als Besitz betrachtet, die Menschen dort als Arbeitskräfte und Untertanen.",
      "Weil Portugal und Spanien um die neuen Gebiete stritten, teilten sie die Welt 1494 im Vertrag von Tordesillas auf, bestätigt durch den Papst: Eine Linie 370 Leguas westlich der Kapverden trennte die Einflusszonen, im Westen gehörte alles Spanien, im Osten Portugal. Dass dadurch Brasilien portugiesisch wurde, ist eine Folge dieser Linie. Dass zwei kleine Königreiche die Welt unter sich aufteilten, ohne die Bewohner der Gebiete zu fragen, zeigt, wie sich das europäische Denken verändert hatte: Die Erde wurde zum Verteilungsraum."
    ]},
    { h: "Magellan und die Erde als Ganzes", p: [
      "Spätestens nach Amerika stellte sich die Frage, ob man auch auf westlichem Weg nach Asien gelangen kann. 1513 sah Vasco Núñez de Balboa den Pazifik. 1519 brach der portugiesische Seefahrer Ferdinand Magellan in spanischen Diensten mit fünf Schiffen auf. Er fand die Meerenge an der Südspitze Südamerikas, durchquerte den riesigen Pazifik unter großen Entbehrungen und starb 1521 bei einem Kampf auf der Insel Mactan auf den Philippinen. Nur ein Schiff unter Juan Sebastián Elcano kehrte 1522 zurück, mit 18 Überlebenden von etwa 240 Mann. Sie hatten die Erde erstmals umrundet.",
      "Die praktische Bedeutung der Fahrt war zunächst gering, weil der Weg zu lang und gefährlich war. Die Bedeutung für das Weltbild war groß: Die Erde war ein zusammenhängender, befahrbarer Raum. 1507 hatte der Kartograf Martin Waldseemüller den neuen Kontinent erstmals „America“ genannt, nach Amerigo Vespucci, der als einer der ersten erkannt hatte, dass es kein Teil Asiens war. Ab 1565 verband die Manila-Galeone die spanischen Philippinen mit Mexiko: Silber aus Amerika floss über den Pazifik nach China und tauschte dort gegen Seide und Porzellan. Zum ersten Mal waren Amerika, Europa, Afrika und Asien in einem einzigen Handelskreislauf verbunden."
    ]},
    { h: "Wer hat hier „entdeckt“? Perspektiven und Folgen", p: [
      "Der Begriff „Entdeckung“ ist eine europäische Sicht. Amerika war von Millionen Menschen bewohnt (Einheit 15), der Indische Ozean voller Handelsstädte, die Küste Ostafrikas hatte Städte wie Kilwa, und Zheng Hes Flotten waren schon dort gewesen. Für die Europäer war es neu, für die Bewohner nicht. Auch die Wikinger hatten um 1000 Nordamerika erreicht, ohne dauerhafte Folgen. Der Unterschied ab 1492 liegt nicht im ersten Sehen, sondern in dem, was danach geschah: dauerhafte Verbindungen, Eroberungen, Kolonien und ein Welthandel. Man spricht daher neutraler von „Begegnung“ oder „Expansion“.",
      "Die Folgen lassen sich in drei Linien denken. Erstens verschob sich das wirtschaftliche Zentrum: vom Mittelmeer an den Atlantik, von Venedig und Genua nach Lissabon, Sevilla und bald Amsterdam und London (Einheit 20). Zweitens entstand eine erste Weltwirtschaft, in der Silber, Gewürze, Zucker, Menschen und Ideen über Ozeane wanderten. Drittens entstand eine Machtasymmetrie: Europäer konnten mit Schiffen und Kanonen Küsten beherrschen und Stützpunkte sichern, und sie nutzten dies, um Eroberung und Handel zu verbinden. Wie das in Amerika ablief, und welche Folgen es für Millionen Menschen hatte, behandeln die nächsten beiden Einheiten."
    ]}
  ],

  deep: [
    ["Warum konnte Portugal so weit kommen?", "Portugal hatte wenig Binnenmarkt und viel Küste. Seefahrt war eine Möglichkeit, aus wenig Land viel Einfluss zu machen. Die Krone vergab Monopole und beteiligte sich an den Gewinnen, und sie sammelte und schützte Wissen in Lissabon und im Haus von Guinea. Ein Land ohne diese enge Verbindung von Staat und Handel hätte vermutlich weder die Mittel noch die Geduld gehabt, hundert Jahre lang jedes Jahr ein Stück weiter zu fahren."],
    ["Der Wert der Länge", "Auf See die Breite zu messen war machbar, die Länge dagegen kaum. Man konnte nur die Fahrzeit und die Geschwindigkeit schätzen. Viele Schiffe liefen deshalb auf Riffe. 1714 setzte das britische Parlament einen hohen Preis für eine Lösung aus, die der Uhrmacher John Harrison mit seinen Schiffschronometern schließlich lieferte. Zeit und Raum hängen hier unmittelbar zusammen."]

  quiz: [
    { q: "Warum reicht die Erklärung „Der Fall Konstantinopels 1453 sperrte die Handelswege und zwang Europa zum Aufbruch“ allein nicht aus?", o: ["Weil Konstantinopel nie von den Osmanen erobert wurde", "Weil der Handel mit dem Osmanischen Reich weiterlief und Portugal schon Jahrzehnte vorher aufgebrochen war", "Weil China die Wege kontrollierte", "Weil es damals keine Gewürze gab"], a: 1,

UNITS.u17 = {
  id: "u17",
  title: "Die Eroberung Amerikas und ihre Folgen",
  lead: "Wie wenige Hundert Spanier zwei Großreiche stürzen konnten, warum Seuchen entscheidender waren als Waffen, und wie der Austausch von Pflanzen und Tieren die Welt veränderte.",
  body: [
    { h: "Die Karibik: Modell der Kolonie", p: [
      "Die erste Kolonie entstand auf Hispaniola, der heutigen Insel mit Haiti und der Dominikanischen Republik. Dort lebten die Taíno, eine Gesellschaft mit Dörfern, Häuptlingen und Landwirtschaft. Die Spanier suchten Gold, und weil es wenig gab, verlangten sie Tribute und Arbeit. Das System der Encomienda übertrug einem Spanier eine Gruppe von Indigenen, die für ihn arbeiten mussten, und im Gegenzug sollte er sie schützen und christlich unterweisen. In der Praxis war es Zwangsarbeit.",
      "Die Folgen waren verheerend. Innerhalb von wenigen Jahrzehnten starb der größte Teil der Taíno, durch Gewalt, Zwangsarbeit, Hunger und vor allem durch eingeschleppte Krankheiten. Schon 1511 hielt der Dominikaner Antonio de Montesinos eine berühmte Predigt gegen das Unrecht, später wurde Bartolomé de las Casas, selbst ehemaliger Encomendero, zum wichtigsten Kritiker. 1542 erließ die Krone die „Neuen Gesetze“, die die Encomienda einschränken sollten, und 1550/51 stritten Las Casas und der Gelehrte Sepúlveda in Valladolid öffentlich, ob die Indigenen als freie Menschen gelten müssten. Die Gesetze setzten sich kaum durch, weil die Kolonisten weit weg und stark waren. Dass es diese Debatte gab, ist dennoch bemerkenswert, denn sie ist ein früher Versuch, Menschenrechte zu begründen. Die Praxis aber folgte dem Interesse."
    ]},
    { h: "Cortés und das Aztekenreich (1519–1521)", p: [
      "1519 landete Hernán Cortés mit etwa 500 Mann an der mexikanischen Küste. Er hatte keine Erlaubnis für die Eroberung, nutzte aber die Lage geschickt. Das Aztekenreich war kein Einheitsstaat, sondern ein Bündnis, das viele Völker durch Tribut belastete (Einheit 15). Die Untertanen hassten die Herren von Tenochtitlan, und als Cortés auftauchte, schlossen sich ihm Zehntausende an, vor allem die Tlaxcalteken. Entscheidend war auch die Dolmetscherin Malinche (Doña Marina), die Nahuatl und Maya sprach und Cortés half, Politik zu verstehen.",
      "Die Azteken empfingen die Spanier zunächst mit Gastfreundschaft. Als Cortés Herrscher Moctezuma II. gefangen nahm, kam es zum Aufstand, bei dem Moctezuma starb, und die Spanier mussten in der „Noche Triste“ (1520) mit schweren Verlusten fliehen. Dann kam die Wende: Eine Pockenepidemie, vermutlich von einem Sklaven aus Kuba eingeschleppt, tötete 1520 einen großen Teil der Bevölkerung in Tenochtitlan, darunter den Nachfolger Moctezumas. Mit Tausenden indigenen Verbündeten und selbst gebauten Schiffen auf dem See belagerte Cortés die Stadt und nahm sie im August 1521 ein. Die Stadt wurde zerstört und auf ihren Trümmern Mexiko-Stadt errichtet.",
      "Man kann daraus lernen, dass die Eroberung nicht nur aus überlegenen Waffen bestand. Pferde, Stahl und Feuerwaffen halfen, aber den Ausschlag gaben Bündnisse mit unterdrückten Völkern, die Spaltung der Gegner und die Seuche. Das ist ein wichtiger Unterschied zu dem Bild, wenige Helden hätten ein Weltreich besiegt."
    ]},
    { h: "Pizarro und die Inka (1532/33)", p: [
      "Ähnlich verlief es in den Anden. Francisco Pizarro landete 1531 mit rund 170 Mann, fand aber ein Reich im Bürgerkrieg vor. Schon vor seiner Ankunft hatten sich Krankheiten, vermutlich Pocken, von Mittelamerika aus über das Land verbreitet und den Herrscher Huayna Cápac und seinen designierten Erben getötet. Die Söhne Huáscar und Atahualpa kämpften um die Macht. Als Pizarro im November 1532 in Cajamarca auf Atahualpa traf, nahm er ihn in einem Hinterhalt gefangen. Atahualpa bot ein riesiges Lösegeld aus Gold und Silber, wurde aber 1533 trotzdem hingerichtet.",
      "Die Inka hatten ein Reich, das durch Straßen, Verwaltung und Arbeitsdienst zusammengehalten wurde (Einheit 15). Gerade diese Zentralisierung machte es verwundbar: Fiel der Herrscher, geriet das System ins Wanken. Die Spanier setzten Marionetten ein und unterwarfen das Land schrittweise, ein letzter Inka-Staat in Vilcabamba hielt sich bis 1572. Wie in Mexiko halfen indigene Gruppen den Spaniern, die unter den Inka gelitten hatten. Es entstand das Vizekönigreich Neuspanien (ab 1535) und das Vizekönigreich Peru (ab 1542)."
    ]},
    { h: "Der große Tod: Seuchen in Amerika", p: [
      "Das wohl folgenreichste Ereignis der Eroberung waren nicht Schlachten, sondern Krankheiten. Pocken, Masern, Grippe, Typhus und andere Erreger waren in Europa und Asien seit Jahrhunderten verbreitet, und viele Menschen dort hatten Teilimmunität erworben, weil sie in der Kindheit überlebt hatten. In Amerika fehlten diese Krankheiten, weil Haustiere, aus denen viele Erreger stammen (Rind, Schwein, Schaf), dort fast nicht existierten und weil die Verbindung zur Alten Welt seit der Eiszeit unterbrochen war. Die Bevölkerung traf auf die Erreger ohne jede Vorbereitung („Jungfernboden-Epidemien“). Krankheiten, die unter Europäern mit niedriger Sterblichkeit verliefen, töteten hier einen großen Teil der Erkrankten.",
      "Dazu kam, dass die Seuchen ganze Gesellschaften lähmten. Wenn alle gleichzeitig erkranken, fehlt jemand, der pflegt, Felder bestellt und Nahrung bringt, und dann sterben auch Menschen, die den Erreger überlebt hätten. Kriege, Zwangsarbeit und Hunger verschärften die Lage. Schätzungen der Bevölkerungsverluste in den ersten hundert Jahren sind unsicher und reichen in vielen Regionen von der Hälfte bis zu neun Zehnteln. Zahlen aus dem 16. Jahrhundert sind spekulativ, die Größenordnung ist aber unbestritten. Wer das Muster aus der Pest (Einheit 13) oder aus der Antoninischen Seuche (Einheit 6) kennt, erkennt es wieder, nur in einem Ausmaß, das ganze Kulturen auslöschte.",
      "Man sollte auch sagen, was dieser Prozess nicht war. Die Eroberer verstanden die Krankheitsübertragung nicht, und in den meisten Fällen war die Ausbreitung nicht geplant, auch wenn einzelne Episoden dokumentiert sind, in denen Menschen den Tod ihrer Gegner billigend in Kauf nahmen. Es war ein katastrophaler Nebeneffekt der Begegnung, der den Eroberern in die Hände spielte und von ihnen als göttliches Zeichen gedeutet wurde."
    ]},
    { h: "Der Kolumbianische Austausch", p: [
      "Der Austausch zwischen den beiden Hemisphären veränderte auch das Essen und die Landwirtschaft. Aus Amerika kamen Mais, Kartoffel, Tomate, Kürbis, Bohnen, Paprika, Kakao, Tabak und Chili in die Alte Welt. Die Kartoffel verbreitete sich in Europa langsam, weil man ihr misstraute, wurde aber in Irland, Nordeuropa und später im Reich zum Grundnahrungsmittel und trug zum Bevölkerungswachstum bei. Mais und Süßkartoffel bereicherten die Landwirtschaft in Afrika und China. Umgekehrt brachten Europäer Weizen, Reis, Zuckerrohr, Rinder, Schweine, Schafe und Pferde nach Amerika. Das Pferd veränderte das Leben der Völker der Great Plains, die erst jetzt zu Reiterkulturen wurden.",
      "Auch Heilmittel wanderten. Aus der Rinde des Chinarindenbaums in den Anden gewannen Jesuiten im 17. Jahrhundert ein Mittel gegen Fieber, das Chinin, das erstmals eine wirksame Behandlung der Malaria bot und später die Besiedlung tropischer Gebiete erleichterte. Ob die Syphilis aus Amerika nach Europa kam, ist unter Fachleuten umstritten. Sicher ist, dass sich Krankheiten in beide Richtungen verbreiteten, wenn auch mit sehr unterschiedlichen Folgen.",
      "Der Austausch zeigt ein Prinzip: Verbindungen zwischen bisher getrennten Räumen haben Folgen, die niemand plant. Ob Pflanzen, Tiere oder Erreger, sie finden neue Umgebungen, in denen sie sich anders verhalten. Das erklärt, warum Historiker von einer „ökologischen Revolution“ sprechen."
    ]},
    { h: "Silber, Staat und koloniale Ordnung", p: [
      "1545 entdeckte man in Potosí im heutigen Bolivien einen riesigen Silberberg. Die Spanier setzten die vorkoloniale Arbeitspflicht der Inka (Mit'a) für den Bergbau ein, und Zehntausende indigene Arbeiter, später auch Sklaven, förderten unter unmenschlichen Bedingungen Silber, das in Barren nach Spanien und über die Philippinen nach China ging. Potosí wurde zeitweise eine der größten Städte der Welt.",
      "Das Silber veränderte Europa. Es finanzierte Kriege der spanischen Könige, vor allem gegen Osmanen und Protestanten (Einheit 20), und es löste im 16. Jahrhundert eine Preissteigerung aus, die „Preisrevolution“. Weil Spanien sein Geld in Kriege und Importe steckte, statt eigene Gewerbe aufzubauen, ging der Reichtum zu Händlern und Bankiers in anderen Ländern, und der Staat musste mehrfach Bankrott anmelden. Das ist ein Beispiel dafür, dass schneller Reichtum nicht dauerhaft stark macht.",
      "In Amerika entstand eine hierarchische Gesellschaft: oben die in Spanien geborenen Beamten, darunter die in Amerika geborenen Weißen (Kreolen), dann Mestizen, Indigene und Menschen afrikanischer Herkunft, die man in ein System von Kasten einordnete. Die Kirche missionierte mit Orden wie Franziskanern und Jesuiten, und viele Indigene verbanden christliche Formen mit älteren Glaubensvorstellungen. Aus dieser Mischung entstanden neue Kulturen, die bis heute Lateinamerika prägen. Die Idee, dass Hautfarbe und Herkunft eine Rangordnung begründen, wurde im Laufe der Zeit zu einem Rechtfertigungsgrund. Wie sich daraus ein System der Sklaverei im Atlantik entwickelte, zeigt die nächste Einheit."
    ]}
  ],

  relevance: [
    "Die Bevölkerungen Lateinamerikas sind das Ergebnis dieser Begegnung: Indigene, Europäer, Afrikaner und ihre Mischungen. Debatten über indigene Rechte und Landfragen knüpfen daran an.",
    "Der Austausch der Nutzpflanzen prägt unsere Ernährung: Ohne Kartoffel, Tomate, Mais oder Kakao sähen Küchen weltweit anders aus.",

  deep: [
    ["War es ein Völkermord?", "Der Begriff ist umstritten. Er setzt eine Absicht voraus, die man für die Gesamtgeschichte der Bevölkerungsverluste nicht belegen kann, denn der größte Teil der Toten starb an Krankheiten. Es gab aber auch gezielte Massaker, Versklavung und Zwangsarbeit, und manche Historiker sprechen daher für einzelne Regionen und Episoden von Genozid oder Demozid. Diese Debatte zeigt, wie sich Begriffe und Beweise gegenseitig begrenzen. Lesenswert ist, dass die Zeitgenossen selbst, wie Las Casas, das Geschehen schon als Unrecht anprangerten."],
    ["Wie sicher sind die Zahlen?", "Für die Bevölkerung Amerikas um 1492 reichen die Schätzungen von rund 8 bis über 100 Millionen. Sie beruhen auf Hochrechnungen aus Steuerlisten, Siedlungsfunden und Modellen. Je nach Annahme ändert sich das Bild stark. Ein sinnvoller Umgang: nicht eine Zahl merken, sondern verstehen, wovon sie abhängt und wie groß die Unsicherheit ist."]

  quiz: [

      e: "Ohne frühere Erfahrung mit den Erregern sind die Verläufe schwerer. Zusammenbrechende Versorgung verstärkte die Sterblichkeit zusätzlich." },
    { q: "Was zeigt der Disput von Valladolid (1550/51)?", o: ["Dass Spanien die Encomienda sofort abschaffte", "Dass es schon früh eine Debatte über die Rechte der Indigenen gab, die Praxis aber weitgehend dem Interesse folgte", "Dass alle Spanier die Eroberung ablehnten", "Dass der Papst die Eroberung verbot"], a: 1,

UNITS.u18 = {
  id: "u18",
  title: "Der atlantische Sklavenhandel und die Plantagenwelt",
  lead: "Etwa zwölf Millionen Menschen werden aus Afrika über den Atlantik verschleppt. Wie ein Wirtschaftssystem entstand, wer daran verdiente und was es bis heute hinterlassen hat.",
  body: [
    { h: "Sklaverei vor dem Atlantik", p: [
      "Sklaverei war nichts Neues. Sie gab es in Mesopotamien, Griechenland und Rom (Einheiten 2, 3, 5), im Frühmittelalter in Europa, in der islamischen Welt, in Afrika und Amerika. Meist waren Sklaven Kriegsgefangene, Schuldner oder Verschleppte, und ihr Status war in vielen Gesellschaften nicht erblich oder nicht so umfassend wie später. Auch der Handel mit Menschen über die Sahara und den Indischen Ozean bestand seit Jahrhunderten (Einheit 15). Das macht die atlantische Sklaverei nicht harmloser, aber es erklärt, dass die Europäer in bestehende Netze eintraten.",
      "Das Neue war der Maßstab und die Verbindung mit einem bestimmten Wirtschaftszweig. Auf Madeira und den Kapverden begannen die Portugiesen im 15. Jahrhundert, Zuckerrohr in Plantagen anzubauen, und setzten dort Sklaven ein. Zucker war ein begehrtes Luxusgut, und sein Anbau war arbeitsintensiv und hart. Auf der Insel São Tomé entstand ab etwa 1490 eine regelrechte Plantagenwirtschaft mit verschleppten Afrikanern. Dieses Modell wurde in Brasilien und später in der Karibik vervielfacht."
    ]},
    { h: "Warum ausgerechnet Afrikaner? Die Logik des Systems", p: [
      "In Amerika brauchten die Kolonisten Arbeitskräfte. Die indigene Bevölkerung war durch Seuchen und Gewalt dramatisch geschrumpft (Einheit 17), und Rohstoffe wie Zucker, Tabak und später Baumwolle ließen sich nur mit sehr vielen Händen gewinnen, die der Markt in Europa verlangte. Europäische Arbeiter waren teuer und gingen lieber in Gebiete mit Land und Freiheit. Zwangsarbeiter aus Afrika, deren Kauf bereits eine Infrastruktur an der Küste ermöglichte, lösten das Problem aus Sicht der Pflanzer. Dazu kam, dass viele Menschen aus Westafrika durch frühere Kontakte eine gewisse Resistenz gegen tropische Krankheiten wie Malaria oder Gelbfieber hatten, die Europäer dagegen häufig starben. Das spielte eine Rolle, erklärt aber den Handel nicht allein.",
      "Wichtig ist die Reihenfolge von Ursache und Begründung. Zuerst standen wirtschaftliche Interessen, dann folgte die Rechtfertigung. Der Rassismus, also die Vorstellung, Menschen mit dunkler Haut seien von Natur aus minderwertig, wurde zu einem großen Teil im Nachhinein entwickelt, um ein System zu begründen, das auf Gewalt beruhte. Das gilt auch für religiöse Argumente, die man heranzog. Man kann den Zusammenhang so lesen: Das Wirtschaftssystem schuf die Nachfrage nach Menschen, und die Ideologie lieferte das gute Gewissen. Wer das versteht, erkennt, dass Rassismus eine historische Konstruktion ist, kein Naturgesetz."
    ]},
    { h: "Das System: Dreieck, Zahlen, Überfahrt", p: [
      "Man spricht vom „Dreieckshandel“. Europäische Schiffe fuhren mit Waren wie Textilien, Metallwaren, Alkohol und Gewehren an die Küsten Westafrikas und tauschten sie gegen Menschen. Diese wurden auf der „Middle Passage“ nach Amerika verschleppt und verkauft. Von dort kehrten die Schiffe mit Zucker, Tabak, Kaffee und später Baumwolle nach Europa zurück. Tatsächlich war der Handel vielfältiger als ein Dreieck, und viele Fahrten verliefen direkt, etwa zwischen Brasilien und Angola.",
      "Nach den Daten der Datenbank „Slave Voyages“ wurden zwischen dem 16. und 19. Jahrhundert rund 12,5 Millionen Menschen eingeschifft, etwa 10,7 Millionen erreichten Amerika lebend. Die meisten, rund fünf Millionen, wurden nach Brasilien gebracht, den Rest bekamen Karibik, Spanisch- und Nordamerika. Portugal und Brasilien, Großbritannien, Frankreich, die Niederlande und Spanien stellten die Hauptakteure, später auch Händler aus Nordamerika. Die Sterblichkeit während der Überfahrt lag im Durchschnitt bei über zehn Prozent. Die Menschen wurden eng gepfercht und unter Deck gehalten, litten an Ruhr, Pocken und Skorbut, und es gab Revolten an Bord. Ein bekanntes Zeugnis ist die Autobiografie von Olaudah Equiano (1789), einem ehemals Versklavten."
    ]},
    { h: "Die afrikanische Seite", p: [
      "Man darf Afrika nicht als bloßes Opfer sehen, aber auch nicht die Gewalt verharmlosen. Die Europäer kauften Menschen meist nicht selbst im Landesinneren, sondern von afrikanischen Händlern und Herrschern an der Küste. Staaten wie Dahomey, Asante oder das Königreich Oyo erweiterten ihre Macht, indem sie Kriege führten, Gefangene machten und sie verkauften. Im Gegenzug erhielten sie Gewehre, Textilien und andere Waren, die sie für weitere Kriege nutzten. So entstand ein Teufelskreis, der Gewalt und Unsicherheit ausweitete. Wer sich nicht beteiligte, riskierte, selbst Opfer zu werden.",
      "Es gab auch Widerstand und Kritik. Der christliche Herrscher des Kongo, Afonso I., schrieb 1526 an den portugiesischen König, die Händler entvölkerten sein Land, und bat darum, den Handel zu begrenzen, ohne Erfolg. Die demografischen Folgen für Westafrika und Zentralafrika waren gravierend: Es gingen vor allem junge Menschen verloren, und die Gesellschaften litten unter dauernder Gewalt. Viele Historiker sehen darin eine wichtige Ursache für wirtschaftliche Schwächen späterer Jahrhunderte, während andere vor einfachen Kausalitäten warnen."
    ]},
    { h: "Plantagen, Widerstand und Kultur", p: [
      "Auf den Zuckerplantagen Brasiliens und der Karibik herrschte extreme Härte. Die Arbeit war schwer, die Lebenserwartung kurz, und weil die Sterblichkeit höher war als die Geburtenrate, brauchte man ständig neuen Nachschub. Die Pflanzer hielten die Sklaven mit Gewalt, Strafen und Angst unter Kontrolle, und die Gesetze machten Menschen zu Eigentum. In Nordamerika dagegen, wo die Bedingungen weniger tödlich waren, wuchs die versklavte Bevölkerung aus eigener Kraft.",
      "Widerstand gab es in vielen Formen: Flucht, Sabotage, Aufstände, die Gründung von Gemeinschaften geflohener Menschen („Maroons“). Das bekannteste Beispiel ist Palmares im brasilianischen Hinterland, das im 17. Jahrhundert Tausende Bewohner hatte und fast hundert Jahre bestand. 1791 begann auf Saint-Domingue der Aufstand, der zur Gründung Haitis (1804) führte, des ersten Staates, den ehemals Versklavte gründeten. Gleichzeitig bewahrten und verwandelten Menschen ihre Kultur: Musik, Religion, Sprache und Küche, aus denen etwa Jazz, Blues, Samba oder Candomblé hervorgingen. Die afrikanische Diaspora gestaltete die Gesellschaften Amerikas mit, trotz Unterdrückung."
    ]},
    { h: "Gewinne, Verbindungen und Erbe", p: [
      "Für Europa waren die Folgen vielfältig. Hafenstädte wie Bristol, Liverpool, Nantes, Bordeaux und Amsterdam wuchsen durch den Handel, Banken und Versicherungen entwickelten sich, und Zucker wurde vom Luxusgut zum Alltagsprodukt, das Tee und Kaffee süßte. Ob die Sklaverei die Industrialisierung ermöglichte, ist umstritten (die These von Eric Williams). Sicher ist, dass die Baumwolle der Sklavenplantagen im 19. Jahrhundert die britische Textilindustrie versorgte (siehe später die Einheiten zur Industrialisierung) und dass viele Vermögen auch in Deutschland und anderswo indirekt mit dem System verbunden waren.",
      "Gleichzeitig wuchs die Kritik. Quäker und Aufklärer, ehemals Versklavte wie Equiano und religiöse Bewegungen forderten das Ende. Großbritannien verbot den Handel 1807 und die Sklaverei im Empire 1833, Frankreich schaffte sie endgültig 1848 ab, die USA 1865 nach dem Bürgerkrieg, Brasilien erst 1888. Danach blieben Ausbeutung, Rassismus und Ungleichheit in anderen Formen bestehen. Heute wird diskutiert, wie man mit diesem Erbe umgeht: durch Erinnerung, Entschädigungsforderungen, Bildung und die Frage, wie Gesellschaften mit Unrecht in ihrer Geschichte umgehen. Das ist keine Randfrage, sondern berührt, wie Reichtum und Armut in der Welt entstanden sind."
    ]}
