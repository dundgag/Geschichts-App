UNITS.u29 = {
  id: "u29",
  title: "Industrialisierung in Europa und der Welt: die soziale Frage",
  lead: "Wie sich die Industrialisierung ausbreitete, warum Deutschland aufholte, welche Antworten Arbeiterbewegung und Staat auf die Not fanden und wer auf der Welt verlor.",
  body: [
    { h: "Aufholen: Wie sich die Industrialisierung ausbreitete", p: [
      "Großbritannien blieb nicht lange allein. Belgien, Frankreich, die deutschen Staaten, die USA und später Japan holten auf. Wer später kam, hatte Vorteile: Man konnte Maschinen und Techniken übernehmen und musste sie nicht erfinden. Zugleich brauchte man Mittel, die die Briten nicht gebraucht hatten, nämlich Banken, die Kapital sammelten, und einen Staat, der Verkehr, Zölle und Bildung organisierte. Dieses Muster, dass Nachzügler stärker auf Staat und Bank setzen, wiederholt sich in der Geschichte immer wieder.",
      "In den deutschen Staaten verhinderten zunächst Zollschranken und Kleinstaaterei den Aufschwung. 1834 schloss sich ein Großteil der Staaten im Deutschen Zollverein zu einem Binnenmarkt zusammen. 1835 fuhr die erste Eisenbahn zwischen Nürnberg und Fürth, und in den folgenden Jahrzehnten entstand ein Netz, das Kohle, Eisen und Märkte verband. Das Ruhrgebiet wurde zum Zentrum von Kohle und Stahl, Firmen wie Krupp, Borsig und Thyssen wuchsen. Preußen förderte Bergbau, Bildung und Technische Hochschulen. Bis 1900 überholte das Deutsche Reich Großbritannien in der Stahlproduktion."
    ]},
    { h: "Die zweite Industrielle Revolution", p: [
      "Ab etwa 1870 begann eine zweite Welle, die stärker von Wissenschaft getragen war. Stahl wurde durch neue Verfahren billig (Bessemer 1856). Werner von Siemens baute 1866 den elektrischen Generator, und Elektrizität verbreitete Licht, Straßenbahnen und Motoren. Die Chemieindustrie in Deutschland (BASF, Bayer, Hoechst) entwickelte Farbstoffe, Dünger und Arzneimittel. Carl Benz und Gottlieb Daimler bauten in den 1880er-Jahren Motoren mit Benzin, aus denen Automobile wurden. Forschung wurde zur Aufgabe von Laboren und Universitäten, nicht mehr nur von Tüftlern. Hier verbindet sich die Wissenschaftliche Revolution (Einheit 23) mit der Industrie.",
      "In den USA entstand ein riesiger Binnenmarkt. 1869 wurde die erste transkontinentale Eisenbahn fertiggestellt, Konzerne wie Standard Oil und US Steel wuchsen, und Millionen Europäer wanderten ein. Allein aus Deutschland wanderten im 19. Jahrhundert rund fünf Millionen Menschen aus, viele in die USA, oft aus Not oder politischen Gründen."
    ]},
    { h: "Die soziale Frage", p: [
      "Mit der Industrie entstand eine neue Klasse, die Arbeiterschaft. Ihre Lage war oft hart: lange Arbeitstage, niedrige Löhne, gefährliche Arbeit, keine Absicherung bei Krankheit, Unfall und Alter. Man sprach von der „sozialen Frage“: Wie kann eine Gesellschaft mit der Not der Arbeiter und dem Reichtum der Unternehmer umgehen? Es gab mehrere Antworten.",
      "Die erste war Selbsthilfe. Arbeiter bildeten Gewerkschaften, Genossenschaften und Hilfskassen. Die zweite war Kritik am System. Karl Marx und Friedrich Engels veröffentlichten 1848 das „Kommunistische Manifest“, das die Geschichte als Geschichte von Klassenkämpfen deutete und die Arbeiter aufrief, die Verhältnisse zu stürzen. Marx’ „Kapital“ (1867) analysierte die Ausbeutung. Seine Ideen wurden zur Grundlage von Sozialismus und Kommunismus. In Deutschland entstand 1863 der erste Arbeiterverein, aus dem 1875 die Sozialdemokratische Partei hervorging.",
      "Die dritte Antwort kam vom Staat. Reichskanzler Otto von Bismarck bekämpfte die Sozialdemokraten durch das Sozialistengesetz (1878–1890), das ihre Organisationen verbot. Zugleich wollte er den Arbeitern einen Grund geben, den Staat zu stützen, und führte die ersten staatlichen Sozialversicherungen ein: die Krankenversicherung (1883), die Unfallversicherung (1884) und die Alters- und Invalidenversicherung (1889). Sie waren das erste große Sozialversicherungssystem der Welt und ein Vorbild für viele Länder. Der Staat wurde nun zum Garanten von Sicherheit. Eine vierte Antwort kam aus Kirchen und Reformern, etwa Adolph Kolping oder Wilhelm Emmanuel von Ketteler, und eine fünfte aus Gesetzen: Arbeitszeit, Kinderarbeit und Fabrikaufsicht wurden schrittweise begrenzt. Das Muster, dass Not erst Bewegungen und dann Gesetze hervorbringt, ist ein Grundmuster der Industriegesellschaft."
    ]},
    { h: "Städte, Familie und neue Lebensformen", p: [
      "Die Städte wuchsen rasant. Berlin hatte 1850 rund 400.000, 1910 über zwei Millionen Einwohner. Mietskasernen, Gasbeleuchtung, Pferdebahnen und später Kanalisation und Elektrizität veränderten den Alltag. Das Bürgertum entwickelte eine eigene Kultur mit Bildung, Vereinen und der Trennung von Wohnen und Arbeiten, und Frauen blieben meist auf Haushalt und Familie verwiesen, während viele Arbeiterfrauen in Fabriken oder als Dienstmädchen arbeiteten. Frauenbewegungen forderten Bildung und Wahlrecht, das in Neuseeland 1893 als erstem Land eingeführt wurde, in Deutschland erst 1918.",
      "Die Bevölkerung wuchs stark, weil die Sterblichkeit sank und die Geburtenrate noch hoch blieb. In Europa lebten um 1800 etwa 190 Millionen Menschen, um 1900 rund 400 Millionen. Wie die Medizin dazu beitrug, zeigt die nächste Einheit."
    ]},
    { h: "Gewinner und Verlierer der Welt", p: [
      "Die Industrialisierung verteilte Macht und Wohlstand auf der Welt neu. Industriestaaten konnten Waren billiger herstellen, bessere Waffen bauen und Schiffe, Eisenbahnen und Telegrafen nutzen. Länder, die nicht mithielten, gerieten in Abhängigkeit. Indien, das 1750 einen großen Anteil an der Weltproduktion von Textilien hatte, wurde zum Rohstofflieferanten und Absatzmarkt für britische Waren. China wurde durch die Opiumkriege (Einheit 32) zur Öffnung gezwungen. Osmanisches Reich und Ägypten gerieten in Schulden. Zugleich stieg der Lebensstandard in den Industrieländern, und die Kluft zwischen reichen und armen Regionen, die heute noch besteht, wurde im 19. Jahrhundert sehr viel größer.",
      "Eine Ausnahme war Japan. Nach der Ankunft amerikanischer Kriegsschiffe 1853 und der Öffnung des Landes (Einheit 22) stürzte eine Gruppe von Reformern 1868 das Shogunat, die „Meiji-Restauration“. Die neue Regierung schickte Studenten ins Ausland, baute Eisenbahnen, Fabriken, Schulen und ein modernes Heer, und schaffte die Samurai-Privilegien ab. In wenigen Jahrzehnten wurde Japan zur Industriemacht, die 1895 China und 1905 Russland besiegte. Das Beispiel zeigt, dass der Weg der Industrialisierung nicht nur im Westen möglich war, aber meist mit einem starken Staat verbunden."
    ]}
  ],

UNITS.u30 = {
  id: "u30",
  title: "Medizin im Industriezeitalter: Narkose, Keime und öffentliche Gesundheit",
  lead: "Wie im 19. Jahrhundert Schmerz beherrschbar, Infektion verständlich und Gesundheit zur Staatsaufgabe wurde, und warum die Lebenserwartung dadurch stieg.",
  body: [
    { h: "Die Ausgangslage: Chirurgie ohne Betäubung", p: [
      "Wer um 1800 eine Operation brauchen würde, hatte vor allem eines zu fürchten: den Schmerz. Chirurgen arbeiteten schnell, oft in Minuten, weil der Patient wach war, von Helfern festgehalten wurde und gelegentlich Alkohol oder Opium bekam. Eine Amputation des Beins war eine Frage von Geschwindigkeit. Zugleich war die Medizin theoretisch noch stark vom Erbe Galens geprägt (Einheit 6), das Vesalius und Harvey korrigiert hatten (Einheit 23), aber die Ursachen von Infektionen waren unbekannt. Man kannte Beobachtungen, aber keine Erklärung. Das 19. Jahrhundert änderte beides: Schmerz und Ansteckung wurden beherrschbar. Man kann in diesem Zusammenhang drei Linien unterscheiden: Schmerz, Infektion und Gesellschaft."
    ]},
    { h: "Die Entdeckung der Narkose", p: [
      "Dass bestimmte Gase betäuben können, war seit Jahrzehnten bekannt. Der Chemiker Humphry Davy hatte 1799 bemerkt, dass Lachgas Schmerzen lindert, aber das blieb zunächst Partyspaß. 1842 verwendete der Arzt Crawford Long in Georgia Äther bei einer kleinen Operation, ohne es zu veröffentlichen. Der Durchbruch kam am 16. Oktober 1846 in Boston. Im Massachusetts General Hospital führte der Zahnarzt William Morton vor Publikum eine Betäubung mit Ätherdämpfen vor, und der Chirurg John Collins Warren entfernte schmerzfrei einen Tumor am Hals. Der Satz Warrens an die Zuschauer, „Meine Herren, das ist kein Humbug“, wurde berühmt. Die Nachricht verbreitete sich in wenigen Wochen über den Atlantik. Im Dezember 1846 operierte man in London unter Äther, und im November 1847 führte der Geburtshelfer James Young Simpson in Edinburgh Chloroform ein, das leichter anzuwenden war.",
      "Es gab Widerstand. Manche Ärzte meinten, Schmerz sei notwendig oder gottgewollt, andere fürchteten Risiken, und tatsächlich starben Patienten an Überdosierung. Der Londoner Arzt John Snow, derselbe, der später die Cholera kartierte (Einheit 28), untersuchte die Wirkung der Gase systematisch, konstruierte Geräte zur genauen Dosierung und gilt deshalb als einer der ersten Anästhesisten im modernen Sinn. 1853 gab er Königin Victoria bei der Geburt ihres Sohnes Chloroform, was die Akzeptanz für Narkose in der Geburtshilfe stark erhöhte. Man sieht daran, dass die Anästhesie von Anfang an eine Frage von Dosierung, Beobachtung und Sicherheit war, nicht nur von der richtigen Substanz. Mit der Narkose änderte sich die Chirurgie: Man konnte lange, sorgfältige Operationen im Körperinneren durchführen, die vorher undenkbar waren."
    ]},
    { h: "Die Entdeckung der Ansteckung", p: [
      "Die Narkose löste ein Problem und schuf ein anderes. Weil Operationen länger und tiefer wurden, starben viele Patienten an Wundinfektionen, die man „Hospitalismus“ nannte. In Krankenhäusern gab es keinen Gedanken an Sauberkeit. Operateure wechselten nicht ihre Kleidung, Instrumente wurden kaum gereinigt. Die Erklärung der Zeit lautete wieder, dass schlechte Luft („Miasmen“) Krankheiten erzeuge.",
      "Eine Beobachtung lieferte der ungarische Arzt Ignaz Semmelweis. In der Wiener Gebärklinik starben 1846 etwa jede zehnte bis sechste Frau an Kindbettfieber, auf der Abteilung, in der Ärzte und Studenten arbeiteten, deutlich mehr als auf der Abteilung der Hebammen. Nachdem ein Kollege bei einer Sektion verletzt worden und an ähnlichen Symptomen gestorben war, schloss Semmelweis 1847, dass die Ärzte etwas von den Leichen an den Händen zu den Gebärenden trugen. Er ließ sich die Hände mit Chlorkalklösung waschen, und die Sterblichkeit sank auf unter drei Prozent. Doch er konnte nicht erklären, was übertragen wurde, und viele Kollegen fühlten sich beschuldigt. Er wurde abgelehnt, verlor die Stelle und starb 1865 in einer Anstalt. Erst später erkannte man, dass er recht gehabt hatte. Sein Fall ist ein Lehrbeispiel dafür, dass ein richtiges Ergebnis ohne Theorie und ohne Überzeugungsarbeit nicht ausreicht.",
      "Die Theorie lieferten Louis Pasteur und Robert Koch. Pasteur zeigte in den 1860er-Jahren, dass Gärung und Fäulnis von Mikroorganismen verursacht werden, und entwickelte später Impfungen, etwa gegen Tollwut (1885). Koch wies 1876 nach, dass ein bestimmtes Bakterium Milzbrand auslöst, entdeckte 1882 den Erreger der Tuberkulose und 1884 den der Cholera, und formulierte Regeln, mit denen man einen Erreger einer Krankheit zuordnen kann. Damit löste die Keimtheorie die Miasmentheorie ab. Der britische Chirurg Joseph Lister nutzte diese Erkenntnisse und führte ab 1867 Karbolsäure zur Desinfektion von Wunden, Instrumenten und Luft im Operationssaal ein, die Antisepsis. Später kam die Asepsis, die Keimfreiheit durch Sterilisation von Instrumenten, Kleidung und Händen. Die Kombination aus Narkose und Keimfreiheit machte moderne Chirurgie erst möglich."
    ]},
    { h: "Gesundheit wird eine Staatsaufgabe", p: [
      "Parallel dazu lernte man, Seuchen zu verhindern, ehe man Erreger kannte. Nach der Cholera von 1854 in London (Einheit 28) wurden Wasserversorgung und Kanalisation ausgebaut. In Hamburg dagegen wurde zu lange auf Sparsamkeit gesetzt, und als 1892 die Cholera ausbrach, starben rund 8.600 Menschen, während im benachbarten Altona, das sein Wasser filterte, kaum Fälle auftraten. Der Ausbruch zeigte, dass Hygiene ein politisches Thema ist, und führte zu Reformen. Florence Nightingale hatte im Krimkrieg (1854–1856) gezeigt, dass saubere Pflege und Statistik mehr Leben retten als Heldentum: Die Mehrzahl der Soldaten starb an Krankheiten, nicht an Wunden. Sie gründete die moderne Krankenpflegeausbildung. 1863 entstand auf Anregung von Henry Dunant, der die Schlacht von Solferino erlebt hatte, das Rote Kreuz.",
      "Der Staat baute Gesundheitsämter, Impfprogramme und Schulen für Hebammen und Ärzte auf. Die Krankenversicherung Bismarcks (Einheit 29) schuf zum ersten Mal einen breiten Zugang zu ärztlicher Behandlung. Neue Mittel kamen hinzu: das Diphtherieserum von Emil von Behring (1890/91), Röntgens Strahlen (1895), die Blutgruppen (1901), und später die ersten gezielten Medikamente. Die Folge war ein deutlicher Rückgang der Sterblichkeit: In Deutschland stieg die Lebenserwartung bei Geburt zwischen 1870 und 1914 von rund 36 auf etwa 47 Jahre, vor allem weil weniger Kinder starben."
    ]},
    { h: "Zusammenhänge und Grenzen", p: [
      "Dass diese Fortschritte gerade im 19. Jahrhundert eintraten, hat Gründe. Die Industrialisierung (Einheiten 28 und 29) erzeugte Probleme, die Lösungen erzwangen: dichte Städte mit Seuchen, Fabrikunfälle und Kriege mit Massenverletzten. Sie lieferte aber auch Mittel: Chemie und Glasindustrie für Reagenzien und Mikroskope, Statistik für die Auswertung, und Staaten, die Geld für Krankenhäuser und Wasserleitungen hatten. Wissenschaftliche Methode, Öffentlichkeit und Presse ließen Entdeckungen schnell weltweit verbreiten (Einheit 24). Es ist das Zusammenspiel von Wissen, Wirtschaft und Verwaltung.",
      "Man sollte auch die Grenzen nennen. Gegen viele Infektionen gab es noch keine Mittel, bis Antibiotika im 20. Jahrhundert kamen. Der Zugang zu moderner Medizin war ungleich: Städter hatten ihn eher als Landbewohner, Reiche eher als Arme, und in den Kolonien dienten Gesundheitsprogramme oft zunächst den Interessen der Kolonialmächte. Chinin als Mittel gegen Malaria erlaubte Europäern im 19. Jahrhundert, tiefer in Afrika einzudringen (nächste Einheiten), und die Tropenmedizin entstand zunächst, um Soldaten und Verwalter zu schützen. Medizin ist deshalb nie nur Wissenschaft, sondern auch Politik."
    ]}
  ],

UNITS.u31 = {
  id: "u31",
  title: "Nationalstaaten: von 1848 bis zum Deutschen Reich",
  lead: "Wie die Idee der Nation Europa umformte, warum die Revolution von 1848 scheiterte und wie Bismarck Deutschland von oben einigte.",
  body: [
    { h: "Was ist eine Nation, und warum wurde sie so mächtig?", p: [
      "Im Mittelalter und in der Frühen Neuzeit gehörten Menschen zu Dynastien, Religionen, Ständen und Regionen, aber selten zu einer „Nation“. Das Heilige Römische Reich bestand aus Hunderten Territorien, und im Habsburgerreich lebten viele Sprachen zusammen. Das änderte sich seit der Französischen Revolution (Einheit 26): Wenn die Souveränität beim Volk liegt, muss man fragen, wer das Volk ist. Die Antwort war oft: eine Gruppe, die Sprache, Geschichte und Kultur teilt. Napoleons Eroberungen (Einheit 27) lösten in Deutschland, Spanien und Russland Gegenbewegungen aus, die sich auf die eigene Nation beriefen. Dichter und Gelehrte sammelten Volkslieder, Märchen und Sprache und schufen so ein Bild gemeinsamer Herkunft.",
      "Dazu kamen praktische Gründe: Wirtschaft und Eisenbahnen (Einheit 29) verlangten größere Märkte, und Verwaltung, Heere und Schulen waren in größeren Einheiten effizienter. Nationalismus war damit zugleich Befreiungsidee und Machtinstrument. Er konnte Menschen vereinen, aber auch Fremde ausschließen, und die Frage, wo die Grenzen der Nation liegen, wurde zu einer Quelle von Konflikten, die bis ins 20. Jahrhundert reichten."
    ]},
    { h: "Der Wiener Kongress und der Druck von unten", p: [
      "Die Ordnung von 1815 (Einheit 27) wollte solche Bewegungen eindämmen. Aber sie ließen sich nicht ersticken. Die Griechen erkämpften sich zwischen 1821 und 1830 gegen das Osmanische Reich die Unabhängigkeit, unterstützt von britischen, französischen und russischen Intellektuellen und Regierungen. 1830 erhoben sich Belgier gegen die Niederlande und Pariser gegen den König. In Deutschland forderten Studenten beim Wartburgfest 1817 und beim Hambacher Fest 1832 Einheit und Freiheit. Die Regierungen antworteten mit Zensur und Verboten.",
      "1848 kam der Ausbruch. Ausgelöst durch Missernten, Wirtschaftskrise und Unzufriedenheit brach im Februar in Paris die Revolution aus, und binnen Wochen erfasste sie Wien, Berlin, Italien und Ungarn. Die Forderungen waren Pressefreiheit, Verfassungen, Wahlrecht und nationale Einheit. In Frankfurt trat im Mai 1848 in der Paulskirche die erste frei gewählte deutsche Nationalversammlung zusammen. Sie verabschiedete Grundrechte und eine Reichsverfassung für ein Kaiserreich mit einem Parlament. Doch es gab Streit: Sollte Österreich dazugehören (großdeutsch) oder nicht (kleindeutsch)? Die Versammlung wählte für die Kaiserkrone den preußischen König Friedrich Wilhelm IV., der sie im April 1849 ablehnte, denn er wollte keine Krone „vom Volk“. Zugleich gewannen die alten Mächte ihre Kraft zurück, und mit Truppen wurden die Aufstände niedergeschlagen. Die Revolution scheiterte, weil die Liberalen sich über Ziele stritten, weil Arbeiter und Bürger bald unterschiedliche Interessen hatten, und weil Armee und Fürsten die Macht behielten. Viele Demokraten wanderten in die USA aus, die „Achtundvierziger“."
    ]},
    { h: "Italien: Einheit mit List und Waffen", p: [
      "In Italien, das in mehrere Staaten geteilt war, die teils von Österreich beherrscht wurden, gelang die Einigung. Der Ministerpräsident Piemont-Sardiniens, Camillo Cavour, verband Diplomatie, Bündnisse und Krieg. 1859 besiegte er mit französischer Hilfe Österreich. 1860 landete Giuseppe Garibaldi mit seinen „Tausend“ Freiwilligen auf Sizilien und eroberte den Süden. 1861 wurde das Königreich Italien ausgerufen, 1870 kam Rom dazu. Das Land blieb aber gespalten: Der Süden war ärmer, und viele Menschen sprachen noch Dialekte. „Wir haben Italien geschaffen, nun müssen wir Italiener schaffen“, soll ein Politiker gesagt haben. Das zeigt, dass die Nation nicht nur gegründet, sondern auch gebaut werden muss."
    ]},
    { h: "Bismarck und die Einigung Deutschlands", p: [
      "In Deutschland führte der Weg nicht über das Parlament, sondern über Preußen. 1862 ernannte König Wilhelm I. Otto von Bismarck zum Ministerpräsidenten. Bismarck erklärte, die großen Fragen der Zeit würden nicht durch Reden und Mehrheitsbeschlüsse entschieden, sondern durch „Eisen und Blut“. Er führte drei Kriege. 1864 besiegte Preußen mit Österreich Dänemark um Schleswig und Holstein. 1866 führte Preußen gegen Österreich Krieg, entschied ihn bei Königgrätz und schloss Österreich aus Deutschland aus. Der Norddeutsche Bund unter preußischer Führung entstand. 1870 provozierte Bismarck mit der Emser Depesche Frankreich zur Kriegserklärung. Die süddeutschen Staaten stellten sich auf die preußische Seite, und nach dem Sieg bei Sedan wurde Napoleon III. gefangen genommen. Am 18. Januar 1871 wurde im Spiegelsaal von Versailles Wilhelm I. zum Deutschen Kaiser ausgerufen. Frankreich musste Elsass-Lothringen abtreten und Reparationen zahlen, was Hass säte.",
      "Das Reich war eine Monarchie mit Parlament. Es gab einen Reichstag mit allgemeinem Männerwahlrecht, aber der Kanzler hing vom Kaiser ab, und Preußen dominierte. Man nennt das ein „Obrigkeitsstaat mit Verfassung“. Bismarck bekämpfte die katholische Kirche im Kulturkampf, die Sozialdemokraten durch das Sozialistengesetz (Einheit 29) und band andere durch Sozialversicherung. Außenpolitisch wollte er Frieden: Mit einem Netz von Bündnissen, dem Dreikaiserbund und später dem Zweibund mit Österreich-Ungarn, wollte er Frankreich isolieren und Konflikte vermeiden. Dass Deutschland nun in der Mitte Europas die stärkste Festlandmacht war, veränderte das Gleichgewicht, das der Wiener Kongress gestützt hatte, und machte die anderen Mächte misstrauisch."
    ]},
    { h: "Parallelen: USA, Russland und Habsburg", p: [
      "Die USA erlebten ihre eigene Nationenfrage. 1861 bis 1865 kämpfte der Norden unter Abraham Lincoln gegen die Südstaaten, die die Union verlassen hatten, um die Sklaverei zu schützen (Einheit 25). Der Krieg kostete über 600.000 Soldaten das Leben, und der Norden siegte. 1865 wurde die Sklaverei durch den 13. Verfassungszusatz abgeschafft, und aus dem Staatenbund wurde ein stärker zentralisiertes Land. Die Rechte der Befreiten wurden jedoch bald wieder eingeschränkt, ein Konflikt, der das 20. Jahrhundert prägte.",
      "In Russland hob Zar Alexander II. 1861 die Leibeigenschaft auf, aus Furcht vor Aufständen und weil das Land den Anschluss an die Industrialisierung verpasste (Einheit 29). Die Bauern blieben aber arm. In der Habsburgermonarchie, in der viele Völker lebten, führte das Nationalprinzip zu Zerreißproben: 1867 einigte man sich im „Ausgleich“ auf die Doppelmonarchie Österreich-Ungarn mit Ungarn als Partner, aber Tschechen, Südslawen, Polen und andere blieben unzufrieden. Das Reich, das Nationalstaaten nicht passte, wurde zum Schauplatz der Konflikte, die 1914 den Krieg auslösten (Einheit 33)."
    ]}
  ],

  deep: [
    ["Warum scheiterte 1848 in Frankfurt?", "Es gab mehrere Gründe: Das Parlament hatte keine eigene Macht, also keine Armee, und war auf die Fürsten angewiesen. Es stritt lange über Grundrechte und Grenzen. Die Liberalen fürchteten die radikale Linke und suchten Schutz bei den alten Mächten. Zugleich hatte Preußen ein eigenes Interesse. Das zeigt, wie Ideen ohne Machtmittel kaum wirken."],

UNITS.u32 = {
  id: "u32",
  title: "Imperialismus: die Aufteilung der Welt",
  lead: "Wie Europa, die USA und Japan zwischen 1870 und 1914 fast die ganze Welt unter Kontrolle brachten, welche Gründe sie nannten, welche sie hatten, und was die Betroffenen taten.",
  body: [
    { h: "Alter Kolonialismus, neuer Imperialismus", p: [
      "Kolonien gab es seit dem 15. Jahrhundert (Einheiten 16 bis 18). Aber im späten 19. Jahrhundert änderte sich der Maßstab. Um 1800 kontrollierten Europäer etwa ein Drittel der Landfläche der Erde, um 1914 fast neun Zehntel einschließlich ihrer früheren Kolonien. Afrika, das 1870 noch zu etwa 90 Prozent von afrikanischen Herrschern regiert wurde, war 1914 bis auf Äthiopien und Liberia aufgeteilt. Man spricht vom Zeitalter des Imperialismus, und die Frage lautet: Warum wuchs die Herrschaft in so kurzer Zeit so stark, und wie war das möglich?"
    ]},
    { h: "Ursachen: Wirtschaft, Macht, Technik und Ideen", p: [
      "Die wirtschaftliche Erklärung sagt: Die Industrialisierung (Einheiten 28 und 29) brauchte Rohstoffe wie Kautschuk, Baumwolle, Kupfer und Öl sowie Märkte für Waren und Kapital. Kolonien sollten beides liefern. Tatsächlich war der Gewinn der meisten Kolonien für die Mutterländer gering, denn der größte Teil des Handels lief weiter mit anderen Industrieländern. Für einzelne Unternehmen, Banken und Händler aber lohnte es sich. Die politische Erklärung hebt Prestige und Sicherheit hervor: Wer Kolonien besaß, galt als Großmacht, und Stützpunkte sicherten Seewege, etwa zu Indien. Konkurrenz trieb die Mächte an, denn jeder wollte verhindern, dass der andere die Gebiete besetzt. Dazu kamen innenpolitische Gründe, denn Kolonialpolitik konnte vom Streit zu Hause ablenken und Nationalstolz stiften.",
      "Die dritte Erklärung betrifft die Technik. Dampfschiffe und der Suezkanal (1869) verkürzten die Wege. Die Telegrafen verbanden Kontinente. Maschinengewehre wie das Maxim-Gewehr gaben europäischen Truppen eine enorme Feuerüberlegenheit. Eisenbahnen erschlossen das Innere, und Medizin war ein weiterer Schlüssel: Chinin als Vorbeugung gegen Malaria erlaubte es Europäern, das tropische Afrika zu betreten, wo viele zuvor binnen Monaten gestorben waren (Einheit 30). Ohne dieses Mittel wäre die Aufteilung kaum so schnell gegangen.",
      "Die vierte Erklärung ist die Ideologie. Man sprach von einer „Zivilisierungsmission“: Europa habe die Pflicht, „rückständige“ Völker zu erziehen, zu christianisieren und zu entwickeln, „the white man’s burden“ nach einem Gedicht Kiplings von 1899. Sozialdarwinismus und Rassentheorien lieferten eine pseudowissenschaftliche Begründung, indem sie behaupteten, es gebe höhere und niedrigere „Rassen“. Das knüpfte an den Rassismus an, der schon die Sklaverei gerechtfertigt hatte (Einheit 18). Es war eine Selbsttäuschung, die ein Gewaltsystem moralisch erträglich machen sollte."
    ]},
    { h: "Asien: Indien und China", p: [
      "In Indien hatte die East India Company seit dem 18. Jahrhundert Gebiete erobert. Nach dem Aufstand von 1857, der sich an Streit um Gewehrpatronen, Steuern und die Missachtung von Religion entzündete und blutig niedergeschlagen wurde, übernahm 1858 die britische Krone die Herrschaft. 1877 wurde Königin Victoria Kaiserin von Indien. Die Briten bauten Eisenbahnen, ein Rechtssystem und eine Verwaltung, nutzten aber das Land als Rohstoffquelle und Absatzmarkt. Hungersnöte, bei denen Millionen starben, etwa 1876–78 und 1896–1902, wurden durch Ausfuhr von Getreide und mangelhafte Hilfe verschärft.",
      "China wurde geöffnet, ohne formell Kolonie zu werden. Britische Händler bezahlten den Tee mit Opium aus Indien, was Millionen Chinesen abhängig machte. Als die Regierung in Kanton 1839 Opium vernichten ließ, griff Großbritannien an. Im Ersten Opiumkrieg (1839–1842) siegten die Briten, und im Vertrag von Nanking musste China Hongkong abtreten, Häfen öffnen und Entschädigung zahlen. Ein zweiter Krieg (1856–1860) vertiefte die Abhängigkeit, und „ungleiche Verträge“ gaben Ausländern Sonderrechte. Zugleich erschütterte der Taiping-Aufstand (1850–1864) das Land, der geschätzt über 20 Millionen Menschenleben kostete. Chinas Selbstbild als Mitte der Welt (Einheit 22) wurde schwer getroffen. Bis heute spricht man dort vom „Jahrhundert der Demütigung“."
    ]},
    { h: "Afrika: der „Wettlauf“ und die Linien auf der Karte", p: [
      "Bis in die 1870er-Jahre kontrollierten Europäer in Afrika vor allem Küstenstützpunkte. Dann wurde der Kongo zum Auslöser. Der belgische König Leopold II. ließ sich als Privatmann ein riesiges Gebiet im Kongobecken sichern, um es auszubeuten. Die Mächte fürchteten, ins Hintertreffen zu geraten. Auf der Berliner Kongokonferenz 1884/85 verständigten sich vierzehn Staaten, keine afrikanischen darunter, auf Spielregeln: Wer ein Gebiet effektiv besetzt, darf es behalten. Das löste einen Wettlauf aus. Innerhalb von zwanzig Jahren wurde fast der ganze Kontinent aufgeteilt, oft mit dem Lineal auf der Karte, ohne Rücksicht auf Sprachen, Reiche und Handelswege. Diese Grenzen sind in vielen Fällen bis heute die Staatsgrenzen und tragen zu heutigen Konflikten bei.",
      "Im Kongo herrschte ein besonders brutales Regime. Zwangsarbeit für die Kautschukgewinnung, Geiselnahmen und Verstümmelungen töteten oder verstümmelten Millionen Menschen, die Zahl der Toten wird auf mehrere Millionen geschätzt und ist umstritten. Internationale Proteste zwangen Belgien 1908, die Kolonie dem Staat zu übernehmen. Deutschland erwarb 1884/85 Kolonien in Togo, Kamerun, Südwestafrika und Ostafrika. In Südwestafrika erhoben sich 1904 die Herero und Nama gegen Landraub und Willkür, und die deutsche Schutztruppe unter General von Trotha antwortete mit einem Vernichtungsbefehl. Zehntausende wurden getötet oder in der Wüste dem Tod überlassen, andere in Lagern eingesperrt. Die Bundesregierung hat 2021 diese Ereignisse als Völkermord anerkannt. 1905 bis 1907 kostete der Maji-Maji-Aufstand in Ostafrika viele Menschenleben."
    ]},
    { h: "Widerstand, Ausnahmen und neue Mächte", p: [
      "Die Betroffenen waren nicht passiv. Es gab bewaffneten Widerstand, wie die Herero, Maji-Maji oder die Mahdi-Bewegung im Sudan, und kluge Diplomatie. Äthiopien unter Kaiser Menelik II. modernisierte sein Heer und besiegte 1896 bei Adwa Italien, ein Sieg, der in Afrika und Asien Hoffnung weckte. Andere nutzten die Kolonialverwaltung, um Bildung zu gewinnen, und aus Schülern missionarischer Schulen wurden später Führer der Unabhängigkeitsbewegungen (Dekolonisierung, spätere Einheiten). Intellektuelle in Indien gründeten 1885 den Indischen Nationalkongress.",
      "Auch außereuropäische Staaten griffen aus. Japan besiegte 1894/95 China und 1905 Russland und besetzte Taiwan und Korea. Die USA gewannen im Spanisch-Amerikanischen Krieg 1898 Kuba, Puerto Rico, Guam und die Philippinen und wurden zur Kolonialmacht im Pazifik. Der Imperialismus erfasste damit die ganze Welt, und die Konkurrenz um Kolonien belastete die Beziehungen der Großmächte, was zum Weg in den Krieg beitrug (Einheit 33)."
    ]},
    { h: "Folgen und Streit um die Deutung", p: [
      "Die Folgen sind vielschichtig und umstritten. Kolonialherrschaft brachte Eisenbahnen, Schulen, Krankenhäuser und neue Pflanzen, aber sie war auf Ausbeutung ausgelegt, schuf Abhängigkeit von Rohstoffexporten, zerriss gewachsene Strukturen und beruhte auf Gewalt und Rassismus. In der Wirtschaftsgeschichte wird gestritten, wie sehr die Kolonien den Reichtum Europas begründeten. Sicher ist, dass die heutige Ungleichheit zwischen Weltregionen auch durch diese Zeit geprägt ist.",
      "Heutige Debatten betreffen Erinnerung und Wiedergutmachung: die Rückgabe von Kulturgütern wie den Benin-Bronzen (Einheit 15), die Anerkennung von Verbrechen wie dem Völkermord an den Herero und Nama, und die Frage, wie Städte mit Denkmälern und Straßennamen umgehen. Wer die Geschichte kennt, kann diese Debatten besser einordnen."
    ]}
  ],

  deep: [
    ["Warum wurde 1884 Berlin Tagungsort?", "Bismarck wollte als „ehrlicher Makler“ zwischen Großbritannien, Frankreich und Portugal auftreten und zugleich Deutschland Kolonien sichern, obwohl er selbst zunächst skeptisch gegenüber Kolonialpolitik war. Das zeigt, wie Innenpolitik, Wirtschaftsinteressen und öffentlicher Druck zusammenwirkten. Die Konferenz teilte Afrika nicht selbst auf, aber sie setzte die Regeln, nach denen es geschah."],
    ["Chinin und Imperialismus", "Rinde des Chinarindenbaums, die Jesuiten im 17. Jahrhundert nach Europa gebracht hatten (Einheit 17), wurde im 19. Jahrhundert als Reinsubstanz Chinin gewonnen. Mit dem täglichen Chinin konnten Europäer Malariagebiete betreten. Die Verknüpfung von Medizin und Macht zeigt, dass Technik die Grenzen des Möglichen verschiebt."]

UNITS.u33 = {
  id: "u33",
  title: "Der Weg in den Ersten Weltkrieg",
  lead: "Wie aus einem Attentat in Sarajevo ein Weltkrieg wurde, welche Ursachen langfristig wirkten, und warum die Schuldfrage bis heute diskutiert wird.",
  body: [
    { h: "Ein Europa im Gleichgewicht, das keines mehr war", p: [
      "Nach 1871 (Einheit 31) war das Deutsche Reich die stärkste Landmacht des Kontinents. Bismarck sorgte mit einem Geflecht aus Bündnissen dafür, dass Frankreich isoliert blieb und niemand einen Grund für einen Krieg sah. Als Kaiser Wilhelm II. 1890 Bismarck entließ, ließ Deutschland den Rückversicherungsvertrag mit Russland auslaufen. Russland verbündete sich mit Frankreich (1894), und Großbritannien, das sich lange aus Bündnissen herausgehalten hatte, schloss 1904 die Entente cordiale mit Frankreich und 1907 eine Verständigung mit Russland. Europa teilte sich in zwei Lager: den Dreibund (Deutschland, Österreich-Ungarn, Italien) und die Triple Entente (Frankreich, Russland, Großbritannien).",
      "Warum näherte sich Großbritannien den alten Rivalen an? Der Grund war die deutsche Flottenpolitik. Admiral Tirpitz baute ab 1898 eine große Schlachtflotte, die Großbritanniens Seeherrschaft herausforderte. Das löste ein Wettrüsten zur See aus und ließ London das Reich als Bedrohung sehen. Zugleich wuchs Deutschlands Wirtschaft stärker als die britische (Einheit 29). Wettrüsten, Bündnisse und die Furcht, ins Hintertreffen zu geraten, verstärkten sich gegenseitig."
    ]},
    { h: "Krisen vor der Krise", p: [
      "Mehrere Krisen zeigten, wie dünn der Frieden war. Die erste und zweite Marokkokrise (1905, 1911) entstanden, weil Deutschland französische Ansprüche in Nordafrika infrage stellte, und endeten mit diplomatischen Niederlagen für Berlin. Die Bosnische Annexionskrise 1908 verschärfte die Spannung zwischen Österreich-Ungarn und Serbien. In den Balkankriegen 1912/13 vertrieben Serbien, Bulgarien und Griechenland die Osmanen fast vollständig aus Europa, und stritten sich danach um die Beute. Serbien wuchs, und Österreich-Ungarn, das zahlreiche slawische Bevölkerungsgruppen in seinem Reich hatte (Einheit 31), fürchtete den großserbischen Nationalismus.",
      "Hinter allem stand eine Stimmung. Nationalismus, Rüstungsdenken, Pressekampagnen und die Vorstellung, ein Krieg sei unvermeidlich oder sogar reinigend, waren in vielen Ländern verbreitet. Militärs rechneten mit einem kurzen Krieg und planten Aufmärsche nach Fahrplan. Der deutsche Schlieffenplan sah vor, im Falle eines Zweifrontenkrieges zuerst Frankreich durch Belgien schnell niederzuwerfen und dann gegen Russland zu ziehen. Das machte Verhandlungen schwierig: Sobald Russland mobilisierte, verlangte der Plan, sofort zu handeln."
    ]},
    { h: "Sarajevo und die Julikrise 1914", p: [
      "Am 28. Juni 1914 besuchte der österreichische Thronfolger Franz Ferdinand Sarajevo, die Hauptstadt des 1908 annektierten Bosnien. Der Student Gavrilo Princip, Mitglied einer serbisch-nationalistischen Gruppe, erschoss ihn und seine Frau Sophie. Die Tat war der Anlass. Österreich-Ungarn wollte Serbien bestrafen und endgültig schwächen. Am 5. Juli sicherte Deutschland Wien in einem „Blankoscheck“ seine Unterstützung zu. Am 23. Juli stellte Österreich ein Ultimatum an Serbien, so formuliert, dass es kaum vollständig erfüllbar war. Serbien nahm fast alles an, aber am 28. Juli erklärte Österreich dennoch den Krieg.",
      "Nun wirkte die Logik der Bündnisse. Russland mobilisierte zum Schutz Serbiens, Deutschland erklärte am 1. August Russland und am 3. August Frankreich den Krieg und marschierte in das neutrale Belgien ein, wie es der Schlieffenplan verlangte. Daraufhin trat Großbritannien am 4. August in den Krieg ein, weil es die Neutralität Belgiens garantiert hatte. Innerhalb von sechs Wochen war aus einem regionalen Konflikt ein europäischer Krieg geworden, der durch die Kolonialreiche zum Weltkrieg wurde. Die Menschen in den Hauptstädten jubelten teils, doch das „Augusterlebnis“ war nicht so einheitlich, wie später erzählt wurde: Auf dem Land und in Arbeitervierteln war die Stimmung oft bedrückter."
    ]},
    { h: "Die Schuldfrage: ein Streit der Deutungen", p: [
      "Der Versailler Vertrag (Einheit 35) wies Deutschland die Alleinschuld zu. Das war politisch begründet, stieß in Deutschland auf Ablehnung und prägte die Weimarer Republik. Die Geschichtswissenschaft hat differenziertere Ansichten entwickelt. In den 1960er-Jahren belegte der Hamburger Historiker Fritz Fischer, dass die deutsche Führung 1914 Kriegsziele verfolgte und das Risiko eines großen Krieges bewusst einging. Das löste einen heftigen Streit aus. In jüngerer Zeit hat Christopher Clark (2012) betont, dass alle Mächte Verantwortung trugen, dass die Entscheidungen von Politikern fielen, die „wie Schlafwandler“ in die Katastrophe gingen, und dass Serbien, Russland und Frankreich ebenfalls Anteil hatten. Heute gilt weitgehend Konsens, dass Deutschland und Österreich-Ungarn durch ihr Vorgehen in der Julikrise besondere Verantwortung tragen, aber dass die Struktur des Mächtesystems den Krieg begünstigte.",
      "Wer die Frage beantworten will, sollte drei Ebenen unterscheiden: die langfristigen Strukturen (Bündnisse, Rüstung, Nationalismus, Imperialismus), die mittelfristigen Krisen (Marokko, Balkan) und die kurzfristigen Entscheidungen im Juli 1914. Keine allein erklärt den Krieg. Zusammen erklären sie, warum ein Attentat genügte, um das System zum Einsturz zu bringen. Das Beispiel zeigt auch, dass wirtschaftliche Verflechtung allein Kriege nicht verhindert, denn der Handel zwischen den Mächten war vor 1914 so eng wie nie, und doch begann der Krieg."
    ]}
  ],

  deep: [
    ["War der Krieg unvermeidlich?", "Rückblickend scheint es so, aber Zeitgenossen sahen Krisen, die friedlich gelöst worden waren. Entscheidend war, dass im Juli 1914 mehrere Regierungen es für vertretbar hielten, das Risiko eines großen Krieges einzugehen. Mit anderen Entscheidungen, etwa Verhandlungen über Serbiens Antwort, hätte es anders ausgehen können. Dieser Gedanke ist wichtig: Strukturen machen Ereignisse wahrscheinlich, entscheiden sie aber nicht."],

UNITS.u34 = {
  id: "u34",
  title: "Der Erste Weltkrieg: ein industrialisierter Krieg",
  lead: "Warum der erwartete kurze Krieg vier Jahre dauerte, wie Industrie, Wissenschaft und Propaganda ihn prägten und wie er die ganze Welt erfasste.",
  body: [
    { h: "Vom Bewegungs- zum Stellungskrieg", p: [
      "Im August 1914 marschierten deutsche Armeen durch Belgien nach Frankreich. Sie scheiterten im September an der Marne, vor allem weil die Nachschubwege zu lang wurden und die Franzosen mit Eisenbahnen schnell Verstärkung heranführten. Danach gruben sich beide Seiten ein. Von der Nordsee bis zur Schweizer Grenze zog sich eine Front aus Schützengräben, Stacheldraht und Maschinengewehrnestern. Die Verteidigung war der Offensive überlegen: Ein Maschinengewehr (Einheit 32) konnte Hunderte Angreifer niedermähen, und Artillerie verwandelte das Gelände in Schlamm und Krater.",
      "Die Generäle suchten den Durchbruch durch immer größere Materialschlachten. 1916 kämpfte man bei Verdun fast zehn Monate, der Preis waren je um die 300.000 Tote und Verwundete auf jeder Seite, bei fast unverändertem Frontverlauf. An der Somme starben im selben Jahr über eine Million Soldaten, allein am ersten Tag etwa 19.000 Briten. Die Industrialisierung (Einheiten 28 und 29) hatte die Fähigkeit geschaffen, Millionen zu bewaffnen und zu versorgen, aber die Taktik nicht gleich mitgeliefert. Im Osten blieb der Krieg beweglicher, weil die Front länger war. Dort besiegten die Deutschen unter Hindenburg und Ludendorff 1914 die Russen bei Tannenberg, aber Russland blieb zu groß, um niedergerungen zu werden."
    ]},
    { h: "Technik, Wissenschaft und neue Waffen", p: [
      "Der Krieg wurde zum Labor. Im April 1915 setzten deutsche Truppen bei Ypern Chlorgas ein, das Chemiker um Fritz Haber entwickelt hatten. Bald nutzten alle Seiten Giftgas, und Gasmasken wurden Ausrüstung. Haber, der zuvor mit dem Haber-Bosch-Verfahren Stickstoffdünger aus Luft möglich gemacht hatte (Einheit 29), stand damit für die Doppelgesichtigkeit der Wissenschaft: dasselbe Verfahren ernährt Menschen und liefert Sprengstoff. Hinzu kamen Flugzeuge, zunächst zur Aufklärung, dann als Jagd- und Bombenflugzeuge, Panzer (erstmals 1916 an der Somme), U-Boote und Flammenwerfer.",
      "Die Medizin (Einheit 30) wurde auf die Probe gestellt. Narkose, Antisepsis und Röntgen waren verfügbar, doch die Verwundungen durch Granatsplitter waren so schwer, dass ganz neue Verfahren entstanden: Triage an Verwundetensammelstellen, Bluttransfusionen mit Konservierung, die Behandlung von Gesichtsverletzungen durch plastische Chirurgie. Zugleich forderten Infektionen wie Wundbrand, Typhus und Ruhr, Läuse und Fleckfieber, hohe Opfer. Viele Soldaten litten an psychischen Schäden, damals „Kriegszitterer“ genannt, heute würde man von posttraumatischen Belastungsstörungen sprechen. Die Psychiatrie wusste nicht, wie sie damit umgehen sollte, und behandelte viele als Simulanten."
    ]},
    { h: "Totaler Krieg: Heimatfront, Hunger, Propaganda", p: [
      "Die kriegführenden Staaten stellten ihre ganze Gesellschaft auf den Krieg um. Frauen arbeiteten in Rüstungsfabriken und ersetzten die Männer in Landwirtschaft und Verwaltung, was später das Frauenwahlrecht in vielen Ländern beschleunigte (in Deutschland 1918). Die Wirtschaft wurde staatlich gelenkt, Lebensmittel wurden rationiert. Die britische Seeblockade schnitt Deutschland von Importen ab, und im „Steckrübenwinter“ 1916/17 hungerten viele Deutsche. Die Zahl der Hungertoten wird auf Hunderttausende geschätzt. Propaganda zeichnete den Gegner als Barbaren, Zensur kontrollierte die Presse, und Kritiker wurden verfolgt.",
      "Ein Weltkrieg wurde es auch durch die Kolonialreiche. Hunderttausende Soldaten aus Indien, Westafrika, Nordafrika, Australien, Neuseeland und Kanada kämpften für ihre Kolonialmächte, und Millionen Arbeiter wurden herangezogen. Japan trat aufseiten der Entente ein und besetzte deutsche Besitzungen in China und im Pazifik. Das Osmanische Reich verbündete sich mit den Mittelmächten. Im Osmanischen Reich führte die Regierung 1915 eine Deportation und Massentötung der armenischen Bevölkerung durch, dem Genozid fielen schätzungsweise bis zu 1,5 Millionen Menschen zum Opfer. Die türkische Regierung bestreitet bis heute die Einordnung als Völkermord, die Mehrheit der Historiker und viele Staaten, darunter Deutschland (2016), erkennen sie an."
    ]},
    { h: "Die Wende 1917 und das Ende", p: [
      "1917 war das Entscheidungsjahr. Deutschland erklärte den uneingeschränkten U-Boot-Krieg gegen alle Schiffe in den Gewässern um Großbritannien, in der Hoffnung, das Land auszuhungern, bevor die USA eingreifen konnten. Ein abgefangenes Telegramm des deutschen Außenstaatssekretärs Zimmermann, das Mexiko ein Bündnis anbot, verstärkte die Stimmung in Amerika. Am 6. April 1917 traten die USA in den Krieg ein. Ihre Industrie und frischen Truppen verschoben das Gleichgewicht. Gleichzeitig brach in Russland die Revolution aus (Einheit 35), und das neue Regime schloss im März 1918 den Frieden von Brest-Litowsk, der Deutschland große Gebiete im Osten zusprach.",
      "Die Frühjahrsoffensive 1918 im Westen brachte Deutschland nicht den Sieg, und danach drängten die Alliierten mit amerikanischer Hilfe zurück. Die Verbündeten Deutschlands brachen zusammen: Bulgarien, das Osmanische Reich und Österreich-Ungarn baten um Waffenstillstand. Im Oktober 1918 meuterten Matrosen in Kiel, die Revolution griff auf das Reich über, Kaiser Wilhelm II. dankte ab, und am 11. November 1918 wurde der Waffenstillstand von Compiègne unterzeichnet. Insgesamt starben rund 9 bis 10 Millionen Soldaten und etwa ebenso viele Zivilisten. Der Krieg endete militärisch mit einer Niederlage Deutschlands, aber die Generäle verbreiteten später die „Dolchstoßlegende“, das Heer sei „im Felde unbesiegt“ gewesen und von der Heimat verraten worden, eine Lüge, die die Weimarer Republik belastete (Einheit 35)."
    ]}
  ],

UNITS.u35 = {
  id: "u35",
  title: "Revolution, Versailles und die neue Ordnung",
  lead: "Wie 1917 in Russland ein neuer Staat entstand, wie die Imperien zerfielen, warum der Friede von 1919 so umstritten blieb und was die Spanische Grippe mit alldem zu tun hatte.",
  body: [
    { h: "Russland 1917: zwei Revolutionen", p: [
      "Das Zarenreich war schon vor dem Krieg unter Spannung (Einheiten 29 und 31): rückständige Landwirtschaft, eine kleine, aber kampfbereite Industriearbeiterschaft, ein autokratischer Zar Nikolaus II. und eine Opposition, die seit der Revolution von 1905 nicht verschwunden war. Der Krieg verschärfte alles. Millionen Soldaten fielen oder gerieten in Gefangenschaft, die Versorgung der Städte brach zusammen. Im Februar 1917 (nach russischem Kalender) streikten und demonstrierten Arbeiterinnen in Petrograd, Soldaten liefen über, und der Zar dankte ab. Eine Provisorische Regierung übernahm, daneben bildeten sich Arbeiter- und Soldatenräte, die Sowjets. Die Regierung führte den Krieg fort, was die Unzufriedenheit erhöhte.",
      "Im Oktober 1917 stürzten die Bolschewiki unter Lenin die Provisorische Regierung. Sie versprachen „Frieden, Land und Brot“, verteilten Land an Bauern und schlossen im März 1918 den Frieden von Brest-Litowsk (Einheit 34). Danach folgte ein blutiger Bürgerkrieg zwischen „Roten“ und „Weißen“ (bis 1922), in dem ausländische Mächte eingriffen. Millionen starben durch Kämpfe, Hunger und Seuchen. Die Bolschewiki siegten, errichteten eine Einparteiendiktatur und gründeten 1922 die Sowjetunion. Die Revolution knüpfte an Marx an (Einheit 29), aber ihre Praxis, die Herrschaft einer Partei, war ein Bruch mit der Idee freier Arbeiterbewegung. Für die Welt wurde sie zum Modell und zum Schreckbild zugleich."
    ]},
    { h: "Deutschland: Revolution und Republik", p: [
      "Im November 1918 stürzte die Revolution in Deutschland die Monarchie. Am 9. November rief Philipp Scheidemann die Republik aus, und Friedrich Ebert übernahm die Regierung. Die SPD wollte eine parlamentarische Demokratie und lehnte eine Räterepublik nach russischem Muster ab. Dafür verbündete sie sich mit der alten Militärführung und schlug linke Aufstände nieder, wie den Spartakusaufstand 1919, bei dem Rosa Luxemburg und Karl Liebknecht ermordet wurden. Die Nationalversammlung trat in Weimar zusammen und beschloss im August 1919 eine Verfassung mit Grundrechten und allgemeinem Wahlrecht, auch für Frauen. Die Republik begann damit gegen starke Gegner von rechts und links, mit einer Verwaltung, Justiz und einem Heer, die oft monarchistisch geprägt waren."
    ]},
    { h: "Der Friede von Versailles 1919", p: [
      "Die Siegermächte verhandelten in Paris. US-Präsident Wilson hatte 1918 in seinen „14 Punkten“ eine Ordnung nach dem Selbstbestimmungsrecht der Völker, offene Diplomatie und einen Völkerbund vorgeschlagen. Frankreich unter Clemenceau wollte Deutschland dauerhaft schwächen, Großbritannien unter Lloyd George suchte einen Mittelweg. Der Vertrag von Versailles (Juni 1919) verpflichtete Deutschland zur Abgabe von Gebieten (Elsass-Lothringen, Teile Posens und Westpreußens, alle Kolonien), zur Abrüstung auf ein Heer von 100.000 Mann, zu Reparationen in später festgelegter Höhe und enthielt den Artikel 231, der Deutschland und seinen Verbündeten die Verantwortung für die Kriegsschäden zuwies. In Deutschland nannte man das „Kriegsschuldlüge“ und „Diktatfrieden“, was die Republik schwer belastete.",
      "Die Historiker bewerten Versailles heute differenzierter. Der Vertrag war weniger hart als der Frieden, den Deutschland 1918 in Brest-Litowsk Russland aufgezwungen hatte, und er ließ das Reich als Staat bestehen. Aber er war zu hart, um Deutschland zufriedenzustellen, und zu milde, um es dauerhaft zu schwächen. Er wurde nicht gemeinsam mit Deutschland ausgehandelt, die USA ratifizierten ihn nicht und traten dem Völkerbund nie bei. Der Völkerbund in Genf, erste Organisation für kollektive Sicherheit, blieb dadurch schwach (Einheit 36)."
    ]},
    { h: "Das Ende der Imperien und neue Grenzen", p: [
      "Vier Reiche gingen unter: das Deutsche Kaiserreich, Österreich-Ungarn, das Russische Reich und das Osmanische Reich. In Mittel- und Osteuropa entstanden neue Staaten wie Polen, die Tschechoslowakei, Jugoslawien, Ungarn, Österreich, Finnland und die baltischen Staaten, oft mit nationalen Minderheiten, die Konflikte vorprogrammierten. Das Selbstbestimmungsrecht galt vor allem für Europa. Die Kolonien der Verlierer wurden als „Mandate“ des Völkerbunds an Siegermächte verteilt. Im Nahen Osten teilten Großbritannien und Frankreich auf Basis des geheimen Sykes-Picot-Abkommens (1916) die arabischen Gebiete des Osmanischen Reiches in Mandate wie Irak, Syrien, Libanon und Palästina auf. Zugleich hatte London 1917 in der Balfour-Erklärung eine „nationale Heimstätte“ für Juden in Palästina in Aussicht gestellt und den Arabern Versprechen gemacht. Aus diesen widersprüchlichen Zusagen erwuchs der Konflikt, der bis heute fortwirkt. In der Türkei setzte sich nach einem Unabhängigkeitskrieg Mustafa Kemal (Atatürk) durch, der 1923 die Republik ausrief.",
      "In den Kolonien wurde das Versprechen der Selbstbestimmung genau registriert. Die Enttäuschung, dass es nicht für sie gelten sollte, stärkte Bewegungen in Indien, China, Ägypten und anderswo, wie die Studentenproteste des 4. Mai 1919 in China (Einheit 22). Der Weg zur Dekolonisierung nach 1945 beginnt hier."
    ]},
    { h: "Die Spanische Grippe 1918–1920", p: [
      "Während der Krieg endete, rollte eine Pandemie um die Welt. Die Spanische Grippe war eine Influenza vom Typ A (H1N1), die ab dem Frühjahr 1918 in mehreren Wellen auftrat, besonders tödlich in der zweiten Welle im Herbst 1918. Sie traf überdurchschnittlich oft junge Erwachsene. Schätzungen gehen von 20 bis 50 Millionen Toten weltweit aus, möglicherweise mehr, in Indien allein Millionen. Truppentransporte, überfüllte Lager und die Erschöpfung durch den Krieg erleichterten die Ausbreitung. Die Medizin hatte kein Impfmittel und keine Antibiotika, und das Virus war noch nicht entdeckt (Einheit 30). Maßnahmen wie Quarantäne, Schließung von Schulen und Versammlungsverboten wirkten dort, wo sie früh und konsequent eingesetzt wurden. Die Erfahrung blieb im öffentlichen Gedächtnis erstaunlich blass, in den Jahren danach überlagerten Krieg und Krisen sie. Doch sie prägte die Gesundheitspolitik und führte zur Gründung internationaler Gesundheitsorganisationen, und in der Corona-Pandemie wurde sie als historischer Vergleich erneut diskutiert."
    ]}

    ["Warum scheiterte der Friede von 1919?", "Er verband Prinzipien (Selbstbestimmung, Völkerbund) mit Machtpolitik (Reparationen, Mandate), ohne beide durchzusetzen. Die USA zogen sich zurück, die Sowjetunion und Deutschland waren zunächst ausgeschlossen, und niemand garantierte die neuen Grenzen. Ein stabiler Frieden verlangt, dass die wichtigen Mächte ihn tragen. Ob ein anderer Vertrag den Zweiten Weltkrieg verhindert hätte, bleibt offen, die Bedingungen der Weltwirtschaftskrise kamen später hinzu."],
    ["Revolution von oben und unten", "Die Revolutionen 1917/18 zeigen, dass Regime häufig unter dem Druck von Krieg, Versorgungskrise und Legitimitätsverlust zusammenbrechen. Das gilt für Russland wie für Deutschland und Österreich-Ungarn. Vergleichbare Muster gab es 1789 in Frankreich (Einheit 26)."]

UNITS.u36 = {
  id: "u36",
  title: "Weimar, Inflation und Weltwirtschaftskrise",
  lead: "Wie die erste deutsche Demokratie zwischen Krisen und Aufschwung stand, warum 1929 eine Wirtschaftskrise die ganze Welt erfasste und wie sie Demokratien schwächte.",
  body: [
    { h: "Die Republik unter Dauerdruck (1919–1923)", p: [
      "Die Weimarer Republik (Einheit 35) startete mit schweren Lasten: Niederlage, Versailler Vertrag, Reparationen und eine Wirtschaft, die vom Krieg ausgezehrt war. Hinzu kamen politische Gewalt und Umsturzversuche. 1920 versuchte der Kapp-Putsch, die Republik zu stürzen. Er scheiterte am Generalstreik. Politische Morde, etwa an Matthias Erzberger 1921 und Walther Rathenau 1922, trafen Politiker, die die Republik trugen, und die Justiz war oft auf dem rechten Auge blind.",
      "1923 erreichte die Krise den Höhepunkt. Weil Deutschland Reparationen nicht pünktlich lieferte, besetzten französische und belgische Truppen das Ruhrgebiet. Die Regierung rief zum „passiven Widerstand“ auf und bezahlte die streikenden Arbeiter, finanziert durch das Drucken von Geld. Die Folge war die Hyperinflation: Im November 1923 kostete ein Brot Milliarden Mark. Sparguthaben und Kriegsanleihen wurden wertlos, besonders der Mittelstand verlor. Im November versuchte Adolf Hitler in München mit dem Hitlerputsch die Macht zu ergreifen und scheiterte. Er wurde zu fünf Jahren Haft verurteilt, kam nach neun Monaten frei und änderte die Strategie: Er wollte die Macht über Wahlen erlangen."
    ]},
    { h: "Stabilisierung und „Goldene Zwanziger“ (1924–1929)", p: [
      "Mit der Rentenmark (1923) und dem Dawes-Plan (1924) stabilisierte sich die Lage. Der Plan staffelte die Reparationen und brachte amerikanische Kredite ins Land. Außenminister Gustav Stresemann führte Deutschland diplomatisch zurück: Die Verträge von Locarno (1925) bestätigten die Westgrenzen, 1926 trat Deutschland dem Völkerbund bei. Kultur und Wissenschaft blühten: Bauhaus, Expressionismus, Film, Jazz, Großstadtleben in Berlin, die „neue Frau“ mit Beruf und Wahlrecht. Doch die Stabilität war brüchig, denn sie hing an kurzfristigen US-Krediten.",
      "Der Reichspräsident Paul von Hindenburg, 1925 gewählt, war ein Monarchist und Weltkriegsgeneral. Viele Eliten in Heer, Justiz, Verwaltung und Universitäten standen der Republik distanziert gegenüber. Die Verfassung (Artikel 48) gab dem Präsidenten Notverordnungsrechte, die später zum Instrument des Abbaus der Demokratie wurden."
    ]},
    { h: "1929: Börsenkrach und Weltwirtschaftskrise", p: [
      "In den USA hatten billige Kredite einen Spekulationsboom an der Börse ausgelöst. Am 24. und 29. Oktober 1929 („Schwarzer Donnerstag“ und „Schwarzer Dienstag“) brachen die Kurse zusammen. Banken gingen pleite, Unternehmen entließen, die Nachfrage sank, und aus der Börsenkrise wurde eine tiefe Wirtschaftskrise. Sie breitete sich über den Welthandel und die Kredite aus: Amerikanische Banken zogen ihr Geld aus Europa ab, Länder erhöhten Zölle (in den USA der Smoot-Hawley-Tarif 1930), und der Handel brach ein. Erzeugerländer von Rohstoffen wie Brasilien, Malaya oder Ägypten verloren Einnahmen.",
      "Deutschland traf es besonders hart, weil es von US-Krediten abhing. 1932 waren etwa sechs Millionen Menschen arbeitslos, fast jeder Dritte der Erwerbstätigen. Die Regierung unter Heinrich Brüning setzte auf strikte Sparpolitik und Deflation, was die Krise vertiefte. Parlamentarische Mehrheiten gab es nicht mehr, Brüning regierte mit Notverordnungen. In den USA bekämpfte Präsident Franklin D. Roosevelt die Krise ab 1933 mit dem „New Deal“: staatliche Investitionen, Bankenregulierung, Arbeitsbeschaffung und erste Sozialversicherung. Das zeigte einen anderen Weg als die Sparpolitik."
    ]},
    { h: "Wie Wirtschaft Demokratie beschädigt", p: [
      "Die Krise machte Radikale stark. Die NSDAP, 1928 mit 2,6 Prozent eine Splitterpartei, erreichte bei der Reichstagswahl im September 1930 18,3 Prozent und im Juli 1932 37,3 Prozent. Auch die KPD wuchs. Die Mitte erodierte. Wer Not litt, fand in einfachen Erklärungen und Schuldzuweisungen („Versailles“, „die Juden“, „die Bonzen“) Resonanz. Die demokratischen Parteien konnten sich nicht auf Maßnahmen einigen, und die Präsidialkabinette regierten ohne Parlament.",
      "Wichtig ist: Die Krise allein erklärt nicht, warum Deutschland kippte. Frankreich, Großbritannien und die USA blieben Demokratien. In Deutschland kamen die Belastungen der Republik, der Rückhalt für die NSDAP in Teilen der Eliten, die Zersplitterung der Linken und die Schwäche der demokratischen Kultur hinzu (Einheit 37). Die Weltwirtschaftskrise war der Katalysator, nicht die einzige Ursache."
    ]}

    ["War das Ende Weimars unvermeidlich?", "Nein. Bis 1932 gab es Alternativen: Die NSDAP verlor bei der Wahl im November 1932 Stimmen, und die Krise ließ nach. Entscheidend wurden Intrigen in der Umgebung Hindenburgs, die Hitler schließlich im Januar 1933 zum Kanzler machten (Einheit 37). Historiker sprechen daher nicht von Zwangsläufigkeit, sondern von einer Folge von Entscheidungen unter schweren Strukturbedingungen."],

  body: [
    { h: "Italien: der erste Faschismus", p: [
      "Italien gehörte 1918 zu den Siegern, fühlte sich aber um Gebiete betrogen, und die Nachkriegszeit brachte Streiks, Arbeitslosigkeit und Angst vor einer Revolution nach russischem Vorbild (Einheit 35). Benito Mussolini gründete 1919 die faschistischen Kampfbünde, deren Schlägertrupps gegen Sozialisten und Gewerkschaften vorgingen. Im Oktober 1922 drohte er mit dem „Marsch auf Rom“, und König Viktor Emanuel III. ernannte ihn zum Ministerpräsidenten. Bis 1926 baute Mussolini den Staat zur Diktatur um: Parteien wurden verboten, die Presse gleichgeschaltet, der Duce wurde als Führer verehrt. Das Wort „Faschismus“ leitet sich vom römischen Rutenbündel (fasces) ab, einem Zeichen der Macht (Einheit 5)."

    { h: "Sowjetunion: von Lenin zu Stalin", p: [

    { h: "Deutschland 1933: der Weg an die Macht", p: [
      "Am 30. Januar 1933 ernannte Hindenburg Adolf Hitler zum Reichskanzler. Konservative Politiker wie Franz von Papen glaubten, ihn „einrahmen“ zu können. Das Gegenteil geschah. Nach dem Reichstagsbrand (27. Februar) erließ man die Reichstagsbrandverordnung, die Grundrechte außer Kraft setzte, und Tausende Kommunisten und Sozialdemokraten wurden verhaftet. Mit dem Ermächtigungsgesetz vom 23. März 1933, dem alle Parteien außer der SPD zustimmten (die KPD-Abgeordneten waren verhaftet oder geflohen), erhielt die Regierung das Recht, Gesetze ohne Parlament zu erlassen. Gewerkschaften und Parteien wurden zerschlagen oder verboten, Länder und Verbände „gleichgeschaltet“. Nach Hindenburgs Tod im August 1934 vereinigte Hitler die Ämter von Kanzler und Präsident als „Führer“.",
      "Der Terror gehörte zum System: SA, SS und Gestapo, Konzentrationslager schon 1933 (Dachau), Verfolgung politischer Gegner. Die Propaganda unter Joseph Goebbels kontrollierte Presse, Rundfunk und Film. Jugendliche wurden in der Hitlerjugend erfasst. Zugleich gewann das Regime Zustimmung durch den Rückgang der Arbeitslosigkeit, der mit Aufrüstung und Staatsaufträgen erkauft wurde, durch außenpolitische Erfolge und durch das Gefühl von Gemeinschaft für die, die dazugehören durften. Wer nicht dazugehören sollte, wurde ausgegrenzt."

      "Das Herzstück der NS-Ideologie war der Rassismus und der Antisemitismus (Einheit 32 zeigt die Vorgeschichte der Rassentheorien). Die „Nürnberger Gesetze“ von 1935 nahmen Jüdinnen und Juden die Staatsbürgerrechte und verboten Ehen und Beziehungen mit „Deutschblütigen“. Boykotte, Berufsverbote und Enteignung („Arisierung“) folgten. In der Pogromnacht vom 9. auf den 10. November 1938 wurden Synagogen angezündet, Geschäfte zerstört, Menschen ermordet und Zehntausende in Konzentrationslager verschleppt. Auch Sinti und Roma, Menschen mit Behinderungen (Zwangssterilisation, später die „Aktion T4“), Homosexuelle, Zeugen Jehovas und politische Gegner wurden verfolgt. Ärztinnen und Ärzte spielten in diesem System eine wichtige Rolle, bei der „Erbgesundheit“ und später beim Krankenmord, eine Mahnung an die Verantwortung des Berufs (Einheit 40)."

    { h: "Was verband und was trennte die Diktaturen?", p: [
      "Gemeinsam waren die Ausschaltung von Opposition, ein Führerkult, Massenorganisationen, Propaganda, Terror und der Anspruch, das ganze Leben zu durchdringen. Man nennt das totalitär. Unterschiede liegen in den Zielen: Der Faschismus pries Nation und Gewalt und verband sich mit den alten Eliten. Der Nationalsozialismus machte „Rasse“ zum Mittelpunkt und plante einen Vernichtungskrieg um „Lebensraum“. Der Stalinismus berief sich auf Klassen und Sozialismus, verfolgte aber ebenfalls Millionen. Die Gleichsetzung ist umstritten, der Vergleich dagegen fruchtbar. In vielen anderen Ländern entstanden autoritäre Regime, etwa in Spanien nach dem Bürgerkrieg 1936–39 unter Franco, in Portugal, Ungarn oder Polen. Die Demokratie war in den 1930er-Jahren in Europa in der Defensive."

UNITS.u39 = {
  id: "u39",
  title: "Der Zweite Weltkrieg in Europa",
  lead: "Wie Appeasement, der Hitler-Stalin-Pakt und der Angriff auf Polen den Krieg auslösten, wie sich das Blatt wendete und warum der Krieg anders war als der erste.",
  body: [
    { h: "Der Weg in den Krieg: Revision, Appeasement, Pakt", p: [
      "Hitler wollte die Ordnung von Versailles (Einheit 35) sprengen und im Osten „Lebensraum“ erobern. Schritt für Schritt verletzte er den Vertrag: 1935 führte er die Wehrpflicht ein, 1936 besetzte er das entmilitarisierte Rheinland, 1938 vereinigte er Österreich mit dem Reich („Anschluss“). Im selben Jahr forderte er das Sudetenland von der Tschechoslowakei. Auf der Münchner Konferenz im September 1938 gaben Großbritannien (Chamberlain) und Frankreich (Daladier) nach, ohne die Tschechoslowakei zu fragen. Diese Politik des Appeasement beruhte auf der Erinnerung an die Schrecken des Ersten Weltkrieges (Einheit 34), auf Kriegsmüdigkeit und auf der Hoffnung, Hitler damit zu zähmen. Im März 1939 besetzte er den Rest des Landes und zeigte, dass er nicht zu zähmen war.",
      "Am 23. August 1939 schlossen Deutschland und die Sowjetunion den Hitler-Stalin-Pakt. In einem geheimen Zusatzprotokoll teilten sie Osteuropa in Interessensphären auf, darunter Polen. Für Hitler beseitigte der Pakt das Risiko eines Zweifrontenkrieges, für Stalin brachte er Zeit und Land. Am 1. September 1939 überfiel Deutschland Polen, am 3. September erklärten Großbritannien und Frankreich den Krieg. Am 17. September marschierte die Sowjetunion in Ostpolen ein. Polen wurde geteilt, und gegen seine Eliten begann ein Terror der Besatzer."
    ]},
    { h: "Blitzkrieg und deutsche Erfolge 1939–1941", p: [
      "Die Wehrmacht setzte auf schnelle Panzer- und Luftangriffe („Blitzkrieg“). 1940 besetzte sie Dänemark und Norwegen, und im Mai/Juni Belgien, die Niederlande und Frankreich, das innerhalb von sechs Wochen kapitulierte, ein Ergebnis, das 1914–1918 undenkbar gewesen war. Großbritannien unter Winston Churchill kämpfte weiter. Die Luftschlacht um England im Sommer 1940 verhinderte eine Invasion. Das Land hielt auch dank Radar und der Entzifferung der deutschen Verschlüsselung Enigma in Bletchley Park durch britische Mathematiker um Alan Turing. 1941 eroberte Deutschland den Balkan, und Italien kämpfte in Nordafrika.",
      "Am 22. Juni 1941 griff Deutschland die Sowjetunion an (Unternehmen Barbarossa). Dieser Krieg war von Beginn an als Vernichtungskrieg geplant: Millionen sowjetischer Kriegsgefangener starben in Lagern, die Zivilbevölkerung sollte durch Hunger dezimiert werden, und hinter der Front ermordeten Einsatzgruppen Juden (Einheit 40). Die Wehrmacht kam bis vor Moskau, wurde aber im Winter 1941 aufgehalten. Am 7. Dezember 1941 griff Japan Pearl Harbor an, einige Tage später erklärte Deutschland den USA den Krieg. Damit war der Krieg ein Weltkrieg (Einheit 41)."
    ]},
    { h: "Die Wende 1942/43 und das Ende", p: [
      "Die Wende kam an mehreren Fronten. In Stalingrad wurde die 6. Armee im Winter 1942/43 eingeschlossen und kapitulierte im Februar 1943. In Nordafrika siegten die Briten bei El Alamein (1942), und die Alliierten landeten 1943 in Sizilien und Italien. Die Industrieleistung der USA und der Sowjetunion überstieg die deutsche bei Weitem, die USA lieferten mit dem Lend-Lease-Programm Waffen und Material. Alliierte Bomber zerstörten deutsche Städte (Hamburg 1943, Dresden 1945), mit hunderttausenden zivilen Opfern; ob dies militärisch sinnvoll und moralisch vertretbar war, wird bis heute diskutiert. Am 6. Juni 1944 landeten die Westalliierten in der Normandie („D-Day“), im Osten rückte die Rote Armee vor.",
      "Am 20. Juli 1944 scheiterte ein Attentat auf Hitler durch Offiziere um Claus Schenk Graf von Stauffenberg. Der Widerstand blieb eine Minderheit, aber er zeigt, dass es Gewissensentscheidungen gab. Am 30. April 1945 nahm sich Hitler das Leben. Am 8. Mai 1945 kapitulierte Deutschland bedingungslos. In Europa starben schätzungsweise 40 Millionen Menschen, mehr als die Hälfte Zivilisten. Die Sowjetunion hatte etwa 27 Millionen Tote zu beklagen, Polen rund sechs Millionen, darunter drei Millionen polnische Juden."
    ]},
    { h: "Was war anders als 1914?", p: [
      "Der Zweite Weltkrieg war schon in seiner Anlage ein Krieg um Rasse, Raum und Vernichtung, nicht um Grenzen. Er richtete sich im Osten bewusst gegen Zivilisten. Er war beweglicher, geprägt von Panzern, Flugzeugen und Funk, und er war wissenschaftlicher: Radar, Entschlüsselung, Operations Research, Penicillin (Einheit 40) und schließlich die Atombombe (Einheit 41). Er war auch ein Krieg der Zwangsarbeit: Millionen Menschen aus besetzten Gebieten wurden in der deutschen Wirtschaft eingesetzt. Und er wurde im Zeichen einer Lehre geführt, die aus 1918 gezogen worden war: Die Alliierten forderten bedingungslose Kapitulation, damit es keine neue Dolchstoßlegende geben könne (Einheit 34)."
    ]}

UNITS.u40 = {
  id: "u40",
  title: "Der Holocaust und die Medizin im Nationalsozialismus",
  lead: "Wie aus Ausgrenzung ein industrieller Massenmord wurde, wer ihn möglich machte, was die Medizin damit zu tun hatte und wie Täter, Opfer und Retter erinnert werden.",
  body: [
    { h: "Von der Ausgrenzung zur Vernichtung", p: [
      "Der Völkermord an den europäischen Juden, der Holocaust oder die Schoa, entstand nicht in einem Schritt. Auf die Entrechtung nach 1933 (Einheit 37) folgte mit Kriegsbeginn eine Radikalisierung. In Polen wurden Juden in Ghettos gepfercht, wie in Warschau, wo Hunger und Krankheiten, besonders Fleckfieber, viele Opfer forderten. Mit dem Überfall auf die Sowjetunion 1941 begannen Einsatzgruppen von SS und Polizei, hinter der Front Juden zu erschießen, am bekanntesten in der Schlucht von Babyn Jar bei Kiew im September 1941, wo an zwei Tagen über 33.000 Menschen ermordet wurden. Insgesamt starben so über eine Million.",
      "Bei der Wannsee-Konferenz am 20. Januar 1942 koordinierten Vertreter von SS, Ministerien und Behörden die „Endlösung der Judenfrage“, die Deportation und Ermordung der europäischen Juden. In Vernichtungslagern wie Chełmno, Belzec, Sobibor, Treblinka, Majdanek und Auschwitz-Birkenau wurden Menschen in Gaskammern ermordet, und Bahnen, Behörden, Firmen und Banken wirkten arbeitsteilig mit. Auschwitz war zugleich Arbeitslager und Vernichtungslager, dort starben mindestens 1,1 Millionen Menschen, die meisten Juden. Insgesamt wurden etwa sechs Millionen Juden ermordet. Dazu kamen Hunderttausende Sinti und Roma, Millionen sowjetische Kriegsgefangene, polnische Zivilisten, Menschen mit Behinderungen, Homosexuelle, Zeugen Jehovas und politische Gegner."
    ]},
    { h: "Täter, Mitläufer, Zuschauer, Retter", p: [
      "Wer war beteiligt? Neben der SS und den Spitzen des Regimes viele „gewöhnliche“ Männer, etwa in Polizeibataillonen, wie der Historiker Christopher Browning gezeigt hat, daneben Beamte, Bahnangestellte, Juristen, Unternehmer und Ärzte. Die Beteiligung beruhte auf Ideologie, Karrierestreben, Gruppendruck und Gewöhnung. Viele blickten weg oder profitierten von der Enteignung jüdischen Eigentums. Es gab auch Hilfe. Menschen versteckten Verfolgte oder retteten sie unter Gefahr, wie Oskar Schindler, Georg Ferdinand Duckwitz oder viele unbekannte Familien, in Israel als „Gerechte unter den Völkern“ geehrt. In den Ghettos und Lagern gab es jüdischen Widerstand, etwa den Aufstand im Warschauer Ghetto 1943.",
      "Auch das Ausland trägt Verantwortung. 1938 hatte die Konferenz von Évian gezeigt, dass viele Staaten nicht bereit waren, jüdische Flüchtlinge aufzunehmen. Schiffe wie die „St. Louis“ wurden 1939 abgewiesen. Die Alliierten wussten ab 1942 von den Morden, und die Frage, ob sie die Bahnlinien oder Lager hätten bombardieren sollen, wird bis heute diskutiert."
    ]},
    { h: "Medizin im Nationalsozialismus", p: [
      "Die deutsche Medizin zählte vor 1933 zur Weltspitze (Einheit 30), und doch entstand im Nationalsozialismus eine ihrer dunkelsten Phasen. Die Rassenhygiene (Eugenik), die in vielen Ländern beliebt war, wurde in Deutschland zur Staatspolitik. Das „Gesetz zur Verhütung erbkranken Nachwuchses“ von 1933 erlaubte die Zwangssterilisation, etwa 400.000 Menschen wurden betroffen. Ärzte meldeten Patienten, sie saßen in den „Erbgesundheitsgerichten“. Ab 1939 organisierte die „Aktion T4“ den Mord an über 70.000 Patienten psychiatrischer Anstalten und Behinderten in Gaskammern, später ging das Töten dezentral weiter („wilde Euthanasie“), insgesamt starben etwa 200.000 bis 300.000 Menschen. Die Ärzte, die selektierten und töteten, handelten nicht auf Befehl allein, sie sahen sich als Vollstrecker einer vermeintlich wissenschaftlichen Idee.",
      "In Konzentrationslagern führten Ärzte, darunter Josef Mengele in Auschwitz, grausame Experimente an Häftlingen durch, etwa Unterkühlung, Höhenversuche, Infektionen und Zwillingsforschung. Viele Opfer starben oder blieben verstümmelt. Im Nürnberger Ärzteprozess 1946/47 wurden 23 Angeklagte angeklagt, sieben zum Tode verurteilt. Aus dem Urteil entstand der Nürnberger Kodex von 1947, der die freiwillige Einwilligung der Versuchsperson zur Bedingung der Forschung am Menschen machte, ein Fundament der Medizinethik. Die Weltärztebund-Erklärung von Helsinki (1964) und die heutigen Ethikkommissionen bauen darauf auf. Für alle, die in der Medizin arbeiten, ist diese Geschichte ein bleibender Auftrag: Fachwissen und Autorität ersetzen nicht das Gewissen, und Einwilligung, Würde und Schutz der Schwachen sind die Grenzen ärztlichen Handelns. Gerade in der Anästhesie, wo Patienten sich völlig anvertrauen, wird das spürbar."
    ]},
    { h: "Aufarbeitung und Erinnerung", p: [
      "Die Nürnberger Prozesse (1945–46 gegen die Hauptkriegsverbrecher, danach weitere) schufen Rechtsgrundsätze: Verbrechen gegen die Menschlichkeit, Verantwortung auch bei Befehlsnotstand. 1948 verabschiedete die UNO die Konvention gegen Völkermord. In Deutschland verlief die Aufarbeitung langsam: In den 1950er-Jahren dominierte Schweigen, der Frankfurter Auschwitz-Prozess (1963–65) brachte die Verbrechen ins öffentliche Bewusstsein, die Fernsehserie „Holocaust“ 1979 erreichte Millionen. 1985 nannte Bundespräsident Richard von Weizsäcker den 8. Mai einen „Tag der Befreiung“. Heute erinnern Gedenkstätten, Stolpersteine und der 27. Januar (Gedenktag der Befreiung von Auschwitz) an die Opfer. Zu den Aufgaben gehört, gegen Leugnung und Verharmlosung einzutreten und aus den Mechanismen, Ausgrenzung, Entmenschlichung, Gewöhnung, zu lernen."
    ]}

    { h: "Hiroshima und Nagasaki", p: [
      "Die USA hatten im Manhattan-Projekt (ab 1942) unter Leitung von Robert Oppenheimer die Atombombe entwickelt, die auf Erkenntnissen der Physik seit Einstein und der Kernspaltung (1938 durch Hahn und Straßmann entdeckt) beruhte. Der Physiker Leo Szilard und andere, darunter Einstein, hatten Präsident Roosevelt 1939 gewarnt, dass Deutschland eine solche Waffe bauen könnte. Am 16. Juli 1945 erfolgte der erste Test in New Mexico. Am 6. August 1945 wurde die Bombe auf Hiroshima abgeworfen, am 9. August auf Nagasaki. Etwa 100.000 bis 200.000 Menschen starben sofort oder in den folgenden Monaten, andere an Strahlenfolgen später. Am 8. August erklärte die Sowjetunion Japan den Krieg. Japan kapitulierte am 15. August, die förmliche Unterzeichnung folgte am 2. September 1945.",
      "Ob der Einsatz notwendig war, ist bis heute umstritten. Die einen sagen, er habe eine verlustreiche Invasion vermieden und den Krieg verkürzt. Andere betonen, Japan sei militärisch ohnehin geschlagen gewesen, der Eintritt der Sowjetunion habe die Führung ebenso erschüttert, und die Bombe habe auch als Signal an Moskau gedient. Die moralische Frage, Zivilisten gezielt anzugreifen, bleibt offen. Sicher ist, dass die Welt ins Atomzeitalter eintrat (Einheit 42). Auch die Medizin lernte: Die Folgen der Strahlung, Leukämie, Krebs, Missbildungen, wurden in der Atomic Bomb Casualty Commission an den Überlebenden („Hibakusha“) langfristig untersucht."
    ]},
    { h: "Bilanz und neue Ordnung", p: [
      "Der Zweite Weltkrieg kostete weltweit schätzungsweise 60 bis 70 Millionen Menschen das Leben, mehr Zivilisten als Soldaten. Große Teile Europas und Asiens lagen in Trümmern, Millionen waren Flüchtlinge und „Displaced Persons“, und nach dem Krieg wurden etwa zwölf bis vierzehn Millionen Deutsche aus dem Osten vertrieben oder umgesiedelt. Die Siegermächte wollten diesmal eine bessere Ordnung. Schon 1941 formulierten Roosevelt und Churchill in der Atlantik-Charta Kriegsziele. Auf der Konferenz von Jalta (Februar 1945) und in Potsdam (Juli/August 1945) verhandelten die „Großen Drei“ über die Aufteilung Deutschlands in Besatzungszonen, Grenzen und Reparationen. Wegen unterschiedlicher Interessen kündigte sich der Kalte Krieg an (Einheit 42).",
      "Im Oktober 1945 trat die Charta der Vereinten Nationen in Kraft, mit einer Vollversammlung und einem Sicherheitsrat, dessen fünf ständige Mitglieder (USA, Sowjetunion, Großbritannien, Frankreich, China) ein Vetorecht haben, die Antwort auf das Scheitern des Völkerbunds (Einheit 38). 1948 verabschiedete die UNO die Allgemeine Erklärung der Menschenrechte. Die Nürnberger Prozesse und der Tokioter Prozess verfolgten die Hauptverantwortlichen und schufen das Völkerstrafrecht. Die Währungs- und Wirtschaftsordnung von Bretton Woods (1944) mit Weltbank und Internationalem Währungsfonds sollte die Fehler der 1930er-Jahre (Einheit 36) vermeiden. Der Marshallplan (1947) half beim Wiederaufbau."
    ]}

UNITS.u42 = {
  id: "u42",
  title: "Der Kalte Krieg beginnt: zwei Blöcke und ein geteiltes Deutschland",
  lead: "Wie aus Verbündeten Gegner wurden, warum Deutschland geteilt wurde und was Marshallplan, NATO und Atombombe für die Ordnung der Welt bedeuteten.",
  body: [
    { h: "Vom Bündnis zum Misstrauen (1945–1947)", p: [
      "Im Zweiten Weltkrieg (Einheit 39) verband die USA, Großbritannien und die Sowjetunion ein gemeinsamer Feind. Mit dem Sieg fiel dieses Band weg, und die Gegensätze traten hervor. Es gab ein Gegeneinander der Systeme: auf der einen Seite liberale Demokratien mit Marktwirtschaft, auf der anderen eine Parteidiktatur mit Planwirtschaft (Einheiten 35 und 37). Dazu kamen Sicherheitsinteressen. Die Sowjetunion hatte 27 Millionen Tote zu beklagen und wollte nie wieder von Westen angegriffen werden. Sie sicherte sich daher einen Gürtel abhängiger Staaten in Osteuropa. Die westlichen Mächte sahen darin eine Ausdehnung der Macht Moskaus und die Aufhebung der in Jalta versprochenen freien Wahlen.",
      "Ein Wendepunkt war Churchills Rede in Fulton (März 1946): Von Stettin bis Triest sei ein „Eiserner Vorhang“ über den Kontinent niedergegangen. 1947 formulierte US-Präsident Truman die Doktrin, die USA würden Länder unterstützen, die sich dem Druck von Minderheiten oder äußeren Mächten widersetzen, zunächst Griechenland und die Türkei. Der Diplomat George Kennan hatte in einem „langen Telegramm“ aus Moskau 1946 eine Politik der „Eindämmung“ (containment) vorgeschlagen. Der Begriff „Kalter Krieg“ steht dafür, dass es zwar nie zum direkten großen Krieg zwischen den beiden Supermächten kam, aber zu Wettrüsten, Propaganda, Spionage und Stellvertreterkriegen."
    ]},
    { h: "Marshallplan und Währungsreform: Wirtschaft als Politik", p: [
      "Europa lag 1945 in Trümmern, es herrschte Hunger, und die Gefahr bestand, dass Armut kommunistischen Parteien Zulauf brachte, wie nach dem Ersten Weltkrieg (Einheit 36). Die USA beschlossen mit dem Marshallplan (1947/48) ein Hilfsprogramm von rund 13 Milliarden Dollar für den Wiederaufbau. Die Mittel flossen in Lebensmittel, Maschinen und Rohstoffe und wurden an Bedingungen geknüpft, darunter Zusammenarbeit der Empfängerländer. Die Sowjetunion lehnte ab und zwang auch ihre Satelliten, es abzulehnen. Damit wurde Europa wirtschaftlich geteilt. Man erkennt die Lehre aus 1919: Anders als der Versailler Vertrag wollte man die Besiegten einbinden statt zu bestrafen (Einheit 41).",
      "In Deutschland führten die Westmächte im Juni 1948 die Währungsreform ein, die D-Mark ersetzte die Reichsmark. Waren, die zuvor gehortet wurden, erschienen plötzlich in den Läden. Die Sowjetunion reagierte mit der Blockade der Westsektoren Berlins (Juni 1948 bis Mai 1949), die Stadt wurde über elf Monate durch eine Luftbrücke mit Lebensmitteln und Kohle versorgt, mit über 200.000 Flügen. Die Berlin-Blockade scheiterte und stärkte die Bindung der Westdeutschen an die USA."
    ]},
    { h: "Zwei deutsche Staaten, zwei Bündnisse", p: [
      "1949 entstanden aus den Besatzungszonen zwei Staaten: im Mai die Bundesrepublik Deutschland mit dem Grundgesetz, im Oktober die Deutsche Demokratische Republik. Das Grundgesetz zog Lehren aus Weimar (Einheit 36): Es schützt die Menschenwürde in Artikel 1, stärkt die Stellung des Kanzlers, setzt eine Hürde für Parteienverbote und schließt Notverordnungen wie Artikel 48 aus. Konrad Adenauer verfolgte die Westbindung: Mitgliedschaft in der Montanunion (1951), später der Europäischen Wirtschaftsgemeinschaft (1957) und 1955 in der NATO. Die DDR unter Walter Ulbricht war eine Einparteiendiktatur der SED mit Planwirtschaft und enger Bindung an die Sowjetunion; sie trat dem Warschauer Pakt (1955) bei.",
      "Die NATO (1949) war ein Verteidigungsbündnis der USA, Kanadas und westeuropäischer Staaten; der Warschauer Pakt (1955) war das östliche Gegenstück. Beide Seiten rüsteten auf. Die Sowjetunion zündete 1949 ihre erste Atombombe, die USA 1952 die erste Wasserstoffbombe (die Sowjetunion 1953). Das Konzept der Abschreckung beruhte auf der Gewissheit gegenseitiger Zerstörung, später als „Gleichgewicht des Schreckens“ bezeichnet. Der Ausbruch eines direkten Krieges wurde dadurch unwahrscheinlicher, aber die Gefahr durch Fehler oder Eskalation stieg (Einheit 43)."
    ]},
    { h: "Mauer, Alltag und Medizin: Wie die Teilung das Leben prägte", p: [
      "Die Teilung bedeutete für Menschen sehr Konkretes. Bis 1961 flohen rund 2,7 Millionen Menschen aus der DDR in den Westen, viele junge, gut ausgebildete Fachkräfte, darunter Ärzte und Ingenieure. Um den Aderlass zu stoppen, ließ die DDR-Führung am 13. August 1961 in Berlin Stacheldraht und dann eine Mauer errichten. Familien wurden getrennt, mindestens 140 Menschen starben an der Berliner Mauer, mehr noch an der innerdeutschen Grenze. Die Mauer wurde zum Symbol der Teilung.",
      "Im Westen entstand das „Wirtschaftswunder“, getragen von Marshallplan, Exporten, Währungsreform und Arbeitskräften, darunter Millionen Vertriebene (Einheit 41) und später „Gastarbeiter“ aus Italien, Spanien, der Türkei. Im Osten blieb der Lebensstandard niedriger, der Staat überwachte die Bevölkerung durch die Staatssicherheit (Stasi). Das Gesundheitswesen unterschied sich: Die DDR hatte ein staatliches System mit Polikliniken und hoher Ärztedichte in der Fläche, aber Mangel an Geräten und Medikamenten. Der Westen baute ein System mit Sozialversicherung und niedergelassenen Ärzten auf. Beide Systeme standen im Wettbewerb, auch in Forschung und Sport. Der Gedanke ist wichtig: Der Kalte Krieg war nicht nur Militärpolitik, sondern ein Wettstreit um Lebensmodelle, der bis in Alltag, Schule, Medizin und Kultur reichte."
    ]}
  ],

  deep: [
    ["Wer trägt Schuld am Kalten Krieg?", "Die Forschung kennt „orthodoxe“ Deutungen, die die sowjetische Expansion betonen, „revisionistische“, die die amerikanische Wirtschaftsmacht und Weltordnungsansprüche hervorheben, und „postrevisionistische“, die Fehlwahrnehmungen und Sicherheitsdilemmata beider Seiten sehen. Nach der Öffnung sowjetischer Archive nach 1991 zeigte sich, dass Stalin vorsichtiger und zugleich ideologisch geprägter war als gedacht. Jede Seite hielt die andere für aggressiver, als sie war, und handelte entsprechend, ein Muster, das schon 1914 wirkte (Einheit 33)."],
    ["Warum gelang der Wiederaufbau im Westen?", "Mehrere Faktoren wirkten zusammen: Marshallplan und Schuldenerleichterung (Londoner Schuldenabkommen 1953), ein großer Binnenmarkt durch europäische Integration, Fachkräfte und Arbeitskräfte, Nachfrage nach Exporten und der Aufbau eines Sozialstaats, der soziale Spannungen dämpfte (Einheit 29). Der Westen lernte aus den Fehlern der Zwischenkriegszeit."]

    { q: "Warum war der Marshallplan mehr als Wirtschaftshilfe?", o: ["Er sollte Hunger bekämpfen und zugleich Stabilität und westliche Bindung sichern, um kommunistische Einflüsse zu verringern", "Er war ein Militärbündnis", "Er verbot den Handel", "Er betraf nur Deutschland"], a: 0, e: "Die Lehre aus 1919 war, Verlierer einzubinden." },
