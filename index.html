  "Der Aufstieg der Karolinger folgt einer ähnlichen Logik. Die merowingischen Könige verloren an Macht, die Hausmeier, die ihren Hof leiteten, gewannen sie. Karl Martell besiegte 732 bei Tours und Poitiers ein arabisches Heer, was später überhöht wurde. Wichtiger war, dass er Land aus Kirchenbesitz an seine Gefolgsleute vergab und so ein Heer von Reitern finanzierte. Sein Sohn Pippin ließ sich 751 mit Zustimmung des Papstes zum König erheben und stützte dafür den Papst gegen die Langobarden. Aus diesem Tauschgeschäft zwischen Kirche und Königtum entstand eine Verbindung, die das Mittelalter prägte (Einheit 12)."
]});
addEnd(UNITS.u8, { h: "Wie regierte man ohne Beamte und Geld? Herrschaft im frühen Mittelalter", p: [
  "Für Menschen heute ist schwer vorstellbar, wie Herrschaft ohne feste Hauptstadt, ohne Steuerverwaltung und ohne Polizei funktionierte. Der König zog mit seinem Hof von Pfalz zu Pfalz und verzehrte die Erträge der königlichen Güter vor Ort. Das Geldwesen war schwach, der Fernhandel eingebrochen. Herrschaft beruhte auf persönlichen Beziehungen: Der König belehnte Adlige mit Land und Rechten, sie schworen ihm Treue und stellten Krieger. Man nennt das Lehnswesen. Es funktionierte, solange der König stark genug war, Treue einzufordern und Land zu vergeben.",
  "Karl der Große versuchte, das System zu stabilisieren. Er setzte Grafen ein und kontrollierte sie durch königliche Boten (Königsboten, missi dominici), die durchs Land reisten. Er ließ Gesetze aufschreiben, förderte Schulen an Klöstern und Domen und sammelte Gelehrte um sich, darunter den Angelsachsen Alkuin. Die Bildungsreform war kein Selbstzweck: Man brauchte Menschen, die lesen und schreiben konnten, damit Anordnungen im Reich verstanden wurden und Gottesdienst korrekt gefeiert werden konnte. Die karolingische Minuskel, eine klare Schrift, ist Vorläufer unserer Kleinbuchstaben. Hier zeigt sich ein Zusammenhang, der später noch oft wichtig wird: Schrift und Bildung sind Instrumente der Macht (Roter Faden Schrift).",
  "Nach Karls Tod 814 zerfiel das System. Das Reich wurde nach fränkischem Erbrecht unter den Söhnen aufgeteilt, 843 im Vertrag von Verdun in drei Teile; aus dem Westteil wurde später Frankreich, aus dem Ostteil Deutschland. Wikinger, Sarazenen und Ungarn griffen an, und weil der König nicht überall helfen konnte, übernahmen lokale Herren die Verteidigung, bauten Burgen und gewannen Macht. Wer Schutz bot, bekam Gehorsam. Dieser Prozess, in dem Macht von oben nach unten wandert, führte zur Ordnung des Hochmittelalters (Einheit 11). Es ist ein Beispiel dafür, wie äußere Bedrohung Herrschaft verändert."
]});

addEnd(UNITS.u9, { h: "Warum hielt Byzanz tausend Jahre durch? Geographie, Geld, Geist", p: [
  "Das Oströmische Reich überlebte das Weströmische um fast tausend Jahre, bis 1453. Das lässt sich nicht durch Glück erklären, sondern durch Strukturen. Erstens die Lage: Konstantinopel (heute Istanbul) kontrolliert den Bosporus, den Übergang zwischen Europa und Asien und zwischen Schwarzem Meer und Mittelmeer. Die Stadt war durch Meer und die gewaltigen Theodosianischen Mauern geschützt und konnte über See versorgt werden. Jahrhundertelang scheiterten Belagerungen von Persern, Awaren, Arabern und Bulgaren.",
  "Zweitens die Wirtschaft. Byzanz besaß ein funktionierendes Steuersystem, eine stabile Goldmünze, den Solidus, die jahrhundertelang als Währung des Mittelmeers galt, und kontrollierte Handelswege. Es verfügte über eine gut ausgebildete Beamtenschaft, die man aus Gebildeten rekrutierte. Das Reich konnte so Heere bezahlen und Verbündete kaufen. Seine Diplomatie war berühmt: Gegner wurden gegeneinander ausgespielt, Fürsten mit Titeln, Gold und Heiratsbündnissen gebunden. Das sogenannte „Griechische Feuer“, eine Brandwaffe, deren Rezeptur geheim blieb, verschaffte der Flotte im 7. Jahrhundert Vorteile gegen arabische Schiffe.",
  "Drittens die Flexibilität. Im 7. Jahrhundert verlor Byzanz unter dem Ansturm von Persern und Arabern Ägypten, Syrien und Palästina, die reichsten Provinzen. Es hätte untergehen können. Stattdessen baute es die Verwaltung um: Die Themenordnung teilte Anatolien in Militärbezirke, in denen Soldatenbauern Land bekamen und dafür Kriegsdienst leisteten. Das Reich wurde kleiner, griechischer und christlicher, aber stabil. Man kann daraus lernen, dass Überlebensfähigkeit weniger mit Größe zu tun hat als mit der Fähigkeit, sich anzupassen. Zugleich war der Preis hoch: Der Gegensatz zum lateinischen Westen wuchs, bis zum Schisma von 1054 und zur Plünderung Konstantinopels 1204 durch Kreuzfahrer (Einheit 12)."
]});
addEnd(UNITS.u9, { h: "Die slawische Welt und die Rus: Wie Byzanz Osteuropa prägte", p: [
  "Während sich im Westen das Frankenreich formte, wanderten ab dem 6. Jahrhundert slawische Gruppen nach Osten, Süden und Westen und besiedelten weite Teile Osteuropas und des Balkans. Auf dem Balkan gründeten sie Reiche, die zwischen Byzanz und dem lateinischen Westen lagen und sich dem einen oder anderen anschlossen. Das erklärt bis heute die kulturelle Teilung: Serben, Bulgaren und Russen übernahmen die orthodoxe Kirche und die kyrillische Schrift, Polen, Tschechen, Kroaten und Slowenen die römisch-katholische Kirche und das lateinische Alphabet. Die Brüder Kyrill und Method, Missionare aus Thessaloniki, schufen im 9. Jahrhundert eine Schrift für die slawische Sprache, ein Beispiel dafür, wie Schrift eine Kultur formt.",
  "Im Osten entstand die Rus, ein Verbund von Fürstentümern um Kiew und Nowgorod, aufgebaut von Händlern und Kriegern, teils skandinavischer Herkunft (Waräger), die auf den Flüssen von der Ostsee zum Schwarzen Meer Handel trieben. Kiew wurde um 1000 unter Fürst Wladimir zum Zentrum, der sich 988 taufen ließ. Er entschied sich für die orthodoxe Kirche, möglicherweise auch wegen der politischen Verbindung mit Byzanz (er heiratete eine Schwester des Kaisers). Mit dem Glauben kamen Kirchen, Bücher, Recht und Architektur. Die Rus wurde so Teil der byzantinischen Kulturwelt, nicht der lateinischen.",
  "Die Mongolen eroberten im 13. Jahrhundert die Rus (Einheit 14) und beherrschten sie lange; Moskau stieg als Steuereintreiber der Mongolen auf und übernahm später die Führung. Nach dem Fall Konstantinopels 1453 verstand sich Moskau als Erbe des byzantinischen Reiches, als „Drittes Rom“. Solche Selbstbilder wirken bis in die Gegenwart. Wer verstehen will, warum Russland, die Ukraine, Serbien und Bulgarien Geschichte so intensiv für heutige Fragen nutzen, muss diese Wurzeln kennen. Die Frage, ob Kiew oder Moskau Erbe der Rus ist, hat heute politische Sprengkraft."
]});

addEnd(UNITS.u10, { h: "Warum breitete sich der Islam so schnell aus? Mehrere Erklärungen", p: [
  "Innerhalb von hundert Jahren nach Muhammads Tod 632 reichte die islamische Herrschaft von Spanien bis zum Indus. Wie war das möglich? Eine erste Erklärung: Die beiden Großmächte der Region, Byzanz und das Sasanidenreich, hatten sich in jahrzehntelangen Kriegen (bis 628) erschöpft. Provinzen waren ausgeblutet, Steuern drückend, und viele Bewohner Syriens und Ägyptens, die Christen waren, aber nicht der Reichskirche folgten, hatten wenig Grund, Byzanz zu verteidigen. Die arabischen Heere trafen auf geschwächte Gegner.",
  "Eine zweite Erklärung: Die neue Religion gab den arabischen Stämmen, die zuvor oft gegeneinander kämpften, eine gemeinsame Idee und Führung. Die Krieger waren mobil, Reiter auf Kamelen und Pferden, und hatten Erfahrung in Wüstenkriegsführung. Eine dritte Erklärung: Die Herrschaft war zunächst milde. Wer nicht Muslim wurde, zahlte eine Kopfsteuer (Dschizya), durfte aber Glauben, Eigentum und lokale Selbstverwaltung behalten. Viele Gemeinden fanden das erträglicher als zuvor. Die Eroberer blieben anfangs in eigenen Garnisonsstädten wie Basra, Kufa oder Fustat und störten die Verwaltung wenig. Erst allmählich nahm die Mehrheit den Islam an, teils aus Überzeugung, teils um Steuern zu sparen oder aufzusteigen.",
  "Wichtig ist, dass man „den Islam“ nicht als Einheit verstehen darf. Schon früh brachen Konflikte aus, vor allem um die Nachfolge Muhammads, aus denen die Spaltung in Sunniten und Schiiten wurde. Politisch zerfiel das Kalifat bald in Teilreiche: die Umayyaden in Córdoba, die Abbasiden in Bagdad, die Fatimiden in Ägypten. Religiöse Einheit und politische Vielfalt bestanden nebeneinander. Das erinnert an das lateinische Christentum, das ebenfalls religiös verbunden, aber politisch geteilt war."
]});
addEnd(UNITS.u10, { h: "Wissen auf Reisen: Wie die islamische Welt Antike, Indien und China verband", p: [
  "Die Blüte von Wissenschaft und Medizin im Abbasidenreich hat konkrete Gründe. Das Reich lag im Zentrum eines gewaltigen Netzes: Indien im Osten, China im Fernen Osten, Byzanz und die Mittelmeerwelt im Westen, Afrika im Süden. Handel brachte Waren und Ideen. 751 besiegten die Abbasiden bei Talas chinesische Truppen und sollen Papiermacher gefangen genommen haben; Papier verbreitete sich im Kalifat und machte Bücher billiger als Pergament. Bagdad, 762 gegründet, wurde zur größten Stadt der Welt mit Papiermühlen, Buchhändlern und Bibliotheken.",
  "Kalifen wie al-Mamun förderten die Übersetzung griechischer Schriften ins Arabische, oft über das Syrische, unterstützt von christlichen und jüdischen Gelehrten. Aristoteles, Euklid, Ptolemäus, Galen und Hippokrates wurden zugänglich. Dazu kam indisches Wissen: Die „arabischen“ Ziffern und die Null stammen aus Indien und wurden von al-Chwarizmi in Büchern erklärt; von seinem Namen stammt das Wort Algorithmus, von seinem Buch „al-dschabr“ das Wort Algebra. Die Gelehrten übernahmen nicht nur, sie verbesserten: Ibn al-Haytham begründete die Optik mit Experimenten, al-Razi unterschied Pocken und Masern, Ibn Sina (Avicenna) schrieb den „Kanon der Medizin“, der in Europa bis ins 17. Jahrhundert Lehrbuch blieb.",
  "Der Zusammenhang für uns: Das antike Wissen überlebte im Mittelalter nicht in Europa allein, sondern wurde im islamischen Raum bewahrt, erweitert und später über Spanien und Sizilien zurück ins lateinische Europa übersetzt (Einheit 11). Ohne diese Kette wären Universitäten, Medizinstudium und Wissenschaftliche Revolution (Einheit 23) kaum denkbar. Der Gedanke, Kulturen entwickelten sich isoliert, trifft nicht zu. Wissen reist mit Händlern, Gelehrten, Büchern und Kriegen, und der Weg von Alexandria über Bagdad nach Toledo und Paris ist ein Beispiel."
]});

addEnd(UNITS.u11, { h: "Warum wuchs Europa nach 1000? Eine Kette von Gründen", p: [
  "Um das Jahr 1000 begann in Europa ein Aufschwung, der drei Jahrhunderte anhielt. Die Bevölkerung wuchs, grob gesagt, von etwa 35 auf 80 Millionen. Wie erklärt man das? Ein Grund ist das Klima: Das „Mittelalterliche Klimaoptimum“ brachte etwas wärmere Sommer und bessere Ernten. Ein zweiter ist die Sicherheit: Die Einfälle von Wikingern, Ungarn und Sarazenen ebbten ab, weil sich Wikinger und Ungarn niederließen und christlich wurden. Wer nicht ständig Überfälle fürchten muss, kann Felder bestellen und Vorräte anlegen.",
  "Der dritte Grund sind technische und organisatorische Fortschritte. Der schwere Räderpflug mit Streichbrett wendete die schweren Böden Nordeuropas, das Kummet erlaubte es, Pferde statt Ochsen vor Pflug und Wagen zu spannen, und die Dreifelderwirtschaft nutzte das Land besser, indem nur ein Drittel brach lag statt der Hälfte. Wassermühlen und später Windmühlen entlasteten die Arbeit. Die Erträge stiegen, mehr Kinder überlebten, und Siedler rodeten Wälder und gewannen Land, was in Deutschland als „Landesausbau“ und im Osten als „Ostsiedlung“ bekannt ist.",
  "Der vierte Grund liegt in den Beziehungen. Herren, die mehr Bauern auf ihrem Land hatten, wurden reicher und mächtiger, und sie warben um Siedler mit günstigen Bedingungen. Die Kirche organisierte Klöster als Zentren neuer Wirtschaft (Zisterzienser). Städte entstanden an Handelswegen und boten Freiheit: „Stadtluft macht frei“ galt, wenn ein Unfreier ein Jahr und einen Tag in der Stadt lebte. Man sieht, wie Landwirtschaft, Bevölkerung, Handel und Herrschaft sich gegenseitig verstärken. Dass ein solcher Kreislauf auch kippen kann, zeigt die Krise des 14. Jahrhunderts, als Klimaverschlechterung, Hungersnöte und die Pest eintrafen (Einheit 13)."
]});
addEnd(UNITS.u11, { h: "Wie lebte man? Alltag, Ernährung, Gesundheit und Geschlechterrollen", p: [
  "Etwa 90 Prozent der Menschen lebten auf dem Land. Ein Bauernhaushalt arbeitete vom Frühjahr bis zum Herbst fast ohne Pause; im Winter gab es handwerkliche Tätigkeiten. Die Nahrung bestand vor allem aus Brot, Brei, Hülsenfrüchten, Kohl und etwas Milchprodukten; Fleisch war selten und Zucker kaum bekannt. Missernten waren gefährlich, denn Vorräte waren knapp. Man kann sich vorstellen, wie sehr die Menschen vom Wetter abhängig waren und warum Prozessionen und Gebete für gutes Wetter so wichtig schienen. Die durchschnittliche Lebenserwartung bei Geburt war niedrig, etwa 30 bis 35 Jahre, vor allem wegen der hohen Kindersterblichkeit. Wer das Erwachsenenalter erreichte, konnte durchaus 60 oder älter werden.",
  "Die Aufgaben der Geschlechter waren verteilt, aber nicht streng getrennt. Bäuerinnen arbeiteten auf dem Feld, versorgten Vieh, buken, brauten Bier und spannen. In den Städten führten Frauen Werkstätten mit, besonders nach dem Tod des Mannes, und waren im Textilgewerbe, im Handel und in der Pflege tätig. Rechtlich standen sie unter der Vormundschaft von Vater oder Ehemann. Frauen in Klöstern konnten Bildung erreichen und Ämter ausüben; Hildegard von Bingen (1098–1179) schrieb über Theologie, Natur und Medizin. Das Frauenbild der Kirche war zwiespältig: Maria als Ideal, Eva als Warnung.",
  "Medizin war eine Mischung aus Erfahrung, Kräuterwissen und Lehre. Klöster pflegten Kranke und bauten Heilkräutergärten an. Ab dem 12. Jahrhundert übersetzte man Werke aus dem Arabischen, und in Salerno und später Montpellier und Bologna entstanden medizinische Schulen (Einheit 10). Chirurgie war Handwerk der Barbiere und Wundärzte, nicht der studierten Ärzte. Die Vorstellung von Krankheit beruhte auf der Lehre der vier Körpersäfte, die auf Hippokrates und Galen zurückgeht (Einheit 3 und 6). Sie konnte Krankheiten wie die Pest nicht erklären. Das Verständnis des Mittelalters wird oft verzerrt durch das Wort „dunkel“, doch es war eine Zeit, in der viele Grundlagen für Universitäten, Städte, Rechtswesen und Wirtschaft gelegt wurden."
]});

addAfter(UNITS.u12, "Der Streit um die Investitur", { h: "Warum eskalierte der Streit gerade im 11. Jahrhundert?", p: [
  "Dass Könige Bischöfe einsetzten, war jahrhundertelang normal gewesen, und kaum jemand hatte sich daran gestört. Warum wurde es im 11. Jahrhundert zum Zankapfel? Mehrere Entwicklungen kamen zusammen. Das Wachstum von Bevölkerung und Wirtschaft (Einheit 11) hatte die Kirche reich gemacht. Bischöfe und Äbte verfügten über riesige Ländereien, Burgen und Einnahmen. Wer sie einsetzte, kontrollierte damit einen großen Teil der Macht im Reich. Für die Könige waren die Bischöfe zuverlässiger als die Herzöge, weil sie keine erblichen Dynastien gründen konnten. Gleichzeitig führte genau das zu Missständen, etwa dem Ämterkauf (Simonie) und verheirateten Priestern, die ihr Amt vererben wollten.",
  "Dagegen richtete sich die Reformbewegung, die von Kloster Cluny ausging. Sie wollte die Kirche von der Welt unabhängig machen, weil sie fürchtete, dass ein Priester, der von einem Fürsten abhängt, nicht frei im Sinne Gottes handeln kann. Mit Gregor VII. kam ein Papst, der diesen Gedanken zu Ende dachte: Wenn die Kirche über der weltlichen Macht steht, darf sie auch Könige absetzen. Das stieß auf einen König, für den die Kontrolle der Bischöfe die Grundlage seiner Herrschaft war. Beide Seiten hatten gute Gründe, und deshalb ließ sich der Streit nicht schnell lösen. Er ging um eine Grundfrage der Ordnung: Wer ist oberste Instanz, wenn weltliche und geistliche Macht aufeinanderstoßen?",
  "Die Fürsten nutzten den Konflikt für ihre eigenen Interessen. Sie unterstützten mal den König, mal den Papst, je nachdem, was ihnen mehr Spielraum brachte. Das erklärt, warum Heinrichs Gang nach Canossa auch ein geschickter Zug war: Er nahm seinen Gegnern das Argument, er stehe im Bann. Langfristig schwächte der Streit das Königtum im Reich und stärkte die Fürsten, was zum späteren Interregnum (1250–1273) beitrug. In Frankreich und England verlief die Entwicklung anders, dort erstarkte das Königtum."
] });
addAfter(UNITS.u12, "Recht und Grenzen der Macht: Magna Carta", { h: "Der rote Faden: Wer darf Macht begrenzen?", p: [
  "Wenn man diese Einheit im Zusammenhang liest, zeigt sich ein gemeinsames Thema. Immer wieder geht es darum, wer die Macht eines Herrschers begrenzen darf. Gregor VII. sagt: der Papst, im Namen Gottes. Die deutschen Fürsten sagen: wir, wenn der König gegen Recht und Herkommen verstößt. Die englischen Barone sagen 1215: das Recht selbst, so wie es in einer Urkunde festgehalten ist, und im Notfall wir. Die Kirche sagt gegenüber dem Einzelnen: Wer von der Lehre abweicht, verliert den Schutz der Gemeinschaft (Inquisition). Es sind verschiedene Antworten auf dieselbe Frage.",
  "Das erklärt, warum das Mittelalter sich so unterschiedlich entwickelte. In England festigte sich über die Jahrhunderte die Idee, dass auch der König an das Recht gebunden ist, und aus den Versammlungen der Barone und später auch der Städte wurde das Parlament. Im Heiligen Römischen Reich bildete sich ein Nebeneinander von Kaiser, Fürsten und Städten heraus, die ihre Rechte eifersüchtig hüteten (Einheit 13: Goldene Bulle). Die Kirche behielt eine eigene Rechtsordnung. Man kann eine Linie bis zu Verfassungen und Gewaltenteilung ziehen, aber man sollte nicht so tun, als hätten die Barone von 1215 an Demokratie gedacht. Sie verteidigten ihre eigenen Rechte. Dass daraus später etwas anderes wurde, ist eine Folge von Jahrhunderten, in denen Menschen sich auf diese Texte beriefen.",
  "Auch die Kreuzzüge passen in dieses Bild: Sie zeigen, wie weit die Autorität des Papstes reichte, solange er Menschen im Namen des Glaubens bewegen konnte. Ihre Folgen, der Handel mit dem Orient und das gewachsene Selbstbewusstsein der italienischen Städte (Einheit 11), wirkten dagegen auf eine ganz andere Ebene. Aus einer religiösen Bewegung entstanden wirtschaftliche Netze, die Venedig und Genua reich machten und den Austausch mit der islamischen Welt (Einheit 10) beschleunigten. Das ist ein typisches Muster: Aus Absichten erwachsen Folgen, die niemand geplant hatte."
] });

addEnd(UNITS.u13, { h: "Wie die Pest Europa veränderte: Ursachen, Wege, Folgen", p: [
  "Der Schwarze Tod von 1347–1351 tötete in Europa vermutlich ein Drittel bis die Hälfte der Menschen. Um zu verstehen, warum er so verheerend war, muss man die Vorbedingungen ansehen. Europa war um 1300 dicht besiedelt, die Ernährung knapp, und nach den Hungersnöten von 1315–1317 waren viele geschwächt. Der Erreger, das Bakterium Yersinia pestis, lebte in Nagetieren Zentralasiens und wurde über Flöhe auf Menschen übertragen. Der Fernhandel, den die Mongolen sicherer gemacht hatten (Einheit 14), brachte die Krankheit auf Handelswegen ans Schwarze Meer, von dort auf genuesischen Schiffen nach Sizilien und Marseille. Die Pest folgte also den Verkehrswegen, so wie später die Cholera (Einheit 28) und die Spanische Grippe (Einheit 35).",
  "Die Menschen kannten weder Bakterien noch Flöhe als Überträger. Die Ärzte der Zeit erklärten die Krankheit mit „verdorbener Luft“ (Miasmen), Sternenkonstellationen oder göttlicher Strafe. Schutzmaßnahmen waren trotzdem manchmal klug: Venedig und Ragusa (Dubrovnik) ließen Schiffe 40 Tage ankern, bevor Mannschaften an Land durften. Daher stammt das Wort Quarantäne (von quaranta, vierzig). Der Gedanke, Ansteckung durch Trennung zu verhindern, entstand also aus Erfahrung, bevor man den Erreger kannte. Eine Entdeckung des Erregers gelang erst 1894 Alexandre Yersin (Einheit 30).",
  "Die Folgen waren tiefgreifend. Der Arbeitskräftemangel stärkte die Position der Überlebenden: Löhne stiegen, Fronlasten sanken, und Bauern konnten bessere Bedingungen aushandeln. Herren versuchten dies mit Gesetzen zu verhindern, was in England 1381 zum großen Bauernaufstand beitrug. Im Osten Europas dagegen verschärfte sich die Herrschaft der Gutsherren später. Die Kirche verlor an Ansehen, weil Gebete nichts halfen, was die Kritik, die in der Reformation (Einheit 19) mündete, vorbereitete. Aber es gab auch eine dunkle Seite: Jüdische Gemeinden wurden beschuldigt, die Brunnen vergiftet zu haben, und in Dutzenden Städten kam es zu Pogromen. Das zeigt, wie Angst und Unwissen Sündenböcke suchen, ein Muster, das uns in Krisen immer wieder begegnet."
]});
addEnd(UNITS.u13, { h: "Krisen, die sich überlagern: Das 14. Jahrhundert als Wendepunkt", p: [
  "Es ist verführerisch, die Pest als alleinigen Bruch zu sehen. Sie traf aber eine Gesellschaft, die ohnehin unter Druck stand. Das Klima wurde ab etwa 1300 kühler und feuchter, was die Ernten verschlechterte. Die Bevölkerung hatte die Grenzen des Landes erreicht: Wo man Grenzböden urbar gemacht hatte, waren die Erträge gering. Kriege wie der Hundertjährige Krieg (1337–1453) verwüsteten Frankreich, und Söldnerbanden plünderten. Die Kirche war durch das Papsttum in Avignon (1309–1377) und das anschließende Schisma (1378–1417), bei dem zeitweise zwei oder drei Päpste existierten, geschwächt.",
  "Wie diese Krisen zusammenwirkten, zeigt ein Gedankenspiel: Eine Gesellschaft mit Reserven kann einen Schock auffangen. Eine Gesellschaft ohne Reserven wird von demselben Schock zerstört. Das 14. Jahrhundert war eine Zeit, in der Reserven aufgebraucht waren. Das erklärt die Schwere der Folgen. Auch der Hundertjährige Krieg war nicht nur ein Streit um Throne. Er veränderte die Kriegführung: Englische Langbogenschützen siegten bei Crécy (1346) und Azincourt (1415) über Ritterheere, und später machten Kanonen Burgmauern wertlos. Johanna von Orléans, die 1429 Frankreich zum Durchhalten motivierte und 1431 verbrannt wurde, wurde zum Symbol einer entstehenden nationalen Idee.",
  "Mit dem Rückgang der Macht von Adel und Kirche öffnete sich Raum für neue Kräfte: Städte, Könige und Kaufleute. Der Staat begann, Steuern und Heere zu organisieren, und die Fugger und Medici bauten Bank- und Handelsimperien auf. Wissenschaftlich und kulturell begann die Renaissance (Einheit 16) in den reichen Städten Italiens. Man kann das Spätmittelalter daher als Zeit des Zerfalls und zugleich der Vorbereitung verstehen. Der Buchdruck um 1450 und der Fall Konstantinopels 1453 setzen dann Zeichen für das Ende einer Epoche."
]});

addEnd(UNITS.u14, { h: "Wie China zusammenhielt: Beamte, Schrift, Prüfungen", p: [
  "China wurde im Lauf der Geschichte mehrfach geteilt und eroberte sich doch immer wieder die Einheit. Das ist ein Unterschied zu Europa, das nach Rom nicht wieder zu einem Reich wurde. Warum? Ein Faktor ist die Schrift. Chinesische Zeichen stehen für Bedeutungen, nicht für Laute, sodass Menschen, die verschiedene Dialekte sprechen, denselben Text lesen können. Seit der Qin-Dynastie (221 v. Chr.) wurden Schrift, Maße, Gewichte und Münzen vereinheitlicht. Ein zweiter Faktor ist die Beamtenschaft. Schon die Han setzten auf Gelehrte, die nach Verdienst ausgewählt wurden, und seit der Tang- und Song-Zeit gab es Staatsprüfungen, die auf den konfuzianischen Klassikern beruhten. Wer sie bestand, konnte aufsteigen, unabhängig von Geburt, wenn auch in der Praxis vor allem Söhne wohlhabender Familien die Zeit zum Lernen hatten.",
  "Der dritte Faktor ist die Ideologie. Der Konfuzianismus lehrte, dass Ordnung aus Pflichten entsteht: Der Herrscher soll tugendhaft sein, Untertanen sollen gehorchen, Kinder die Eltern ehren. Das „Mandat des Himmels“ erklärte, dass ein Herrscher nur so lange legitim ist, wie er gut regiert; Katastrophen, Aufstände und Niederlagen galten als Zeichen, dass er es verloren hatte. So rechtfertigte man den Wechsel von Dynastien, ohne das System selbst infrage zu stellen. Das ist ein Gedanke, den man mit der europäischen Vorstellung vom Gottesgnadentum vergleichen kann (Einheit 23). Er verband Anspruch und Begrenzung der Macht.",
  "Der Preis dieser Ordnung war Starrheit. Das Prüfungssystem belohnte Anpassung und Bildung nach festen Mustern, nicht unbedingt Neuerung. Dennoch war China lange technisch führend: Papier, Buchdruck, Schießpulver und Kompass stammen von dort (Einheit 16). Unter den Song (960–1279) kam es zu einer wirtschaftlichen Revolution mit Papiergeld, Reisanbau in zwei Ernten, großen Städten und Seehandel. Warum entwickelte sich daraus keine industrielle Revolution? Dazu gibt es mehrere Erklärungen, etwa die fehlende Konkurrenz zwischen Staaten, billige Arbeitskräfte und die Orientierung des Staates auf Stabilität. Die Frage zeigt, dass Entwicklung kein Naturgesetz ist (Einheit 28)."
]});
addEnd(UNITS.u14, { h: "Die Mongolen: Zerstörer und Verbinder", p: [
  "Dschingis Khan einte um 1206 die mongolischen Stämme und schuf ein Reich, das unter seinen Nachfolgern von Korea bis nach Ungarn reichte, das größte zusammenhängende Landreich der Geschichte. Der Erfolg beruhte auf Mobilität, Disziplin und Taktik: Reiterheere mit Kompositbogen, die weite Strecken zurücklegten, gute Aufklärung und eine Organisation in Zehnerschaften. Die Mongolen setzten Terror als Mittel ein; Städte, die sich widersetzten, wurden zerstört, die Bevölkerung oft getötet, Städte wie Merw, Nischapur und Bagdad (1258) erlitten Verwüstung. Unterworfene, die sich ergaben, wurden dagegen meist geschont.",
  "Zugleich schufen die Mongolen etwas, das man „Pax Mongolica“ nennt: Auf den Handelsrouten Asiens herrschten weitgehend Sicherheit und einheitliche Regeln. Ein Jam genanntes Relaissystem erlaubte schnelle Botenwege. Religionen wurden toleriert; Händler, Missionare und Gesandte wie Marco Polo reisten bis nach China. Das hatte Folgen für die Weltgeschichte. Wissen reiste mit: Papier und Schießpulver gelangten nach Westen, persisches Wissen und Astronomie nach China. Zugleich reiste die Pest: Die Seuche, die Europa ab 1347 erreichte, stammt wohl aus dem Raum der Goldenen Horde und folgte den Handelswegen (Einheit 13).",
  "Das Mongolenreich zerfiel im 13. und 14. Jahrhundert in vier Teilreiche: die Goldene Horde in Russland, das Ilchanat in Persien, das Tschagatai-Khanat in Zentralasien und die Yuan-Dynastie in China unter Kublai Khan. Die Herrscher passten sich den Regionen an, wurden Muslime oder Buddhisten und übernahmen deren Verwaltung. Ihr Erbe ist ambivalent: Millionen Tote, aber auch eine vernetzte Welt. In Russland stieg unter mongolischer Oberherrschaft Moskau auf (Einheit 9), in Persien und Zentralasien erneuerte sich die Kultur, und China gewann unter den Ming (1368) die Herrschaft zurück. Der Gedanke, dass Zerstörung und Vernetzung nebeneinander stehen können, ist wichtig, um die Mongolen differenziert zu sehen."
]});

addEnd(UNITS.u15, { h: "Wie Reiche in Westafrika reich wurden: Gold, Salz, Karawanen", p: [
  "Die Reiche Ghana, Mali und Songhai im Sahel lagen zwischen zwei Rohstoffzonen: im Süden Gold aus den Wäldern und Flüssen (Bambuk, Bure, Akan), im Norden Salz aus der Sahara. Salz war lebensnotwendig, Gold begehrt im Mittelmeerraum und in der islamischen Welt. Transsaharakarawanen mit Kamelen, deren Einsatz seit etwa dem 3. Jahrhundert die Wüste durchquerbar machte, tauschten beides, dazu Kupfer, Stoffe, Pferde, Bücher und Sklaven. Wer die Handelsrouten und Märkte kontrollierte, konnte Zölle erheben und wurde reich, ohne das Gold selbst abzubauen. Die Herrscher verzichteten darauf, die Minen zu besetzen, weil Kontrolle über den Handel genügte und die Bergleute das Geheimnis der Herkunft hüteten.",
  "Das erklärt den Reichtum von Mansa Musa, dem Herrscher von Mali, der 1324 auf der Pilgerfahrt nach Mekka so viel Gold mitgeführt und verteilt haben soll, dass der Goldpreis in Kairo jahrelang sank. Er brachte Gelehrte und Architekten zurück; Timbuktu entwickelte sich zu einem Zentrum von Handel und Bildung mit Bibliotheken und der Sankoré-Moschee, und Tausende Handschriften erhalten sich bis heute. Der Islam kam über Händler und Gelehrte in die Region, nicht durch Eroberung, und verband sich mit lokalen Traditionen. Die Reiche waren Vielvölkerreiche, die durch Loyalität lokaler Fürsten und Abgaben zusammenhielten (vergleichbar mit Einheit 21).",
  "Wichtig ist der Gegensatz zum Bild, das oft von Afrika gezeichnet wird: Afrika war nicht „geschichtslos“ und von der Welt abgeschnitten. Es gehörte zum Handelsnetz, das über das Mittelmeer, den Indischen Ozean und die Sahara reichte. Der Sklavenhandel gehörte auch dazu und existierte lange vor Europas Handel über den Atlantik, hatte aber einen anderen Umfang und andere Strukturen (Einheit 18). Als Portugiesen im 15. Jahrhundert die Küste erreichten (Einheit 16), versuchten sie unter anderem, direkt an das Gold zu kommen und die Karawanen zu umgehen. Das veränderte langfristig die Handelsrouten und schwächte den Sahel."
]});
addEnd(UNITS.u15, { h: "Amerika vor Kolumbus: Landwirtschaft, Städte, Staaten ohne Rad und Eisen", p: [
  "Die Hochkulturen Amerikas entstanden unabhängig von denen der Alten Welt. Das zeigt, dass Städte, Staaten und Schrift sich unter ähnlichen Bedingungen mehrfach entwickeln können. Grundlage war auch hier die Landwirtschaft: Mais, Bohnen und Kürbis in Mesoamerika, Kartoffeln und Quinoa in den Anden. Mais wurde aus dem Wildgras Teosinte über Jahrtausende gezüchtet, eine bemerkenswerte Leistung. Weil es kaum große Haustiere gab (Lama und Alpaka in den Anden, sonst vor allem Truthahn und Hund), fehlte Zugkraft, und ohne Zugtiere gab es weder Pflug noch Wagen. Räder kannte man von Spielzeug, nutzte sie aber nicht für Transport.",
  "Die Maya bauten in den Regenwäldern Stadtstaaten mit Pyramiden, einer Schrift, einem genauen Kalender und Astronomie. Ihre Städte wie Tikal erreichten in der Klassik (250–900) ihren Höhepunkt und wurden dann, wohl durch Dürre, Kriege und Übernutzung der Umwelt, großenteils aufgegeben. Die Azteken gründeten um 1325 Tenochtitlan auf einer Insel im Texcoco-See, eine Stadt mit etwa 200.000 Einwohnern, die größer war als die meisten europäischen Städte. Sie beherrschten ihr Reich durch Tribute und Bündnisse, was Groll bei Unterworfenen erzeugte, den Cortés später nutzte (Einheit 17). Die Inka verwalteten ein Reich von rund 10 Millionen Menschen ohne Schrift, aber mit Knotenschnüren (Quipu) für Buchhaltung, einem Straßennetz von Zehntausenden Kilometern und staatlich organisierter Arbeit.",
  "Für das Verständnis von 1492 ist wichtig: Die Menschen Amerikas lebten in komplexen Gesellschaften, die Kriege führten, Menschenopfer darbrachten (Azteken) und Herrschaft ausübten, wie andere Reiche auch. Sie waren jedoch isoliert von den Krankheiten der Alten Welt, weil sie keine Herdentiere hielten und seit der Eiszeit abgeschieden waren. Das machte sie gegenüber Pocken, Masern und Grippe wehrlos (Einheit 17). Technologisch verfügten sie nicht über Eisen, Pulver und Pferde. Diese Ungleichheiten erklären die Geschwindigkeit der spanischen Eroberung besser als Mut oder Kriegskunst der Eroberer."
]});

addEnd(UNITS.u16, { h: "Warum Portugal und Spanien vorn lagen, nicht China oder die Osmanen", p: [
  "Im 15. Jahrhundert war China technisch und wirtschaftlich stärker als Europa. Zheng He unternahm zwischen 1405 und 1433 sieben Expeditionen mit Schiffen, die größer waren als alles in Europa, bis nach Ostafrika (Einheit 14). Dann brach der Kaiserhof sie ab. Warum? Der Hof sah Prioritäten an der Nordgrenze gegen die Mongolen, die Expeditionen waren teuer und brachten wenig, konfuzianische Beamte misstrauten Händlern. Es fehlte der Antrieb, im Ausland zu expandieren, weil das Reich selbst genug Reichtum bot. Die Osmanen kontrollierten die Landwege nach Asien, aber sie waren eine Landmacht mit Interessen an Südosteuropa und dem Mittelmeer.",
  "Europa dagegen war politisch zersplittert. Viele Staaten konkurrierten, und ein Herrscher, der eine Idee ablehnte, konnte einen anderen finden. Kolumbus wurde von Portugal und anderen abgewiesen, bevor Spanien ihn unterstützte. Dieser Wettbewerb ermunterte Risiko. Portugals Lage am Atlantik, die Erfahrung in Fischfang und Seefahrt und das Interesse des Königshauses (Heinrich der Seefahrer) schufen eine Kultur der Erkundung. Spanien hatte 1492 gerade Granada erobert und die Reconquista beendet; ein Heer erfahrener Krieger und Adliger suchte neue Ziele.",
  "Der Druck kam auch aus dem Handel. Die Venezianer und Genuesen verdienten am Gewürzhandel mit Asien, der über muslimische Zwischenhändler lief. Wer einen direkten Seeweg fand, konnte die Zwischenhändler ausschalten. Das Motiv war Gewinn, verbunden mit religiösem Eifer, Prestige und der Hoffnung, ein christliches Reich im Osten (Priester Johannes) als Verbündeten zu finden. So verbanden sich mehrere Motive. Es gab keine „Entdeckung der Welt aus Neugier“ allein: Gold, Gewürze, Macht und Mission gingen Hand in Hand, und die Gewalt gegen die Bewohner begann sofort (Einheiten 17 und 18)."
]});
addEnd(UNITS.u16, { h: "Wissen, Technik und Renaissance: Warum gerade jetzt?", p: [
  "Die Fahrten waren nur möglich, weil verschiedene Entwicklungen zusammentrafen. Die Karavelle, ein wendiges Schiff mit Lateinsegeln, konnte gegen den Wind kreuzen; die Kogge und später die Karacke trugen große Ladungen. Der Kompass, aus China über die islamische Welt nach Europa gelangt, und das Astrolab, ebenfalls aus der islamischen Welt, halfen bei der Orientierung. Seekarten (Portolane) wurden genauer. Die Wiederentdeckung antiker Geografie, etwa des Ptolemäus, regte an, die Welt zu vermessen, auch wenn Ptolemäus die Erde zu klein ansetzte und Kolumbus dadurch den Weg nach Indien zu kurz berechnete. Er hatte Glück, dass Amerika im Weg lag.",
  "Hinzu kam der Buchdruck (um 1450), der Wissen schnell und billig verbreitete (Einheit 13): Reiseberichte, Karten und Navigationshandbücher wurden gedruckt. Die Renaissance in Italien, die den Menschen und seine Erkenntnis ins Zentrum stellte, förderte Neugier und Beobachtung. Maler wie Leonardo da Vinci studierten Anatomie, Vesalius begründete 1543 die moderne Anatomie (Einheit 23). Alles hängt zusammen: Handelsreichtum finanziert Künstler und Gelehrte, Gelehrte liefern Wissen, Wissen ermöglicht Fahrten, Fahrten bringen neuen Reichtum.",
  "Die Welt änderte sich in der Folge grundlegend. Der Atlantik wurde zum Zentrum des Handels, Europa gewann Zugang zu Silber, Zucker und Rohstoffen, und über den „Kolumbianischen Austausch“ wanderten Pflanzen, Tiere und Krankheiten zwischen den Kontinenten (Einheit 17). Die Kartoffel veränderte die Ernährung in Europa, der Mais jene in Afrika und China. Der Preis wurde in Amerika und Afrika bezahlt. Wer Geschichte als Ursache und Wirkung liest, sieht, dass dieselben Voraussetzungen zugleich Fortschritt und Gewalt ermöglichten, ein Muster, das sich in der Industrialisierung (Einheit 28) und im Imperialismus (Einheit 32) wiederholt."
]});

addEnd(UNITS.u17, { h: "Warum siegten wenige Spanier über große Reiche? Mehr als Waffen", p: [
  "Die Eroberung des Aztekenreiches durch Cortés mit einigen hundert Spaniern wirkt unglaublich. Sie wird verständlich, wenn man mehrere Faktoren zusammenführt. Erstens Verbündete: Cortés gewann Tausende indigene Krieger, vor allem von den Tlaxcalteken, die unter aztekischem Tribut litten. Das Aztekenreich war ein Tributsystem mit vielen unzufriedenen Völkern, nicht ein fest gefügter Staat. Ohne diese Verbündeten wären die Spanier gescheitert. Zweitens die Krankheit: 1520 brach eine Pockenepidemie aus, die große Teile der Bevölkerung Tenochtitlans tötete, darunter den Herrscher Cuitláhuac. Die Azteken hatten keine Immunität.",
  "Drittens technische Vorteile: Stahlwaffen, Rüstungen, Pferde und Feuerwaffen waren für die Verteidiger neu. Sie sind aber weniger entscheidend als oft angenommen, denn die Zahl der Spanier war klein, und Pferde und Schießpulver waren begrenzt. Viertens politisches Geschick und Brutalität: Cortés nutzte Konflikte, nahm Moctezuma gefangen und verbreitete Terror. Fünftens Missverständnisse und Zufälle. Die Spanier hatten in Amerika auch Glück, doch Glück allein erklärt nicht, warum es wiederholt gelang. Bei den Inka war es ähnlich: Ein Bürgerkrieg zwischen Atahualpa und Huáscar und eine Pockenwelle hatten das Reich geschwächt, bevor Pizarro 1532 in Cajamarca Atahualpa gefangen nahm.",
  "Die Erzählung vom „Wunder“ verdeckt auch den langen Widerstand. Die Eroberung Mexikos war 1521 nicht abgeschlossen; die Maya wurden erst 1697 endgültig unterworfen. Indigene Völker nutzten ihr Wissen, Bündnisse und Rebellionen, etwa die Inka-Aufstände um Manco Inca. Ein Verständnis der Geschichte erfordert den Blick auf beide Seiten: Eroberer, die ihren Vorteil suchten, und Gesellschaften, die handelten, kämpften und sich anpassten. Die Folgen blieben: Das Land wurde umgeformt, die Bevölkerung dezimiert, und eine neue Gesellschaft entstand."
]});
addEnd(UNITS.u17, { h: "Die neue Ordnung: Ausbeutung, Mission, Mischung", p: [
  "Nach der Eroberung baute Spanien ein System auf, um Land und Arbeitskraft zu nutzen. In der Encomienda wurden Gruppen von Indigenen einem Spanier zugeteilt, der Tribut und Arbeit forderte und dafür Schutz und Christianisierung versprach. In der Praxis bedeutete das oft Zwangsarbeit unter brutalen Bedingungen. Der Dominikaner Bartolomé de las Casas klagte diese Zustände ab 1514 an und forderte Reformen. Die „Neuen Gesetze“ von 1542 schränkten die Encomienda ein, aber ihre Umsetzung war schwach, denn Kolonisten widersetzten sich, und die Krone brauchte die Einnahmen. Der Streit von Valladolid (1550/51) debattierte, ob Indigene von Natur aus unterlegen seien; eine frühe Debatte über Menschenrechte, die das Problem nicht löste.",
  "Das Silber von Potosí (heute Bolivien) und Zacatecas finanzierte das spanische Weltreich und floss weiter nach Europa und China, wo es als Zahlungsmittel diente (Einheit 22). Die Bergwerksarbeit, die Mita, kostete unzählige Leben. Die Kolonialgesellschaft war streng gegliedert: oben die in Spanien geborenen Spanier (Peninsulares), dann die in Amerika geborenen Kreolen, darunter Mestizen, Indigene und Afrikaner. Die Vermischung zwischen den Gruppen war häufig, aber die Hierarchie knüpfte Rechte an Herkunft (Casta-System). Diese Ungleichheit prägte die Politik Lateinamerikas bis in die Gegenwart und spielte in den Unabhängigkeitskriegen der 1810er-Jahre eine Rolle (Einheit 27).",
  "Missionare, vor allem Franziskaner, Dominikaner und später Jesuiten, errichteten Kirchen, Schulen und Missionen. Sie zerstörten Tempel und Handschriften, bewahrten aber auch Sprachen und Wissen, indem sie etwa die aztekische Kultur in Quellen wie dem Codex Florentinus dokumentierten (Bernardino de Sahagún). Aus der Mischung entstanden neue Kulturen: Religiosität, Musik, Küche und Sprache Lateinamerikas sind Ergebnisse dieser Begegnung. Der Zusammenhang zu den anderen Kolonialmächten liegt im Muster: Eroberung, Ausbeutung, Mission, Mischung. Portugal in Brasilien, England in Nordamerika und Frankreich in Kanada führten es mit eigenen Akzenten fort (Einheiten 18 und 25)."
]});

addEnd(UNITS.u18, { h: "Das Leben zwischen den Zahlen: Erfahrung der Versklavten", p: [
  "Zahlen sind wichtig, aber sie machen leicht vergessen, dass hinter ihnen einzelne Menschen standen. Etwa 12,5 Millionen Menschen wurden zwischen dem 16. und 19. Jahrhundert aus Afrika über den Atlantik verschifft, rund 1,8 Millionen starben auf der Überfahrt. Die Sterblichkeit hatte viele Ursachen: enge Laderäume, Ruhr und Pocken, Unterernährung, Gewalt. Menschen wurden zuvor oft in Kriegen gefangen oder entführt und marschierten wochenlang zur Küste. Dort wurden sie in Forts gesperrt, gebrandmarkt und verkauft. Wer überlebte, kam in eine fremde Welt ohne Familie und Sprache.",
  "Die Menschen blieben handelnde Personen. Es gab Aufstände auf Schiffen und Plantagen. In Haiti führten Versklavte ab 1791 einen Aufstand unter Toussaint Louverture, besiegten französische Truppen und gründeten 1804 den ersten Staat, der aus einer erfolgreichen Sklavenrevolution hervorging (Einheit 26). In Brasilien, Jamaika und Surinam entstanden Gemeinschaften entflohener Sklaven (Maroons, Quilombos). Im Alltag bewahrten Menschen Sprache, Musik, Religion und Küche und mischten sie mit neuen Elementen; so entstanden Formen wie Candomblé, Vodou, Blues und Jazz. Frauen waren doppelt betroffen: durch Arbeit und sexuelle Gewalt.",
  "Wichtig ist auch der Blick auf die Ideen. Rassentheorien wurden entwickelt oder verstärkt, um ein System zu rechtfertigen, das Menschen zu Eigentum machte, obwohl die Aufklärung Gleichheit lehrte (Einheit 24). Das führt zu einem Widerspruch, den man bei den Gründervätern der USA sieht: Sie sprachen von Freiheit und hielten Sklaven (Einheit 25). Der Abolitionismus, getragen von Quäkern, Versklavten wie Olaudah Equiano und Aufklärern, setzte die Abschaffung durch: Großbritannien verbot den Handel 1807 und die Sklaverei 1833, Frankreich endgültig 1848, die USA 1865, Brasilien 1888. Doch das Erbe von Diskriminierung und Ungleichheit blieb."
]});
addEnd(UNITS.u18, { h: "Wie der Sklavenhandel die Weltwirtschaft formte", p: [
  "Der atlantische Dreieckshandel verband drei Kontinente. Europäische Schiffe brachten Waren (Textilien, Metallwaren, Alkohol, Waffen) nach Afrika und tauschten sie gegen Menschen, diese wurden nach Amerika gebracht, und von dort kamen Zucker, Tabak, Kaffee und später Baumwolle zurück nach Europa. Die Gewinne finanzierten Häfen wie Liverpool, Bristol, Nantes und Bordeaux, Banken, Versicherungen und Werften. Ob sie die Industrialisierung in England „verursacht“ haben, ist unter Historikern umstritten. Sicher ist, dass Sklavenarbeit die Rohstoffe, besonders Baumwolle, lieferte, ohne die die Textilindustrie nicht so schnell gewachsen wäre (Einheit 28).",
  "Zucker war das Schlüsselprodukt. Er erforderte viel Arbeitskraft, und weil die indigene Bevölkerung der Karibik durch Krankheit und Zwangsarbeit stark dezimiert war (Einheit 17), wurde auf Afrikaner zurückgegriffen. Zuckerrohr wurde durch Sklavenarbeit angebaut, geerntet und verarbeitet, in einem Prozess, der an eine Fabrik erinnert. Der Konsum von Zucker, Tee und Kaffee veränderte Europa: Er machte aus Luxus Alltagsgüter und schuf neue Gesellschaftsformen wie das Kaffeehaus, in dem sich die Öffentlichkeit der Aufklärung traf (Einheit 24). Hier zeigt sich eine Verbindung, die im Alltag oft unsichtbar ist: Der Wohlstand und die Kultur Europas hingen mit Zwangsarbeit in Übersee zusammen.",
  "In Afrika hatte der Handel gravierende Folgen. Regionen verloren junge Menschen, Gewalt und Krieg nahmen zu, weil Herrscher Gefangene verkauften und mit den Erlösen Feuerwaffen kauften. Manche Staaten wie Dahomey und Asante wurden stark, andere zerfielen. Die demografischen und sozialen Folgen werden von Historikern unterschiedlich beurteilt, doch es gibt Hinweise, dass Regionen mit intensivem Sklavenhandel langfristig geringeres Vertrauen und schwächere Institutionen zeigen. Das Thema bleibt aktuell, in Debatten über Reparationen, Erinnerungskultur und Rassismus, wie auch in der Frage, wie man die Wirtschaftsgeschichte des Westens erzählt."
]});

addEnd(UNITS.u19, { h: "Luthers Gedanke im Kern: Warum Rechtfertigung allein aus Glauben so viel veränderte", p: [
  "Um zu verstehen, warum die 95 Thesen von 1517 eine Lawine auslösten, muss man den theologischen Kern kennen. Im mittelalterlichen Verständnis konnte der Mensch durch Gebet, gute Werke, Sakramente und Ablass seinen Weg zum Heil unterstützen, und die Kirche vermittelte die Gnade. Luther, der als Mönch in schwerer Gewissensnot nach einem gnädigen Gott suchte, fand in der Bibel, besonders bei Paulus, einen anderen Gedanken: Der Mensch wird vor Gott gerecht allein durch Glauben und Gnade, nicht durch eigene Leistung. Das klingt abstrakt, hatte aber enorme Folgen. Wenn Gnade nicht gekauft oder verdient werden kann, braucht man keinen Ablasshandel, und auch die Mittlerrolle der Priester verliert Gewicht: Jeder Gläubige hat unmittelbaren Zugang zu Gott („Priestertum aller Gläubigen“).",
  "Daraus folgte ein zweiter Gedanke: Maßstab der Wahrheit ist die Bibel („sola scriptura“), nicht Papst oder Konzil. Damit stellte Luther die Autorität der Kirche infrage. Folgerichtig übersetzte er das Neue Testament 1522 auf der Wartburg ins Deutsche, damit Laien selbst lesen konnten. Man erkennt die Verbindung zur Schrift: Wer lesen kann, ist nicht mehr auf Vermittler angewiesen. Das erklärt den Schub für Schulen und Alphabetisierung in protestantischen Gebieten (Roter Faden Schrift). Es ist zugleich ein Beispiel dafür, wie ein religiöser Gedanke politische und gesellschaftliche Folgen hat.",
  "Dass Luther nicht beabsichtigte, die Kirche zu spalten, ist wichtig. Er wollte reformieren und wurde durch die Reaktion Roms und die Dynamik der Ereignisse zum Gegner. 1521 wurde er auf dem Reichstag zu Worms vom Kaiser Karl V. zur Rede gestellt. Er weigerte sich zu widerrufen und wurde mit der Reichsacht belegt, doch Kurfürst Friedrich der Weise ließ ihn „entführen“ und schützte ihn auf der Wartburg. Ohne Schutz eines Landesherrn hätte Luther wohl das Schicksal von Jan Hus erlitten, der 1415 in Konstanz verbrannt wurde. Die Reformation war also ebenso ein politisches wie ein religiöses Ereignis."
]});
addEnd(UNITS.u19, { h: "Eine Bewegung wird vielstimmig: Zwingli, Calvin, Täufer, Frauen", p: [
  "Die Reformation blieb nicht bei Luther. In Zürich lehrte Huldrych Zwingli ab 1519 einen radikaleren Kurs: Bilder in Kirchen wurden entfernt, der Gottesdienst vereinfacht, und über das Abendmahl entstand ein Streit mit Luther (Marburger Religionsgespräch 1529). In Genf baute Johannes Calvin ab 1541 eine strenge Kirchenordnung auf, mit Konsistorium und Sittenzucht. Seine Lehre von der Vorherbestimmung (Prädestination) und seine Betonung von Arbeit und Disziplin beeinflussten die Niederlande, Schottland, Frankreich (Hugenotten) und England (Puritaner). Der Soziologe Max Weber vermutete, dass die calvinistische Arbeitsethik die Entstehung des Kapitalismus gefördert habe; die These ist bis heute umstritten, denn Handelsstädte florierten schon vor der Reformation.",
  "Die Täufer (Anabaptisten) lehnten die Kindertaufe ab und forderten Gemeinden von bewusst Gläubigen, getrennt vom Staat. Das war für Obrigkeiten beider Konfessionen eine Bedrohung, und sie wurden grausam verfolgt. Nach dem Münsteraner Täuferreich (1534/35) galten sie vielen als Schreckbild. Aus friedlichen Täufergruppen gingen später Mennoniten und Amische hervor. In dieser Vielfalt zeigt sich, dass die Reformation viele Fragen aufwarf: Wer entscheidet über den richtigen Glauben? Wie weit reicht die Macht der Obrigkeit?",
  "Auch Frauen spielten eine Rolle. Die Abschaffung des Zölibats ließ Pfarrer heiraten, und das Pfarrhaus wurde Vorbild des bürgerlichen Familienlebens. Katharina von Bora, eine ehemalige Nonne, führte als Luthers Frau einen großen Haushalt. Die Reformatoren schätzten die Rolle der Frau als Hausmutter, schlossen aber Klöster, in denen Frauen zuvor Bildung und Ämter erreichen konnten. Gleichzeitig förderte das Prinzip, dass jeder die Bibel lesen soll, die Mädchenbildung, wenn auch zunächst bescheiden. Die Reformation brachte also Chancen und Einschränkungen, ein Muster, das in der Geschichte oft begegnet."
]});

addEnd(UNITS.u20, { h: "Warum aus einem Streit ein dreißigjähriger Krieg wurde", p: [
  "Der Dreißigjährige Krieg begann 1618 mit dem Prager Fenstersturz: Protestantische Adlige warfen kaiserliche Beamte aus dem Fenster der Prager Burg, aus Protest gegen die Politik des katholischen Habsburgers. Das war der Anlass. Die Ursachen lagen tiefer. Im Reich standen sich seit dem Augsburger Religionsfrieden von 1555 (Einheit 19) die Konfessionen mit Misstrauen gegenüber. Der Frieden regelte nur Katholiken und Lutheraner, nicht Calvinisten, und enthielt strittige Klauseln. Es bildeten sich Bündnisse, die Protestantische Union (1608) und die Katholische Liga (1609). Zugleich kämpfte der Kaiser darum, seine Macht gegenüber den Fürsten zu stärken, und die Fürsten verteidigten ihre Rechte.",
  "Das Reich war außerdem in die Mächtepolitik Europas eingebunden. Frankreich, obwohl katholisch, fürchtete die Umklammerung durch die Habsburger in Spanien und im Reich und unterstützte Gegner des Kaisers. Schweden unter Gustav II. Adolf griff 1630 ein, sowohl für den Protestantismus als auch aus Machtinteresse an der Ostsee. Dänemark und Spanien griffen ein. So entstand ein Krieg, in dem religiöse, dynastische und machtpolitische Motive verschmolzen. Er verlief in Phasen, mit wechselnden Fronten, und wurde zunehmend ein Krieg um europäische Vorherrschaft.",
  "Die Kriegführung trug zur Eskalation bei. Heere wurden von Söldnerführern wie Wallenstein aufgestellt und lebten vom Land: Man nahm, was man brauchte, von der Bevölkerung. Der Satz „der Krieg ernährt den Krieg“ beschreibt das. Plünderung, Brandschatzung und Gewalt trafen Zivilisten. Dazu kamen Seuchen wie Pest und Typhus, verbreitet durch Truppenbewegungen und Flüchtlinge, und Hunger. Schätzungen gehen davon aus, dass in manchen Regionen des Reiches ein Drittel oder mehr der Bevölkerung starb; für das ganze Reich geht man von etwa 20 bis 30 Prozent aus. Magdeburg wurde 1631 zerstört, und das Bild der Verwüstung prägte die Erinnerung bis heute."
]});
addEnd(UNITS.u20, { h: "Was der Westfälische Friede wirklich entschied, und warum er so wichtig wurde", p: [
  "Die Verhandlungen in Münster und Osnabrück dauerten Jahre und waren der erste große europäische Friedenskongress. Man verhandelte mit Gesandten vieler Mächte, Verhandlungen über Rang und Titel allein füllten Wochen. Das Ergebnis bestätigte die Gleichberechtigung von Katholiken, Lutheranern und Reformierten im Reich, regelte das Prinzip, dass der Stand der Konfession von 1624 („Normaljahr“) gelten sollte, und stärkte die Landesherren: Die Fürsten durften Bündnisse schließen, solange sie nicht gegen Kaiser und Reich gerichtet waren. Der Kaiser blieb Oberhaupt, aber seine Macht im Reich war begrenzt. Schweden erhielt Gebiete an Nord- und Ostsee, Frankreich das Elsass in Teilen, die Niederlande und die Schweiz wurden als unabhängig anerkannt.",
  "Warum gilt der Frieden als Wendepunkt? Man sieht darin den Beginn eines Systems souveräner Staaten, die sich gegenseitig als gleichberechtigt anerkennen und in innere Angelegenheiten nicht eingreifen. Historiker diskutieren, wie sehr dies im Frieden selbst angelegt war oder später so gedeutet wurde. Sicher ist, dass er Religionskriege in Mitteleuropa weitgehend beendete und dass Religion als Grund für Kriege zwischen Staaten an Bedeutung verlor. An ihre Stelle trat die Staatsräson: Staaten verfolgten Interessen und suchten Gleichgewicht. Dieses Denken prägte das Zeitalter des Absolutismus (Einheit 23) und den Wiener Kongress (Einheit 27).",
  "Für die Betroffenen blieb das Ergebnis ambivalent. Das Reich war verwüstet und zerstückelt, die Erholung dauerte Jahrzehnte. Der Wiederaufbau führte zu Peuplierung, also Anwerbung von Siedlern, und zur Stärkung der Landesherren, die Steuer- und Heeresverwaltung ausbauten. Brandenburg-Preußen stieg unter dem Großen Kurfürsten auf. Man kann daraus lernen: Große Katastrophen verändern Machtverhältnisse und Institutionen, oft durch das, was danach aufgebaut wird. Zugleich blieb das Problem der religiösen Minderheiten bestehen, und Vertreibungen wie die der Salzburger Protestanten 1731 oder der Hugenotten aus Frankreich 1685 zeigen, dass Toleranz sich nur langsam durchsetzte (Einheit 24)."
]});

addEnd(UNITS.u21, { h: "Wie die Osmanen herrschten: Das Beispiel des Millet-Systems und der Janitscharen", p: [
  "Das Osmanische Reich umfasste Muslime, Christen, Juden und viele Sprachgruppen. Wie hielt man das zusammen? Eine Antwort ist das Millet-System: Religionsgemeinschaften erhielten Selbstverwaltung in persönlichen Angelegenheiten wie Ehe, Erbe und Bildung unter eigenen Oberhäuptern, etwa dem griechisch-orthodoxen Patriarchen oder dem Oberrabbiner. Nichtmuslime zahlten eine zusätzliche Steuer, durften aber ihren Glauben ausüben. Das war keine Gleichberechtigung, aber ein Ausgleich, der Konflikte dämpfte. Nach der Vertreibung der Juden aus Spanien 1492 fanden viele Aufnahme im Osmanischen Reich, wo Städte wie Thessaloniki und Istanbul große jüdische Gemeinden bekamen.",
  "Die zweite Säule war eine Elite, die dem Sultan persönlich verpflichtet war. Durch die Knabenlese (Devschirme) wurden christliche Jungen vom Balkan ausgehoben, zum Islam erzogen und für Verwaltung oder Heer ausgebildet. Die Janitscharen, die Elitetruppe mit Feuerwaffen, waren dem Sultan unmittelbar unterstellt. Ein solches System machte den Herrscher unabhängig von Adelsfamilien, die sonst Macht beanspruchten, und eröffnete Aufstiegschancen. Großwesire stammten oft aus dieser Gruppe. Gleichzeitig war es für die Betroffenen und ihre Familien ein schweres Schicksal.",
  "Auf Dauer hatte das System Schwächen. Die Janitscharen wurden mächtig und mischten sich in die Thronfolge ein; im 17. Jahrhundert wurden sie eine Kraft, die Reformen bremste. Das Reich wurde von der wirtschaftlichen Verschiebung berührt, als der Handel über den Atlantik und um Afrika die Landrouten entwertete (Einheit 16), und von Inflation durch das Silber aus Amerika (Einheit 17). Die Belagerung Wiens 1683 scheiterte, danach begann der Rückzug vom Balkan. Man sollte aber nicht von einem geradlinigen „Niedergang“ sprechen: Das Reich blieb bis 1918 bestehen und reformierte sich im 19. Jahrhundert (Tanzimat). Das Beispiel zeigt, wie wichtig Anpassungsfähigkeit für Imperien ist (vgl. Byzanz, Einheit 9)."
]});
addEnd(UNITS.u21, { h: "Persien und Indien: Wie Religion und Toleranz Staaten formten", p: [
  "Die Safawiden machten unter Schah Ismail ab 1501 die Zwölferschia zur Staatsreligion Persiens. Das war eine bewusste Entscheidung, die eine Identität gegen die sunnitischen Nachbarn, Osmanen und Usbeken, schuf und einen Staat zusammenschweißte, dessen Bevölkerung zuvor überwiegend sunnitisch war. Die Folge waren Konflikte mit den Osmanen, die sich um 1514 bei Tschaldiran entluden, und eine Verfestigung der Spaltung zwischen Sunniten und Schiiten (Einheit 10), die bis in die Gegenwart politische Bedeutung hat. Unter Schah Abbas I. (1588–1629) erlebte Persien eine Blüte: Isfahan wurde zur prachtvollen Hauptstadt, Seide wurde ein Exportgut, und ein neues Heer mit Feuerwaffen entstand.",
  "In Indien gründete Babur, ein Nachfahre Timurs und Dschingis Khans, 1526 das Mogulreich. Sein Enkel Akbar (1556–1605) regierte ein Reich mit hinduistischer Mehrheit und führte eine Politik des Ausgleichs: Er schaffte die Kopfsteuer für Nichtmuslime ab, heiratete Rajputenprinzessinnen und bezog Hindus in die Verwaltung ein. In religiösen Gesprächen ließ er Vertreter verschiedener Religionen diskutieren. Diese Politik stabilisierte das Reich, das mit der Landwirtschaft Nordindiens und Steuereinnahmen aus Handel (Textilien, Gewürze) reich wurde. Der Taj Mahal, von Shah Jahan für seine Frau gebaut, steht für diese Blüte.",
  "Aurangzeb (1658–1707) wandte sich einer strengeren Linie zu: Er führte die Kopfsteuer wieder ein, zerstörte einige Tempel und führte Kriege im Süden. Das schwächte den Zusammenhalt, Aufstände der Marathen und Sikhs wuchsen, und nach seinem Tod zerfiel das Reich allmählich. Dies gab der britischen East India Company Raum, die zunächst als Händler auftrat und seit der Schlacht von Plassey 1757 zunehmend Herrscherin wurde (Einheit 32). Ein Gedanke zum Vergleich: Toleranz kann Vielvölkerreiche stabilisieren, Intoleranz sie spalten. Das gilt für Akbar und Aurangzeb ebenso wie für die Habsburger oder die Osmanen."
]});

addEnd(UNITS.u22, { h: "Wie die Qing China regierten: Eroberer, die sich anpassten", p: [
  "1644 eroberten die Mandschu, ein Volk aus dem Nordosten, Peking, nachdem ein Bauernaufstand die Ming-Dynastie gestürzt hatte. Eine Minderheit von vielleicht einer Million Menschen herrschte über Dutzende Millionen Han-Chinesen. Wie war das möglich, und wie hielt es? Die Mandschu übernahmen die chinesische Verwaltung, das Prüfungssystem und die konfuzianische Ideologie. Zugleich sicherten sie ihre Stellung: Hohe Ämter wurden doppelt besetzt mit Mandschu und Han, und Han-Männer mussten den Zopf tragen als Zeichen der Unterwerfung. Das war eine Mischung aus Anpassung und Abgrenzung.",
  "Unter den Kaisern Kangxi, Yongzheng und Qianlong (1661–1796) erreichte das Reich seine größte Ausdehnung. Es wuchs durch Feldzüge nach Zentralasien (Xinjiang, Tibet, Mongolei) auf etwa das Doppelte der Ming-Zeit. Die Bevölkerung stieg von etwa 150 Millionen auf über 300 Millionen, ermöglicht durch Mais, Süßkartoffeln und Erdnüsse aus Amerika (Einheit 17) und durch Frieden. Handel mit Europa lief über den Hafen Kanton, in dem Ausländer nur eingeschränkt agieren durften. Die britische Gesandtschaft Macartneys bat 1793 um mehr Freihandel und wurde abgewiesen: China sah wenig Bedarf an europäischen Waren.",
  "Diese Haltung hatte Folgen. Als die Briten Tee, Seide und Porzellan kaufen wollten und wenig Gegenleistung fanden, begannen sie, Opium aus Indien zu verkaufen (Einheit 32). Eine wachsende Bevölkerung, Landknappheit, Korruption und Aufstände wie der Weiße-Lotos-Aufstand (1796–1804) zeigten Risse. Die Qing gerieten im 19. Jahrhundert unter Druck, weil sie militärisch und technisch zurückgefallen waren, während Europa durch die Industrialisierung stärker wurde (Einheit 28). Man erkennt den Zusammenhang zwischen innerer Stabilität, wirtschaftlicher Dynamik und äußerer Verwundbarkeit."
]});
addEnd(UNITS.u22, { h: "Japan und Korea: zwei Antworten auf Unsicherheit", p: [
  "Nach einem Jahrhundert Bürgerkrieg einigten Oda Nobunaga, Toyotomi Hideyoshi und Tokugawa Ieyasu Japan. 1603 begründete Ieyasu das Shogunat der Tokugawa, das über 250 Jahre Frieden brachte. Das Land wurde durch ein System von Daimyō-Herrschaften kontrolliert, deren Herren regelmäßig in der Hauptstadt Edo leben mussten, wo ihre Familien als Geiseln blieben („sankin kōtai“). Die Reisen kosteten Geld und hielten die Fürsten von Aufstand ab; sie belebten aber auch Straßen, Handel und Städte. Edo wurde mit rund einer Million Einwohnern eine der größten Städte der Welt.",
  "Nach der Erfahrung mit christlichen Missionaren und dem Aufstand von Shimabara (1637/38) schloss das Shogunat das Land weitgehend ab. Nur Holländer und Chinesen durften in Nagasaki handeln. Die „Abschließung“ (sakoku) war nicht vollständig, denn Informationen über westliches Wissen gelangten über Nagasaki („Rangaku“, holländische Studien) ins Land, etwa in Medizin und Anatomie. Sie schützte das Land vor Einmischung und ermöglichte eine stabile Wirtschaft, Alphabetisierung und städtische Kultur (Kabuki, Holzschnitte), erschwerte aber technische Entwicklung. Als die USA 1853 mit Commodore Perry Japan zur Öffnung zwangen, zeigte sich die Lage: Eine Gesellschaft, die Frieden bewahrt hatte, musste schnell aufholen (Einheit 29).",
  "Korea, unter der Joseon-Dynastie (1392–1910), orientierte sich eng am konfuzianischen Staatsmodell. Es wurde mehrfach von Japan (1592–98, Hideyoshis Invasion) und von den Mandschu (1627, 1636) überfallen und wählte danach eine Politik der Zurückhaltung, bekannt als „Einsiedlerkönigreich“. Dennoch blühte die Kultur: König Sejong ließ um 1443 die Schrift Hangul entwickeln, die leicht erlernbar war und den Zugang zur Schrift öffnete. Admiral Yi Sun-sin besiegte mit seinen „Schildkrötenschiffen“ die japanische Flotte. Die Beispiele zeigen unterschiedliche Strategien, wie Staaten auf Bedrohung reagieren: Öffnung, Abschottung, Anpassung. Keine war dauerhaft erfolgreich, denn im 19. Jahrhundert wurden alle drei unter Druck gesetzt."
]});

addEnd(UNITS.u23, { h: "Warum zwei Wege? England und Frankreich im Vergleich", p: [
  "Im 17. Jahrhundert standen viele europäische Staaten vor derselben Aufgabe: Kriege waren teuer, Armeen wuchsen, und die Herrscher brauchten Geld. Frankreich und England lösten das Problem verschieden. In Frankreich verfügte der König über Steuern, die er ohne regelmäßige Zustimmung ständischer Vertretungen erheben konnte; die Generalstände wurden 1614 zum letzten Mal vor 1789 einberufen. Ludwig XIV. baute eine Verwaltung aus Intendanten und Beamten auf, die den Adel an den Hof band: In Versailles lebte die Elite unter dem Blick des Königs, abhängig von Gunst und Pensionen, statt auf ihren Gütern Macht zu sammeln. Der Minister Colbert förderte Manufakturen und Handel (Merkantilismus).",
  "In England hatte das Parlament seit dem Mittelalter ein Mitspracherecht bei Steuern (Magna Carta, Einheit 12). Als die Stuarts-Könige versuchten, ohne Parlament zu regieren und katholische Tendenzen zeigten, kam es zum Bürgerkrieg (1642–49), zur Hinrichtung Karls I. und zur Diktatur Cromwells. Nach der Restauration führte die Glorious Revolution von 1688/89 zur Bill of Rights, die dem Parlament dauerhaft Rechte gab. Das Ergebnis war eine Monarchie, deren Macht begrenzt war, und ein Staat, der Kredit aufnehmen konnte, weil die Gläubiger dem Parlament vertrauten. Die Bank of England (1694) ist ein Ausdruck davon.",
  "Beide Modelle konnten erfolgreich sein. Der französische Absolutismus schuf eine starke Armee und Kultur, aber er hing von der Person des Königs ab und führte zu Schuldenkrisen. Das englische Modell war flexibler, hatte höhere Finanzkraft und förderte Handel. Es war jedoch kein modernes demokratisches System: Das Wahlrecht war auf wenige Besitzende beschränkt, und Irland und die Kolonien wurden ausgebeutet. Der Unterschied erklärt viel für die Folgezeit: Frankreichs Krise von 1789 (Einheit 26) und Englands industrieller Vorsprung (Einheit 28). Man sieht, wie Institutionen langfristig Wege prägen."
]});
addEnd(UNITS.u23, { h: "Wissen als neue Macht: Wie die Wissenschaftliche Revolution funktionierte", p: [
  "Kopernikus veröffentlichte 1543 seine Theorie, dass die Sonne im Zentrum stehe. Es dauerte Jahrzehnte, bis das Gewicht dieser Idee deutlich wurde. Galileo Galilei beobachtete mit dem Fernrohr Jupitermonde und Mondgebirge und stützte die Idee 1610; 1633 musste er vor der Inquisition widerrufen. Kepler berechnete die Planetenbahnen als Ellipsen, und Isaac Newton fasste 1687 in den „Principia“ Bewegung auf der Erde und am Himmel in wenigen Gesetzen zusammen, mit der Gravitation als Kraft. Zum ersten Mal erschien das Universum als berechenbarer Mechanismus.",
  "Was war neu an der Methode? Erstens die Beobachtung und das Experiment als Prüfstein. Francis Bacon forderte, Wissen durch systematische Beobachtung zu gewinnen, nicht nur aus Autoritäten. Zweitens die Mathematik als Sprache der Natur (Galilei). Drittens die Idee, dass Wissen öffentlich geprüft wird: Wissenschaftliche Gesellschaften wie die Royal Society (1660) und Zeitschriften verbreiteten und kontrollierten Ergebnisse. Viertens technische Instrumente: Fernrohr, Mikroskop, Barometer, Pendeluhr. Mit dem Mikroskop sah Antonie van Leeuwenhoek um 1676 „Tierchen“, die ersten Bakterien, deren Bedeutung man erst viel später begriff (Einheit 30).",
  "Auch die Medizin veränderte sich. Vesalius korrigierte 1543 Galen, indem er menschliche Körper sezierte, William Harvey beschrieb 1628 den Blutkreislauf mit einer Kombination aus Experiment und Rechnung. Die Folgen für Therapie blieben zunächst klein, denn die Grundlagen fehlten noch, aber das Prinzip, Behauptungen zu prüfen, setzte sich langsam durch. Die Revolution veränderte das Weltbild: Der Mensch war nicht mehr das Zentrum des Kosmos, doch er konnte ihn verstehen. Sie bereitete die Aufklärung (Einheit 24) vor, die den Gedanken auf Gesellschaft und Politik übertrug: Wenn die Natur Gesetzen folgt, könnte es auch eine vernünftige Ordnung des Staates geben."
]});

addEnd(UNITS.u24, { h: "Staat, Gesellschaft und Vernunft: Was die großen Denker wirklich vorschlugen", p: [
  "Die Aufklärer waren sich nicht einig, und ihre Unterschiede zeigen, wie vielfältig das Denken war. Thomas Hobbes (1651) sah den Menschen im Naturzustand als bedroht von allen gegen alle und forderte einen starken Herrscher als Garantie für Sicherheit. John Locke (1689) dagegen entwarf einen Gesellschaftsvertrag, in dem Menschen natürliche Rechte auf Leben, Freiheit und Eigentum haben, die der Staat schützen muss; verletzt er sie, darf das Volk ihn ersetzen. Das wurde zur Grundlage der amerikanischen Unabhängigkeitserklärung (Einheit 25). Montesquieu (1748) schlug die Teilung der Gewalten in Gesetzgebung, Regierung und Rechtsprechung vor, damit niemand zu mächtig wird. Rousseau (1762) betonte den Gemeinwillen: Legitime Macht beruht auf der Zustimmung des Volkes. Seine Ideen wurden in der Französischen Revolution (Einheit 26) einflussreich, auch für radikale Auslegungen.",
  "Voltaire kämpfte für Toleranz und gegen Machtmissbrauch der Kirche, am bekanntesten im Fall Calas, in dem er sich für einen zu Unrecht hingerichteten Protestanten einsetzte. Immanuel Kant fasste 1784 zusammen: Aufklärung sei der „Ausgang des Menschen aus seiner selbstverschuldeten Unmündigkeit“; „Habe Mut, dich deines eigenen Verstandes zu bedienen“. Cesare Beccaria forderte 1764, Folter und Todesstrafe abzuschaffen; Adam Smith (1776) beschrieb, wie freie Märkte zu Wohlstand führen können, und Denis Diderot gab die „Encyclopédie“ heraus, die das Wissen der Zeit sammelte.",
  "Bemerkenswert ist, dass viele dieser Ideen aus Auseinandersetzung mit Krieg und Konflikt entstanden. Hobbes schrieb im Angesicht des englischen Bürgerkrieges, Locke nach der Glorious Revolution. Ideen sind selten rein abstrakt: Sie reagieren auf Erfahrungen. Das hilft beim Verständnis, warum dieselben Gedanken zu verschiedenen Folgerungen führen können. Und es erklärt, warum die Aufklärung nicht automatisch Demokratie bedeutete: Viele Aufklärer wie Friedrich II. von Preußen oder Katharina II. von Russland setzten auf „aufgeklärten Absolutismus“, also Reformen von oben."
]});
addEnd(UNITS.u24, { h: "Wer war „der Mensch“? Frauen, Sklaverei und die Grenzen der Aufklärung", p: [
  "Die Aufklärung sprach von Menschenrechten, aber wer zählte als Mensch? Viele Aufklärer schlossen Frauen, Nichtweiße und Besitzlose stillschweigend aus. Rousseau beschrieb Frauen vorrangig als Erzieherinnen und Hausmütter. Dagegen wandte sich Olympe de Gouges, die 1791 eine „Erklärung der Rechte der Frau und Bürgerin“ verfasste und 1793 hingerichtet wurde, und Mary Wollstonecraft, die 1792 für gleiche Bildung eintrat. Mehrere Salons, geleitet von gebildeten Frauen wie Madame de Geoffrin, waren Orte, an denen Ideen verhandelt wurden. Frauen waren also beteiligt, auch ohne formale Rechte.",
  "Auch das Verhältnis zur Sklaverei war widersprüchlich. Aufklärer wie Montesquieu und Diderot kritisierten sie, während Kant und Hume rassistische Aussagen machten, die später genutzt wurden, um Hierarchien zu rechtfertigen. Die Wissenschaften, die Menschen klassifizierten, trugen zur Entstehung von Rassentheorien bei (Einheit 32). Zugleich stritten Menschen wie Olaudah Equiano und Ottobah Cugoano in Schriften für die Abschaffung (Einheit 18). Der Widerspruch zwischen Anspruch und Wirklichkeit wurde zu einem Antrieb: Spätere Bewegungen beriefen sich gerade auf die universalen Prinzipien, um Rechte einzufordern.",
  "Ein Blick auf die Medizin zeigt eine praktische Seite. Die Variolation gegen Pocken, in Istanbul beobachtet und von Lady Mary Wortley Montagu nach England gebracht, wurde statistisch geprüft; Edward Jenner entwickelte 1796 die Impfung mit Kuhpocken (Einheit 30). Die Aufklärung brachte also Methoden, mit denen man Behauptungen an Zahlen prüfte. Man kann sie als Wegbereiter der modernen Statistik und Epidemiologie sehen. Sie steht damit am Anfang des Gedankens, dass Vernunft und Erfahrung das Leben verbessern können, aber auch am Anfang der Frage, wer von dieser Verbesserung profitiert."
]});

addEnd(UNITS.u25, { h: "Warum rebellierten gerade die Kolonisten? Geld, Recht und Selbstverständnis", p: [
  "Die dreizehn Kolonien gehörten zu den wohlhabendsten Gebieten des britischen Empires, und ihre Bewohner zahlten weniger Steuern als Engländer. Warum entstand dennoch ein Aufstand? Der Auslöser war der Siebenjährige Krieg (1756–63), den Großbritannien gegen Frankreich auch in Nordamerika führte. Er brachte London große Schulden. Nach dem Sieg wollte die Regierung die Kolonien an den Kosten für ihre Verteidigung beteiligen und erließ Gesetze wie den Stamp Act (1765), der auf Zeitungen und Dokumente eine Steuer erhob. Die Kolonisten sahen darin nicht nur Geld, sondern ein Prinzip: „No taxation without representation“. Sie hatten keine Abgeordneten im Parlament, also, so ihr Argument, durfte das Parlament sie nicht besteuern.",
  "Dahinter stand ein Selbstverständnis. Seit mehr als hundert Jahren verwalteten sich die Kolonien weitgehend selbst, mit gewählten Versammlungen. Sie verstanden sich als Engländer mit englischen Rechten, die dieses Erbe gegen willkürliche Eingriffe verteidigten. Das Gedankengut der Aufklärung (Einheit 24), besonders Lockes Lehre von natürlichen Rechten, gab ihnen die Sprache. Ereignisse wie das Massaker von Boston (1770) und die Boston Tea Party (1773) verhärteten die Fronten, und Gegenmaßnahmen Londons, die „Intolerable Acts“, brachten die Kolonien enger zusammen. Der Erste Kontinentalkongress trat 1774 zusammen.",
  "Es war keine Revolution im Sinne einer einheitlichen Volksbewegung. Etwa ein Fünftel bis ein Drittel der Weißen blieb loyal zur Krone (Loyalisten), viele hielten sich heraus. Für Versklavte, Indigene und Frauen bedeutete die Unabhängigkeit zunächst wenig oder Nachteile: Britische Truppen versprachen Sklaven Freiheit, wenn sie überliefen, und tausende folgten. Indigene Völker fürchteten Landnahme nach Westen. Der Konflikt war also ebenso ein Bürgerkrieg wie ein Unabhängigkeitskrieg. Dass er trotz dieser Spannungen gelang, hing mit der Hilfe Frankreichs zusammen, das 1778 in den Krieg eintrat, aus Rache für 1763, mit Geld, Flotte und Soldaten."
]});
addEnd(UNITS.u25, { h: "Eine Verfassung entwerfen: Wie man Macht begrenzt und was dabei offenblieb", p: [
  "Nach dem Sieg stand man vor einer neuen Aufgabe: einen Staat zu bauen. Die Konföderationsartikel von 1781 schufen einen losen Bund mit schwacher Zentrale, die keine Steuern erheben konnte. Das führte zu Schulden, Streit zwischen Staaten und Aufständen wie Shays’ Rebellion (1786/87). 1787 trafen sich 55 Delegierte in Philadelphia, um das System zu ändern. Sie stritten über Fragen, die bis heute wirken: Wie viel Macht sollte der Bund haben? Wie verteilt man Sitze zwischen großen und kleinen Staaten? Der „Große Kompromiss“ schuf einen Kongress mit zwei Kammern: Im Repräsentantenhaus zählt die Einwohnerzahl, im Senat hat jeder Staat zwei Sitze.",
  "Die Verfassung beruht auf Gewaltenteilung (Montesquieu, Einheit 24): Der Kongress macht Gesetze, der Präsident führt sie aus, die Gerichte legen sie aus, und jede Gewalt kann die anderen kontrollieren („checks and balances“). Der Föderalismus teilte Macht zwischen Bund und Einzelstaaten. Die Bill of Rights (1791), zehn Zusätze, garantierte Grundrechte wie Meinungs-, Religions- und Versammlungsfreiheit. Damit entstand eine geschriebene Verfassung, die Macht an Regeln band, ein Modell, das viele Länder prägte.",
  "Doch die Verfassung enthielt Kompromisse, die später zum Problem wurden. Sklaverei wurde nicht abgeschafft, sondern indirekt geschützt: Für die Sitzverteilung zählte jeder Versklavte als drei Fünftel einer Person (Dreifünftelklausel), und der Sklavenhandel durfte bis 1808 weitergehen. Frauen, Indigene und die meisten Nichtweißen hatten kein Wahlrecht. Die Verfassung ließ die Frage der Sklaverei offen, und diese Frage führte 1861 zum Bürgerkrieg (Einheit 31). Man erkennt: Gründungskompromisse schaffen Stabilität, aber verlagern Konflikte in die Zukunft. Außerdem wirkte die Revolution weit über Amerika, indem sie in Frankreich (Einheit 26) und später in Lateinamerika (Einheit 27) Beispiel wurde."
]});

addEnd(UNITS.u26, { h: "Wie es zur Radikalisierung kam: eine Spirale aus Angst, Krieg und Misstrauen", p: [
  "Die Revolution begann 1789 mit Idealen, Menschenrechten und der Hoffnung auf Reformen. Wie wurde daraus die Schreckensherrschaft von 1793/94? Eine Rolle spielten äußere Bedrohungen. Seit 1792 führte Frankreich Krieg gegen Österreich und Preußen, die die Monarchie wiederherstellen wollten. Nach Niederlagen und dem Manifest des Herzogs von Braunschweig, das Paris mit Zerstörung drohte, wuchs die Panik. Die Menschen in Paris stürmten die Tuilerien (August 1792), setzten den König ab, und im September töteten Menschenmengen in Gefängnissen mehr als tausend Gefangene. Die Republik wurde ausgerufen, Ludwig XVI. im Januar 1793 hingerichtet. Damit war ein Rückweg abgeschnitten, denn alle Beteiligten hatten viel zu verlieren, wenn die Monarchie zurückkehrte.",
  "Hinzu kam die innere Not: Steigende Brotpreise, Inflation der Assignaten (Papiergeld) und Hunger. Die Sansculotten, Handwerker und Kleinhändler von Paris, forderten Preiskontrollen und harte Maßnahmen gegen „Verräter“. Die Vendée erhob sich 1793 gegen Aushebungen, und der Bürgerkrieg dort kostete Zehntausende Menschenleben. Der Wohlfahrtsausschuss unter Robespierre erhielt umfassende Vollmachten. Das Revolutionstribunal verurteilte Zehntausende (etwa 17.000 formelle Todesurteile, mehr Tote durch Willkür und im Bürgerkrieg). Das Argument lautete, Tugend müsse mit Terror verbunden sein, um die Republik zu retten.",
  "Der Terror endete im Juli 1794 mit dem Sturz Robespierres. Das Muster ist lehrreich: In Ausnahmezuständen, wenn Menschen Angst vor Feinden im Innern und Äußern haben, werden Rechte eingeschränkt, Verdächtigungen genügen, und Radikale gewinnen. Die Revolution „frisst ihre Kinder“, wie ein bekanntes Wort sagt, denn auch Danton und andere Revolutionäre wurden hingerichtet. Ähnliche Spiralen finden sich in der Russischen Revolution (Einheit 35). Die Erfahrung führt zu der Frage, wie Institutionen entworfen sein müssen, um solche Eskalationen zu verhindern: unabhängige Gerichte, Gewaltenteilung, Schutz von Minderheiten."
]});
addEnd(UNITS.u26, { h: "Was die Revolution veränderte: Recht, Nation, Gesellschaft", p: [
  "Trotz ihrer Gewalt hat die Revolution Dauerhaftes geschaffen. Sie schaffte 1789 die Privilegien des Adels und der Kirche ab, verkündete die Gleichheit vor dem Gesetz und die Menschen- und Bürgerrechte. Die Verwaltung wurde in Departements gegliedert, das Metrische System eingeführt, kirchliche Güter verkauft. Der Gedanke, dass die Nation und nicht der König souverän ist, wurde zur Grundlage des modernen Staates (Einheit 31). Die „Marseillaise“ und die Trikolore wurden Symbole einer Nation, die ihre Bürger zu Verteidigern machte: Die „levée en masse“ (1793) mobilisierte ein Massenheer, das Europa in Schrecken versetzte.",
  "Es gab Brüche im Gewohnten. Die Kirche wurde dem Staat unterstellt, was viele Gläubige verstörte. Das Eherecht wurde säkularisiert, Scheidung wurde möglich. Juden erhielten 1791 die Bürgerrechte, ein Fortschritt gegenüber früheren Zeiten. Die Sklaverei wurde 1794 abgeschafft, aber Napoleon führte sie 1802 wieder ein (Einheit 27), und in Haiti kämpften die Versklavten selbst um ihre Freiheit. Frauen erhielten keine politischen Rechte, obwohl sie an Protesten (Zug nach Versailles im Oktober 1789) und Debatten beteiligt waren.",
  "Wie ist die Revolution zu deuten? Die Geschichtsschreibung hat sie lange als Epochenbruch gesehen, der das Alte vom Neuen trennt. Neuere Forschung betont Kontinuitäten: Die Zentralisierung des Staates hatte schon der Absolutismus begonnen (Einheit 23), und der Staat war nach 1789 oft mächtiger als zuvor. Für das Verständnis ist beides wichtig: Die Revolution war ein Schnittpunkt, an dem Ideen, Finanznot, Hunger und politischer Streit zusammenfielen. Ihr Erbe sind Menschenrechte und Demokratie, aber auch die Erfahrung, wie schnell Ideale in Gewalt umschlagen können. Beides prägte das 19. Jahrhundert, Liberale und Konservative, Nationalisten und Sozialisten (Einheiten 29 und 31)."
]});

addEnd(UNITS.u27, { h: "Napoleons Herrschaft: Modernisierer und Eroberer zugleich", p: [
  "Napoleon war ein Widerspruch: Er festigte revolutionäre Errungenschaften und beschnitt zugleich Freiheiten. Als 1799 durch einen Staatsstreich Erster Konsul, ab 1804 Kaiser, stützte er seine Macht auf Armee, Verwaltung und Popularität. Er baute die Präfekturen aus, gründete die Banque de France, ordnete das Bildungswesen mit Lycées und der Universität und schloss 1801 ein Konkordat mit dem Papst, das den Frieden mit der Kirche herstellte. Der Code civil (1804) sicherte Eigentum, Gleichheit vor dem Gesetz und die Aufhebung der Feudallasten, schränkte aber die Rechte von Frauen ein (sie waren dem Ehemann untergeordnet). Die Pressefreiheit wurde unterdrückt, die Polizei ausgebaut.",
  "Seine Eroberungen trugen die Revolution nach Europa. In den eroberten Gebieten, etwa im Rheinland, in Italien und Polen, wurden Zünfte und Adelsprivilegien abgeschafft, Juden bekamen gleiche Rechte, und der Code civil galt. Das war für viele Menschen eine Befreiung. Zugleich war es Fremdherrschaft: Steuern, Aushebungen und Plünderung weckten Widerstand. In Spanien (1808) erhob sich eine Guerilla (das Wort stammt von dort), und der Krieg band über Jahre große Kräfte. In Deutschland wirkte die Erfahrung der Fremdherrschaft als Auslöser für Reformen in Preußen (Stein, Hardenberg) und für ein aufkeimendes Nationalgefühl (Einheit 31).",
  "Die Kontinentalsperre von 1806, mit der Napoleon den Handel mit Großbritannien unterbinden wollte, schadete auch Europa und trieb ihn in Konflikte, etwa mit Russland. Der Feldzug von 1812 endete in der Katastrophe: Von etwa 600.000 Mann kehrten nur Zehntausende zurück, durch Kälte, Hunger und Fleckfieber (Einheit 28). In der Völkerschlacht bei Leipzig (1813) und bei Waterloo (1815) wurde er besiegt. Man erkennt eine Regel der Weltgeschichte: Reiche, die sich zu schnell ausdehnen, überfordern ihre Mittel, und Gegenwehr wächst. Das gilt für Alexander (Einheit 4), Napoleon und später Hitler (Einheit 39)."
]});
addEnd(UNITS.u27, { h: "Nach Napoleon: Lateinamerika, Haiti und die Ordnung von 1815", p: [
  "Napoleons Eingriff in Spanien und Portugal (1807/08) hatte weitreichende Folgen jenseits des Atlantiks. Als er den spanischen König absetzte, fehlte den Kolonien die legitime Autorität. Kreolische Eliten gründeten Juntas, und aus der Frage, wem man gehorchte, wurde der Wunsch nach Unabhängigkeit. Simón Bolívar und José de San Martín führten Befreiungskriege, bis 1825 war ein großer Teil Spanisch-Amerikas unabhängig. Brasilien löste sich 1822 friedlich von Portugal. Allerdings blieben die sozialen Strukturen weitgehend: Kreolische Eliten übernahmen die Macht, Indigene und Mestizen hatten wenig Teilhabe, und die Sklaverei blieb vielerorts bestehen. Auch dies erklärt Ungleichheit und politische Instabilität der Region (Einheit 17).",
  "Haiti war zuvor, 1804, als erste Republik Schwarzer Menschen entstanden, nach einem Aufstand gegen Sklaverei und französische Herrschaft. Frankreich erkannte sie erst 1825 an, gegen hohe Entschädigungszahlungen, die das Land jahrzehntelang belasteten. Hier zeigt sich, wie Freiheit und wirtschaftliche Abhängigkeit zusammenhängen. Die Revolution in Haiti schreckte die Sklavenhalter in Amerika und trug dazu bei, dass die USA sie lange nicht anerkannten.",
